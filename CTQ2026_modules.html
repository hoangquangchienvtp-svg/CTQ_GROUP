<script>
    // ==========================================
    // ==========================================
    // GIAO DIỆN & LOGIC: NỘP LỢN (SUPER PRO V3 - REALTIME)
    // ==========================================
    function renderNopLon(content, isSilentSync = false) {
        // Lưu lại giá trị đang gõ dở để khi tự động tải lại không bị mất chữ
        let curMa = document.getElementById('lon-ma') ? document.getElementById('lon-ma').value : '';
        let curLoi = document.getElementById('lon-loi') ? document.getElementById('lon-loi').value : '';
        let curNop = document.getElementById('lon-nop') ? document.getElementById('lon-nop').value : '0';
        let curNo = document.getElementById('lon-no') ? document.getElementById('lon-no').value : '0';
        let curSearch = document.getElementById('lon-search') ? document.getElementById('lon-search').value : '';

        let history = G_Data.quyLon || [];
        let tongQuy = 0; let tongNo = 0;
        let noMap = {};

        // KIỂM TRA PHÂN QUYỀN CHẶT CHẼ 100% (Khớp chính xác từng chữ)
        let perms = (window.USER_PERMS || "").split(',');
        let isAdmin = perms.includes('admin');
        // CÔNG THỨC CHẶN TẬN GỐC: Khóa form nếu bị tick ô Chỉ Xem
        let hasFull = (perms.includes('nop-lon') && !perms.includes('nop-lon-view')) || isAdmin;

        // TÍNH TOÁN DỮ LIỆU
        for (let i = 1; i < history.length; i++) {
            let r = history[i];
            let nop = parseFloat(r[4]) || 0;
            let no = parseFloat(r[5]) || 0;
            let ma = r[1] || "KHÔNG RÕ"; let ten = r[2] || "KHÔNG RÕ";
            let loi = r[3] || "Không rõ";

            tongQuy += nop;
            tongNo += no;

            if (!noMap[ma]) noMap[ma] = { ten: ten, no: 0, nop: 0, dsLoiNo: [], dsLoiNop: [] };
            noMap[ma].no += no;
            noMap[ma].nop += nop;

            if (no > 0) {
                let detailNo = no + "K " + loi;
                if (!noMap[ma].dsLoiNo.includes(detailNo)) noMap[ma].dsLoiNo.push(detailNo);
            }
            if (nop > 0) {
                let detailNop = nop + "K " + loi;
                if (!noMap[ma].dsLoiNop.includes(detailNop)) noMap[ma].dsLoiNop.push(detailNop);
            }
        }

        window.TEMP_QUY_DATA = noMap;

        let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px; margin-bottom:15px;">
        <h2 style="color:var(--danger); font-weight:900; font-size:24px;" data-lang="nl_title">🐷 HỆ THỐNG QUẢN LÝ QUỸ LỢN</h2>
        <div>
            ${!hasFull ? `<span style="background:var(--warning); color:#000; font-weight:900; padding:8px 15px; border-radius:20px; margin-right:10px;" data-lang="nl_chi_xem">👀CHỈ XEM</span>` : ''}
            ${isAdmin ? `<button class="action-btn" style="background:#6f42c1; font-size:16px; padding:0 20px;" onclick="thucHienMoLon()" data-lang="nl_mo_lon">🔨 MỔ LỢN</button>` : ''}
        </div>
    </div>

    <div style="display:flex; gap:15px; margin-bottom:15px; flex-wrap:wrap;">
        <div ondblclick="showChiTietQuy()" title="Kích đúp để xem chi tiết" data-lang-title="title_click_detail" style="cursor:pointer; background:var(--success); color:white; padding:15px; border-radius:12px; flex:1; min-width:180px; box-shadow:0 5px 15px rgba(25,135,84,0.3); position:relative; overflow:hidden;">
            <div style="font-size:40px; position:absolute; right:10px; top:10px; opacity:0.3;">💰</div>
            <div style="font-size:13px; font-weight:900; opacity:0.9;" data-lang="nl_tong_quy">TỔNG QUỸ (Kích đúp)</div>
            <div style="font-size:30px; font-weight:900;">${tongQuy} K</div>
        </div>
        
        <div ondblclick="showChiTietNo()" title="Kích đúp để xem chi tiết" data-lang-title="title_click_detail" style="cursor:pointer; background:var(--danger); color:white; padding:15px; border-radius:12px; flex:1; min-width:180px; box-shadow:0 5px 15px rgba(220,53,69,0.3); position:relative; overflow:hidden;">
            <div style="font-size:40px; position:absolute; right:10px; top:10px; opacity:0.3;">📉</div>
            <div style="font-size:13px; font-weight:900; opacity:0.9;" data-lang="nl_dang_no">ĐANG NỢ (Kích đúp)</div>
            <div style="font-size:30px; font-weight:900;">${Math.max(0, tongNo)} K</div>
        </div>

        <div style="background:#0d6efd; color:white; padding:15px; border-radius:12px; flex:1; min-width:180px; box-shadow:0 5px 15px rgba(13,110,253,0.3); position:relative; overflow:hidden;">
            <div style="font-size:40px; position:absolute; right:10px; top:10px; opacity:0.3;">💎</div>
            <div style="font-size:13px; font-weight:900; opacity:0.9;" data-lang="nl_tong_cong">TỔNG CỘNG (QUỸ + NỢ)</div>
            <div style="font-size:30px; font-weight:900;">${tongQuy + Math.max(0, tongNo)} K</div>
        </div>
    </div>

    <div style="margin-bottom: 20px;">
        <input type="text" id="lon-search" class="app-input" style="max-width:500px; border:2px solid var(--secondary); margin:0;" placeholder="🔍 Dán Mã thẻ / Tên vào đây để tra cứu nợ..." onkeyup="filterLon()" value="${curSearch}" data-lang="nl_search">
    </div>
    <button class="action-btn purple" style="height:44px; font-size:15px; padding: 0 25px; border-radius:8px;" onclick="showBxhLon()" data-lang="nl_bxh">🏆 BẢNG XẾP HẠNG</button>

    <div style="display:flex; gap:20px; flex-wrap:wrap;">
        <div class="app-card" style="flex:1; min-width:300px; margin:0; display:${hasFull ? 'block' : 'none'}; border-top:4px solid var(--primary);">
            <div class="app-card-title" style="color:var(--primary); display:flex; justify-content:space-between;">
                <span data-lang="nl_ghi_nhan">➕ GHI NHẬN NỘP / NỢ</span>
                <button class="action-btn orange btn-sm" onclick="quanLyLoiLon()" title="Thêm lỗi lợn mới" data-lang-title="nl_them_loi" data-lang="nl_them_loi">⚙️ Thêm Lỗi</button>
            </div>
            <div class="form-group"><label data-lang="nl_lbl_mathe">${getTxt('nl_lbl_mathe') || 'Mã Thẻ :'}</label><input type="text" id="lon-ma" class="app-input" style="color:var(--primary); font-weight:900;" onchange="timMaNopLon(this)" value="${curMa}"></div>
            <div class="form-group"><label data-lang="nl_lbl_hoten">${getTxt('nl_lbl_hoten') || 'Họ Và Tên:'}</label><input type="text" id="lon-ten" class="app-input" readonly style="background:#f8f9fa;"></div>
            <div class="form-group"><label data-lang="nl_lbl_loi">${getTxt('nl_lbl_loi') || 'Lỗi Vi Phạm:'}</label><select id="lon-loi" class="app-input">${generateOptionsValGen(7, curLoi)}</select></div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;"><label data-lang="nl_lbl_danop">${getTxt('nl_lbl_danop') || 'Đã Nộp:'}</label><input type="number" id="lon-nop" class="app-input" value="${curNop}" placeholder="Nhập số tiền..." data-lang-placeholder="lon_nop_ph"></div>
                <div class="form-group" style="flex:1;"><label style="color:var(--danger);" data-lang="nl_lbl_ghino">${getTxt('nl_lbl_ghino') || 'Ghi Nợ :'}</label><input type="number" id="lon-no" class="app-input" value="${curNo}" placeholder="Nhập số tiền..." data-lang-placeholder="lon_no_ph"></div>
            </div>
            <button class="action-btn green" style="width:100%; height:45px; font-size:16px;" onclick="submitNopLon()" data-lang="nl_btn_nop">${getTxt('nl_btn_nop') || 'NỘP LỢN'}</button>
        </div>

        <div style="flex:2; min-width:500px; display:flex; flex-direction:column; gap:20px;">
            <div class="app-card" style="margin:0; border-top: 4px solid var(--danger);">
                <div class="app-card-title" style="color:var(--danger); margin-bottom:10px; border:none; padding:0;" data-lang="nl_ds_no">${getTxt('nl_ds_no') || '⚠️ DANH SÁCH NỢ'}</div>
                <div class="table-container" style="max-height:200px;">
                    <table class="app-table" id="tbl-lon-no">
                        <thead><tr><th data-lang="th_mathe">${getTxt('th_mathe') || 'Mã Thẻ'}</th><th data-lang="nl_emp_name">${getTxt('nl_emp_name') || 'Tên Nhân Viên'}</th><th data-lang="nl_reason_debt">${getTxt('nl_reason_debt') || 'Lý do nợ'}</th><th data-lang="nl_debt_amt">${getTxt('nl_debt_amt') || 'Số Tiền Nợ'}</th>${hasFull ? '<th style="text-align:center;" data-lang="nl_action">' + (getTxt('nl_action') || 'Thao tác') + '</th>' : ''}</tr></thead>
                        <tbody>
                            ${Object.keys(noMap).filter(k => noMap[k].no > 0).length === 0 ? `<tr><td colspan="5" style="text-align:center; color:var(--success); font-weight:bold;" data-lang="nl_no_debt">${getTxt('nl_no_debt') || 'Không có ai nợ quỹ!'}</td></tr>` : ''}
                            ${Object.keys(noMap).filter(k => noMap[k].no > 0).map(k => `<tr class="lon-row"><td style="font-weight:900;" class="l-ma">${k}</td><td style="font-weight:900;" class="l-ten">${noMap[k].ten}</td><td style="color:#555; font-size:13px; max-width:150px; overflow:hidden; text-overflow:ellipsis;" title="${noMap[k].dsLoiNo.join(', ')}">${noMap[k].dsLoiNo.join(', ')}</td><td style="color:var(--danger); font-weight:900; font-size:16px;">${Math.max(0, noMap[k].no)} K</td>${hasFull ? `<td style="text-align:center;"><button class="action-btn green btn-sm" onclick="traNoLon('${k}', '${noMap[k].ten}', ${Math.max(0, noMap[k].no)}, '${noMap[k].dsLoiNo.join(', ')}')">💳 Trả nợ</button></td>` : ''}</tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="app-card" style="margin:0; border-top: 4px solid var(--secondary);">
                <div class="app-card-title" style="margin-bottom:10px; border:none; padding:0;" data-lang="nl_so_nhatky">${getTxt('nl_so_nhatky') || '📖 SỔ NHẬT KÝ THU QUỸ'}</div>
                <div class="table-container" style="max-height:300px;">
                    <table class="app-table" id="tbl-lon-his">
                        <thead><tr><th data-lang="nl_date">Ngày</th><th data-lang="th_mathe">Mã Thẻ</th><th data-lang="nl_payer">Người Nộp</th><th data-lang="nl_reason">Lý do</th><th data-lang="nl_pay">Nộp</th><th data-lang="nl_debt">Nợ</th>${hasFull ? '<th data-lang="nl_del">Xóa</th>' : ''}</tr></thead>
                        <tbody>
                            ${history.map((x, i) => i > 0 ? `<tr class="lon-row"><td class="l-ngay">${x[0]}</td><td style="font-weight:900;" class="l-ma">${x[1]}</td><td style="font-weight:900; color:var(--primary);" class="l-ten">${x[2]}</td><td class="l-loi">${x[3]}</td><td style="font-weight:900; color:var(--success);">${x[4]}</td><td style="font-weight:900; color:var(--danger);">${x[5]}</td>${hasFull ? `<td><button class="action-btn red btn-sm" onclick="xoaLichSuLon(${i + 1})">Xóa</button></td>` : ''}</tr>` : '').reverse().join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
  `;
        content.innerHTML = html;

        if (curMa && !isSilentSync) { let inputEl = document.getElementById('lon-ma'); if (inputEl) timMaNopLon(inputEl); }
        if (curSearch) filterLon();
        updateTextByLang();
    }

    // HÀM TÌM KIẾM NHANH (MÃ THẺ & TÊN)
    window.filterLon = window.appDebounce(function () {
        let inputEl = document.getElementById('lon-search');
        if (!inputEl) return;
        let input = inputEl.value.toUpperCase();
        let rows = document.querySelectorAll('.lon-row');
        rows.forEach(row => {
            let ma = row.querySelector('.l-ma') ? row.querySelector('.l-ma').innerText.toUpperCase() : '';
            let ten = row.querySelector('.l-ten') ? row.querySelector('.l-ten').innerText.toUpperCase() : '';
            if (ma.includes(input) || ten.includes(input)) row.style.display = '';
            else row.style.display = 'none';
        });
    }, 250);

    // THÊM LÝ DO TRỰC TIẾP VÀO CỘT H ADMIN_DATA
    function quanLyLoiLon() {
        let loiMoi = prompt("Nhập tên Lỗi Vi Phạm / Lý do thu quỹ mới:");
        if (!loiMoi) return;
        showToast("Đang thêm vào danh sách Cột H...", "info");
        google.script.run.withSuccessHandler(d => {
            G_Data.adminData = d; showToast("Đã cập nhật danh sách lỗi!", "success"); renderNopLon(document.getElementById('tab-nop-lon'));
        }).addAdminData(7, loiMoi, CURRENT_USER); // Cột H index là 7
    }

    function thucHienMoLon() {
        let mk = prompt("⚠️ CẢNH BÁO NGUY HIỂM: Hành động này dành cho Admin để XÓA SẠCH dữ liệu quỹ Lợn của toàn xưởng.\nNhập mật khẩu Admin để xác nhận MỔ LỢN:");
        if (!mk) return;
        let isMatch = false;
        for (let i = 1; i < G_Data.users.length; i++) { if (G_Data.users[i][0] === CURRENT_USER && G_Data.users[i][1] === mk) { isMatch = true; break; } }
        if (!isMatch) return showToast("Sai mật khẩu! Cấm mổ.", "error");
        if (!confirm("Xác nhận ĐẬP TOÀN BỘ LỢN? Tất cả tiền quỹ và nợ sẽ lập tức về 0!")) return;

        showToast("Đang mổ lợn...", "info");

        // 1. Ép giao diện về 0 ngay lập tức cho mượt
        G_Data.quyLon = [G_Data.quyLon[0]];
        renderNopLon(document.getElementById('tab-nop-lon'), true);

        // 2. Báo máy chủ xóa dữ liệu và ÉP CẬP NHẬT TẤT CẢ TẠI CHỖ
        google.script.run.withSuccessHandler(d => {
            G_Data.quyLon = d;
            renderNopLon(document.getElementById('tab-nop-lon'), true); // Vẽ lại lần nữa để chốt sổ 100%
            showToast("🐷 ĐÃ MỔ LỢN THÀNH CÔNG! Mọi thứ đã về 0.", "success");
        }).moConLon(CURRENT_USER);
    }

    // TRẢ NỢ THÔNG MINH - GỘP HÀNG & TỰ NHẢY SỐ POPUP
    function traNoLon(ma, ten, maxNo, lyDoGoc) {
        let payStr = prompt(`[${ten}] đang nợ tổng ${maxNo}K.\n\nNhập số tiền muốn trả (K):`, maxNo);
        if (!payStr) return;
        let pay = parseFloat(payStr);
        if (isNaN(pay) || pay <= 0) return showToast("Số tiền không hợp lệ!", "error");
        if (pay > maxNo) return showToast(`Chỉ nợ ${maxNo}K, không thể trả lố!`, "warning");

        showToast("Đang xử lý trừ lùi nợ thông minh...", "info");

        google.script.run.withSuccessHandler(d => {
            G_Data.quyLon = d;
            renderNopLon(document.getElementById('tab-nop-lon'), true);
            if (typeof showChiTietNo === 'function') {
                showChiTietNo();
            }

            showToast("✅ Đã thanh toán nợ thành công!", "success");
        }).processTraNoThongMinh(ma, pay, CURRENT_USER);
    }

    // LƯU TIỀN SIÊU TỐC (CÓ LƯU NGÀY GIỜ VÀO CỘT H)
    function submitNopLon() {
        let ma = document.getElementById('lon-ma').value.trim().toUpperCase();
        let ten = document.getElementById('lon-ten').value.trim();
        let loi = document.getElementById('lon-loi').value.trim();
        let nop = parseFloat(document.getElementById('lon-nop').value) || 0;
        let no = parseFloat(document.getElementById('lon-no').value) || 0;

        if (!ma || ten.includes("Không tìm thấy") || !loi) return showToast("Vui lòng điền đúng mã thẻ và chọn lỗi!", "warning");
        if (nop == 0 && no == 0) return showToast("Chưa nhập tiền!", "warning");

        // Lấy Ngày và Giờ hiện tại
        let now = new Date();
        let ngay = now.toLocaleDateString('en-GB');
        let gio = now.toLocaleTimeString('en-GB');
        let ngayGio = ngay + " " + gio; // Ghép lại thành "09/06/2026 17:30:45"

        // Dữ liệu 8 cột: Cột H là ngayGio
        let dataRow = [ngay, ma, ten, loi, nop, no, CURRENT_USER, ngayGio];

        // BƯỚC 1: Nhảy số tức thì trên máy người dùng
        G_Data.quyLon.push(dataRow);
        renderNopLon(document.getElementById('tab-nop-lon'));

        document.getElementById('lon-ma').value = ""; document.getElementById('lon-ten').value = "";
        document.getElementById('lon-nop').value = "0"; document.getElementById('lon-no').value = "0";
        showToast("Đang đồng bộ dữ liệu...", "info");

        // BƯỚC 2: Đẩy lên Sheets và cập nhật cho tất cả mọi người
        google.script.run.withSuccessHandler(d => {
            G_Data.quyLon = d;
            renderNopLon(document.getElementById('tab-nop-lon'), true);
            showToast("Đã chốt sổ Quỹ Lợn!", "success");
        }).saveTienLon(dataRow, CURRENT_USER);
    }

    function xoaLichSuLon(rowIndex) {
        if (!confirm("Xóa giao dịch này?")) return;
        G_Data.quyLon.splice(rowIndex - 1, 1); renderNopLon(document.getElementById('tab-nop-lon')); showToast("Đã xóa!", "success");
        google.script.run.withSuccessHandler(d => { G_Data.quyLon = d; }).deleteTienLon(rowIndex, CURRENT_USER);
    }

    function timMaNopLon(inputEl) {
        let ma = inputEl.value.trim().toUpperCase();
        if (!ma) { document.getElementById('lon-ten').value = ""; return; }
        document.getElementById('lon-ten').value = "Đang tìm..."; document.getElementById('lon-ten').style.color = "#000";
        google.script.run.withSuccessHandler(res => {
            if (inputEl.value.trim().toUpperCase() !== ma) return;
            if (res.success) { document.getElementById('lon-ten').value = res.name; document.getElementById('lon-ten').style.color = "var(--primary)"; }
            else { document.getElementById('lon-ten').value = "❌ Không tìm thấy mã này!"; document.getElementById('lon-ten').style.color = "var(--danger)"; }
        }).getEmployeeData(ma);
    }

    // --- POPUP PHÓNG TO, HIỂN THỊ ĐẸP & CÓ NGÀY THÁNG ---
    function showChiTietQuy() {
        let map = {};
        for (let i = 1; i < G_Data.quyLon.length; i++) {
            let r = G_Data.quyLon[i];
            let ngay = r[0] || ""; let ma = r[1] || "???"; let ten = r[2] || "???";
            let loi = r[3] || ""; let nop = parseFloat(r[4]) || 0;

            if (nop > 0) {
                if (!map[ma]) map[ma] = { ten: ten, nop: 0, dsLoi: [], dsNgay: [] };
                map[ma].nop += nop;
                let detailNop = nop + "K " + loi;
                if (loi && !map[ma].dsLoi.includes(detailNop)) map[ma].dsLoi.push(detailNop);
                if (ngay && !map[ma].dsNgay.includes(ngay)) map[ma].dsNgay.push(ngay);
            }
        }

        let html = `<div style="width: 100%; padding: 10px 20px; margin: 0 auto;">
                <div class="table-container" style="max-height: 75vh; border:2px solid var(--success); border-radius: 8px;">
                <table class="app-table" style="width: 100%; font-size:16px;">
                <thead><tr>
                    <th style="background:var(--success);" data-lang="th_mathe">Mã Thẻ</th>
                    <th style="background:var(--success);" data-lang="nl_emp_name">Tên Nhân Viên</th>
                    <th style="background:var(--success);" data-lang="nl_ngay_thu">Ngày thu</th>
                    <th style="background:var(--success);" data-lang="nl_ly_do_nop">Lý do đã nộp</th>
                    <th style="background:var(--success); text-align:right; padding-right:40px;" data-lang="nl_tong_nop">Tổng Đã Đóng</th>
                </tr></thead><tbody>`;

        let keys = Object.keys(map);
        if (keys.length === 0) html += `<tr><td colspan="5" style="text-align:center; padding:30px; font-weight:bold; font-size:16px;">Chưa có dữ liệu đóng quỹ!</td></tr>`;
        else {
            keys.forEach(k => {
                html += `<tr>
                    <td style="font-weight:900; padding:12px 15px;">${k}</td>
                    <td style="font-weight:900;">${map[k].ten}</td>
                    <td style="color:#000; font-weight:800;">${map[k].dsNgay.join(', ')}</td>
                    <td style="color:#555;">${map[k].dsLoi.join(' ; ')}</td>
                    <td style="color:var(--success); font-weight:900; font-size:22px; text-align:right; padding-right:40px;">${map[k].nop} K</td>
                </tr>`;
            });
        }

        document.getElementById('modal-title').innerText = "📋 DANH SÁCH CHI TIẾT NHỮNG NGƯỜI ĐÃ ĐÓNG QUỸ";
        document.getElementById('modal-body').innerHTML = html + "</tbody></table></div></div>";
        document.getElementById('app-modal').style.display = 'flex';
        updateTextByLang();
    }

    function showChiTietNo() {
        let map = {};
        for (let i = 1; i < G_Data.quyLon.length; i++) {
            let r = G_Data.quyLon[i];
            let ngay = r[0] || ""; let ma = r[1] || "???"; let ten = r[2] || "???";
            let loi = r[3] || ""; let no = parseFloat(r[5]) || 0;

            if (no > 0) {
                if (!map[ma]) map[ma] = { ten: ten, no: 0, dsLoi: [], dsNgay: [] };
                map[ma].no += no;
                let detailNo = no + "K " + loi;
                if (loi && !map[ma].dsLoi.includes(detailNo)) map[ma].dsLoi.push(detailNo);
                if (ngay && !map[ma].dsNgay.includes(ngay)) map[ma].dsNgay.push(ngay);
            }
        }

        let html = `<div style="width: 100%; padding: 10px 20px; margin: 0 auto;">

    function loadKiemTraData() {
        let fromDate = document.getElementById('kt-from-date').value;
        let toDate = document.getElementById('kt-to-date').value;
        let soLoiVal = document.getElementById('kt-so-loi').value;
        let soLoi = soLoiVal === 'ALL' ? 'ALL' : parseInt(soLoiVal, 10);

        if (!fromDate || !toDate) {
            return showToast("Vui lòng chọn Từ Ngày và Đến Ngày!", "error");
        }

        document.getElementById('kt-tbody').innerHTML = '<tr><td colspan="13" style="text-align:center; padding:20px;"><div class="loader-spinner" style="margin:0 auto; width:30px; height:30px;"></div></td></tr>';

        google.script.run.withSuccessHandler(res => {
            let html = '';
            if (!res || res.length === 0) {
                let msg = soLoi === 'ALL' ? 'lỗi' : 'đúng ' + soLoi + ' lỗi';
                html = '<tr><td colspan="13" style="text-align:center; padding:20px; color:#dc3545; font-weight:bold; border:1px solid #dee2e6;">Không tìm thấy nhân viên nào có ' + msg + ' trong khoảng thời gian này.</td></tr>';
            } else {
                res.forEach(row => {
                    html += '<tr>';
                    for (let i = 0; i < 13; i++) {
                        let cell = row[i] || "";
                        let align = (i === 1 || i === 4 || i === 5 || i === 11 || i === 12) ? 'center' : 'left';
                        let color = (i === 5 && parseInt(cell) > 0) ? 'color:var(--danger);font-weight:bold;' : '';
                        html += `<td style="text-align:${align}; padding:8px; border:1px solid #dee2e6; ${color}">${cell}</td>`;
                    }
                    html += '</tr>';
                });
            }
            document.getElementById('kt-tbody').innerHTML = html;
        }).getKiemTraData(fromDate, toDate, soLoi);
    }

    function exportKiemTraExcel() {
        let table = document.getElementById('kt-result-table');
        if (!table) return showToast('Chưa có dữ liệu để tải!', 'warning');

        let rows = table.querySelectorAll('tr');
        if (rows.length <= 1 || table.querySelector('tbody').innerText.includes('Nhấn "TÌM KIẾM"')) {
            return showToast('Không có dữ liệu để xuất Excel!', 'warning');
        }

        let csvContent = '\uFEFF';
        rows.forEach(row => {
            let cols = row.querySelectorAll('th, td');
            let rowData = [];
            cols.forEach(col => {
                let text = col.innerText.replace(/"/g, '""');
                rowData.push('"' + text + '"');
            });
            csvContent += rowData.join(',') + '\r\n';
        });

        let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        let url = URL.createObjectURL(blob);
        let link = document.createElement('a');
        let fromDate = document.getElementById('kt-from-date').value || 'ALL';
        let toDate = document.getElementById('kt-to-date').value || 'ALL';
        let fileName = `KiemTraLoi_${fromDate}_den_${toDate}.csv`;
        link.setAttribute('href', url);
        link.setAttribute('download', fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function renderQuySummary(data, adminData) {
        let members = [];
        let tongThu = 0;
        let tongChi = 0;
        let thuByPersonAndMonth = {};
        let monthSet = new Set();

        for (let i = 1; i < adminData.length; i++) {
            if (adminData[i][4]) members.push(adminData[i][4].trim());
        }
        members = [...new Set(members)].sort();

        let mienByPersonAndMonth = {};

        for (let i = 1; i < data.length; i++) {
            let d = data[i];
            if (!d[0]) continue;
            let loai = d[1].toUpperCase();
            let isThu = (loai === 'THU TIỀN' || loai === 'INCOME' || loai === 'THU');
            let isChi = (loai === 'CHI TIỀN' || loai === 'EXPENSE' || loai === 'CHI');
            let isMien = (loai === 'MIỄN QUỸ');
            let sotien = parseFloat(d[2]) || 0;
            let nguoi = (d[3] || '').trim();

            let monthStr = (d[6] || '').trim();
            if (!monthStr && d[0].includes('/')) {
                let parts = d[0].split(' ')[0].split('/');
                if (parts.length >= 2) monthStr = parts[1] + "/" + (parts[2].length === 2 ? "20" + parts[2] : parts[2]);
            }
            if (!monthStr) monthStr = "N/A";
            monthSet.add(monthStr);

            if (isThu) {
                tongThu += sotien;
                if (!thuByPersonAndMonth[nguoi]) thuByPersonAndMonth[nguoi] = {};
                thuByPersonAndMonth[nguoi][monthStr] = (thuByPersonAndMonth[nguoi][monthStr] || 0) + sotien;
            } else if (isChi) {
                tongChi += sotien;
            } else if (isMien) {
                if (!mienByPersonAndMonth[nguoi]) mienByPersonAndMonth[nguoi] = {};
                mienByPersonAndMonth[nguoi][monthStr] = d[4] || "Miễn đóng";
            }
        }

        let tonQuy = tongThu - tongChi;

        let months = Array.from(monthSet).sort((a, b) => {
            if (a === "N/A") return -1; if (b === "N/A") return 1;
            let pa = a.split('/'); let pb = b.split('/');
            if (pa[1] !== pb[1]) return parseInt(pa[1]) - parseInt(pb[1]);
            return parseInt(pa[0]) - parseInt(pb[0]);
        });

        let currentMonth = months.length > 0 ? months[months.length - 1] : '';

        let unpaidMembers = [];

            members.forEach(m => {

                let mien = (mienByPersonAndMonth[m] && mienByPersonAndMonth[m][selectedMonth]) ? mienByPersonAndMonth[m][selectedMonth] : null;
                if (paid <= 0 && !mien) {

                    <div style="flex:1; min-width:180px; background:white; border-radius:12px; padding:10px 15px; box-shadow:${shadow}; display:flex; align-items:center; gap:15px; border-left:6px solid var(--primary);">

                            ${monthOptions}

                html += `

                                    <button class="action-btn orange btn-sm" onclick="moFormMienQuy('${m}')" style="margin:0 auto; margin-left:5px;">MIỄN QUỸ</button>

        html += `
                        </tbody>

        let exemptMembers = [];
        if (selectedMonth) {
            members.forEach(m => {
                let mien = (mienByPersonAndMonth[m] && mienByPersonAndMonth[m][selectedMonth]) ? mienByPersonAndMonth[m][selectedMonth] : null;
                if (mien) {
                    exemptMembers.push({ name: m, reason: mien });

        if (exemptMembers.length > 0) {
            html += `

                    <div class="table-container" style="border-radius:16px; box-shadow:${shadow}; background:#f8fbff; overflow-y:auto; overflow-x:auto;">

    function showBxhLon() {
        let map = {};
        for (let i = 1; i < G_Data.quyLon.length; i++) {
            let r = G_Data.quyLon[i];
            let ma = r[1] || "???"; let ten = r[2] || "???";
            let nop = parseFloat(r[4]) || 0; let no = parseFloat(r[5]) || 0;

            if (!map[ma]) map[ma] = { ma: ma, ten: ten, nop: 0, no: 0 };
            map[ma].nop += nop;
            map[ma].no += no;
        }

        let arr = Object.values(map);
        let arrNop = arr.filter(x => x.nop > 0).sort((a, b) => b.nop - a.nop);
        let arrNo = arr.filter(x => x.no > 0).sort((a, b) => b.no - a.no);

        let html = `<div style="display:flex; flex-wrap:wrap; gap:20px; width:100%; padding: 10px;">`;

        html += `<div style="flex:1; min-width:350px;"><h3 style="color:var(--success); text-align:center; margin-bottom:15px; font-weight:900; text-transform:uppercase; font-size:20px;" data-lang="quy_bang_vang">🏆 Bảng Vàng Đóng Góp</h3>
    <div class="table-container" style="max-height: 65vh; border:2px solid var(--success); border-radius: 8px;"><table class="app-table" style="width: 100%;"><thead><tr><th style="text-align:center; background:var(--success); width: 80px;" data-lang="xnl_th_stt">TOP</th><th style="background:var(--success);" data-lang="quy_th_hoten">Tên Nhân Viên</th><th style="background:var(--success); text-align:right; padding-right:20px;" data-lang="quy_da_dong">Đã Đóng</th></tr></thead><tbody>`;
        arrNop.forEach((x, i) => {
            let huyHieu = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `<span style="color:#888; font-size:16px;">#${i + 1}</span>`;
            let highlight = i < 3 ? "background:#f8fff9;" : "";
            html += `<tr style="${highlight}"><td style="text-align:center; font-size:26px;">${huyHieu}</td><td style="font-weight:900; font-size:16px; padding: 12px 15px;">${x.ten} <br><small style="color:#888;">${x.ma}</small></td><td style="color:var(--success); font-weight:900; font-size:22px; text-align:right; padding-right:20px;">${x.nop} K</td></tr>`;
        });
        if (arrNop.length === 0) html += `<tr><td colspan="3" style="text-align:center; font-weight:bold; padding:30px; font-size:16px;" data-lang="quy_no_nop">Chưa có ai đóng góp!</td></tr>`;
        html += `</tbody></table></div></div>`;

        html += `<div style="flex:1; min-width:350px;"><h3 style="color:var(--danger); text-align:center; margin-bottom:15px; font-weight:900; text-transform:uppercase; font-size:20px;" data-lang="quy_bang_no">🚨 Bảng Phong Thần (Nợ)</h3>
    <div class="table-container" style="max-height: 65vh; border:2px solid var(--danger); border-radius: 8px;"><table class="app-table" style="width: 100%;"><thead><tr><th style="text-align:center; background:var(--danger); width: 80px;" data-lang="xnl_th_stt">TOP</th><th style="background:var(--danger);" data-lang="quy_th_hoten">Tên Nhân Viên</th><th style="background:var(--danger); text-align:right; padding-right:20px;" data-lang="quy_dang_no">Đang Nợ</th></tr></thead><tbody>`;
        arrNo.forEach((x, i) => {
            let huyHieu = i === 0 ? "🔥" : i === 1 ? "💀" : i === 2 ? "⚠️" : `<span style="color:#888; font-size:16px;">#${i + 1}</span>`;
            let highlight = i < 3 ? "background:#fff5f5;" : "";
            html += `<tr style="${highlight}"><td style="text-align:center; font-size:26px;">${huyHieu}</td><td style="font-weight:900; font-size:16px; padding: 12px 15px;">${x.ten} <br><small style="color:#888;">${x.ma}</small></td><td style="color:var(--danger); font-weight:900; font-size:22px; text-align:right; padding-right:20px;">${Math.max(0, x.no)} K</td></tr>`;

    function moFormMienQuy(nguoi) {
        let quyData = G_Data.quy || [];

        let monthSet = new Set();
        for (let i = 1; i < quyData.length; i++) {
            if (quyData[i][6]) monthSet.add(quyData[i][6].toString().trim());
        }
        let months = Array.from(monthSet).sort((a, b) => {
            let pa = a.split('/'); let pb = b.split('/');
            return new Date(pa[1], pa[0] - 1) - new Date(pb[1], pb[0] - 1);
        });

        let thuByMonth = {};
        let mienByMonth = {};
        for (let i = 1; i < quyData.length; i++) {
            let r = quyData[i];
            if (!r[0]) continue;
            let loai = r[1] ? r[1].toString().toUpperCase() : '';
            let target = r[3] ? r[3].toString().trim() : '';
            let m = r[6] ? r[6].toString().trim() : '';

            if (target === nguoi && m) {
                if (loai === 'THU TIỀN' || loai === 'THU' || loai === 'INCOME') {
                    thuByMonth[m] = (thuByMonth[m] || 0) + (parseFloat(r[2]) || 0);
                } else if (loai === 'MIỄN QUỸ') {
                    mienByMonth[m] = true;
                }
            }
        }

        let unpaidMonths = [];
        months.forEach(m => {
            if (!thuByMonth[m] && !mienByMonth[m]) unpaidMonths.push(m);
        });

        if (unpaidMonths.length === 0) {
            showToast(nguoi + " không nợ quỹ tháng nào!", "info");
            return;
        }

        let html = `
                <div style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:5000;" id="mienquy-modal">
                    <div style="background:white; padding:30px; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.3); width:90%; max-width:500px; animation:slideIn 0.3s ease;">
                        <h3 style="margin-top:0; color:var(--primary); font-weight:900; border-bottom:2px solid #eee; padding-bottom:10px;">MIỄN QUỸ CHO: <span style="color:#e74c3c;">${nguoi}</span></h3>
                        <div style="margin-bottom:15px;">
                            <label style="font-weight:bold; color:#555;">Chọn các tháng cần miễn quỹ:</label>
                            <div style="margin-top:10px; border:1px solid #ddd; border-radius:8px; padding:10px; max-height:200px; overflow-y:auto;">
                                <div style="margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:8px;">
                                    <label style="font-weight:bold; cursor:pointer;"><input type="checkbox" onchange="document.querySelectorAll('.mq-cb').forEach(c=>c.checked=this.checked)"> CHỌN TẤT CẢ</label>
                                </div>
            `;

        unpaidMonths.forEach(m => {
            html += `<div style="margin-bottom:5px;"><label style="cursor:pointer;"><input type="checkbox" class="mq-cb" value="${m}"> Tháng ${m}</label></div>`;
        });

        html += `
                            </div>
                        </div>
                        <div style="margin-bottom:20px;">
                            <label style="font-weight:bold; color:#555;">Lý do miễn (Bắt buộc):</label>
                            <input type="text" id="mq-lydo" class="app-input" placeholder="Ví dụ: Nghỉ sinh, Nghỉ ốm..." style="margin-top:5px;">
                        </div>
                        <div style="display:flex; justify-content:flex-end; gap:10px;">
                            <button class="action-btn" style="background:#888;" onclick="document.getElementById('mienquy-modal').remove()">HỦY</button>
                            <button class="action-btn green" onclick="submitMienQuyMulti('${nguoi}')">XÁC NHẬN MIỄN</button>
                        </div>
                    </div>
                </div>
            `;

    function renderQuyMatrix(data, adminData) {
        let members = [];
        for (let i = 1; i < adminData.length; i++) {
            if (adminData[i][4]) {
                members.push(adminData[i][4].trim());
            }
        }
        members = [...new Set(members)].sort();

        let monthSet = new Set();
        let thuByPersonAndMonth = {};
        let mienByPersonAndMonth = {};
        let chiByMonth = {};
        let sumThuByMonth = {};
        let sumChiByMonth = {};

        for (let i = 1; i < data.length; i++) {
            let d = data[i];
            if (!d[0]) continue;

            let loai = d[1].toUpperCase();
            let isThu = (loai === 'THU TIỀN' || loai === 'INCOME' || loai === 'THU');
            let sotien = parseFloat(d[2]) || 0;
            let nguoi = (d[3] || '').trim();
            let lydo = (d[4] || '').trim();

            let monthStr = (d[6] || '').trim();
            if (!monthStr && d[0].includes('/')) {
                let parts = d[0].split(' ')[0].split('/');
                if (parts.length >= 2) {
                    monthStr = parts[1] + "/" + (parts[2].length === 2 ? "20" + parts[2] : parts[2]);
                }
            }
            if (!monthStr) monthStr = "N/A";
            monthSet.add(monthStr);

            if (isThu) {
                if (!thuByPersonAndMonth[nguoi]) thuByPersonAndMonth[nguoi] = {};
                thuByPersonAndMonth[nguoi][monthStr] = (thuByPersonAndMonth[nguoi][monthStr] || 0) + sotien;
                sumThuByMonth[monthStr] = (sumThuByMonth[monthStr] || 0) + sotien;
            } else if (loai === 'CHI TIỀN' || loai === 'EXPENSE' || loai === 'CHI') {
                if (!chiByMonth[monthStr]) chiByMonth[monthStr] = [];
                chiByMonth[monthStr].push({ lydo: lydo, amount: sotien });
                sumChiByMonth[monthStr] = (sumChiByMonth[monthStr] || 0) + sotien;
            } else if (loai === 'MIỄN QUỸ') {
                if (!mienByPersonAndMonth[nguoi]) mienByPersonAndMonth[nguoi] = {};
                mienByPersonAndMonth[nguoi][monthStr] = true;
            }
        }

        let months = Array.from(monthSet).sort((a, b) => {
            if (a === "N/A") return -1; if (b === "N/A") return 1;
            let pa = a.split('/'); let pb = b.split('/');
            if (pa[1] !== pb[1]) return parseInt(pa[1]) - parseInt(pb[1]);
            return parseInt(pa[0]) - parseInt(pb[0]);
        });

        if (months.length === 0) months = ['06/2026'];

        let html = `
                <style>
                    .quy-matrix-table td {
                        border: 1px solid #000 !important;
                        color: #000 !important;
                        font-size: 16px !important;
                    }
                    .quy-matrix-table th {
                        border: 1px solid #000 !important;
                        color: #fff !important;
                        font-size: 16px !important;
                    }
                    .quy-matrix-table {
                        border-collapse: collapse !important;
                        border: 2px solid #000 !important;
                    }
                </style>
                <div class="table-container" style="border:none; box-shadow:0 10px 25px rgba(0,0,0,0.05); overflow-x:auto;">
                    <table class="app-table quy-matrix-table" style="min-width: ${600 + months.length * 150}px;">
                        <thead>
                            <tr>
                                <th style="position:sticky; top:0; left:0; z-index:20; width:50px; background:var(--primary); color:white; border-bottom:none;" data-lang="xnl_th_stt">STT</th>
                                <th style="position:sticky; top:0; left:50px; z-index:20; width:200px; text-align:left; background:var(--primary); color:white; border-bottom:none;" data-lang="xnl_th_hoten">HỌ TÊN</th>
                                <th style="position:sticky; top:0; z-index:10; text-align:right; width:120px; background:var(--primary); color:white; border-bottom:none;" data-lang="quy_tong_nop">TỔNG NỘP</th>
            `;

        months.forEach(m => {
            html += `<th style="position:sticky; top:0; z-index:10; text-align:right; width:150px; background:var(--primary); color:white; border-bottom:none;">T. ${m}</th>`;
        });

        html += `
                            </tr>
                        </thead>
                        <tbody>
            `;

        let totalAllThu = 0;

        members.forEach((m, idx) => {
            let personTotal = 0;
            let tds = '';
            months.forEach(month => {
                let amt = (thuByPersonAndMonth[m] && thuByPersonAndMonth[m][month]) ? thuByPersonAndMonth[m][month] : 0;
                personTotal += amt;
                totalAllThu += amt;
                let isMien = (mienByPersonAndMonth[m] && mienByPersonAndMonth[m][month]);
                let colorStyle = amt > 0 ? "font-weight:900; font-size:15px; background:#fff;" : "background:#fff;";
                let cellContent = amt > 0 ? amt.toLocaleString() : (isMien ? '<span style="color:var(--danger); font-weight:900; font-size:16px;">X</span>' : '<span style="color:var(--danger); font-weight:bold;" data-lang="quy_no">Nợ</span>');
                tds += `<td style="text-align:right; ${colorStyle}">${cellContent}</td>`;
            });

            html += `
                    <tr>
                        <td style="position:sticky; left:0; z-index:5; background:#fff; text-align:center; font-size:14px;">${idx + 1}</td>
                        <td style="position:sticky; left:50px; z-index:5; background:#fff; font-weight:900; font-size:15px; text-align:left;">${m}</td>
                        <td style="text-align:right; font-weight:900; font-size:15px; background:#fff;">${personTotal.toLocaleString()}</td>
                        ${tds}
                    </tr>
                `;
        });

        let extraMembers = Object.keys(thuByPersonAndMonth).filter(m => !members.includes(m) && m !== '').sort();
        if (extraMembers.length > 0) {
            html += `<tr><td colspan="${3 + months.length}" style="background:#fff3cd; font-weight:bold; padding:10px; text-align:center; color:#856404;" data-lang="quy_nguon_khac">${getTxt('quy_nguon_khac') || 'NGUỒN KHÁC (NGHỈ VIỆC / SẾP TÀI TRỢ...)'}</td></tr>`;
            extraMembers.forEach((m, idx) => {
                let personTotal = 0;
                let tds = '';
                months.forEach(month => {
                    let amt = (thuByPersonAndMonth[m] && thuByPersonAndMonth[m][month]) ? thuByPersonAndMonth[m][month] : 0;
                    personTotal += amt;
                    totalAllThu += amt;
                    let colorStyle = amt > 0 ? "font-weight:900; font-size:15px; background:#fff;" : "background:#fff;";
                    let cellContent = amt > 0 ? amt.toLocaleString() : '<span style="color:#000; font-weight:900; font-size:16px;">-</span>';
                    tds += `<td style="text-align:right; ${colorStyle}">${cellContent}</td>`;
                });

                html += `
                        <tr>
                            <td style="position:sticky; left:0; z-index:5; background:#fff; text-align:center; font-style:italic; font-size:14px; font-weight:900; color:#856404;">${idx + 1}</td>
                            <td style="position:sticky; left:50px; z-index:5; background:#fff; font-weight:900; font-size:15px; text-align:left; color:#856404;">${m}</td>
                            <td style="text-align:right; font-weight:900; font-size:15px; background:#fff;">${personTotal.toLocaleString()}</td>
                            ${tds}
                        </tr>
                    `;
            });
        }

        // Tổng THU
        html += `
                    <tr style="background:#e2f0df;">
                        <td colspan="2" style="position:sticky; left:0; z-index:5; font-weight:900; font-size:15px; text-align:right; background:#e2f0df;">TỔNG THU TRONG THÁNG:</td>
                        <td style="font-weight:900; font-size:15px; text-align:right; background:#e2f0df;">${totalAllThu.toLocaleString()}</td>
            `;
        months.forEach(month => {
            let s = sumThuByMonth[month] || 0;
            html += `<td style="font-weight:900; font-size:15px; text-align:right; background:#e2f0df;">${s.toLocaleString()}</td>`;
        });
        html += `</tr>`;

        // Tổng CHI
        html += `
                    <tr style="background:#f8d7da;">
                        <td colspan="2" style="position:sticky; left:0; z-index:5; font-weight:900; font-size:15px; text-align:right; background:#f8d7da;">CÁC KHOẢN CHI & TỔNG CHI:</td>
                        <td style="font-weight:900; font-size:15px; text-align:right; background:#f8d7da;">${Object.values(sumChiByMonth).reduce((a, b) => a + b, 0).toLocaleString()}</td>
            `;
        months.forEach(month => {
            let s = sumChiByMonth[month] || 0;
            html += `<td style="font-weight:900; font-size:15px; text-align:right; vertical-align:middle; background:#f8d7da;">${s > 0 ? s.toLocaleString() : '0'}</td>`;
        });
        html += `</tr>`;

        // TỒN QUỸ
        let runningTonQuy = 0;
        html += `
                    <tr style="background:#cce5ff;">
                        <td colspan="2" style="position:sticky; left:0; z-index:5; font-weight:900; text-align:right; background:#cce5ff; font-size:16px;">TỒN QUỸ LŨY KẾ:</td>
                        <td style="font-weight:900; text-align:right; font-size:16px; background:#cce5ff;">${(totalAllThu - Object.values(sumChiByMonth).reduce((a, b) => a + b, 0)).toLocaleString()}</td>
            `;
        months.forEach(month => {
            let sThu = sumThuByMonth[month] || 0;
            let sChi = sumChiByMonth[month] || 0;
            runningTonQuy += (sThu - sChi);
            html += `<td style="font-weight:900; text-align:right; font-size:18px; background:#cce5ff; color: var(--primary);">${runningTonQuy.toLocaleString()}</td>`;
        });
        html += `</tr>`;

        html += `</tbody></table></div>`;
        return html;
    }

    function moFormAddHolder() {
        let name = prompt("Nhập họ tên người giữ quỹ:");
        if (!name) return;
        let amt = prompt("Nhập số tiền người này đang giữ (K):", "0");
        if (amt === null) return;
        amt = parseFloat(amt) || 0;

        let holders = G_Data.fundHolders || [];
        holders.push({ name: name.trim(), amount: amt });
        saveHoldersToBackend(holders);
    }

    function editHolder(idx, oldName, oldAmt) {
        let name = prompt("Sửa họ tên:", oldName);
        if (!name) return;
        let amt = prompt("Sửa số tiền (K):", oldAmt);
        if (amt === null) return;

        let holders = G_Data.fundHolders || [];
        if (holders[idx]) {
            holders[idx].name = name.trim();
            holders[idx].amount = parseFloat(amt) || 0;
            saveHoldersToBackend(holders);
        }
    }

    function deleteHolder(idx) {
        if (!confirm("Bạn có chắc chắn muốn xóa người này?")) return;
        let holders = G_Data.fundHolders || [];
        holders.splice(idx, 1);
        saveHoldersToBackend(holders);
    }

                showToast("Lỗi: " + res.error, "error");

    function luuGiaoDichQuy() {
        let loai = document.getElementById('quy-loai').value;
        let sotien = document.getElementById('quy-sotien').value.trim();

        let cbs = document.querySelectorAll('.quy-cb-nguoi:checked');
        let selectedNguoi = Array.from(cbs).map(cb => cb.value);

        let nguoiNgoai = document.getElementById('quy-nguoi-ngoai').value.trim();
        if (nguoiNgoai) {
            let listNgoai = nguoiNgoai.split(',').map(n => n.trim()).filter(n => n);
            selectedNguoi = selectedNguoi.concat(listNgoai);
        }

        let lydo = document.getElementById('quy-lydo').value.trim();
        let thangInput = document.getElementById('quy-thang-ghi');
        let thangGhiQuy = "";

        if (thangInput && thangInput.value) {
            let parts = thangInput.value.split("-");
            thangGhiQuy = parts[1] + "/" + parts[0];
        }

        if (!sotien || selectedNguoi.length === 0) return showToast("Vui lòng nhập số tiền và chọn/nhập tên người!", "error");

        let dataArr = [];
        let nowTime = new Date().toLocaleString('vi-VN');
        selectedNguoi.forEach(ng => {
            dataArr.push({
                thoiGian: nowTime,
                loai: loai,
                soTien: sotien,
                nguoiNopNhan: ng,
                lyDo: lydo,
                nguoiThaoTac: CURRENT_USER,
                thangGhiQuy: thangGhiQuy
            });
        });

        document.getElementById('quy-modal-overlay').remove();
        showToast("Đang lưu " + dataArr.length + " giao dịch...", "info");
        document.getElementById('loader').style.display = 'flex';

        google.script.run.withSuccessHandler(res => {
            document.getElementById('loader').style.display = 'none';
            if (res.success) {
                G_Data.quy = res.newQuy;
                showToast("Lưu giao dịch thành công!", "success");
                renderQuy(document.getElementById('tab-quy'));
            } else {
                showToast("Lỗi: " + res.message, "error");
            }
        }).saveMultipleQuyData(dataArr);
    }

    function xoaQuy() {
        let checkboxes = document.querySelectorAll('.quy-cb:checked');
        let rowsToDel = Array.from(checkboxes).map(cb => parseInt(cb.value));

        if (rowsToDel.length === 0) return showToast(getTxt('no_select_del') || 'Chưa chọn dòng nào!', 'warning');
        if (!confirm("Bạn có chắc chắn muốn xóa " + rowsToDel.length + " giao dịch này không? Hành động này không thể hoàn tác!")) return;

        showToast("Đang xóa...", "info");
        document.getElementById('loader').style.display = 'flex';

        google.script.run.withSuccessHandler(res => {
            document.getElementById('loader').style.display = 'none';
            if (res.success) {
                G_Data.quy = res.newQuy;
                showToast("Đã xóa thành công!", "success");
                renderQuy(document.getElementById('tab-quy'));
            } else {
                showToast("Lỗi: " + res.message, "error");
            }
        }).xoaQuyData(rowsToDel, CURRENT_USER);
    }

    let qsSaveTimeout = null;
    function qsSaveDataOnline() {
        if (window.QS_IS_SPINNING) return; // Do not save mid-spin to avoid lag
        clearTimeout(qsSaveTimeout);
        qsSaveTimeout = setTimeout(() => {
            let data = {
                winners: window.QS_WINNERS,
                prizes: window.QS_PRIZES,
                participants: window.QS_PARTICIPANTS,
                eventTitle: window.QS_EVENT_TITLE,
                background: window.QS_BACKGROUND || ''
            };
            google.script.run.withSuccessHandler(function (res) {
                // Saved
            }).saveQuaySoData(JSON.stringify(data));
        }, 1000);
    }

    function qsSyncOnline(event) {
        let btn = event ? event.target : document.getElementById('qs-main-title'); // fallback
        let oldText = btn.innerText;
        if (btn.tagName === 'BUTTON') btn.innerText = "ĐANG TẢI...";
        google.script.run.withSuccessHandler(function (res) {
            if (res) {
                try {
                    let data = JSON.parse(res);
                    window.QS_WINNERS = data.winners || [];
                    window.QS_PRIZES = data.prizes || window.QS_PRIZES;
                    window.QS_PARTICIPANTS = data.participants || [];
                    window.QS_EVENT_TITLE = data.eventTitle || window.QS_EVENT_TITLE;
                    window.QS_BACKGROUND = data.background || window.QS_BACKGROUND;
                    window.QS_EFFECT = data.effect || window.QS_EFFECT;
                    window.QS_DISPLAY_MODE = data.displayMode || window.QS_DISPLAY_MODE;

                    // Re-render
                    document.getElementById('qs-main-container').style.background = window.QS_BACKGROUND;
                    document.getElementById('qs-main-container').style.backgroundSize = 'cover';
                    document.getElementById('qs-config-title').value = window.QS_EVENT_TITLE;
                    let bgSelect = document.getElementById('qs-config-bg');
                    if (bgSelect && window.QS_BACKGROUND) bgSelect.value = window.QS_BACKGROUND;
                    let efSelect = document.getElementById('qs-config-effect');
                    if (efSelect && window.QS_EFFECT) {
                        efSelect.value = window.QS_EFFECT;
                        qsUpdateEffect(window.QS_EFFECT, false);
                    }
                    let disSelect = document.getElementById('qs-config-display');
                    if (disSelect && window.QS_DISPLAY_MODE) disSelect.value = window.QS_DISPLAY_MODE;

                    // Re-load participants into textareas
                    let ids = [];
                    let names = [];
                    window.QS_PARTICIPANTS.forEach(p => {
                        let parts = p.split('|');
                        if (parts.length >= 2) {
                            ids.push(parts[0].trim());
                            names.push(parts.slice(1).join('|').trim());
                        } else {
                            ids.push('');
                            names.push(p);
                        }
                    });
                    let txtId = document.getElementById('qs-parts-id');
                    let txtName = document.getElementById('qs-parts-name');
                    if (txtId) txtId.value = ids.join('\n');
                    if (txtName) txtName.value = names.join('\n');

                    qsUpdateParticipants(false);
                    qsRenderPrizes(false);
                    qsUpdatePrizeDisplay();
                    qsRenderTableWinners();

                    showToast("Đã đồng bộ xong dữ liệu!");
                } catch (e) { }
            }
            if (btn.tagName === 'BUTTON') btn.innerText = oldText;
        }).getQuaySoData();
    }

    function qsUpdateTitle(val) {
        window.QS_EVENT_TITLE = val;
        let mainTitle = document.getElementById('qs-main-title');
        if (mainTitle) mainTitle.innerText = val || '🎉 HỆ THỐNG QUAY SỐ 🎉';
        qsSaveDataOnline();
    }

    function qsUpdateBackground(val) {
        window.QS_BACKGROUND = val;
        let el = document.getElementById('qs-main-container');
        if (el) {
            el.style.background = val;
            el.style.backgroundSize = 'cover';
            el.style.backgroundPosition = 'center';
        }
        qsSaveDataOnline();
    }

    function qsSwitchTab(tab) {
        window.QS_CURRENT_TAB = tab;
        ['spin', 'list', 'settings'].forEach(t => {
            let el = document.getElementById('qs-tab-' + t);
            let btn = document.getElementById('qs-btn-' + t);
            if (t === tab) {
                el.style.display = 'flex';
                btn.style.background = '#ffd700';
                btn.style.color = '#000';
                btn.style.boxShadow = '0 0 15px rgba(255,215,0,0.5)';
                btn.style.border = 'none';
            } else {
                el.style.display = 'none';
                btn.style.background = 'transparent';
                btn.style.color = '#fff';
                btn.style.boxShadow = 'none';
                btn.style.border = '1px solid #ffd700';
            }
        });

        if (tab === 'spin') qsUpdatePrizeDisplay();
        if (tab === 'list') qsRenderTableWinners();
    }

    function qsUpdateParticipants(save = true) {
        let txtId = document.getElementById('qs-parts-id');
        let txtName = document.getElementById('qs-parts-name');
        if (!txtId || !txtName) return;

        let ids = txtId.value.split('\n').map(x => x.trim());
        let names = txtName.value.split('\n').map(x => x.trim());
        let len = Math.max(ids.length, names.length);

        let parts = [];
        for (let i = 0; i < len; i++) {
            let id = ids[i] || '';
            let name = names[i] || '';
            if (id === '' && name === '') continue;
            if (id !== '' && name !== '') parts.push(id + ' | ' + name);
            else parts.push(id + name);
        }
        window.QS_PARTICIPANTS = parts;

        let countEl = document.getElementById('qs-count-pp');
        if (countEl) {
            let prefix = typeof getTxt === 'function' ? getTxt('qs_set_total') || 'Tổng cộng:' : 'Tổng cộng:';
            countEl.innerHTML = `<span data-lang="qs_set_total">${prefix}</span> ${parts.length}`;
        }
        if (typeof updateTextByLang === 'function') updateTextByLang();
        if (save) qsSaveDataOnline();
    }

    function qsAddSinglePerson() {
        let inp = document.getElementById('qs-single-add');
        let name = inp.value.trim();
        if (!name) return;
        let txtName = document.getElementById('qs-parts-name');
        if (txtName) {
            if (txtName.value.trim() !== '') txtName.value += '\n' + name;
            else txtName.value = name;
        }
        qsUpdateParticipants();
        inp.value = '';
    }

    function qsHandleImageUpload(inputEl, prizeIdx) {
        let file = inputEl.files[0];
        if (!file) return;

        let btn = document.getElementById('qs-upload-btn-' + prizeIdx);
        if (btn) btn.innerText = 'Đang tải...';

        let reader = new FileReader();
        reader.onload = function (e) {
            let img = new Image();
            img.onload = function () {
                let canvas = document.createElement('canvas');
                let max_w = 400;
                let max_h = 400;
                let w = img.width;
                let h = img.height;

                if (w > h) {
                    if (w > max_w) {
                        let ratio = max_w / w;
                        w = max_w;
                        h = Math.round(h * ratio);
                    }
                } else {
                    if (h > max_h) {
                        let ratio = max_h / h;
                        h = max_h;
                        w = Math.round(w * ratio);
                    }
                }
                canvas.width = w;
                canvas.height = h;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                window.QS_PRIZES[prizeIdx].image = canvas.toDataURL('image/jpeg', 0.8);

                qsRenderPrizes();
                qsSaveDataOnline();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

        btn.style.transform = 'scale(0.95)';
        btn.style.opacity = '0.5';
        btn.innerText = (typeof getTxt === 'function' ? getTxt('qs_btn_spinning') : 'ĐANG QUAY...');

        qsDoSingleSpin(prizeIdx, p);
    }

    function qsDoSingleSpin(prizeIdx, p) {
        let parts = window.QS_PARTICIPANTS;
        let wonNames = window.QS_WINNERS.map(w => w.name);
        let eligibleParts = parts.filter(name => !wonNames.includes(name));

        let winnersCount = window.QS_WINNERS.filter(w => w.prizeIdx == prizeIdx).length;

        if (winnersCount >= p.count || eligibleParts.length === 0) {
            window.QS_IS_SPINNING = false;
            let btn = document.getElementById('qs-btn-action');
            btn.style.transform = 'scale(1)';
            btn.style.opacity = '1';
            btn.innerText = (typeof getTxt === 'function' ? getTxt('qs_btn_spin') : '🚀 QUAY NGAY');
            qsSaveDataOnline(); // Final save
            return;
        }

        let dur = p.duration || 3;
        let resEl = document.getElementById('qs-result');
        resEl.style.color = '#fff';
        resEl.style.textShadow = 'none';

        let startTime = Date.now();
        let durationMs = dur * 1000;

        let winnerIndex = Math.floor(Math.random() * eligibleParts.length);
        let winnerName = eligibleParts[winnerIndex];

        if (window.QS_SPIN_INTERVAL) clearInterval(window.QS_SPIN_INTERVAL);

        let speed = 50;
        let box = document.getElementById('qs-spinner-box');
        box.classList.remove('qs-flash-anim');
        resEl.classList.remove('qs-winner-anim');
        box.style.boxShadow = 'inset 0 0 50px rgba(255,255,255,0.5)';

        window.QS_SPIN_INTERVAL = setInterval(() => {
            let elapsed = Date.now() - startTime;
            if (elapsed >= durationMs) {
                clearInterval(window.QS_SPIN_INTERVAL);
                resEl.innerHTML = qsGetDisplayPart(winnerName, window.QS_DISPLAY_MODE);
                resEl.style.color = '#ffd700';
                resEl.style.textShadow = '0 0 30px rgba(255, 215, 0, 1)';

                // Trigger animations
                void resEl.offsetWidth;
                resEl.classList.add('qs-winner-anim');

                void box.offsetWidth;
                box.classList.add('qs-flash-anim');

                window.QS_WINNERS.push({ prizeIdx: prizeIdx, name: winnerName });
                qsUpdatePrizeDisplay();

                let newWinnersCount = window.QS_WINNERS.filter(w => w.prizeIdx == prizeIdx).length;
                let remainingParts = parts.filter(n => !window.QS_WINNERS.map(w => w.name).includes(n));

                if (newWinnersCount < p.count && remainingParts.length > 0) {
                    let delayMs = (p.delay !== undefined ? p.delay : 2) * 1000;
                    resEl.style.color = '#00ff00';
                    setTimeout(() => {
                        if (!window.QS_IS_SPINNING) return;
                        qsDoSingleSpin(prizeIdx, p);
                    }, delayMs);
                } else {
                    window.QS_IS_SPINNING = false;
                    let btn = document.getElementById('qs-btn-action');
                    btn.style.transform = 'scale(1)';
                    btn.style.opacity = '1';
                    btn.innerText = (typeof getTxt === 'function' ? getTxt('qs_btn_spin') : '🚀 QUAY NGAY');

                    let wonList = window.QS_WINNERS.filter(w => w.prizeIdx == prizeIdx);
                    if (wonList.length > 0 && typeof google !== 'undefined' && google.script && google.script.run) {
                        let msg = (window.QS_EVENT_TITLE || "🎉 VÒNG QUAY TRÚNG THƯỞNG 🎉").toUpperCase() + "\n";
                        msg += "🎁 Giải: " + p.name + (p.giftName ? " - " + p.giftName : "") + "\n";
                        msg += "Xin chúc mừng các nhân viên sau:\n";
                        wonList.forEach((w, i) => { msg += (i + 1) + ". " + w.name + "\n"; });
                        google.script.run.sendTelegramNotify(msg);
                    }

                    qsSaveDataOnline(); // Spin sequence finished
                }
            } else {
                // Flash names completely randomly from the FULL list of participants
                let rndName = parts[Math.floor(Math.random() * parts.length)];
                resEl.innerHTML = qsGetDisplayPart(rndName, window.QS_DISPLAY_MODE);
                let hue = Math.floor(Math.random() * 360);
                resEl.style.color = `hsl(${hue}, 100%, 75%)`;

                // Flash images
                let imgContainer = document.getElementById('qs-prize-image-container');
                if (imgContainer) {
                    let availablePrizes = window.QS_PRIZES.filter(pr => pr.image && pr.image.trim() !== '');
                    if (availablePrizes.length > 1) {
                        let rndPrize = availablePrizes[Math.floor(Math.random() * availablePrizes.length)];
                        imgContainer.innerHTML = '<div style="display:flex; flex-direction:column; align-items:center;">' +
                            '<img src="' + rndPrize.image + '" style="max-width:100%; max-height:450px; object-fit:contain; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:3px solid #ffd700; opacity:0.8;">' +
                            (rndPrize.giftName ? '<div style="margin-top:20px; background:linear-gradient(45deg, #ffd700, #ff8c00); padding:10px 30px; border-radius:30px; color:#000; font-size:24px; font-weight:900; text-transform:uppercase; opacity:0.8;">' + rndPrize.giftName + '</div>' : '') +
                            '</div>';
                    }
                }
            }
        }, speed);
    }



    // --- 23. KIỂM TRA THẺ ---
    let kiemTraTheInited = false;
    function openKiemTraTheModal() {
        document.getElementById('kiem-tra-the-modal').style.display = 'flex';
        if (!kiemTraTheInited) {
            kiemTraTheRenderRows(50); // Mặc định 50 dòng

            // Sự kiện paste
            document.getElementById('ktt-tbody').addEventListener('paste', function (e) {
                e.preventDefault();
                let pasteText = (e.clipboardData || window.clipboardData).getData('text');
                let pasteHtml = (e.clipboardData || window.clipboardData).getData('text/html');

                if (!pasteText) return;
                let rows = pasteText.split(/\r?\n/);
                if (rows.length > 0 && rows[rows.length - 1] === "") rows.pop(); // Bỏ dòng trống cuối

                // Parse HTML to extract colors
                let htmlRows = [];
                if (pasteHtml) {
                    let temp = document.createElement('div');
                    temp.innerHTML = pasteHtml;
                    let table = temp.querySelector('table');
                    if (table) {
                        htmlRows = Array.from(table.querySelectorAll('tr'));
                    }
                }

                let startRowIdx = 0;
                let target = e.target;
                if (target && target.tagName === 'INPUT' && target.hasAttribute('data-row')) {
                    startRowIdx = parseInt(target.getAttribute('data-row'));
                }

                let currentRows = document.getElementById('ktt-tbody').querySelectorAll('tr').length;
                if (startRowIdx + rows.length > currentRows) {
                    kiemTraTheAddRows((startRowIdx + rows.length) - currentRows + 10);
                }

                let pastedData = rows.map(r => r.split('\t'));
                for (let i = 0; i < pastedData.length; i++) {
                    let trIdx = startRowIdx + i;
                    let rowCols = pastedData[i];

                    let tr = document.getElementById('ktt-row-' + trIdx);
                    if (!tr) continue;

                    let inpTram = tr.querySelector('.ktt-tram');
                    let inpCa = tr.querySelector('.ktt-ca');
                    let inpLine = tr.querySelector('.ktt-line');
                    let inpMaThe = tr.querySelector('.ktt-mathe');

                    let inputs = [inpTram, inpCa, inpLine, inpMaThe];
                    let startColIdx = 0;
                    if (target && target.classList) {
                        if (target.classList.contains('ktt-ca')) startColIdx = 1;
                        else if (target.classList.contains('ktt-line')) startColIdx = 2;
                        else if (target.classList.contains('ktt-mathe')) startColIdx = 3;
                    }

                    for (let j = 0; j < rowCols.length; j++) {
                        let cIdx = startColIdx + j;
                        if (cIdx < inputs.length && inputs[cIdx]) {
                            inputs[cIdx].value = rowCols[j].trim();
                            // Apply styles
                            if (htmlRows.length > i) {
                                let tds = htmlRows[i].querySelectorAll('td, th');
                                if (tds.length > j) {
                                    applyStyleFromTd(tds[j], inputs[cIdx]);
                                }
                            }
                        }
                    }

                    kiemTraTheCalcRow(trIdx);
                }
            });

            function applyStyleFromTd(td, inp) {
                let color = td.style.color;
                let bg = td.style.backgroundColor;

                if (!color || color === 'windowtext') {
                    let span = td.querySelector('font') || td.querySelector('span');
                    if (span && span.style.color) color = span.style.color;
                    else if (span && span.color) color = span.color;
                }

                if (color) {
                    inp.style.color = color;
                    inp.style.fontWeight = 'bold'; // Keep bold to make it visible
                } else {
                    inp.style.color = '';
                }

                if (bg && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'window') {
                    inp.style.backgroundColor = bg;
                } else {
                    inp.style.backgroundColor = '';
                }
            }

            kiemTraTheInited = true;
        }
    }

    function kiemTraTheRenderRows(num) {
        let tbody = document.getElementById('ktt-tbody');
        tbody.innerHTML = '';
        for (let i = 0; i < num; i++) {
            tbody.insertAdjacentHTML('beforeend', kiemTraTheRowHTML(i));
        }
    }

    function kiemTraTheAddRows(num) {
        let tbody = document.getElementById('ktt-tbody');
        let currentRows = tbody.querySelectorAll('tr').length;
        for (let i = 0; i < num; i++) {
            tbody.insertAdjacentHTML('beforeend', kiemTraTheRowHTML(currentRows + i));
        }
    }

    function kiemTraTheRowHTML(idx) {
        return `
        <tr id="ktt-row-${idx}">
            <td style="padding:0; border:1px solid #dee2e6;"><input type="text" class="ktt-tram" data-row="${idx}" oninput="kiemTraTheCalcRow(${idx})"></td>
            <td style="padding:0; border:1px solid #dee2e6;"><input type="text" class="ktt-ca" data-row="${idx}"></td>
            <td style="padding:0; border:1px solid #dee2e6;"><input type="text" class="ktt-line" data-row="${idx}"></td>
            <td style="padding:0; border:1px solid #dee2e6;"><input type="text" class="ktt-mathe" data-row="${idx}" oninput="kiemTraTheCalcRow(${idx})"></td>
            <td class="ktt-ctq1" style="padding:8px; border:1px solid #dee2e6; border-left:2px solid #ffeb3b; text-align:center; background:#fafafa; font-weight:bold;"></td>
            <td class="ktt-ctq2" style="padding:8px; border:1px solid #dee2e6; text-align:center; background:#fafafa; font-weight:bold;"></td>
            <td class="ktt-ctq3" style="padding:8px; border:1px solid #dee2e6; text-align:center; background:#fafafa; font-weight:bold;"></td>
            <td class="ktt-res" style="padding:8px; border:1px solid #dee2e6; text-align:center; background:#fafafa; font-weight:bold;"></td>
        </tr>
        `;
    }

    function kiemTraTheCalcRow(idx) {
        let tr = document.getElementById('ktt-row-' + idx);
        if (!tr) return;

        let tram = tr.querySelector('.ktt-tram').value.trim().toUpperCase();
        let maThe = tr.querySelector('.ktt-mathe').value.trim().toUpperCase();

        let ctq1El = tr.querySelector('.ktt-ctq1');
        let ctq2El = tr.querySelector('.ktt-ctq2');
        let ctq3El = tr.querySelector('.ktt-ctq3');
        let resEl = tr.querySelector('.ktt-res');

        if (!maThe) {
            ctq1El.innerText = ''; ctq2El.innerText = ''; ctq3El.innerText = ''; resEl.innerText = '';
            return;
        }

        // Tìm trong dữ liệu THÔNG TIN THẺ
        let ttt = G_Data.thongTinThe;
        let found = null;
        if (ttt && ttt.length > 2) {
            for (let i = 2; i < ttt.length; i++) {
                if (ttt[i][4] && ttt[i][4].toString().trim().toUpperCase() === maThe) {
                    found = ttt[i];
                    break;
                }
            }
        }
    }

    function switchPassTramSubTab(tabName) {
        document.querySelectorAll('.pt-tab-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.style.borderBottom = 'none';
            btn.style.color = '#555';
        });
        document.querySelectorAll('.pt-subtab-content').forEach(sub => sub.style.display = 'none');

        let activeBtn = document.getElementById('pt-tab-' + tabName + '-btn');
        if (activeBtn) {
            activeBtn.classList.add('active');
            activeBtn.style.borderBottom = '3px solid var(--primary)';
            activeBtn.style.color = 'var(--primary)';
        }

        let activeSub = document.getElementById('pt-subtab-' + tabName);
        if (activeSub) activeSub.style.display = 'block';

        let saveBtn = document.getElementById('pt-save-btn');
        if (saveBtn) {
            saveBtn.style.display = (tabName === 'input') ? 'inline-block' : 'none';
        }

        if (tabName === 'report') {
            ptPopulateReportKhuVuc();
        } else if (tabName === 'stat') {
            ptPopulateStatFilters();
        } else if (tabName === 'setting') {
            let fromInp = document.getElementById('pt-sum-from-date');

    function ptRenderReportTable() {
        let tbody = document.getElementById('pt-report-tbody');
        if (!tbody) return;
        let rows = window.ptCurrentReportRows || [];
        let sel = document.getElementById('pt-report-sogiayto');
        let sgtFilter = sel ? sel.value : '';

        if (sgtFilter) {
            rows = rows.filter(r => (r[15] || '').toString().trim() === sgtFilter);
        }

        if (!rows.length) {
            let msg = `Không tìm thấy dữ liệu`;
            tbody.innerHTML = `<tr><td colspan="16" style="text-align:center; padding:30px; color:#64748b; font-weight:bold;">${msg}.</td></tr>`;
            return;
        }

        let html = '';
        let rowspans = [];
        let currentSpan = 1;
        for (let i = 0; i < rows.length; i++) {
            if (i === 0) {
                rowspans.push(1);
                continue;
            }
            let prevSgt = (rows[i - 1][15] || '').toString().trim();
            let currSgt = (rows[i][15] || '').toString().trim();
            if (currSgt === prevSgt) {
                rowspans[i - currentSpan] += 1;
                rowspans.push(0);
                currentSpan++;
            } else {
                rowspans.push(1);
                currentSpan = 1;
            }
        }

        rows.forEach((r, idx) => {
            let ketQua = (r[10] || '').toString().trim().toUpperCase();
            let ketQuaColor = (ketQua === 'PASS') ? '#059669' : ((ketQua === 'FAIL') ? '#dc3545' : '#333');
            let caVal = (r[4] || '').toString().trim().toLowerCase();
            let caBg = (caVal === 'day') ? '#d1fae5' : ((caVal === 'night') ? '#fef9c3' : 'transparent');
            let sgt = (r[15] || '').toString().trim();
            let displaySgt = sgt ? sgt : '#NA';
            let sgtBg = '#ffffff';
            let sgtBorder = '#cbd5e1';
            let sgtColor = '#000000';

            html += `
            <tr style="border-bottom:1px solid #e2e8f0; font-size:13px; color:#000000;">`;

            if (rowspans[idx] > 0) {
                html += `<td rowspan="${rowspans[idx]}" style="padding:8px 6px; font-weight:900; font-size:16px; text-align:center; white-space:nowrap; background:${sgtBg}; border:1px solid ${sgtBorder}; color:${sgtColor}; vertical-align:middle;">${displaySgt}</td>`;
            }

            html += `
                <td style="text-align:center; font-weight:800; padding:6px 2px; white-space:nowrap;">${idx + 1}</td>
                <td style="padding:6px 4px; font-weight:800; white-space:nowrap;">${r[1] || ''}</td>
                <td style="padding:6px 8px; font-weight:800; white-space:nowrap;">${r[2] || ''}</td>
                <td style="padding:6px 8px; font-weight:800; white-space:nowrap;">${r[3] || ''}</td>
                <td style="padding:6px 8px; text-align:center; font-weight:800; white-space:nowrap; background:${caBg};">${r[4] || ''}</td>
                <td style="padding:6px 8px; font-weight:800;">${r[5] || ''}</td>
                <td style="padding:6px 8px; font-weight:800; white-space:nowrap;">${r[6] || ''}</td>
                <td style="padding:6px 8px; font-weight:800;">${r[7] || ''}</td>
                <td style="padding:6px 8px; text-align:center; font-weight:800; white-space:nowrap;">${r[8] || ''}</td>
                <td style="padding:6px 8px; text-align:center; font-weight:800; white-space:nowrap;">${r[9] || '0'}</td>
                <td style="padding:4px 4px; text-align:center; font-weight:800; font-size:12px; color:${ketQuaColor}; white-space:nowrap;">${ketQua || ''}</td>
                <td style="padding:6px 8px; font-weight:800;">${r[11] || ''}</td>
                <td style="padding:6px 8px; font-weight:800;">${r[12] || ''}</td>
                <td style="padding:6px 8px; font-weight:800;">${r[13] || ''}</td>
                <td style="padding:6px 8px; font-weight:800;">${r[14] || ''}</td>
            </tr>
            `;
        });
        tbody.innerHTML = html;
    }
