    function ptProcessAndRenderStat(rows) {
        let totalCount = 0;
        let passCount = 0;
        let failCount = 0;

        let stationMap = {};

        function getCaSuffix(ca) {
            if (!ca) return '';
            let c = String(ca).trim().toUpperCase();
            if (c === 'DAY' || c === 'CA NGÀY' || c === 'D' || c === 'DAYTIME') return 'D';
            if (c === 'NIGHT' || c === 'CA ĐÊM' || c === 'N' || c === 'NIGHTTIME') return 'N';
            return c;
        }

        rows.forEach(r => {
            let tramKey = (r.tram || '').trim();
            if (!tramKey || tramKey === 'Trạm Khác' || tramKey === 'Trạm Chưa Phân Loại') return;

            let khuVucKey = (r.khuVuc || '').trim();
            let lineKey = (r.line || '').trim();
            let caKey = (r.ca || '').trim();
            let caSuffix = getCaSuffix(caKey);

            // Tạo key nhóm theo Trạm + Khu Vực + Line + Ca
            let groupKey = `${tramKey}___${khuVucKey}___${lineKey}___${caSuffix}`;

            let formattedLine = lineKey;
            if (caSuffix) {
                // Nếu lineKey chưa có sẵn D/N ở cuối thì nối thêm
                let lineUpper = lineKey.toUpperCase();
                if (!lineUpper.endsWith(' ' + caSuffix) && !lineUpper.endsWith('-' + caSuffix)) {
                    formattedLine = lineKey + ' ' + caSuffix;
                }
            }

            if (!stationMap[groupKey]) {
                stationMap[groupKey] = {
                    tram: tramKey,
                    khuVuc: khuVucKey,
                    line: formattedLine,
                    total: 0,
                    pass: 0,
                    fail: 0
                };
            }

            // Đếm theo số lượt (mỗi hàng/dòng dữ liệu = 1 lượt)
            stationMap[groupKey].total += 1;
            totalCount += 1;

            if (r.ketQua === 'PASS') {
                passCount += 1;
                stationMap[groupKey].pass += 1;
            } else if (r.ketQua === 'FAIL') {
                failCount += 1;
                stationMap[groupKey].fail += 1;
            }
        });

        document.getElementById('pt-kpi-total').innerText = totalCount;
        document.getElementById('pt-kpi-pass').innerText = passCount;
        document.getElementById('pt-kpi-fail').innerText = failCount;

        let passRate = totalCount ? ((passCount / totalCount) * 100).toFixed(1) : '0';
        let failRate = totalCount ? ((failCount / totalCount) * 100).toFixed(1) : '0';

        document.getElementById('pt-kpi-pass-rate').innerText = passRate + '%';

        stationsList.forEach((st, idx) => {

            <td style="padding:10px; text-align:center;">${failRate}%</td>
        </tr>
        `;

        tbody.innerHTML = html;
    }

    function ptInitDatesFromRange() {
        if (!window.PassTramSummaryDatesLoaded && typeof google !== 'undefined' && google.script && google.script.run) {
            window.PassTramSummaryDatesLoaded = true;
            google.script.run.withSuccessHandler(res => {
                if (res && res.success && res.dates && res.dates.length > 0) {
                    let sheetDates = res.dates.map(d => new Date(d.year, d.month - 1, d.day));
                    window.PassTramSummaryDates = sheetDates;
                    window.PassTramHiddenDateIndices = {};
                    ptRenderSummaryDates();
                    return;
                }
            }).getPassTramSummarySheetDates();
        }

        let fromInp = document.getElementById('pt-sum-from-date');
        let toInp = document.getElementById('pt-sum-to-date');

        let now = new Date();
        if (fromInp && !fromInp.value) {
            let d3 = new Date(now);
            d3.setDate(now.getDate() - 3);
            let y = d3.getFullYear(), m = ("0" + (d3.getMonth() + 1)).slice(-2), d = ("0" + d3.getDate()).slice(-2);
            fromInp.value = `${y}-${m}-${d}`;
        }
        if (toInp && !toInp.value) {
            let y = now.getFullYear(), m = ("0" + (now.getMonth() + 1)).slice(-2), d = ("0" + now.getDate()).slice(-2);
            toInp.value = `${y}-${m}-${d}`;
        }

        let fromDate = fromInp && fromInp.value ? new Date(fromInp.value) : new Date();
        let toDate = toInp && toInp.value ? new Date(toInp.value) : new Date();
        if (fromDate > toDate) toDate = new Date(fromDate);

        let datesList = [];
        let cur = new Date(fromDate);
        while (cur <= toDate) {
            if (cur.getDay() !== 0) { // Tự động loại bỏ Chủ Nhật
                datesList.push(new Date(cur));
            }
            cur.setDate(cur.getDate() + 1);
        }
        if (!datesList.length) datesList.push(new Date());

        window.PassTramSummaryDates = datesList;
        window.PassTramHiddenDateIndices = {};
        ptRenderSummaryDates();
    }

                <th rowspan="2" style="width:${col2W}; min-width:${col2W}; max-width:${col2W}; padding:6px 6px; font-size:15px; font-weight:900; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle;">目录</th>

    function ptCalcSummaryTable() {
        let tbody = document.getElementById('pt-summary-tbody');
        if (!tbody) return;

        let rows = tbody.querySelectorAll('tr.pt-sum-row');
        let dataByGroupKey = {};

        rows.forEach(tr => {
            let group = tr.getAttribute('data-group');
            let key = tr.getAttribute('data-key');
            let type = tr.getAttribute('data-type');
            if (!dataByGroupKey[group]) dataByGroupKey[group] = {};

            if (type === 'input') {
                let inputs = tr.querySelectorAll('.pt-sum-inp');
                let vals = [];
                inputs.forEach(inp => vals.push(Number(inp.value || 0)));
                dataByGroupKey[group][key] = vals;
            }
        });

        // Pass 1: Tính các hàng SUM (TOTAL ĐƯỢC ĐÀO TẠO)
        rows.forEach(tr => {
            let group = tr.getAttribute('data-group');
            let type = tr.getAttribute('data-type');

            if (type === 'calc_sum') {
                let calcCells = tr.querySelectorAll('.pt-sum-calc-cell');
                if (!dataByGroupKey[group]) dataByGroupKey[group] = {};
                dataByGroupKey[group]['main_sum_val'] = [];

                calcCells.forEach((cell, colIdx) => {
                    let lineVal = (dataByGroupKey['MAIN'] && dataByGroupKey['MAIN']['main_line']) ? dataByGroupKey['MAIN']['main_line'][colIdx] : 0;
                    let outVal = (dataByGroupKey['MAIN'] && dataByGroupKey['MAIN']['main_out']) ? dataByGroupKey['MAIN']['main_out'][colIdx] : 0;
                    let sumVal = lineVal + outVal;
                    cell.innerText = sumVal;
                    dataByGroupKey[group]['main_sum_val'][colIdx] = sumVal;
                });
            }
        });

        // Pass 2: Tính tỷ lệ cho các ca và tổng cộng dồn cột TOTAL
        rows.forEach(tr => {
            let group = tr.getAttribute('data-group');
            let key = tr.getAttribute('data-key');
            let type = tr.getAttribute('data-type');
            let totalCell = tr.querySelector('.pt-sum-total-cell');

            if (type === 'calc_rate') {
                let calcCells = tr.querySelectorAll('.pt-sum-calc-cell');
                let sumTotalVal = 0;
                let sumPassVal = 0;

                calcCells.forEach((cell, colIdx) => {
                    let totalVal = 0;
                    let passVal = 0;

                    if (group === 'SUB') {
                        totalVal = (dataByGroupKey['SUB'] && dataByGroupKey['SUB']['sub_total']) ? dataByGroupKey['SUB']['sub_total'][colIdx] : 0;
                        passVal = (dataByGroupKey['SUB'] && dataByGroupKey['SUB']['sub_pass']) ? dataByGroupKey['SUB']['sub_pass'][colIdx] : 0;
                    } else if (group === 'MAIN') {
                        let sumVal = (dataByGroupKey['MAIN'] && dataByGroupKey['MAIN']['main_sum_val']) ? dataByGroupKey['MAIN']['main_sum_val'][colIdx] : 0;
                        totalVal = sumVal;
                        passVal = (dataByGroupKey['MAIN'] && dataByGroupKey['MAIN']['main_pass']) ? dataByGroupKey['MAIN']['main_pass'][colIdx] : 0;
                    }

                    sumTotalVal += totalVal;
                    sumPassVal += passVal;

                    if (totalVal > 0) {
                        let rate = Math.round((passVal / totalVal) * 100);
                        cell.innerText = rate + '%';
                    } else {
                        cell.innerText = (passVal === 0) ? '0%' : '100%';
                    }
                });

                if (totalCell) {
                    if (sumTotalVal > 0) {
                        let totalRate = Math.round((sumPassVal / sumTotalVal) * 100);
                        totalCell.innerText = totalRate + '%';
                    } else {
                        totalCell.innerText = (sumPassVal === 0) ? '0%' : '100%';
                    }
                }
            } else if (type === 'input') {
                let inputs = tr.querySelectorAll('.pt-sum-inp');
                let totalSum = 0;
                inputs.forEach(inp => totalSum += Number(inp.value || 0));
                if (totalCell) totalCell.innerText = totalSum;
            } else if (type === 'calc_sum') {
                let calcCells = tr.querySelectorAll('.pt-sum-calc-cell');
                let totalSum = 0;
                calcCells.forEach(cell => totalSum += Number(cell.innerText || 0));
                if (totalCell) totalCell.innerText = totalSum;
            }
        });
    }

    function ptSaveSummaryToSheet(isAutoSave) {
        let table = document.getElementById('pt-summary-table');
        if (!table) return showToast("Không tìm thấy bảng Summary!", "warning");

        let matrix = [];
        let bgColors = [];
        let merges = [];

        let sheetSel = document.getElementById('pt-target-sheet');
        let sheetName = sheetSel ? (sheetSel.value || 'STA5') : 'STA5';
        let datesList = window.PassTramSummaryDates || [new Date()];
        let totalShiftCols = datesList.length * 2;
        let numCols = 2 + totalShiftCols + 1; // +1 cho cột TOTAL ở cuối

        // Row 1: Title
        let r1 = [`${sheetName} 每天CTQ新人培训数\nSố lượng người mới tham gia khóa đào tạo CTQ hàng ngày của ${sheetName}`];
        let r1Bgs = [];
        for (let i = 0; i < numCols; i++) {
            if (i > 0) r1.push('');
            r1Bgs.push('#0f5132');
        }
        matrix.push(r1);
        bgColors.push(r1Bgs);
        merges.push({ r: 1, c: 1, rs: 1, cs: numCols });

        // Row 2: Header 2
        let r2 = ['制程', '目录'];
        let r2Bgs = ['#0f5132', '#0f5132'];
        datesList.forEach(d => {
            let m = d.getMonth() + 1;
            let day = d.getDate();
            r2.push(`${m}/${day}`, '');
            r2Bgs.push('#0f5132', '#0f5132');
        });
        r2.push('TOTAL');
        r2Bgs.push('#0f5132');
        matrix.push(r2);
        bgColors.push(r2Bgs);

        // Merges for 制程 & 目录 & TOTAL
        merges.push({ r: 2, c: 1, rs: 2, cs: 1 });
        merges.push({ r: 2, c: 2, rs: 2, cs: 1 });
        merges.push({ r: 2, c: 3 + totalShiftCols, rs: 2, cs: 1 });

        // Merges for Date headers
        for (let idx = 0; idx < datesList.length; idx++) {
            merges.push({ r: 2, c: 3 + idx * 2, rs: 1, cs: 2 });
        }

        // Row 3: Header 3 (Shifts: #bbf7d0 for 白班, #fef08a for 夜班)
        let r3 = ['', ''];
        let r3Bgs = ['#0f5132', '#0f5132'];
        datesList.forEach(() => {
            r3.push('白班', '夜班');
            r3Bgs.push('#bbf7d0', '#fef08a');
        });
        r3.push('');
        r3Bgs.push('#0f5132');
        matrix.push(r3);
        bgColors.push(r3Bgs);

        // Tbody Rows
        let tbody = document.getElementById('pt-summary-tbody');
        let currentSheetRow = 4;

        if (tbody) {
            let trs = tbody.querySelectorAll('tr.pt-sum-row');
            let groupMergeMap = {};

            trs.forEach(tr => {
                let groupName = tr.getAttribute('data-group');
                let type = tr.getAttribute('data-type');
                let key = tr.getAttribute('data-key');

                if (!groupMergeMap[groupName]) {
                    groupMergeMap[groupName] = { startRow: currentSheetRow, count: 0 };
                }
                groupMergeMap[groupName].count++;

                let isCyan = (type === 'calc_rate' || type === 'calc_sum' || key === 'sub_rate' || key === 'main_sum' || key === 'main_rate');
                let defaultRowBg = isCyan ? '#00ffff' : '#ffffff';

                // Query label text from TD before shift cells (giữ xuống dòng \n giữa Tiếng Trung và Tiếng Việt)
                let allTds = tr.querySelectorAll('td');
                let labelTd = (allTds.length > 1 && tr.querySelector('td[rowspan]')) ? allTds[1] : allTds[0];
                let labelText = '';
                if (labelTd) {
                    labelText = labelTd.innerHTML
                        .replace(/<br\s*\/?>/gi, '\n')
                        .replace(/<\/?[^>]+(>|$)/g, '')
                        .trim();
                }

                let rowVals = [groupName, labelText];
                let rowBgs = ['#ffffff', defaultRowBg];

                // Query shift values for ALL shift columns from 0 to totalShiftCols - 1
                for (let c = 0; c < totalShiftCols; c++) {
                    let cell = tr.querySelector(`[data-col="${c}"]`);
                    let txt = '0';
                    if (cell) {
                        if (cell.tagName === 'INPUT') {
                            txt = cell.value || '0';
                        } else {
                            let inp = cell.querySelector('input');
                            if (inp) {
                                txt = inp.value || '0';
                            } else {
                                txt = cell.innerText ? cell.innerText.trim() : '0';
                            }
                        }
                    } else {
                        txt = (type === 'calc_rate') ? '0%' : '0';
                    }
                    rowVals.push(txt);
                    rowBgs.push(defaultRowBg);
                }

                // Cột TOTAL ở cuối dòng
                let totalCell = tr.querySelector('.pt-sum-total-cell');
                let totalTxt = totalCell ? totalCell.innerText.trim() : '0';
                rowVals.push(totalTxt);
                rowBgs.push(defaultRowBg);

                matrix.push(rowVals);
                bgColors.push(rowBgs);
                currentSheetRow++;
            });

            Object.values(groupMergeMap).forEach(g => {
                if (g.count > 1) {
                    merges.push({ r: g.startRow, c: 1, rs: g.count, cs: 1 });
                }
            });
        }

        let hiddenMap = window.PassTramHiddenDateIndices || {};
        let hiddenCols = [];
        datesList.forEach((_, idx) => {
            if (hiddenMap[idx]) {
                hiddenCols.push(3 + idx * 2);
                hiddenCols.push(3 + idx * 2 + 1);
            }
        });

        if (!isAutoSave) {
            showToast("Đang lưu bảng Summary vào sheet Sumarry...", "info");
        }

        google.script.run.withSuccessHandler(res => {
            if (res && res.success) {
                showToast(`Đã lưu dữ liệu bảng Summary vào sheet ${res.sheetName} thành công!`, "success");
            } else {
                if (!isAutoSave) {
                    showToast("Lỗi khi lưu bảng Summary: " + (res ? res.message : "Không xác định"), "error");
                }
            }
        }).savePassTramSummaryData(matrix, bgColors, merges, hiddenCols);
    }

    function ptAutoCalcSummaryFromData(evt) {
        if (evt && evt.preventDefault) evt.preventDefault();
        let sheetName = document.getElementById('pt-target-sheet') ? document.getElementById('pt-target-sheet').value : 'STA5';

        let fromInp = document.getElementById('pt-sum-from-date');
        let toInp = document.getElementById('pt-sum-to-date');
        let fromDateVal = fromInp ? fromInp.value : '';
        let toDateVal = toInp ? toInp.value : '';

        if (!fromDateVal || !toDateVal) {
            return showToast("Vui lòng chọn Từ ngày và Đến ngày trước khi tìm kiếm!", "warning");
        }

        // Bật hiển thị bảng và ẩn banner placeholder
        let card = document.getElementById('pt-summary-table-card');
        let placeholder = document.getElementById('pt-summary-placeholder');
        if (card) card.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';

        // Tự động xây dựng danh sách cột ngày từ khoảng ngày được chọn
        let fromDate = new Date(fromDateVal);
        let toDate = new Date(toDateVal);
        if (fromDate > toDate) toDate = new Date(fromDate);

        let datesList = [];
        let cur = new Date(fromDate);
        while (cur <= toDate) {
            if (cur.getDay() !== 0) { // Tự động loại bỏ Chủ Nhật
                datesList.push(new Date(cur));
            }
            cur.setDate(cur.getDate() + 1);
        }
        if (!datesList.length) datesList.push(new Date());

        window.PassTramSummaryDates = datesList;
        window.PassTramHiddenDateIndices = {};

        showToast(`Đang tìm kiếm & tổng hợp số liệu từ sheet ${sheetName}...`, "info");

        google.script.run.withSuccessHandler(res => {
            if (!res || !res.success || !res.rows) {
                return showToast("Không thể tải dữ liệu từ sheet " + sheetName, "error");
            }
            let rows = res.rows;

            // Xung quanh danh sách ngày có dữ liệu thực tế từ Sheet
            let datesWithData = new Set();
            rows.forEach(r => {
                let rawNgay = (r.ngay || '').toString().trim();
                if (rawNgay) {
                    datesWithData.add(rawNgay);
                    let parsedDate = new Date(rawNgay);
                    if (!isNaN(parsedDate.getTime())) {
                        let py = parsedDate.getFullYear();
                        let pm = ("0" + (parsedDate.getMonth() + 1)).slice(-2);
                        let pd = ("0" + parsedDate.getDate()).slice(-2);
                        datesWithData.add(`${py}-${pm}-${pd}`);
                        datesWithData.add(`${pd}/${pm}/${py}`);
                        datesWithData.add(`${py}/${pm}/${pd}`);
                        datesWithData.add(`${parsedDate.getMonth() + 1}/${parsedDate.getDate()}/${py}`);
                    }
                }
            });

            // Tự động xây dựng lại danh sách cột ngày: Bỏ Chủ Nhật trừ khi Chủ Nhật đó CÓ DỮ LIỆU nhập trong sheet
            let datesList = [];
            let cur = new Date(fromDate);
            while (cur <= toDate) {
                let isSunday = (cur.getDay() === 0);
                let py = cur.getFullYear();
                let pm = ("0" + (cur.getMonth() + 1)).slice(-2);
                let pd = ("0" + cur.getDate()).slice(-2);
                let k1 = `${py}-${pm}-${pd}`;
                let k2 = `${pd}/${pm}/${py}`;
                let k3 = `${py}/${pm}/${pd}`;
                let k4 = `${cur.getMonth() + 1}/${cur.getDate()}/${py}`;

                let sundayHasData = datesWithData.has(k1) || datesWithData.has(k2) || datesWithData.has(k3) || datesWithData.has(k4);

                if (!isSunday || sundayHasData) {
                    datesList.push(new Date(cur));
                }
                cur.setDate(cur.getDate() + 1);
            }
            if (!datesList.length) datesList.push(new Date());

            window.PassTramSummaryDates = datesList;
            window.PassTramHiddenDateIndices = {};
            ptRenderSummaryDates();

            let dateMap = {};
            datesList.forEach((d, idx) => {
                let y = d.getFullYear();
                let m = ("0" + (d.getMonth() + 1)).slice(-2);
                let day = ("0" + d.getDate()).slice(-2);

                dateMap[`${y}-${m}-${day}`] = idx;
                dateMap[`${day}/${m}/${y}`] = idx;
                dateMap[`${y}/${m}/${day}`] = idx;
                dateMap[`${d.getMonth() + 1}/${d.getDate()}/${y}`] = idx;
            });

            let maxColLength = datesList.length * 2;
            let counts = {
                'SUB_sub_total': Array(maxColLength).fill(0),
                'SUB_sub_pass': Array(maxColLength).fill(0),
                'SUB_sub_fail': Array(maxColLength).fill(0),
                'MAIN_main_line': Array(maxColLength).fill(0),
                'MAIN_main_pass': Array(maxColLength).fill(0),
                'MAIN_main_fail': Array(maxColLength).fill(0)
            };

            rows.forEach(r => {
                let rawNgay = (r.ngay || '').toString().trim();
                let dIdx = dateMap[rawNgay];
                if (dIdx === undefined) {
                    let parsedDate = new Date(rawNgay);
                    if (!isNaN(parsedDate.getTime())) {
                        let py = parsedDate.getFullYear();
                        let pm = ("0" + (parsedDate.getMonth() + 1)).slice(-2);
                        let pd = ("0" + parsedDate.getDate()).slice(-2);
                        dIdx = dateMap[`${py}-${pm}-${pd}`];
                    }
                }
                if (dIdx === undefined) return;

                let ca = (r.ca || '').toString().toUpperCase().trim();
                let isNight = ca.includes('NIGHT') || ca.includes('ĐÊM') || ca.includes('CA ĐÊM');
                let shiftOffset = isNight ? 1 : 0;
                let colIdx = dIdx * 2 + shiftOffset;

                let kv = (r.khuVuc || '').toString().toUpperCase().trim();
                let isSub = kv.includes('SUB');
                let isMain = kv.includes('MAIN') || kv.includes('OFFLINE');

                let kq = (r.ketQua || '').toString().toUpperCase().trim();

                if (isSub) {
                    counts['SUB_sub_total'][colIdx] += 1;
                    if (kq === 'PASS') counts['SUB_sub_pass'][colIdx] += 1;
                    if (kq === 'FAIL') counts['SUB_sub_fail'][colIdx] += 1;
                } else if (isMain) {
                    counts['MAIN_main_line'][colIdx] += 1;
                    if (kq === 'PASS') counts['MAIN_main_pass'][colIdx] += 1;
                    if (kq === 'FAIL') counts['MAIN_main_fail'][colIdx] += 1;
                }
            });

            let trs = document.querySelectorAll('#pt-summary-tbody tr.pt-sum-row');
            trs.forEach(tr => {
                let group = tr.getAttribute('data-group');
                let key = tr.getAttribute('data-key');
                let mapKey = group + '_' + key;
                if (counts[mapKey]) {
                    let inps = tr.querySelectorAll('.pt-sum-inp');
                    inps.forEach(inp => {
                        let cIdx = Number(inp.getAttribute('data-col'));
                        if (cIdx !== undefined && !isNaN(cIdx)) {
                            inp.value = counts[mapKey][cIdx] || 0;
                        }
                    });
                }
            });

            ptCalcSummaryTable();
            showToast("Đã tự động tổng hợp dữ liệu thành công!", "success");

            // Tự động đồng bộ / lưu dữ liệu nền vào sheet Sumarry
            ptSaveSummaryToSheet(true);
        }).getPassTramStatData(sheetName, fromDateVal, toDateVal, 'ALL', 'ALL', 'ALL');
    }

    function ptCaptureSummaryImage() {
        let table = document.getElementById('pt-summary-table');
        if (!table) return showToast("Không tìm thấy bảng Summary!", "warning");
        if (typeof html2canvas !== 'function') return showToast("Thư viện html2canvas chưa sẵn sàng!", "error");

        showToast("Đang chụp ảnh bảng Summary...", "info");
        html2canvas(table, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#ffffff'
        }).then(canvas => {
            let sheetName = document.getElementById('pt-target-sheet') ? document.getElementById('pt-target-sheet').value : 'STA5';
            let link = document.createElement('a');
            link.download = `Bang_Summary_${sheetName}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast("Đã tải ảnh bảng Summary thành công!", "success");
        }).catch(err => {
            showToast("Lỗi chụp ảnh: " + err.toString(), "error");
        });
    }

    function loadPassTramInitData() {
        google.script.run.withSuccessHandler(res => {
            if (res && res.success) {
                window.PassTramGlobalData.dropdowns = res.dropdowns || {};
                window.PassTramGlobalData.hrMap = res.hrMap || {};
                window.PassTramGlobalData.targetSheets = res.targetSheets || ['STA5', 'CFN4'];

                let sheetSel = document.getElementById('pt-target-sheet');
                if (sheetSel && res.targetSheets && res.targetSheets.length) {
                    let curVal = sheetSel.value || 'STA5';
                    let opts = '';
                    res.targetSheets.forEach(sName => {
                        opts += `<option value="${sName}" ${sName === curVal ? 'selected' : ''}>${sName}</option>`;
                    });
                    sheetSel.innerHTML = opts;
                }

                ptUpdateAllDropdownOptions();
            }
        }).getPassTramInitData();
    }

    function ptUpdateAllDropdownOptions() {
        let d = window.PassTramGlobalData.dropdowns || {};
        function populateSelect(selectEl, list, isEditable = false) {
            if (!selectEl) return;
            let currentVal = selectEl.value;
            let opts = '<option value="">-- Chọn --</option>';
            if (list && list.length) {
                list.forEach(item => {
                    opts += `<option value="${item}">${item}</option>`;
                });
            }
            if (isEditable) {
                opts += `<option value="__custom__">✏️ Nhập trực tiếp (khác)...</option>`;
            }
            selectEl.innerHTML = opts;
            selectEl.value = currentVal;
        }

        document.querySelectorAll('#pt-input-tbody tr').forEach(tr => {
            populateSelect(tr.querySelector('.pt-model'), d.model);
            populateSelect(tr.querySelector('.pt-khuvuc'), d.khuVuc);
            populateSelect(tr.querySelector('.pt-line'), d.line);
            populateSelect(tr.querySelector('.pt-tram'), d.tram);
            populateSelect(tr.querySelector('.pt-giaovien'), d.giaoVien);
            populateSelect(tr.querySelector('.pt-ipqc'), d.ipqc, true);
            populateSelect(tr.querySelector('.pt-me'), d.me, true);
        });
    }

    function ptHandleCustomOptionInput(selectEl) {
        if (selectEl.value === '__custom__') {
            let userVal = prompt("Vui lòng nhập giá trị trực tiếp:");
            if (userVal && userVal.trim() !== '') {
                userVal = userVal.trim();
                let opt = document.createElement('option');
                opt.value = userVal;
                opt.innerText = userVal;
                opt.selected = true;
                selectEl.insertBefore(opt, selectEl.lastElementChild);
                selectEl.value = userVal;
            } else {
                selectEl.value = '';
            }
        }
    }

            <td><select class="app-input pt-me" onchange="ptHandleCustomOptionInput(this)" onpaste="ptHandleGenericInputPaste(event, this)" style="margin:0; height:36px; font-size:13px;">${makeOptions(d.me, true)}</select></td>
            <td><input type="text" class="app-input pt-note" placeholder="Ghi chú..." onpaste="ptHandleGenericInputPaste(event, this)" style="margin:0; height:36px; font-size:13px;"></td>
        `;

        tbody.appendChild(tr);
        ptUpdateSTT();
    }

    function ptHandleGenericInputPaste(e, targetEl) {
        let clipboardData = (e.clipboardData || window.clipboardData);
        if (!clipboardData) return;
        let pastedText = clipboardData.getData('Text') || '';
        let lines = pastedText.split(/\r?\n/).map(s => s.trim()).filter(s => s.length > 0);

        if (lines.length <= 1) return; // Nếu dán 1 dòng thì để trình duyệt xử lý bình thường

        e.preventDefault();

        let currentRow = targetEl.closest('tr');
        let tbody = document.getElementById('pt-input-tbody');
        if (!tbody || !currentRow) return;

        // Tìm class nhận dạng của cột vừa dán (ví dụ .pt-model, .pt-khuvuc, .pt-mathe, v.v...)
        let colClass = Array.from(targetEl.classList).find(c => c.startsWith('pt-'));
        if (!colClass) return;

        let rows = Array.from(tbody.querySelectorAll('tr'));
        let startIdx = rows.indexOf(currentRow);

        lines.forEach((val, i) => {
            let targetRowIdx = startIdx + i;
            while (tbody.children.length <= targetRowIdx) {
                ptAddRow();
            }
            let targetRow = tbody.children[targetRowIdx];
            let cellEl = targetRow.querySelector('.' + colClass);
            if (cellEl) {
                if (cellEl.tagName === 'SELECT') {
                    // Nếu giá trị có sẵn trong select option thì gán, nếu không thì tự tạo option tạm thời
                    let matchingOption = Array.from(cellEl.options).find(opt => opt.value.toUpperCase() === val.toUpperCase() || opt.text.toUpperCase() === val.toUpperCase());
                    if (matchingOption) {
                        cellEl.value = matchingOption.value;
                    } else {
                        let newOpt = document.createElement('option');
                        newOpt.value = val;
                        newOpt.text = val;
                        cellEl.appendChild(newOpt);
                        cellEl.value = val;
                    }
                } else {
                    cellEl.value = val;
                    if (colClass === 'pt-mathe') {
                        ptLookupEmpName(cellEl);
                    }
                }
            }
        });

        showToast(`📋 Đã tự động dán ${lines.length} dòng dữ liệu vào các hàng liên tiếp!`, "success");
    }

    // Nút và Tính năng Copy Nhanh theo Ô Đang Chọn / Theo Cột
    function ptFillDownRow1() {
        let tbody = document.getElementById('pt-input-tbody');
        if (!tbody || tbody.children.length === 0) return;

        let rows = Array.from(tbody.children);
        if (rows.length <= 1) {
            showToast("Vui lòng có ít nhất 2 hàng để sao chép dữ liệu!", "info");
            return;
        }

        // Kiểm tra xem chuột / con trỏ đang đặt ở ô nào trong bảng không
        let activeEl = document.activeElement;
        let isInsideTable = activeEl && activeEl.closest('#pt-input-tbody');

        if (isInsideTable) {
            // Xác định class của cột mà người dùng đang chọn (ví dụ: .pt-tram, .pt-model, .pt-khuvuc...)
            let colClass = Array.from(activeEl.classList).find(c => c.startsWith('pt-'));
            if (colClass) {
                let startRow = activeEl.closest('tr');
                let startIdx = rows.indexOf(startRow);
                let valToCopy = activeEl.value;

                if (!valToCopy) {
                    showToast("Ô đang chọn chưa có dữ liệu để sao chép!", "warning");
                    return;
                }

                let count = 0;
                for (let i = startIdx + 1; i < rows.length; i++) {
                    let cellEl = rows[i].querySelector('.' + colClass);
                    if (cellEl) {
                        if (cellEl.tagName === 'SELECT') {
                            let matchingOpt = Array.from(cellEl.options).find(opt => opt.value.toUpperCase() === valToCopy.toUpperCase() || opt.text.toUpperCase() === valToCopy.toUpperCase());
                            if (matchingOpt) {
                                cellEl.value = matchingOpt.value;
                            } else {
                                let newOpt = document.createElement('option');
                                newOpt.value = valToCopy;
                                newOpt.text = valToCopy;
                                cellEl.appendChild(newOpt);
                                cellEl.value = valToCopy;
                            }
                        } else {
                            cellEl.value = valToCopy;
                        }
                        count++;
                    }
                }
                showToast(`⏬ Đã sao chép riêng cột "${colClass.replace('pt-', '').toUpperCase()}" xuống ${count} hàng phía dưới!`, "success");
                return;
            }
        }

        // Nếu không bấm chọn vào ô nào cụ thể (hoặc bấm nút từ ngoài), sao chép từng cột Hàng 1 có dữ liệu xuống bên dưới
        let row1 = rows[0];
        let copiedCols = [];
        let colClasses = ['.pt-model', '.pt-khuvuc', '.pt-line', '.pt-ca', '.pt-tram', '.pt-ngay', '.pt-ngay1', '.pt-ketqua', '.pt-giaovien', '.pt-ipqc', '.pt-me', '.pt-note'];

        colClasses.forEach(cls => {
            let srcEl = row1.querySelector(cls);
            if (srcEl && srcEl.value !== "") {
                let val = srcEl.value;
                copiedCols.push(cls);
                for (let i = 1; i < rows.length; i++) {
                    let targetEl = rows[i].querySelector(cls);
                    if (targetEl) {
                        if (targetEl.tagName === 'SELECT') {
                            let matchingOpt = Array.from(targetEl.options).find(opt => opt.value.toUpperCase() === val.toUpperCase() || opt.text.toUpperCase() === val.toUpperCase());
                            if (matchingOpt) {
                                targetEl.value = matchingOpt.value;
                            } else {
                                let newOpt = document.createElement('option');
                                newOpt.value = val;
                                newOpt.text = val;
                                targetEl.appendChild(newOpt);
                                targetEl.value = val;
                            }
                        } else {
                            targetEl.value = val;
                        }
                    }
                }
            }
        });

        if (copiedCols.length > 0) {
            showToast(`⏬ Đã sao chép các cột có dữ liệu từ Hàng 1 xuống tất cả ${rows.length - 1} hàng bên dưới!`, "success");
        } else {
            showToast("Hàng 1 chưa chọn dữ liệu ở ô nào!", "warning");
        }
    }

    function ptLookupEmpName(inputEl) {
        let val = (inputEl.value || "").trim().toUpperCase();
        let row = inputEl.closest('tr');
        let hoTenEl = row ? row.querySelector('.pt-hoten') : null;
        if (!hoTenEl) return;

        let map = window.PassTramGlobalData.hrMap || {};
        if (val && map[val]) {
            hoTenEl.value = map[val];
        } else if (val.length >= 4) {
            hoTenEl.value = "Chưa tìm thấy";
        } else {
            hoTenEl.value = "";
        }
    }

    function ptDeleteRowBySTT() {
        let sttInp = document.getElementById('pt-del-stt');
        let sttStr = sttInp ? sttInp.value : prompt("Nhập STT của hàng bạn muốn xóa (Ví dụ: 1):");
        if (!sttStr) return;
        let stt = parseInt(sttStr.toString().trim());
        if (isNaN(stt) || stt <= 0) return showToast("STT không hợp lệ!", "warning");

        let tbody = document.getElementById('pt-input-tbody');
        if (!tbody || !tbody.children.length) return showToast("Bảng hiện tại đang trống!", "warning");

        if (stt < 1 || stt > tbody.children.length) {
            return showToast(`STT không hợp lệ! Vui lòng nhập số từ 1 đến ${tbody.children.length}`, "error");
        }

        tbody.removeChild(tbody.children[stt - 1]);
        ptUpdateSTT();
        if (sttInp) sttInp.value = '';
        showToast(`Đã xóa thành công hàng STT ${stt}!`, "success");
    }

    function ptDeleteSingleRow(btn) {
        let row = btn.closest('tr');
        if (row) {
            row.remove();
            ptUpdateSTT();
        }
    }

    function ptDeleteCheckedRows() {
        let checked = document.querySelectorAll('.pt-row-cb:checked');
        if (!checked.length) return showToast("Vui lòng chọn ít nhất 1 dòng để xóa!", "warning");

        checked.forEach(cb => {
            let row = cb.closest('tr');
            if (row) row.remove();
        });
        ptUpdateSTT();
        showToast("Đã xóa các dòng được chọn!", "success");
    }

    function ptClearTable() {
        let tbody = document.getElementById('pt-input-tbody');
        if (tbody) {
            tbody.innerHTML = '';
            for (let i = 0; i < 2; i++) {
                ptAddRow();
            }
        }
        showToast("Đã làm mới bảng nhập liệu!", "info");
    }

    function ptToggleSelectAllRows(masterCb) {
        document.querySelectorAll('.pt-row-cb').forEach(cb => cb.checked = masterCb.checked);
    }

    function ptUpdateSTT() {
        let rows = document.querySelectorAll('#pt-input-tbody tr');
        rows.forEach((row, idx) => {
            let sttCell = row.querySelector('.pt-stt-cell');
            if (sttCell) sttCell.innerText = idx + 1;
        });
    }

    function savePassTramDataClient() {
        let rows = document.querySelectorAll('#pt-input-tbody tr');
        if (!rows.length) return showToast("Bảng chưa có dữ liệu để lưu!", "warning");

        let rowsData = [];
        let hasAnyData = false;
        let validationError = null;

        for (let idx = 0; idx < rows.length; idx++) {
            let tr = rows[idx];
            let stt = idx + 1;
            let model = tr.querySelector('.pt-model').value || '';
            let khuVuc = tr.querySelector('.pt-khuvuc').value || '';
            let line = tr.querySelector('.pt-line').value || '';
            let ca = tr.querySelector('.pt-ca').value || '';
            let tram = tr.querySelector('.pt-tram').value || '';
            let maThe = tr.querySelector('.pt-mathe').value.trim().toUpperCase();
            let hoTen = tr.querySelector('.pt-hoten').value || '';
            let ngay = tr.querySelector('.pt-ngay').value || '';
            let ngay1 = tr.querySelector('.pt-ngay1').value;
            let ketQua = tr.querySelector('.pt-ketqua').value || '';
            let giaoVien = tr.querySelector('.pt-giaovien').value || '';
            let ipqc = tr.querySelector('.pt-ipqc').value || '';
            let me = tr.querySelector('.pt-me').value || '';
            let note = tr.querySelector('.pt-note') ? tr.querySelector('.pt-note').value || '' : '';

            // Kiểm tra xem dòng này có nhập bất kỳ thông tin nào không
            let isRowStarted = !!(model || khuVuc || line || tram || maThe || hoTen || (ngay1 !== "" && ngay1 !== null && ngay1 !== undefined && parseFloat(ngay1) !== 0) || giaoVien || ipqc || me || note);

            if (isRowStarted) {
                hasAnyData = true;

                // Bắt buộc nhập đầy đủ tất cả các cột từ Model đến ME (trừ Note)
                if (!model) { validationError = `Hàng STT ${stt}: Chưa chọn Model!`; break; }
                if (!khuVuc) { validationError = `Hàng STT ${stt}: Chưa chọn Khu Vực!`; break; }
                if (!line) { validationError = `Hàng STT ${stt}: Chưa chọn Line!`; break; }
                if (!ca) { validationError = `Hàng STT ${stt}: Chưa chọn Ca!`; break; }
                if (!tram) { validationError = `Hàng STT ${stt}: Chưa chọn Trạm CTQ!`; break; }
                if (!maThe) { validationError = `Hàng STT ${stt}: Chưa nhập Mã Thẻ!`; break; }
                if (!hoTen || hoTen === "Chưa tìm thấy") { validationError = `Hàng STT ${stt}: Mã Thẻ không hợp lệ hoặc chưa tìm thấy Họ Và Tên!`; break; }
                if (!ngay) { validationError = `Hàng STT ${stt}: Chưa chọn Ngày Làm Việc!`; break; }
                let numNgay1 = parseFloat(ngay1);
                if (ngay1 === "" || ngay1 === null || ngay1 === undefined || isNaN(numNgay1) || numNgay1 <= 0) {
                    validationError = `Hàng STT ${stt}: Cột Ngày thứ 1 (pcs) phải nhập số lớn hơn 0!`;
                    break;
                }
                if (!ketQua) { validationError = `Hàng STT ${stt}: Chưa chọn Kết Quả!`; break; }
                if (!giaoVien) { validationError = `Hàng STT ${stt}: Chưa chọn Giáo Viên!`; break; }
                if (!ipqc) { validationError = `Hàng STT ${stt}: Chưa chọn IPQC!`; break; }
                if (!me) { validationError = `Hàng STT ${stt}: Chưa chọn ME!`; break; }

                let ngayFormatted = ngay;
                if (ngay && ngay.indexOf('-') !== -1) {
                    let p = ngay.split('-');
                    if (p.length === 3) {
                        ngayFormatted = p[2] + '/' + p[1] + '/' + p[0];
                    }
                }

                rowsData.push([
                    stt,           // STT (Cột A)
                    model,         // Model (Cột B)
                    khuVuc,        // Khu Vực (Cột C)
                    line,          // Line (Cột D)
                    ca,            // Ca (Cột E)
                    tram,          // Trạm CTQ (Cột F)
                    maThe,         // Mã Thẻ (Cột G)
                    hoTen,         // Họ Và Tên (Cột H)
                    ngayFormatted, // Ngày Làm Việc (DD/MM/YYYY) (Cột I)
                    ngay1,         // Ngày thứ 1 (pcs) (Cột J)
                    ketQua,        // Trạng Thái / Kết Quả (Cột K)
                    giaoVien,      // Giáo Viên (Cột L)
                    ipqc,          // IPQC (Cột M)
                    me,            // ME (Cột N)
                    note           // Note / Ghi chú (Cột O)
                ]);
            }
        }

        if (!hasAnyData) {
            return showToast("Vui lòng nhập dữ liệu vào ít nhất 1 hàng trước khi lưu!", "warning");
        }

        if (validationError) {
            return showToast("⚠️ " + validationError, "error");
        }

        let targetSheetSelect = document.getElementById('pt-target-sheet');
        let targetSheetName = targetSheetSelect ? (targetSheetSelect.value || 'STA5') : 'STA5';

        showToast(`Đang lưu dữ liệu vào sheet ${targetSheetName}...`, "info");
        google.script.run.withSuccessHandler(res => {
            if (res && res.success) {
                showToast(`Lưu thành công ${res.count} dòng vào sheet ${targetSheetName} (bắt đầu từ hàng ${res.startRow})!`, "success");
                let tbody = document.getElementById('pt-input-tbody');
                if (tbody) {
                    tbody.innerHTML = '';
                    for (let i = 0; i < 10; i++) {
                        ptAddRow();
                    }
                }

                // Hiển thị ô vuông ô thông báo SỐ GIẤY TỜ to in đậm rõ ràng
                let docNo = res.docNo || '---';
                let docModal = document.createElement('div');
                docModal.id = 'pt-docno-modal';
                docModal.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:999999; backdrop-filter:blur(4px);';
                docModal.innerHTML = `
                    <div style="background:#ffffff; border-radius:16px; padding:35px 45px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.4); border:4px solid #10b981; max-width:480px; width:90%; animation:ptPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
                        <div style="font-size:48px; margin-bottom:10px;">✅</div>
                        <h2 style="color:#065f46; font-size:24px; font-weight:900; margin:0 0 15px 0; text-transform:uppercase; letter-spacing:1px;">LƯU DỮ LIỆU THÀNH CÔNG</h2>
                        <div style="background:#ecfdf5; border:2px dashed #10b981; border-radius:12px; padding:20px; margin-bottom:25px;">
                            <div style="color:#047857; font-size:16px; font-weight:800; margin-bottom:8px; letter-spacing:0.5px;">SỐ GIẤY TỜ</div>
                            <div style="color:#059669; font-size:56px; font-weight:900; line-height:1; letter-spacing:2px; text-shadow:0 2px 4px rgba(5,150,105,0.2);">${docNo}</div>
                        </div>
                        <button onclick="document.getElementById('pt-docno-modal').remove()" style="padding:14px 40px; background:linear-gradient(135deg, #10b981 0%, #059669 100%); color:#ffffff; font-size:18px; font-weight:900; border:none; border-radius:10px; cursor:pointer; box-shadow:0 4px 12px rgba(16,185,129,0.4); outline:none; transition:all 0.2s;">
                            XÁC NHẬN OK
                        </button>
                    </div>
                `;
                document.body.appendChild(docModal);
            } else {
                showToast("Lỗi khi lưu dữ liệu: " + (res ? res.message : "Không xác định"), "error");
            }
        }).savePassTramData(rowsData, targetSheetName);
    }

    function ptLoadSavedTrainingStations() {
        try {
            let savedMain = localStorage.getItem('PassTramTrainingMainStations');
            let savedSub = localStorage.getItem('PassTramTrainingSubStations');
            if (savedMain) {
                let parsed = JSON.parse(savedMain);
                if (parsed && parsed.length) window.PassTramTrainingMainStations = parsed;
            }
            if (savedSub) {
                let parsed = JSON.parse(savedSub);
                if (parsed && parsed.length) window.PassTramTrainingSubStations = parsed;
            }
        } catch (e) { console.error("Error loading training stations:", e); }
    }
    ptLoadSavedTrainingStations();

    function ptSyncTrainingStationsFromUI() {
        let trs = document.querySelectorAll('#pt-training-tbody tr.pt-tr-row');
        if (!trs || !trs.length) return;

        let newMain = [];
        let newSub = [];

        trs.forEach(tr => {
            let type = tr.getAttribute('data-type');
            let nameInp = tr.querySelector('.pt-tr-st-name');
            let hcInp = tr.querySelector('.pt-tr-hc');
            let lineInp = tr.querySelector('.pt-tr-line');
            let onInp = tr.querySelector('.pt-tr-on');

            let name = nameInp ? nameInp.value.trim() : '';
            let hc = hcInp ? Number(hcInp.value || 0) : 0;
            let line = lineInp ? Number(lineInp.value || 0) : 0;
            let on = onInp ? Number(onInp.value || 0) : 0;

            let vals = [];
            let cellInps = tr.querySelectorAll('.pt-tr-cell');
            cellInps.forEach(cell => {
                let colIdx = Number(cell.getAttribute('data-col'));
                vals[colIdx] = Number(cell.value || 0);
            });

            let obj = { name, hc, line, on, vals };
            if (type === 'MAIN') {
                newMain.push(obj);
            } else {
                newSub.push(obj);
            }
        });

        if (newMain.length) window.PassTramTrainingMainStations = newMain;
        if (newSub.length) window.PassTramTrainingSubStations = newSub;

        try {
            localStorage.setItem('PassTramTrainingMainStations', JSON.stringify(window.PassTramTrainingMainStations));
            localStorage.setItem('PassTramTrainingSubStations', JSON.stringify(window.PassTramTrainingSubStations));
        } catch (e) { console.error("Error saving training stations:", e); }
    }
