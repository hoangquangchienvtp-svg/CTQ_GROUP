    window.ddDoMerge = function () {
        let fromRow = parseInt(document.getElementById('dd-merge-from-row').value) - 1;
        let toRow = parseInt(document.getElementById('dd-merge-to-row').value) - 1;
        let fromCol = parseInt(document.getElementById('dd-merge-from-col').value);
        let toCol = parseInt(document.getElementById('dd-merge-to-col').value);
        let text = document.getElementById('dd-merge-text').value;
        if (fromRow > toRow) { showToast('Hàng bắt đầu phải nhỏ hơn hàng kết thúc!', 'error'); return; }
        if (fromCol > toCol) { showToast('Ngày bắt đầu phải nhỏ hơn ngày kết thúc!', 'error'); return; }
        let n = toCol - fromCol + 1;
        document.getElementById('dd-merge-modal').remove();

        for (let r = fromRow; r <= toRow; r++) {
            if (r >= DD_DATA.length) continue;
            DD_DATA[r].days[fromCol] = text;
            for (let k = 1; k < n; k++) DD_DATA[r].days[fromCol + k] = '';
            if (!DD_DATA[r].merged) DD_DATA[r].merged = {};
            DD_DATA[r].merged['merge_' + r + '_' + fromCol] = n;
        }
        ddRenderTable();
        showToast('Đã gộp ' + n + ' ô cho hàng ' + (fromRow + 1) + ' đến ' + (toRow + 1) + '!', 'success');

    window.ddLoadSelected = function () {
        let sel = document.getElementById('dd-sheet-select');

        if (!sheetName) return;

        showToast('Đang tải bảng ' + sheetName + '...', 'info');
        google.script.run.withSuccessHandler(function (res) {
            if (!res.success) { showToast('Lỗi: ' + res.message, 'error'); return; }
            let data = res.data;
            if (!data || data.length < 2) { showToast('Bảng trống!', 'error'); return; }

            DD_CURRENT_SHEET = sheetName;
            // data[0] = title row, data[1] = header row, data[2+] = data
            let header = data[1] || data[0];
            DD_DATES = [];
            // Header: STT, ID, NAME, ...dates..., SỐ NGÀY LÀM, SỐ NGÀY NGHỈ, TỶ LỆ
            for (let i = 3; i < header.length - 3; i++) DD_DATES.push(header[i]);

            DD_DATA = [];
            let startRow = (data.length > 2 && data[0][0] && String(data[0][0]).indexOf('Bảng') !== -1) ? 2 : 1;
            for (let i = startRow; i < data.length; i++) {
                let r = data[i];
                if (!r[0] && !r[1] && !r[2]) continue;
                let days = [];
                for (let j = 3; j < 3 + DD_DATES.length; j++) days.push(r[j] || '');
                DD_DATA.push({ id: r[1] || '', name: r[2] || '', days: days, merged: {} });
            }
            ddRenderTable();
            showToast('Đã tải bảng ' + sheetName, 'success');
        }).loadDiemDanh(sheetName);
    };

    window.lcCopyTableImage = function () {
        let container = document.querySelector('#lc-table-container table');
        if (!container) return showToast("Chưa có bảng Lỗi CTQ để copy!", "warning");
        if (typeof html2canvas !== 'function') return showToast("Thư viện html2canvas chưa sẵn sàng!", "warning");

        showToast("📸 Đang chụp và copy ảnh bảng Lỗi CTQ...", "info");
        html2canvas(container, {
            scale: Math.max(3, (window.devicePixelRatio || 1) * 2),
            useCORS: true,
            allowTaint: true,
            logging: false,
            backgroundColor: '#ffffff',
            onclone: function (clonedDoc) {
                let clonedTbl = clonedDoc.querySelector('#lc-table-container table');
                if (clonedTbl) {
                    clonedTbl.querySelectorAll('tr').forEach(tr => {
                        let firstCell = tr.children[0];
                        if (firstCell && (firstCell.tagName === 'TH' || firstCell.tagName === 'TD')) {
                            let input = firstCell.querySelector('input[type="checkbox"]');
                            if (input || firstCell.style.width === '35px') {
                                firstCell.style.display = 'none';
                            }
                        }
                    });
                }
            }
        }).then(canvas => {
            canvas.toBlob(async (blob) => {
                if (!blob) return showToast("Không thể tạo dữ liệu ảnh!", "error");
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast("📋 Đã copy toàn bộ ảnh bảng Lỗi CTQ vào Bộ nhớ tạm! Nhấn Ctrl+V để dán.", "success");
                    } else {
                        throw new Error("Trình duyệt không hỗ trợ ClipboardItem");
                    }
                } catch (err) {
                    let link = document.createElement('a');
                    link.download = `Loi_CTQ_${new Date().toISOString().slice(0, 10)}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("📋 Đã tải ảnh Lỗi CTQ xuống máy do trình duyệt chặn copy tự động.", "info");
                }
            }, 'image/png');
        }).catch(err => {
            showToast("Lỗi khi chụp ảnh: " + err, "error");
        });
    };

    let LC_EMP_CACHE = null;

    function lcIsSunday(dateStr) {
        if (!LC_CURRENT_SHEET) return false;
        let mthMatch = LC_CURRENT_SHEET.match(/T(\d+)_(\d+)/i);
        if (!mthMatch) return false;
        let sheetM = parseInt(mthMatch[1]);
        let sheetY = parseInt(mthMatch[2]);
        let dp = dateStr.split('/');
        if (dp.length !== 2) return false;
        let d = parseInt(dp[0]);
        let m = parseInt(dp[1]);
        let y = sheetY;
        if (sheetM === 12 && m === 1) y = sheetY + 1;
        if (sheetM === 1 && m === 12) y = sheetY - 1;
        let dateObj = new Date(y, m - 1, d);
        return dateObj.getDay() === 0;
    }

    window.lcCreateTable = function () {
        let fromStr = document.getElementById('lc-from-date').value;
        let toStr = document.getElementById('lc-to-date').value;
        let sheetName = document.getElementById('lc-sheet-name').value.trim();
        if (!fromStr || !toStr) { showToast('Vui lòng chọn đầy đủ ngày!', 'error'); return; }
        let fromDate = new Date(fromStr);
        let toDate = new Date(toStr);
        if (fromDate > toDate) { showToast('Ngày bắt đầu phải nhỏ hơn ngày kết thúc!', 'error'); return; }
        if (!sheetName) sheetName = 'LOI_CTQ_' + fromStr.replace(/-/g, '');
        document.getElementById('lc-create-modal').remove();

        LC_DATES = [];
        let cur = new Date(fromDate);
        while (cur <= toDate) {
            LC_DATES.push(cur.getDate() + '/' + (cur.getMonth() + 1));
            cur.setDate(cur.getDate() + 1);
        }
        let oldData = (LC_DATA && LC_DATA.length > 0) ? LC_DATA.filter(r => r.id || r.name || r.pos) : [];
        LC_CURRENT_SHEET = sheetName;
        LC_DATA = [];

        if (oldData.length > 0) {
            oldData.forEach(r => {
                let initialDays = [];
                let initialNotes = [];
                for (let k = 0; k < LC_DATES.length; k++) {
                    initialDays.push(lcIsSunday(LC_DATES[k]) ? '周日' : '');
                    initialNotes.push('');
                }
                LC_DATA.push({ id: r.id || '', name: r.name || '', pos: r.pos || '', days: initialDays, comments: initialNotes });
            });
        } else {
            for (let i = 0; i < 20; i++) {
                let initialDays = [];
                let initialNotes = [];
                for (let k = 0; k < LC_DATES.length; k++) {
                    initialDays.push(lcIsSunday(LC_DATES[k]) ? '周日' : '');
                    initialNotes.push('');
                }
                LC_DATA.push({ id: '', name: '', pos: '', days: initialDays, comments: initialNotes });
            }
        }

        google.script.run.withSuccessHandler(function (res) {
            if (res.success && res.data) LC_EMP_CACHE = res.data;
        }).getDiemDanhEmployees();

        lcRenderTable();
        showToast('Đã tạo bảng bắt lỗi từ ' + LC_DATES[0] + ' đến ' + LC_DATES[LC_DATES.length - 1] + '. Đang tạo sheet...', 'success');

        let headerRow = ['STT', 'ID', 'VỊ TRÍ / LINE', 'NAME'];
        LC_DATES.forEach(d => headerRow.push(d));
        headerRow.push('TOTAL');
        let emptyRows = LC_DATA.map((emp, i) => {
            let row = [i + 1, emp.id || '', emp.pos || '', emp.name || ''];
            LC_DATES.forEach(() => row.push(''));
            row.push(0);
            return row;
        });
        google.script.run.withSuccessHandler(function (res) {
            if (res.success) {
                showToast('Đã tạo sheet: ' + sheetName, 'success');
                lcLoadSheetList();
            }
        }).saveLoiCTQ(sheetName, headerRow, emptyRows, null);
    };

    function lcFindEmpInCache(cache, ma) {
        if (!cache || cache.length < 2) return null;
        for (let i = 1; i < cache.length; i++) {
            if (String(cache[i][0]).trim().toUpperCase() === ma || String(cache[i][1]).trim().toUpperCase() === ma) {
                return { name: cache[i][2] || '' };
            }
        }
        return null;
    }

    window.lcLookupId = function (inputEl, rowIdx) {
        let ma = inputEl.value.trim().toUpperCase();
        LC_DATA[rowIdx].id = inputEl.value.trim();
        if (!ma) return;
        google.script.run.withSuccessHandler(function (res) {
            if (res.success && res.data && res.data.length > 1) {
                LC_EMP_CACHE = res.data;
                let found = lcFindEmpInCache(res.data, ma);
                if (found) {
                    LC_DATA[rowIdx].name = found.name;
                    let tr = inputEl.closest('tr');
                    if (tr) {
                        let nameInput = tr.querySelectorAll('.lc-input')[1];
                        if (nameInput) nameInput.value = found.name;
                    }
                }
            }
        }).getDiemDanhEmployees();
    };

    function lcRenderTable() {
        if (LC_DATES.length === 0) return;
        let html = '<div class="lc-table-wrap"><table class="lc-table"><thead><tr>';
        html += '<th style="width:35px;"><input type="checkbox" id="lc-chk-all" onchange="lcToggleAll(this)"></th>';
        html += '<th style="width:35px;">STT</th>';
        html += '<th style="width:105px;">ID</th>';
        html += '<th style="min-width:80px;">VỊ TRÍ</th>';
        html += '<th style="min-width:200px; white-space:nowrap;">Họ Tên</th>';
        LC_DATES.forEach(d => { html += '<th style="min-width:42px;">' + d + '</th>'; });
        html += '<th style="min-width:70px; background:#0d47a1;">TOTAL</th>';
        html += '</tr></thead><tbody>';

        LC_DATA.forEach((emp, idx) => {
            html += '<tr>';
            html += '<td><input type="checkbox" class="lc-row-chk" data-idx="' + idx + '"></td>';
            html += '<td style="font-weight:900;">' + (idx + 1) + '</td>';
            html += '<td><input class="lc-input lc-input-id" value="' + (emp.id || '') + '" onchange="lcLookupId(this,' + idx + ')"></td>';

            html += '<td><select class="lc-select" style="width:100%; border:none; padding:2px;" onchange="LC_DATA[' + idx + '].pos=this.value">';
            html += '<option value="">- Chọn -</option>';
            LC_POS_LIST.forEach(p => {
                let sel = (emp.pos === p) ? ' selected' : '';
                html += '<option value="' + p + '"' + sel + '>' + p + '</option>';
            });
            html += '</select></td>';

            html += '<td style="font-weight:900; color:#b71c1c;"><input class="lc-input" value="' + (emp.name || '') + '" readonly style="font-weight:900; color:#b71c1c; cursor:default; background:#f5f5f5;"></td>';

            for (let di = 0; di < LC_DATES.length; di++) {
                let val = emp.days[di] || '';
                let note = emp.comments[di] || '';
                let cls = 'lc-cell';
                if (val.toUpperCase() === '周日') cls += ' lc-cell-sun';
                if (note) cls += ' lc-has-comment';

                html += '<td class="' + cls + '" title="' + note + '" data-row="' + idx + '" data-col="' + di + '" oncontextmenu="lcShowComment(this, event)">';
                html += '<input type="text" inputmode="numeric" class="lc-num-input" value="' + val + '" data-row="' + idx + '" data-col="' + di + '" oninput="lcCellInput(this)">';
                html += '</td>';
            }

            let sum = 0;
            emp.days.forEach(v => {
                let num = parseFloat(v);
                if (!isNaN(num)) sum += num;
            });
            html += '<td class="lc-summary" style="color:#0d47a1;">' + sum + '</td>';
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        document.getElementById('lc-table-container').innerHTML = html;
    }

    document.addEventListener('paste', function (e) {
        let active = document.activeElement;
        if (active && active.classList.contains('lc-num-input')) {
            e.preventDefault();
            let pastedText = '';
            if (e.clipboardData) pastedText = e.clipboardData.getData('text/plain');
            else if (window.clipboardData) pastedText = window.clipboardData.getData('Text');

            let startRow = parseInt(active.dataset.row);
            let startCol = parseInt(active.dataset.col);

            let rows = pastedText.split(/\r?\n/);
            if (rows.length > 0 && rows[rows.length - 1] === '') rows.pop();

            for (let r = 0; r < rows.length; r++) {
                let targetRow = startRow + r;
                if (targetRow >= LC_DATA.length) break;
                let cols = rows[r].split('\t');
                for (let c = 0; c < cols.length; c++) {
                    let targetCol = startCol + c;
                    if (targetCol >= LC_DATES.length) break;
                    let val = cols[c].trim();
                    LC_DATA[targetRow].days[targetCol] = val;
                }
                lcUpdateSummary(targetRow);
            }
            lcRenderTable();
            return;
        }

        if (active && active.classList.contains('lc-input-id')) {
            let tr = active.closest('tr');
            if (!tr) return;
            let tbody = tr.closest('tbody');
            if (!tbody || !tbody.closest('.lc-table')) return;

            e.preventDefault();
            let text = (e.clipboardData || window.clipboardData).getData('text');
            let lines = text.split(/\r?\n/).filter(l => l.trim());
            let rowsArr = Array.from(tbody.querySelectorAll('tr'));
            let startIdx = rowsArr.indexOf(tr);

            for (let i = 0; i < lines.length; i++) {
                let rowIdx = startIdx + i;
                if (rowIdx >= LC_DATA.length) {
                    let initialDays = [];
                    let initialNotes = [];
                    for (let k = 0; k < LC_DATES.length; k++) {
                        initialDays.push(lcIsSunday(LC_DATES[k]) ? '周日' : '');
                        initialNotes.push('');
                    }
                    LC_DATA.push({ id: '', name: '', pos: '', days: initialDays, comments: initialNotes });
                }
                LC_DATA[rowIdx].id = lines[i].trim();
            }

            showToast('Đã dán ' + lines.length + ' mã thẻ! Đang tra cứu tên...', 'info');
            google.script.run.withSuccessHandler(function (res) {
                if (res.success && res.data && res.data.length > 1) {
                    LC_EMP_CACHE = res.data;
                    for (let i = 0; i < lines.length; i++) {
                        let rowIdx = startIdx + i;
                        let ma = (LC_DATA[rowIdx].id || '').trim().toUpperCase();
                        if (!ma) continue;
                        let found = lcFindEmpInCache(res.data, ma);
                        if (found) LC_DATA[rowIdx].name = found.name;
                    }
                }
                lcRenderTable();
                showToast('Đã tra cứu xong ' + lines.length + ' nhân viên!', 'success');
            }).getDiemDanhEmployees();
        }
    });

    function lcUpdateSummary(rowIdx) {
        let emp = LC_DATA[rowIdx];
        let sum = 0;
        emp.days.forEach(v => {
            let num = parseFloat(v);
            if (!isNaN(num)) sum += num;
        });
        let trs = document.querySelectorAll('.lc-table tbody tr');
        if (trs[rowIdx]) {
            let tds = trs[rowIdx].querySelectorAll('td.lc-summary');
            if (tds[0]) tds[0].innerText = sum;
        }
    }

        let initialDays = [];
        let initialNotes = [];
        for (let k = 0; k < LC_DATES.length; k++) {
            initialDays.push(lcIsSunday(LC_DATES[k]) ? '周日' : '');
            initialNotes.push('');
        }
        LC_DATA.push({ id: '', name: '', pos: '', days: initialDays, comments: initialNotes });
        lcRenderTable();
        showToast('Đã thêm 1 hàng mới!', 'success');

    window.lcDeleteRows = function () {
        let checks = document.querySelectorAll('.lc-row-chk:checked');
        if (checks.length === 0) { showToast('Chọn ít nhất 1 hàng để xóa!', 'error'); return; }
        if (!confirm('Xóa ' + checks.length + ' hàng đã chọn?')) return;
        let indices = Array.from(checks).map(c => parseInt(c.dataset.idx)).sort((a, b) => b - a);
        indices.forEach(i => LC_DATA.splice(i, 1));
        lcRenderTable();
        showToast('Đã xóa ' + indices.length + ' hàng! Đang cập nhật sheet...', 'info');

        if (LC_CURRENT_SHEET && LC_DATES.length > 0) {
            lcSaveDataInternal(true);
        }
    };

    window.lcToggleAll = function (el) {
        document.querySelectorAll('.lc-row-chk').forEach(c => c.checked = el.checked);
    };

    window.lcSaveData = function () {
        lcSaveDataInternal(false);
    };

    function lcSaveDataInternal(isSilent) {
        if (!LC_CURRENT_SHEET || LC_DATES.length === 0) {
            if (!isSilent) showToast('Chưa có bảng nào để lưu!', 'error');
            return;
        }
        let headerRow = ['STT', 'ID', 'VỊ TRÍ / LINE', 'NAME'];
        LC_DATES.forEach(d => headerRow.push(d));
        headerRow.push('TOTAL');

        let dataRows = [];
        let notesRows = [];

        LC_DATA.forEach((emp, i) => {
            let row = [i + 1, emp.id, emp.pos, emp.name];
            let nRow = ['', '', '', ''];
            let sum = 0;
            emp.days.forEach((v, di) => {
                row.push(v);
                nRow.push(emp.comments[di] || '');
                let num = parseFloat(v);
                if (!isNaN(num)) sum += num;
            });
            row.push(sum);
            nRow.push('');
            dataRows.push(row);
            notesRows.push(nRow);
        });

        if (!isSilent) showToast('Đang lưu bảng bắt lỗi...', 'info');
        google.script.run.withSuccessHandler(function (res) {
            if (res.success) {
                if (!isSilent) showToast('Đã lưu thành công vào sheet: ' + LC_CURRENT_SHEET, 'success');
                lcLoadSheetList();
            } else {
                if (!isSilent) showToast('Lỗi: ' + res.message, 'error');
            }
        }).saveLoiCTQ(LC_CURRENT_SHEET, headerRow, dataRows, notesRows);
    }

    function lcLoadSheetList() {
        google.script.run.withSuccessHandler(function (res) {
            let sel = document.getElementById('lc-sheet-select');
            if (!sel) return;
            sel.innerHTML = '<option value="">-- Chọn --</option>';
            if (res.success && res.data) {
                res.data.forEach(name => {
                    sel.innerHTML += '<option value="' + name + '"' + (name === LC_CURRENT_SHEET ? ' selected' : '') + '>' + name.replace('LOI_CTQ_', '') + '</option>';
                });
            }
        }).getListLoiCTQSheets();
    }

    window.lcLoadSelected = function () {
        let sel = document.getElementById('lc-sheet-select');
        let sheetName = sel.value;
        if (!sheetName) return;

        showToast('Đang tải bảng ' + sheetName + '...', 'info');
        google.script.run.withSuccessHandler(function (res) {
            if (!res.success) { showToast('Lỗi: ' + res.message, 'error'); return; }
            let data = res.data;
            let notes = res.notes || [];
            if (!data || data.length < 2) { showToast('Bảng trống!', 'error'); return; }

            LC_CURRENT_SHEET = sheetName;
            let header = data[1] || data[0];
            LC_DATES = [];
            for (let i = 4; i < header.length - 1; i++) LC_DATES.push(header[i]);

            LC_DATA = [];
            let startRow = (data.length > 2 && data[0][0] && String(data[0][0]).indexOf('Bắt') !== -1) ? 2 : 1;
            for (let i = startRow; i < data.length; i++) {
                let r = data[i];
                let nR = notes[i] || [];
                if (!r[0] && !r[1] && !r[2]) continue;
                let days = [];
                let comments = [];
                for (let j = 4; j < 4 + LC_DATES.length; j++) {
                    days.push(r[j] || '');
                    comments.push(nR[j] || '');
                }
                LC_DATA.push({ id: r[1] || '', name: r[3] || '', pos: r[2] || '', days: days, comments: comments });
            }
            lcRenderTable();
            showToast('Đã tải bảng ' + sheetName, 'success');
        }).loadLoiCTQ(sheetName);
    };

    window.lcExportExcel = function () {
        if (LC_DATES.length === 0 || LC_DATA.length === 0) { showToast('Chưa có dữ liệu để tải!', 'error'); return; }

        let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
        html += '<head><meta charset="UTF-8"><style>td,th{text-align:center;vertical-align:middle;font-family:Times New Roman;font-size:21pt;font-weight:bold;border:1px solid #333;padding:4px;} th{background:#b71c1c;color:#fff;font-size:12pt;}</style></head>';
        html += '<body><table>';

        let totalCols = 4 + LC_DATES.length + 1;
        html += '<tr><td colspan="' + totalCols + '" style="font-size:14pt;font-weight:bold;color:#b71c1c;text-align:center;">' + (LC_CURRENT_SHEET || 'Bảng bắt lỗi') + '</td></tr>';

        html += '<tr>';
        ['STT', 'ID', 'VỊ TRÍ / LINE', 'NAME'].forEach(h => html += '<th>' + h + '</th>');
        LC_DATES.forEach(d => html += '<th>' + d + '</th>');
        html += '<th style="background:#0d47a1;">TOTAL</th>';
        html += '</tr>';

        LC_DATA.forEach((emp, i) => {
            html += '<tr>';
            html += '<td>' + (i + 1) + '</td>';
            html += '<td>' + (emp.id || '') + '</td>';
            html += '<td>' + (emp.pos || '') + '</td>';
            html += '<td>' + (emp.name || '') + '</td>';
            let sum = 0;
            emp.days.forEach((d, di) => {

        html += '</table></body></html>';
        let blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });

        let a = document.createElement('a');

        a.download = (LC_CURRENT_SHEET || 'LOI_CTQ') + '.xls';

    window.bccCalc = function (shift) {
        var tong = parseFloat(document.getElementById('bcc-' + shift + '-slTong').value) || 0;
        var a = parseFloat(document.getElementById('bcc-' + shift + '-nghiViecRieng').value) || 0;
        var b = parseFloat(document.getElementById('bcc-' + shift + '-nghiTuDo').value) || 0;
        var c = parseFloat(document.getElementById('bcc-' + shift + '-nghiOm').value) || 0;
        var d = parseFloat(document.getElementById('bcc-' + shift + '-nghiPhep').value) || 0;
        // Vào muộn không trừ vào tổng có mặt
        var f = parseFloat(document.getElementById('bcc-' + shift + '-nghiViec').value) || 0;
        var coMat = tong - a - b - c - d - f;
        document.getElementById('bcc-' + shift + '-tongCoMat').value = coMat;
        window.bccDirty = true;
        window.bccScheduleSync();
    };

    // Generic input handler to trigger sync on any bcc input
    document.addEventListener('input', function (e) {
        if (e.target && e.target.classList && (e.target.classList.contains('bcc-input') || e.target.classList.contains('bcc-input-line') || e.target.classList.contains('bcc-input-note'))) {
            window.bccDirty = true;
            window.bccScheduleSync();
        }
    });

    function bccCollectData(shift) {
        var fields = ['date', 'slTong', 'nghiViecRieng', 'nghiTuDo', 'nghiOm', 'nghiPhep', 'vaoMuon', 'nghiViec', 'hoTroMain', 'hoTroSub', 'ctqGiaoQuan', 'traNguoiMoi', 'dangDaoTao', 'line1', 'line2', 'line3', 'note1', 'note2', 'note3', 'note4', 'note5'];
        var data = {};
        fields.forEach(function (f) {
            var el = document.getElementById('bcc-' + shift + '-' + f);
            data[f] = el ? el.value : '';
        });
        var tongEl = document.getElementById('bcc-' + shift + '-tongCoMat');
        data.tongCoMat = tongEl ? tongEl.value : '';
        return data;
    }

    function bccFillData(shift, data) {
        if (!data) return;
        var fields = ['date', 'slTong', 'nghiViecRieng', 'nghiTuDo', 'nghiOm', 'nghiPhep', 'vaoMuon', 'nghiViec', 'hoTroMain', 'hoTroSub', 'ctqGiaoQuan', 'traNguoiMoi', 'dangDaoTao', 'line1', 'line2', 'line3', 'note1', 'note2', 'note3', 'note4', 'note5'];
        fields.forEach(function (f) {
            var el = document.getElementById('bcc-' + shift + '-' + f);
            if (el && data[f] !== undefined && document.activeElement !== el) el.value = data[f];
        });
        bccCalc(shift);
    }

    window.bccSaveData = function (silent = false) {
        var dayData = bccCollectData('day');
        var nightData = bccCollectData('night');
        var now = new Date();
        var payload = {
            timestamp: now.toLocaleString('vi-VN'),
            date: now.getDate() + '/' + (now.getMonth() + 1) + '/' + now.getFullYear(),
            day: dayData,
            night: nightData
        };

        if (!silent) showToast('Đang lưu báo cáo...', 'info');
        window.bccDirty = false;
        google.script.run.withSuccessHandler(function (res) {
            if (res.success) {
                if (!silent) showToast('Đã lưu dữ liệu thành công!', 'success');
            } else {
                if (!silent) showToast('Lỗi: ' + res.message, 'error');
            }
        }).saveBaoChuyenCan(JSON.stringify(payload));
    };

    window.bccLoadData = function (silent = false) {
        google.script.run.withSuccessHandler(function (res) {
            if (res.success && res.data) {
                try {
                    var parsed = JSON.parse(res.data);
                    if (parsed.day) bccFillData('day', parsed.day);
                    if (parsed.night) bccFillData('night', parsed.night);
                    if (!silent) showToast('Đã tải dữ liệu báo cáo gần nhất!', 'success');
                } catch (e) {
                    if (!silent) showToast('Dữ liệu không hợp lệ.', 'error');
                }
            }
        }).loadBaoChuyenCan();
    };

        let minC = Math.min(window.bcSelection.startC, window.bcSelection.endC);
        let maxC = Math.max(window.bcSelection.startC, window.bcSelection.endC);

            let minC = Math.min(window.bcSelection.startC, window.bcSelection.endC);

            let textRows = [];
            for (let r = minR; r <= maxR; r++) {

                let rowData = [];
                for (let c = minC; c <= maxC; c++) {

    window.bcParsePaste = function (text, activeEl) {
        let lines = text.split(/\r?\n/);
        if (lines.length === 0) return;

        let matrix = [];
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            if (line.endsWith('\r')) line = line.substring(0, line.length - 1);
            if (!line && i === lines.length - 1) continue;
            let cols = line.split('\t');
            matrix.push(cols);
        }
        if (matrix.length === 0) return;

        let startRow = window.bcData.length;
        let startCol = 0;
        let isThead = false;

        if (window.bcSelection && window.bcSelection.startR !== -1) {
            startRow = Math.min(window.bcSelection.startR, window.bcSelection.endR);
            startCol = Math.min(window.bcSelection.startC, window.bcSelection.endC);
        } else {
            let cell = activeEl ? activeEl.closest('td, th') : null;
            if (cell) {
                let tr = cell.closest('tr');
                if (tr && tr.parentElement) {
                    if (tr.parentElement.tagName === 'TBODY') {
                        startRow = parseInt(tr.getAttribute('data-rowindex')) || 0;
                        startCol = Array.prototype.indexOf.call(tr.children, cell);
                    } else if (tr.parentElement.tagName === 'THEAD') {
                        isThead = true;
                        startRow = 0;
                        startCol = Array.prototype.indexOf.call(tr.children, cell);
                    }
                }
            }
        }

        let selR = 1, selC = 1;
        if (!isThead && window.bcSelection && window.bcSelection.startR !== -1) {
            selR = Math.abs(window.bcSelection.endR - window.bcSelection.startR) + 1;
            selC = Math.abs(window.bcSelection.endC - window.bcSelection.startC) + 1;
        }

        let targetRows = matrix.length;
        let targetCols = matrix[0].length;
        if (!isThead && (selR > 1 || selC > 1)) {
            targetRows = selR;
            targetCols = selC;
        }

        for (let r = 0; r < targetRows; r++) {
            let rowPasted = matrix[r % matrix.length];

            if (isThead && r === 0) {
                for (let c = 0; c < rowPasted.length; c++) {
                    let targetCol = startCol + c;
                    if (targetCol < window.bcHeaders.length) {
                        window.bcHeaders[targetCol] = rowPasted[c];
                    }
                }
                continue;
            }

            let targetRow = isThead ? (startRow + r - 1) : (startRow + r);

            while (targetRow >= window.bcData.length) {
                let newRow = new Array(window.bcHeaders.length).fill('');
                newRow[0] = window.bcData.length + 1;
                window.bcData.push(newRow);
            }

            for (let c = 0; c < targetCols; c++) {
                let targetCol = startCol + c;
                if (targetCol < window.bcHeaders.length) {
                    window.bcData[targetRow][targetCol] = rowPasted[c % rowPasted.length];
                }
            }
        }

        bcRenderTable();
        window.bcDirty = true;
        window.bcScheduleSync();
        showToast('Đã dán dữ liệu thành công!', 'success');
    };

    window.bcRenderTable = function () {

    window.bcSilentPull = function () {
        let caName = document.getElementById('bc-ca-select') ? document.getElementById('bc-ca-select').value : 'CA_1';
        google.script.run.withSuccessHandler(res => {
            if (res.success && res.data && !window.bcDirty) {
                try {
                    let payload = JSON.parse(res.data);
                    let matrix = payload.matrix || [];

                    window.bcCache[caName] = res.data; // Always update cache

                    let currentCa = document.getElementById('bc-ca-select') ? document.getElementById('bc-ca-select').value : 'CA_1';
                    if (caName !== currentCa) return; // Prevent race condition if user switched CA during load

                    let newCacheStr = JSON.stringify(matrix);
                    let currentMatrix = [window.bcHeaders].concat(window.bcData);
                    let oldCacheStr = JSON.stringify(currentMatrix);

                    if (newCacheStr !== oldCacheStr && matrix.length > 0) {
                        window.bcHiddenCols = payload.hiddenCols || [];
                        window.bcHeaders = matrix[0];
                        window.bcData = matrix.slice(1);
                        bcRenderTable();
                    }
                } catch (e) { }

    window.bcDeleteSelectedCols = function () {
        let checkboxes = document.querySelectorAll('.bc-col-cb');
        let toDelete = [];
        checkboxes.forEach(cb => {
            if (!cb.checked) {
                toDelete.push(parseInt(cb.getAttribute('data-col')));
            }
        });

        if (toDelete.length === 0) {
            showToast('Bạn chưa bỏ tick cột nào!', 'warning');
            return;
        }

        if (!confirm('Bạn có CHẮC CHẮN muốn XÓA VĨNH VIỄN ' + toDelete.length + ' cột đã bỏ tick không?')) return;

        toDelete.sort((a, b) => b - a);

        toDelete.forEach(c => {
            window.bcHeaders.splice(c, 1);
            for (let r = 0; r < window.bcData.length; r++) {
                window.bcData[r].splice(c, 1);
            }
        });

        window.bcHiddenCols = [];
        document.getElementById('bc-modal-overlay').style.display = 'none';

        window.bcScheduleSync();

        let newRow = new Array(window.bcHeaders.length).fill('');
        window.bcData.push(newRow);
        for (let r = 0; r < window.bcData.length; r++) {
            window.bcData[r][0] = r + 1; // Cập nhật lại toàn bộ STT
        }
        bcRenderTable();
        window.bcDirty = true;
        window.bcScheduleSync();
    };

    window.bcDelRow = function () {
        if (window.bcData.length === 0) {
            showToast('Bảng đang trống!', 'warning');
            return;
        }
        let input = prompt("Nhập STT dòng muốn xóa (VD: 3 hoặc xóa nhiều dòng: 1-4):");
        if (!input) return;

        let startIdx, endIdx;

        if (input.includes('-')) {
            let parts = input.split('-');
            if (parts.length !== 2) {
                showToast('Định dạng không hợp lệ! Vui lòng dùng định dạng như: 1-4', 'error');
                return;
            }
            startIdx = parseInt(parts[0].trim()) - 1;
            endIdx = parseInt(parts[1].trim()) - 1;
        } else {
            startIdx = parseInt(input.trim()) - 1;
            endIdx = startIdx;
        }

        if (isNaN(startIdx) || isNaN(endIdx) || startIdx > endIdx || startIdx < 0 || endIdx >= window.bcData.length) {
            showToast('STT không hợp lệ hoặc nằm ngoài phạm vi (1 đến ' + window.bcData.length + ')!', 'error');
            return;
        }

        let deleteCount = endIdx - startIdx + 1;
        if (deleteCount > 1) {
            if (!confirm(`Bạn có chắc chắn muốn xóa ${deleteCount} dòng (từ STT ${startIdx + 1} đến ${endIdx + 1}) không?`)) return;
        }

        window.bcData.splice(startIdx, deleteCount);

        // Cập nhật lại STT sau khi xóa
        for (let r = 0; r < window.bcData.length; r++) {
            window.bcData[r][0] = r + 1;
        }
        bcRenderTable();
        window.bcDirty = true;
        window.bcScheduleSync();
        showToast(`Đã xóa ${deleteCount} dòng thành công!`, 'success');
    };

    window.bcCollectMatrix = function () {
        let matrix = [];
        matrix.push(window.bcHeaders);
        for (let r = 0; r < window.bcData.length; r++) {
            // Ensure row has same length as headers
            let row = [];
            for (let c = 0; c < window.bcHeaders.length; c++) {
                row.push(window.bcData[r][c] || '');
            }
            matrix.push(row);
        }
        return matrix;
    };

    window.bcSync = function (silent = false) {
        let matrix = bcCollectMatrix();
        if (matrix.length <= 1) {
            if (!silent) showToast('Bảng không có dữ liệu để lưu!', 'warning');
            return;
        }

        let caName = document.getElementById('bc-ca-select') ? document.getElementById('bc-ca-select').value : 'CA_1';

        let payload = {
            matrix: matrix,
            hiddenCols: window.bcHiddenCols || []
        };

        let payloadStr = JSON.stringify(payload);
        window.bcCache[caName] = payloadStr; // Update local cache

        if (!silent) showToast('Đang đồng bộ lên Sheet...', 'info');
        window.bcDirty = false; // reset dirty flag

        google.script.run.withSuccessHandler(res => {
            if (res.success) {
                if (!silent) showToast(`Đã lưu thành công dữ liệu ${caName}!`, 'success');
            } else {
                if (!silent) showToast('Lỗi: ' + res.message, 'error');
            }
        }).saveBaoCong(payloadStr, caName);
    };

    window.bcChangeCa = function () {
        let caName = document.getElementById('bc-ca-select') ? document.getElementById('bc-ca-select').value : 'CA_1';

        // Show spinner instantly to avoid UI freeze and lag
        let oldHeaders = window.bcHeaders;
        window.bcData = [];
        bcRenderTable();

        if (window.bcCache[caName]) {
            try {
                let payload = JSON.parse(window.bcCache[caName]);
                let matrix = payload.matrix || [];

                if (matrix.length > 0) {
                    // Let browser paint spinner first, then render heavy table
                    setTimeout(() => {
                        let currentCa = document.getElementById('bc-ca-select') ? document.getElementById('bc-ca-select').value : 'CA_1';
                        if (caName !== currentCa) return;

                        window.bcHiddenCols = payload.hiddenCols || [];
                        window.bcHeaders = matrix[0];
                        window.bcData = matrix.slice(1);
                        bcRenderTable();
                    }, 50);
                    return; // Fast switch
                }
            } catch (e) { }
        }

        showToast('Đang tải dữ liệu ca...', 'info');
        window.bcHeaders = ["STT", "Bộ Phận", "Khu Vực", "Mã Thẻ", "Họ Tên", "CA"];
        window.bcHiddenCols = [];
        window.bcSilentPull(); // Load data from server
    };

    window.bcLoadAll = function () {
        google.script.run.withSuccessHandler(res => {
            if (res.success) {
                window.bcCache['CA_1'] = res.CA_1;
                window.bcCache['CA_2'] = res.CA_2;
                let caName = document.getElementById('bc-ca-select') ? document.getElementById('bc-ca-select').value : 'CA_1';

                if (window.bcCache[caName]) {
                    try {
                        let payload = JSON.parse(window.bcCache[caName]);
                        let matrix = payload.matrix || [];
                        window.bcHiddenCols = payload.hiddenCols || [];
                        if (matrix.length > 0) {
                            window.bcHeaders = matrix[0];
                            window.bcData = matrix.slice(1);
                            bcRenderTable();
                        }
                    } catch (e) { }
                }
            }
        }).loadBaoCongAll();
    };

    // ==========================================
    // THEO DÕI CÔNG NHÂN (CHẤM CÔNG CTQ)
    // ==========================================

    let _prevOnLangCal = window.onLanguageChanged;
    window.onLanguageChanged = function () {
        if (typeof _prevOnLangCal === 'function') _prevOnLangCal();
        if (typeof tdcnRenderTable === 'function' && document.getElementById('tdcn-content-1') && document.getElementById('tdcn-content-1').style.display !== 'none') {
            tdcnRenderTable();
        }
        if (typeof tdcnRenderDataTab === 'function' && document.getElementById('tdcn-content-2') && document.getElementById('tdcn-content-2').style.display !== 'none') {
            tdcnRenderDataTab();
        }
        if (typeof window.renderLhLoaiHinh === 'function') {
            window.renderLhLoaiHinh();
        }
        if (typeof window.dcdLoadKanban === 'function' && document.getElementById('dcd-content-kanban') && document.getElementById('dcd-content-kanban').style.display !== 'none') {
            window.dcdLoadKanban();
        }
        if (typeof window.dcdRenderTable === 'function' && document.getElementById('dcd-content-main') && document.getElementById('dcd-content-main').style.display !== 'none') {
            window.dcdRenderTable(window.dcdData ? window.dcdData.currentLine : null);
        }
    };

    let tdcnData = []; // Mảng chứa 600 dòng dữ liệu
    let tdcnComments = {}; // Lưu ghi chú dạng "row_col": "text"
    let tdcnDates = []; // Các ngày trong tháng từ 26 -> 25
    let tdcnIsSunday = []; // Mảng boolean đánh dấu Chủ Nhật
    let tdcnExtraColumns = [
        "Chuyên Cần", "Sai Vị Trí", "Điểm Mù", "Lỗi Process",
        "Đạt/Không Đạt", "Ghi Chú", "Ngày Công", "Tỷ Lệ", "Phép Năm",
        "Việc Riêng", "Tự Do", "Nghỉ Việc", "NO", "Không Mở Chuyền"
    ];
    let tdcnCurrentMonth = '';
    let tdcnCurrentYear = '';
    let tdcnActiveTab = 1;

    let tdcnSelection = { startR: -1, startC: -1, endR: -1, endC: -1, isDragging: false };
    let tdcnContextMenuTarget = null;
    let tdcnColors = {};
    let tdcnTextColors = {}; // Lưu màu chữ dạng "row_col": "#hexcolor"
    let tdcnQuickFillVisible = false;

    function tdcnToggleQuickFill() {
        tdcnQuickFillVisible = !tdcnQuickFillVisible;
        let panel = document.getElementById('tdcn-quick-fill-panel');
        if (panel && tdcnActiveTab === 1) {
            panel.style.display = tdcnQuickFillVisible ? 'block' : 'none';
        }
    }

    let tdcnQuickFillData = [];

    // Tải dữ liệu bảng màu từ Server
    google.script.run.withSuccessHandler(function (res) {
        if (res && res.length > 0) {
            tdcnQuickFillData = res;
        } else {
            tdcnQuickFillData = [
                { v: "丧假", d: "PHÉP TANG", c: "#cba2c8" },
                { v: "不开线", d: "Không mở chuyền", c: "#ea9999" },
                { v: "请假", d: "PHÉP RIÊNG", c: "#00b0f0" },
                { v: "病假", d: "PHÉP ỐM", c: "#7030a0" },
                { v: "年假", d: "PHÉP NĂM", c: "#ffc000" },
                { v: "旷工", d: "NGHỈ TỰ DO", c: "#ff0000" },
                { v: "离职", d: "NGHỈ VIỆC", c: "#c00000" },
                { v: "婚假", d: "Nghỉ Cưới", c: "#fce5cd" },
                { v: "放假", d: "Nghỉ Lễ", c: "#ffd966" },
                { v: "盘点", d: "Kiểm Kê", c: "#f6b26b" },
                { v: "周日", d: "Chủ Nhật", c: "#ffff00" },
                { v: "NO", d: "Trống", c: "#ffffff" },
                { v: "V", d: "Đi Làm", c: "#00ff00" }
            ];
        }
        tdcnUpdateQuickFillUI();
    }).getQuickFillData();

    let tdcnDragInfo = { isDragging: false, startX: 0, startY: 0, initialX: 0, initialY: 0 };

    function tdcnRenderQuickFill() {
        let html = "";
        tdcnQuickFillData.forEach(function (item, idx) {
            let isWhite = item.c === '#ffffff';
            let colorStyle = isWhite ? "color:#000; border:1px solid #ccc;" : ("color:" + (['#ff0000', '#c00000', '#7030a0'].includes(item.c) ? "#fff" : "#000") + "; border:1px solid #999;");
            let textColor = item.tc || '';
            let textColorStyle = textColor ? 'color:' + textColor + ';' : '';
            html += "<button onclick=\"tdcnApplyQuickFill('" + item.v + "', '" + item.c + "', '" + textColor + "')\" style=\"background:" + item.c + "; " + colorStyle + " " + textColorStyle + " padding:6px; text-align:left; font-size:12px; font-weight:bold; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-radius:4px;\">" +
                "<span>" + item.v + "</span>" +
                "<span style=\"font-weight:normal; font-size:11px;\">" + item.d + "</span>" +
                "</button>";
        });
        return html;
    }

    function tdcnApplyQuickFill(val, color, textColor) {
        if (tdcnSelection.startR === -1) return alert("Vui lòng bôi đen (chọn) các ô ngày cần điền trước!");

        let minR = Math.min(tdcnSelection.startR, tdcnSelection.endR);
        let maxR = Math.max(tdcnSelection.startR, tdcnSelection.endR);
        let minC = Math.min(tdcnSelection.startC, tdcnSelection.endC);
        let maxC = Math.max(tdcnSelection.startC, tdcnSelection.endC);

        if (minC < 8) {
            if (maxC < 8) return alert("Chỉ được điền vào các cột ngày (từ 26/6 trở đi)!");
            minC = 8;
        }

        let tbody = document.getElementById("tdcn-tbody");
        let count = 0;
        // val === "" là lệnh XÓA (clear), mọi giá trị khác kể cả "NO" đều được ghi vào ô
        let isClear = (val === "");

        for (let r = minR; r <= maxR; r++) {
            let tr = tbody.children[r];
            if (!tr) continue;
            for (let c = minC; c <= maxC; c++) {
                if (c >= 8 && c < 8 + tdcnDates.length) { // Chỉ cho phép điền nhanh vào cột ngày
                    tdcnData[r][c] = val;

                    if (isClear) {
                        delete tdcnColors[r + '_' + c];
                        delete tdcnTextColors[r + '_' + c];
                    } else {
                        tdcnColors[r + '_' + c] = color;
                        if (textColor) tdcnTextColors[r + '_' + c] = textColor;
                        else delete tdcnTextColors[r + '_' + c];
                    }

                    if (tr.children[c]) {
                        tr.children[c].innerText = val;
                        tr.children[c].style.backgroundColor = isClear ? "" : color;
                        tr.children[c].style.color = (isClear || !textColor) ? "" : textColor;
                    }
                    count++;
                }
            }
            tdcnRecalculateRow(r);
        }
        if (count > 0 && typeof showToast === 'function') showToast("Đã điền " + count + " ô!", "success");
    }

    function tdcnRecalculateRow(r) {
        if (!tdcnData[r] || tdcnDates.length === 0) return;

        let dateStartIdx = 8;
        let dateEndIdx = 8 + tdcnDates.length - 1;
        let extraStartIdx = 8 + tdcnDates.length;

        let countV = 0, countPhepNam = 0, countViecRieng = 0, countTuDo = 0;
        let countNghiViec = 0, countNo = 0, countKhongMoChuyen = 0, countSunday = 0;

        for (let c = dateStartIdx; c <= dateEndIdx; c++) {
            let val = tdcnData[r][c] || "";
            let v = val.trim().toUpperCase();
            let valTrim = val.trim();

            if (v === 'V' || valTrim === '盘点' || valTrim === '公司放假') countV++;
            else if (valTrim === '年假') countPhepNam++;
            else if (valTrim === '请假' || valTrim === '丧假' || valTrim === '病假') countViecRieng++;
            else if (valTrim === '旷工') countTuDo++;
            else if (valTrim === '离职') countNghiViec++;
            else if (v === 'NO') countNo++;
            else if (valTrim === '不开线') countKhongMoChuyen++;

            if (valTrim === '周日') countSunday++;
        }

        // 6: Ngày Công
        tdcnData[r][extraStartIdx + 6] = countV;
        // 7: Tỷ Lệ
        let baseDays = tdcnDates.length - countSunday;
        let tyLe = "0%";
        if (baseDays > 0 && countV > 0) {
            tyLe = ((countV / baseDays) * 100).toFixed(1) + "%";
        }
        tdcnData[r][extraStartIdx + 7] = tyLe;

        let indexDiemMu = extraStartIdx + 2;
        if (!tdcnData[r][indexDiemMu] || tdcnData[r][indexDiemMu].toString().trim() === '') {
            tdcnData[r][indexDiemMu] = "0";
        }

        // Cập nhật các cột đếm
        tdcnData[r][extraStartIdx + 8] = countPhepNam;
        tdcnData[r][extraStartIdx + 9] = countViecRieng;
        tdcnData[r][extraStartIdx + 10] = countTuDo;
        tdcnData[r][extraStartIdx + 11] = countNghiViec;
        tdcnData[r][extraStartIdx + 12] = countNo;
        tdcnData[r][extraStartIdx + 13] = countKhongMoChuyen;

        let tbody = document.getElementById('tdcn-tbody');
        if (tbody && tbody.children[r]) {
            let tr = tbody.children[r];
            for (let i = 6; i <= 13; i++) {
                let cell = tr.children[extraStartIdx + i];
                if (cell) {
                    let val = tdcnData[r][extraStartIdx + i];
                    if (i >= 8 && i <= 13 && val == 0) {
                        cell.innerText = '';
                    } else {
                        cell.innerText = val;
                    }
                }
            }
        }
    }

    function tdcnInitDrag() {
        let header = document.getElementById("tdcn-quick-fill-header");
        let panel = document.getElementById("tdcn-quick-fill-panel");
        if (!header || !panel) return;

        header.onmousedown = function (e) {
            tdcnDragInfo.isDragging = true;
            tdcnDragInfo.startX = e.clientX;
            tdcnDragInfo.startY = e.clientY;
            tdcnDragInfo.initialX = panel.offsetLeft;
            tdcnDragInfo.initialY = panel.offsetTop;
            document.body.style.userSelect = "none";
        }

        document.addEventListener("mousemove", function (e) {
            if (tdcnDragInfo.isDragging) {
                let dx = e.clientX - tdcnDragInfo.startX;
                let dy = e.clientY - tdcnDragInfo.startY;
                panel.style.left = (tdcnDragInfo.initialX + dx) + "px";
                panel.style.top = (tdcnDragInfo.initialY + dy) + "px";
                panel.style.right = "auto";
            }
        });

        document.addEventListener("mouseup", function () {
            if (tdcnDragInfo.isDragging) {
                tdcnDragInfo.isDragging = false;
                document.body.style.userSelect = "";
            }
        });
    }

</script>
