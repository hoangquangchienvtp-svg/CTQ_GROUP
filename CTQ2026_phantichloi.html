    function switchPtlSubTab(tabName) {
        document.querySelectorAll('.ptl-tab-btn').forEach(btn => {
            btn.style.background = '#e2e8f0';
            btn.style.color = '#475569';
        });
        document.querySelectorAll('.ptl-subtab-content').forEach(sub => sub.style.display = 'none');

        let activeBtn = document.getElementById('ptl-btn-' + tabName);
        let activeSub = document.getElementById('ptl-subtab-' + tabName);
        if (activeBtn) {
            activeBtn.style.background = '#2563eb';
            activeBtn.style.color = '#ffffff';
        }
        if (activeSub) activeSub.style.display = 'block';

        if (tabName === 'wt' || tabName === 'thongkewt') {
            loadPtlWtDataAndInit(false);
        } else if (tabName === 'kanban1') {
            // Tab KANBAN 1: tải cùng dữ liệu như tab 1 (KANBAN)
            loadPtlDataAndInit(false, function () { executeK1Search(); });
        } else if (tabName === 'kanban2wt') {
            // Tab KANBAN 2 WT: tải cùng dữ liệu như tab WT
            loadPtlWtDataAndInit(false);
        }
    }

    function loadPtlDataAndInit(forceReload = false, callback = null) {
        if (!forceReload && window.G_LoiThang7Data && window.G_LoiThang7Data.length > 1) {
            initPtlFiltersAndRender();
            if (typeof callback === 'function') callback();
        } else if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(res => {
                if (res && res.success && res.data) {
                    window.G_LoiThang7Data = res.data;
                } else if (res && Array.isArray(res)) {
                    window.G_LoiThang7Data = res;
                } else {
                    window.G_LoiThang7Data = [];
                }
                if (window.G_Data) window.G_Data.loiThang7Data = window.G_LoiThang7Data;
                initPtlFiltersAndRender();
                if (typeof callback === 'function') callback();
            }).withFailureHandler(err => {
                showToast("Lỗi tải dữ liệu Sheet Lỗi Tháng 7: " + err, "error");
                initPtlFiltersAndRender();
                if (typeof callback === 'function') callback();
            }).getLoiThang7Data();
        } else {
            window.G_LoiThang7Data = [];
            initPtlFiltersAndRender();
            if (typeof callback === 'function') callback();
        }
    }

    function ptlDateToIsoStr(dStr) {
        if (!dStr) return '';
        dStr = dStr.trim();
        let parts = dStr.split(/[\/\-]/);
        let currentYear = new Date().getFullYear();
        if (parts.length === 2) {
            let day = parts[0].padStart(2, '0');
            let month = parts[1].padStart(2, '0');
            return `${currentYear}-${month}-${day}`;
        } else if (parts.length === 3) {
            if (parts[0].length === 4) {
                let year = parts[0];
                let month = parts[1].padStart(2, '0');
                let day = parts[2].padStart(2, '0');
                return `${year}-${month}-${day}`;
            } else {
                let day = parts[0].padStart(2, '0');
                let month = parts[1].padStart(2, '0');
                let year = parts[2].length === 2 ? '20' + parts[2] : parts[2];
                return `${year}-${month}-${day}`;
            }
        }
        return '';
    }

            rootcause: 5,   // Cột F (TÊN LỖI)
            histStation: 6, // Cột G (TÊN TRẠM)
            line: 7,        // Cột H (LINE)
            shift: 9,       // Cột J (CA)

            imageUrl: 13    // Cột N (LINK XEM ẢNH)
        };
        if (!headerRow || !headerRow.length) return idx;

        for (let i = 0; i < headerRow.length; i++) {
            let val = String(headerRow[i] || '').trim().toLowerCase();
            if (val === 'date' || val === 'ngày') idx.date = i;
            else if (val === 'history line' || val === 'line' || val === 'trạm') idx.line = i;
            else if (val === 'history shift' || val === 'shift' || val === 'ca') idx.shift = i;
            else if (val === 'op' || val === 'mã thẻ') idx.op = i;

            else if (val.includes('link') || val.includes('ảnh') || val.includes('image')) idx.imageUrl = i;
        }

        return idx;
    }

            if (textSpan) textSpan.innerText = checked[0].value;

            if (textSpan) textSpan.innerText = `Đã chọn (${checked.length})`;
            if (badge) badge.innerText = checked.length;

        let cbs = document.querySelectorAll('.ptl-wt-line-cb');
        let checked = Array.from(cbs).filter(cb => cb.checked).map(cb => cb.value);
        if (checked.length === cbs.length) return 'ALL';
        return checked;
    }

    function togglePtlWtTramDropdown(e) {
        if (e) e.stopPropagation();
        let menu = document.getElementById('ptl-wt-tram-dropdown-menu');
        if (!menu) return;
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function togglePtlWtTramSelectAll(masterCb) {
        let isChecked = masterCb.checked;
        document.querySelectorAll('.ptl-wt-tram-cb').forEach(cb => cb.checked = isChecked);
        updatePtlWtTramDropdownLabel();
    }

    function updatePtlWtTramDropdownLabel() {
        let cbs = document.querySelectorAll('.ptl-wt-tram-cb');
        let checked = Array.from(cbs).filter(cb => cb.checked);
        let textSpan = document.getElementById('ptl-wt-tram-dropdown-text');
        let badge = document.getElementById('ptl-wt-tram-count-badge');
        let masterCb = document.getElementById('ptl-wt-tram-check-all');

        if (masterCb) masterCb.checked = (cbs.length > 0 && checked.length === cbs.length);

        if (checked.length === cbs.length || cbs.length === 0) {
            if (textSpan) textSpan.innerText = '-- Tất cả --';
            if (badge) badge.innerText = 'All';
        } else if (checked.length === 0) {
            if (textSpan) textSpan.innerText = 'Chưa chọn Trạm';
            if (badge) badge.innerText = '0';
        } else if (checked.length === 1) {
            if (textSpan) textSpan.innerText = checked[0].value;
            if (badge) badge.innerText = '1';
        } else {
            if (textSpan) textSpan.innerText = `Đã chọn (${checked.length})`;
            if (badge) badge.innerText = checked.length;
        }
    }

    function getSelectedPtlWtTrams() {
        let cbs = document.querySelectorAll('.ptl-wt-tram-cb');
        let checked = Array.from(cbs).filter(cb => cb.checked).map(cb => cb.value);
        if (checked.length === cbs.length) return 'ALL';
        return checked;
    }

    function togglePtlWtSortOrder() {
        window.G_PTL_WT_SORT_DESC = !window.G_PTL_WT_SORT_DESC;
        let btn = document.getElementById('ptl-wt-btn-sort');
        if (btn) {
            if (window.G_PTL_WT_SORT_DESC) {
                btn.innerHTML = '⬇️ Sắp Xếp';
                btn.style.background = '#f59e0b';
            } else {
                btn.innerHTML = '⬆️ Mặc Định';
                btn.style.background = '#64748b';
            }
        }
        executePtlWtSearch();
    }

    function loadPtlWtDataAndInit(forceReload = false, callback = null) {
        if (!forceReload && window.G_WtData && window.G_WtData.length > 1) {
            initPtlWtFiltersAndRender();
            if (typeof callback === 'function') callback();
        } else if (typeof google !== 'undefined' && google.script && google.script.run) {
            let runner = google.script.run.withSuccessHandler(res => {
                if (res && res.success && res.data) {
                    window.G_WtData = res.data;
                } else if (res && Array.isArray(res)) {
                    window.G_WtData = res;
                } else {
                    window.G_WtData = [];
                }
                initPtlWtFiltersAndRender();
                if (typeof callback === 'function') callback();
            }).withFailureHandler(err => {
                showToast("Lỗi tải dữ liệu Sheet WT: " + err, "error");
                initPtlWtFiltersAndRender();
                if (typeof callback === 'function') callback();
            });

            if (typeof google.script.run.getSheetData === 'function') {
                runner.getSheetData('LỖI WT');
            } else if (typeof google.script.run.getLoiWtData === 'function') {
                runner.getLoiWtData();
            } else if (typeof google.script.run.getWtData === 'function') {
                runner.getWtData();
            } else {
                runner.getLoiWTData(); // force it to try calling this to cause a natural error if none exist
            }
        } else {
            window.G_WtData = window.G_WtData || [];
            initPtlWtFiltersAndRender();
            if (typeof callback === 'function') callback();
        }
    }

    function initPtlWtFiltersAndRender() {
        let rawData = window.G_WtData || [];
        let fromInp = document.getElementById('ptl-wt-filter-from-date');
        let toInp = document.getElementById('ptl-wt-filter-to-date');

        if (!fromInp || !toInp) return;

        let colIdx = getPtlWtColIndexes(rawData[0]);
        let stationsSet = new Set();
        let tramSet = new Set();
        let minIso = '', maxIso = '';

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let d = (row[colIdx.date] || '').trim();
            let st = (row[colIdx.line] || '').trim();
            let tr = (row[colIdx.histStation] || '').trim();
            if (st) stationsSet.add(st);
            if (tr) tramSet.add(tr);

            let iso = ptlDateToIsoStr(d);
            if (iso) {
                if (!minIso || iso < minIso) minIso = iso;
                if (!maxIso || iso > maxIso) maxIso = iso;
            }
        }

        // Populate Line (Cột H) Checkboxes WT
        let stationsArr = Array.from(stationsSet).sort();
        let lineListContainer = document.getElementById('ptl-wt-line-checkbox-list');
        if (lineListContainer) {
            let currentlySelectedLine = getSelectedPtlWtLines();
            let htmlLine = '';
            stationsArr.forEach(st => {
                let isChecked = (currentlySelectedLine === 'ALL' || (Array.isArray(currentlySelectedLine) && currentlySelectedLine.includes(st)));
                htmlLine += `
                    <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:#1e293b; cursor:pointer; padding:3px 6px; border-radius:4px;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'">
                        <input type="checkbox" class="ptl-wt-line-cb" value="${st}" ${isChecked ? 'checked' : ''} onchange="updatePtlWtLineDropdownLabel()" style="accent-color:#2563eb; cursor:pointer;" />
                        <span>${st}</span>
                    </label>
                `;
            });
            lineListContainer.innerHTML = htmlLine;
            updatePtlWtLineDropdownLabel();
        }

        // Populate Trạm (Cột G) Checkboxes WT
        let tramArr = Array.from(tramSet).sort();
        let tramListContainer = document.getElementById('ptl-wt-tram-checkbox-list');
        if (tramListContainer) {
            let currentlySelected = getSelectedPtlWtTrams();
            let html = '';
            tramArr.forEach(tr => {
                let isChecked = (currentlySelected === 'ALL' || (Array.isArray(currentlySelected) && currentlySelected.includes(tr)));
                html += `
                    <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:#1e293b; cursor:pointer; padding:3px 6px; border-radius:4px;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'">
                        <input type="checkbox" class="ptl-wt-tram-cb" value="${tr}" ${isChecked ? 'checked' : ''} onchange="updatePtlWtTramDropdownLabel()" style="accent-color:#2563eb; cursor:pointer;" />
                        <span>${tr}</span>
                    </label>
                `;
            });
            tramListContainer.innerHTML = html;
            updatePtlWtTramDropdownLabel();
        }

        let todayIso = new Date().toISOString().slice(0, 10);
        let defaultFrom = minIso || todayIso;
        let defaultTo = maxIso || todayIso;

        if (fromInp && !fromInp.value) fromInp.value = defaultFrom;
        if (toInp && !toInp.value) toInp.value = defaultTo;
    }

    function executePtlWtSearch(skipReload = false) {
        let wrapper = document.getElementById('ptl-wt-table-wrapper');
        let searchBtn = document.getElementById('ptl-wt-btn-search-el');

        if (!skipReload) {
            if (wrapper) {
                wrapper.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px; color:#2563eb; font-weight:800; font-size:15px; gap:12px;">
                        <div class="ptl-spinner" style="width:40px; height:40px; border:4px solid #e2e8f0; border-top:4px solid #2563eb; border-radius:50%; animation:ptlSpin 0.8s linear infinite;"></div>

                    </div>

            }
            if (searchBtn) {
                searchBtn.disabled = true;
                searchBtn.innerHTML = `<span class="ptl-spinner" style="display:inline-block; width:14px; height:14px; border:2px solid #ffffff; border-top:2px solid transparent; border-radius:50%; animation:ptlSpin 0.8s linear infinite; margin-right:6px; vertical-align:middle;"></span> Đang tìm...`;
            }

            loadPtlWtDataAndInit(true, function () {
                executePtlWtSearch(true);
            });
            return;
        }

        if (searchBtn) {
            searchBtn.disabled = false;
            searchBtn.innerHTML = `🔍 Tìm Kiếm`;

        if (rawData.length <= 1) {
            wrapper.innerHTML = `<div style="text-align:center; padding:30px; color:#ef4444; font-weight:800; font-size:15px;">Chưa tìm thấy dữ liệu trong sheet WT!</div>`;
            return;
        }

        let colIdx = getPtlWtColIndexes(rawData[0]);
        let fromIso = (document.getElementById('ptl-wt-filter-from-date') || {}).value || '';
        let toIso = (document.getElementById('ptl-wt-filter-to-date') || {}).value || '';
        let selectedLines = getSelectedPtlWtLines();
        let selectedTrams = getSelectedPtlWtTrams();
        let selectedShift = (document.getElementById('ptl-wt-filter-shift') || {}).value || 'ALL';

        let filteredRows = [];
        let stationColsSet = new Set();

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let dateVal = (row[colIdx.date] || '').trim();
            let stationVal = (row[colIdx.line] || '').trim(); // Cột H (History Line)
            let tramVal = (row[colIdx.histStation] || '').trim(); // Cột G (History CTQ Station)
            let shiftVal = (row[colIdx.shift] || '').trim(); // Cột J (History Shift)
            let rowIso = ptlDateToIsoStr(dateVal);

            // Bỏ qua dòng trống không có ngày (Date)
            if (!dateVal || !rowIso) continue;

            if (fromIso && rowIso < fromIso) continue;
            if (toIso && rowIso > toIso) continue;
            if (selectedLines !== 'ALL' && Array.isArray(selectedLines) && !selectedLines.includes(stationVal)) continue;
            if (selectedTrams !== 'ALL' && Array.isArray(selectedTrams) && !selectedTrams.includes(tramVal)) continue;
            if (selectedShift !== 'ALL' && shiftVal.toLowerCase() !== selectedShift.toLowerCase()) continue;

            filteredRows.push(row);
            if (stationVal) stationColsSet.add(stationVal);
        }

        let activeStations = Array.from(stationColsSet).sort();
        if (activeStations.length === 0) activeStations = ['102A-I1', '102A-I2', '102A-I3'];

        let grouped = {};
        filteredRows.forEach(row => {
            let op = (row[colIdx.op] || '').trim();
            let name = (row[colIdx.name] || '').trim();
            let ctq = (row[colIdx.ctq] || '').trim();
            let histStation = (row[colIdx.histStation] || '').trim();
            let rootcause = (row[colIdx.defect] || row[colIdx.rootcause] || '').trim();
            let line = (row[colIdx.line] || '').trim();
            let shift = (row[colIdx.shift] || '').trim();

            if (!op) op = '#NA';
            let groupKey = `${op}|||${name}|||${ctq}|||${histStation}|||${rootcause}`;
            if (!grouped[groupKey]) {
                grouped[groupKey] = { op, name, ctq, histStation, rootcause, counts: {}, total: 0 };
            }

            let cellKey = `${line}_${shift}`;
            grouped[groupKey].counts[cellKey] = (grouped[groupKey].counts[cellKey] || 0) + 1;
            grouped[groupKey].total += 1;

        let formatDateLabel = (iso) => {

                        <td style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:6px; font-weight:900; font-size:${totalFontSize}px; background:${totalBg}; color:${totalTextColor};">${dayTot > 0 ? dayTot : ''}</td>
                        <td style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:6px; font-weight:900; font-size:${totalFontSize}px; background:${totalBg}; color:${totalTextColor};">${nightTot > 0 ? nightTot : ''}</td>
                    `;
        }).join('')}
                <td style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:6px; background:${totalBg}; color:${totalTextColor === '#ffffff' ? '#ffeb3b' : totalTextColor}; font-size:${Number(totalFontSize) + 2}px; font-weight:900;">${grandTotal}</td>
            </tr>
        `;

        if (totalPos === 'top') {
            html += `
                </tbody>
                <tbody>
                    ${totalRowHtml}
                    ${rowsHtml}
                </tbody>
                </table>
            `;
        } else {
            html += `
                </tbody>
                <tbody>
                    ${rowsHtml}
                </tbody>
                <tfoot>
                    ${totalRowHtml}
                </tfoot>
                </table>
            `;
        }

        wrapper.innerHTML = html;
    }

    function initPtlFiltersAndRender() {
        let rawData = window.G_LoiThang7Data || [];
        let fromInp = document.getElementById('ptl-filter-from-date');
        let toInp = document.getElementById('ptl-filter-to-date');

        if (!fromInp || !toInp) return;

        let colIdx = getPtlColIndexes(rawData[0]);
        let stationsSet = new Set();
        let tramSet = new Set();
        let minIso = '', maxIso = '';

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let d = (row[colIdx.date] || '').trim();
            let st = (row[colIdx.line] || '').trim();
            let tr = (row[colIdx.histStation] || '').trim();
            if (st) stationsSet.add(st);
            if (tr) tramSet.add(tr);

            let iso = ptlDateToIsoStr(d);
            if (iso) {
                if (!minIso || iso < minIso) minIso = iso;
                if (!maxIso || iso > maxIso) maxIso = iso;
            }
        }

        // Populate Line (Cột H) Checkboxes
        let stationsArr = Array.from(stationsSet).sort();
        let lineListContainer = document.getElementById('ptl-line-checkbox-list');
        if (lineListContainer) {
            let currentlySelectedLine = getSelectedPtlLines();
            let htmlLine = '';
            stationsArr.forEach(st => {
                let isChecked = (currentlySelectedLine === 'ALL' || (Array.isArray(currentlySelectedLine) && currentlySelectedLine.includes(st)));
                htmlLine += `
                    <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:#1e293b; cursor:pointer; padding:3px 6px; border-radius:4px;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'">
                        <input type="checkbox" class="ptl-line-cb" value="${st}" ${isChecked ? 'checked' : ''} onchange="updatePtlLineDropdownLabel()" style="accent-color:#2563eb; cursor:pointer;" />
                        <span>${st}</span>
                    </label>
                `;
            });
            lineListContainer.innerHTML = htmlLine;
            updatePtlLineDropdownLabel();
        }

        // Populate Trạm (Cột G) Checkboxes
        let tramArr = Array.from(tramSet).sort();
        let tramListContainer = document.getElementById('ptl-tram-checkbox-list');
        if (tramListContainer) {
            let currentlySelected = getSelectedPtlTrams();
            let html = '';
            tramArr.forEach(tr => {
                let isChecked = (currentlySelected === 'ALL' || (Array.isArray(currentlySelected) && currentlySelected.includes(tr)));
                html += `
                    <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:#1e293b; cursor:pointer; padding:3px 6px; border-radius:4px;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='transparent'">
                        <input type="checkbox" class="ptl-tram-cb" value="${tr}" ${isChecked ? 'checked' : ''} onchange="updatePtlTramDropdownLabel()" style="accent-color:#2563eb; cursor:pointer;" />
                        <span>${tr}</span>
                    </label>
                `;
            });
            tramListContainer.innerHTML = html;
            updatePtlTramDropdownLabel();
        }

        // Set default dates for Calendar inputs (chỉ gán nếu chưa chọn)
        let todayIso = new Date().toISOString().slice(0, 10);
        let defaultFrom = minIso || todayIso;
        let defaultTo = maxIso || todayIso;

        if (fromInp && !fromInp.value) fromInp.value = defaultFrom;
        if (toInp && !toInp.value) toInp.value = defaultTo;

        let sumFrom = document.getElementById('ptl-summary-from-date');
        let sumTo = document.getElementById('ptl-summary-to-date');
        if (sumFrom && !sumFrom.value) sumFrom.value = defaultFrom;
        if (sumTo && !sumTo.value) sumTo.value = defaultTo;

        let thangFrom = document.getElementById('ptl-thang-from-date');
        let thangTo = document.getElementById('ptl-thang-to-date');
        if (thangFrom && !thangFrom.value) thangFrom.value = defaultFrom;
        if (thangTo && !thangTo.value) thangTo.value = defaultTo;

        let tongHopFrom = document.getElementById('ptl-tonghop-from-date');
        let tongHopTo = document.getElementById('ptl-tonghop-to-date');
        if (tongHopFrom && !tongHopFrom.value) tongHopFrom.value = defaultFrom;
        if (tongHopTo && !tongHopTo.value) tongHopTo.value = defaultTo;
    }

    function executePtlSearch(skipReload = false) {
        let wrapper = document.getElementById('ptl-table-wrapper');
        let searchBtn = document.getElementById('ptl-btn-search-el');

        if (!skipReload) {
            if (wrapper) {
                wrapper.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px; color:#2563eb; font-weight:800; font-size:15px; gap:12px;">
                        <div class="ptl-spinner" style="width:40px; height:40px; border:4px solid #e2e8f0; border-top:4px solid #2563eb; border-radius:50%; animation:ptlSpin 0.8s linear infinite;"></div>
                        <span>Đang tải và cập nhật dữ liệu từ hệ thống...</span>
                    </div>
                `;
            }
            if (searchBtn) {
                searchBtn.disabled = true;
                searchBtn.innerHTML = `<span class="ptl-spinner" style="display:inline-block; width:14px; height:14px; border:2px solid #ffffff; border-top:2px solid transparent; border-radius:50%; animation:ptlSpin 0.8s linear infinite; margin-right:6px; vertical-align:middle;"></span> Đang tìm...`;
            }

            loadPtlDataAndInit(true, function () {
                executePtlSearch(true);
            });
            return;
        }

        if (searchBtn) {
            searchBtn.disabled = false;
            searchBtn.innerHTML = `🔍 Tìm Kiếm`;
        }

        let rawData = window.G_LoiThang7Data || [];
        if (!wrapper) return;

        if (rawData.length <= 1) {
            wrapper.innerHTML = `<div style="text-align:center; padding:30px; color:#ef4444; font-weight:800; font-size:15px;">Chưa tìm thấy dữ liệu trong sheet LỖI THÁNG 7!</div>`;
            return;
        }

        let colIdx = getPtlColIndexes(rawData[0]);
        let fromIso = (document.getElementById('ptl-filter-from-date') || {}).value || '';
        let toIso = (document.getElementById('ptl-filter-to-date') || {}).value || '';
        let selectedLines = getSelectedPtlLines();
        let selectedTrams = getSelectedPtlTrams();

        let filteredRows = [];
        let stationColsSet = new Set();

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let dateVal = (row[colIdx.date] || '').trim();
            let stationVal = (row[colIdx.line] || '').trim();
            let tramVal = (row[colIdx.histStation] || '').trim();
            let rowIso = ptlDateToIsoStr(dateVal);

            // Bỏ qua dòng trống không có ngày (ví dụ các ô dòng tự nhảy STT từ 120 trở đi)
            if (!dateVal || !rowIso) continue;

            if (fromIso && rowIso < fromIso) continue;
            if (toIso && rowIso > toIso) continue;
            if (selectedLines !== 'ALL' && Array.isArray(selectedLines) && !selectedLines.includes(stationVal)) continue;
            if (selectedTrams !== 'ALL' && Array.isArray(selectedTrams) && !selectedTrams.includes(tramVal)) continue;

            filteredRows.push(row);
            if (stationVal) stationColsSet.add(stationVal);
        }

        let activeStations = Array.from(stationColsSet).sort();
        if (activeStations.length === 0) activeStations = ['102A-I1', '102A-I2', '102A-I3'];

        let grouped = {};
        filteredRows.forEach(row => {
            let op = (row[colIdx.op] || '').trim();
            let name = (row[colIdx.name] || '').trim();
            let ctq = (row[colIdx.ctq] || '').trim();
            let histStation = (row[colIdx.histStation] || '').trim();
            let rootcause = (row[colIdx.defect] || row[colIdx.rootcause] || '').trim();
            let line = (row[colIdx.line] || '').trim();
            let shift = (row[colIdx.shift] || '').trim();

            if (!op) op = '#NA';
            let groupKey = `${op}|||${name}|||${ctq}|||${histStation}|||${rootcause}`;
            if (!grouped[groupKey]) {
                grouped[groupKey] = { op, name, ctq, histStation, rootcause, counts: {}, total: 0 };
            }

            let cellKey = `${line}_${shift}`;
            grouped[groupKey].counts[cellKey] = (grouped[groupKey].counts[cellKey] || 0) + 1;
            grouped[groupKey].total += 1;
        });

        // Date Display Format
        let formatDateLabel = (iso) => {
            if (!iso) return '';

            if (p.length === 3) return `${parseInt(p[1])}/${parseInt(p[2])}`;
            return iso;
        };
        let dateRangeLabel = fromIso === toIso ? formatDateLabel(fromIso) : `${formatDateLabel(fromIso)} ~ ${formatDateLabel(toIso)}`;

        // Hidden Columns check

        let txtMathe = { vn: 'MÃ THẺ', cn: '工号', en: 'EMP ID' }[lang] || 'MÃ THẺ';
        let txtHoten = { vn: 'HỌ TÊN', cn: '姓名', en: 'FULL NAME' }[lang] || 'HỌ TÊN';
        let txtGiaovien = { vn: 'GIÁO VIÊN', cn: '指导员', en: 'TRAINER' }[lang] || 'GIÁO VIÊN';
        let txtTentram = { vn: 'TÊN TRẠM', cn: '工站名称', en: 'STATION NAME' }[lang] || 'TÊN TRẠM';
        let txtTenloi = { vn: 'TÊN LỖI', cn: '不良名称', en: 'DEFECT NAME' }[lang] || 'TÊN LỖI';
        let txtDay = { vn: 'Day', cn: '白班', en: 'Day' }[lang] || 'Day';
        let txtNight = { vn: 'Night', cn: '夜班', en: 'Night' }[lang] || 'Night';

        let titleColSpan1 = Math.max(1, fixedColsCount - 1);
        let titleColSpan2 = fixedColsCount > 1 ? 1 : 0;

        let html = `

                <thead>

                    <tr style="background:#0f5132; color:#ffffff; font-weight:900; font-size:16px; text-align:center; height:38px;">

                        </th>` : ''}
                        ${titleColSpan2 > 0 ? `<th colspan="${titleColSpan2}" style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:6px 10px; text-align:center; vertical-align:middle; background:#0f5132; color:#ffffff;">
                            <div style="font-size:15px; font-weight:900; color:#ffffff; text-align:center;">${dateRangeLabel}</div>
                        </th>` : ''}
                        ${activeStations.map(st => `

                                <div style="font-size:14px; font-weight:900; color:#ffffff; text-align:center;">${st}</div>
                            </th>

                        <th style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:6px 4px; text-align:center; vertical-align:middle; min-width:70px; background:#0f5132 !important; color:#ffffff !important; font-weight:900; font-size:14px; height:38px;">
                            <div style="font-size:14px; font-weight:900; color:#ffffff !important; text-align:center; line-height:1; margin:0; padding:0;">TOTAL</div>
                        </th>
                    </tr>

                    <!-- ROW 2: COLUMN HEADERS -->
                    <tr style="background:#0f5132; color:#ffffff; font-weight:900; font-size:14px; text-align:center; height:36px;">
                        ${!hiddenCols.has('op') ? `<th style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:8px; text-align:center; vertical-align:middle; min-width:85px; background:#0f5132; color:#ffffff;"><div style="font-size:14px; font-weight:900; color:#ffffff; text-align:center;">${txtMathe}</div></th>` : ''}
                        ${!hiddenCols.has('name') ? `<th style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:8px; text-align:center; vertical-align:middle; min-width:120px; background:#0f5132; color:#ffffff;"><div style="font-size:14px; font-weight:900; color:#ffffff; text-align:center;">${txtHoten}</div></th>` : ''}
                        ${!hiddenCols.has('ctq') ? `<th style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:8px; text-align:center; vertical-align:middle; min-width:170px; background:#0f5132; color:#ffffff;"><div style="font-size:14px; font-weight:900; color:#ffffff; text-align:center;">${txtGiaovien}</div></th>` : ''}
                        ${!hiddenCols.has('histStation') ? `<th style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:8px; text-align:center; vertical-align:middle; min-width:150px; max-width:180px; background:#0f5132; color:#ffffff;"><div style="font-size:14px; font-weight:900; color:#ffffff; text-align:center;">${txtTentram}</div></th>` : ''}
                        ${!hiddenCols.has('rootcause') ? `<th style="border:none; border-bottom:1px solid #333 !important; border-right:1px solid #333 !important; padding:8px; text-align:center; vertical-align:middle; min-width:210px; background:#0f5132; color:#ffffff;"><div style="font-size:14px; font-weight:900; color:#ffffff; text-align:center;">${txtTenloi}</div></th>` : ''}
                        ${activeStations.map(() => `

                    </tr>
                </thead>
                <tbody>

        let colTotals = {};

        let rowKeys = Object.keys(grouped);

                </tbody>

    function getPtlPaintMode() {
        let radio = document.querySelector('input[name="ptl-paint-mode"]:checked');
        return radio ? radio.value : 'row';

    function applyPtlPaint(targetEl, type) {
        if (!window.G_PTL_PAINT_ACTIVE) return;
        let color = getPtlSelectedColor();
        let mode = getPtlPaintMode();

        if (mode === 'row') {
            let row = targetEl.closest('tr');
            if (row) {
                let rowKey = row.getAttribute('data-row-key');
                row.style.background = color;
                if (rowKey) window.G_PTL_CUSTOM_COLORS[rowKey] = color;
            }
        } else if (mode === 'cell') {
            let cell = targetEl.tagName === 'TD' ? targetEl : targetEl.closest('td');
            if (cell) {
                let cellKey = cell.getAttribute('data-cell-key');
                cell.style.background = color;
                if (cellKey) window.G_PTL_CUSTOM_CELL_COLORS[cellKey] = color;
            }
        }
    }

    function handlePtlPaintStart(e, targetEl, type) {
        if (!window.G_PTL_PAINT_ACTIVE) return;
        window.G_PTL_IS_MOUSE_DOWN = true;
        applyPtlPaint(targetEl, type);
    }
    window.handlePtlPaintStart = handlePtlPaintStart;

    function handlePtlPaintEnter(e, targetEl, type) {
        if (!window.G_PTL_PAINT_ACTIVE || !window.G_PTL_IS_MOUSE_DOWN) return;
        applyPtlPaint(targetEl, type);
    }

    function copyPtlTableImage(tableId = 'ptl-main-table') {
        let table = document.getElementById(tableId);
        if (!table) return showToast("Không tìm thấy bảng để copy!", "warning");
        if (typeof html2canvas !== 'function') return showToast("Thư viện html2canvas chưa sẵn sàng!", "warning");

        showToast("📸 Đang chụp và copy ảnh bảng...", "info");
        html2canvas(table, {
            scale: 2,
            useCORS: true,
            logging: false,
            backgroundColor: '#ffffff',
            onclone: function (clonedDoc) {
                let clonedTbl = clonedDoc.getElementById(tableId);
                if (clonedTbl) {
                    clonedTbl.style.borderCollapse = 'separate';
                    clonedTbl.style.borderSpacing = '0';
                    clonedTbl.style.borderTop = '1px solid #333';
                    clonedTbl.style.borderLeft = '1px solid #333';
                    clonedTbl.querySelectorAll('th, td').forEach(el => {
                        el.style.border = 'none';
                        el.style.borderBottom = '1px solid #333';
                        el.style.borderRight = '1px solid #333';
                        el.style.boxSizing = 'border-box';
                    });
                }
            }
        }).then(canvas => {
            canvas.toBlob(async (blob) => {
                if (!blob) return showToast("Không thể tạo dữ liệu ảnh!", "error");
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast("📋 Đã copy toàn bộ ảnh bảng Phân Tích Lỗi vào Bộ nhớ tạm! Nhấn Ctrl+V để dán.", "success");
                    } else {
                        throw new Error("Trình duyệt không hỗ trợ ClipboardItem");
                    }
                } catch (err) {
                    console.error(err);
                    let link = document.createElement('a');
                    link.download = `Phan_Tich_Loi_${new Date().toISOString().slice(0, 10)}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("📋 Đã tải ảnh xuống máy do trình duyệt chặn copy tự động.", "info");
                }
            }, 'image/png');
        }).catch(err => {
            showToast("Lỗi khi chụp ảnh: " + err, "error");
        });
    }
    window.copyPtlTableImage = copyPtlTableImage;

        let html = tbl.outerHTML;

    function executePtlSummarySearch() {
        let rawData = window.G_LoiThang7Data || [];
        let wrapper = document.getElementById('ptl-summary-wrapper');
        if (!wrapper) return;

        if (rawData.length <= 1) {
            wrapper.innerHTML = `<div style="text-align:center; padding:30px; color:#ef4444; font-weight:800; font-size:15px;">Chưa tìm thấy dữ liệu trong sheet LỖI THÁNG 7!</div>`;
            return;
        }

        let colIdx = getPtlColIndexes(rawData[0]);
        window.G_PTL_LAST_COL_IDX = colIdx;

        let fromIso = (document.getElementById('ptl-summary-from-date') || {}).value || '';
        let toIso = (document.getElementById('ptl-summary-to-date') || {}).value || '';

        // Filter rows
        let filteredRows = [];
        let lineStats = {};
        let opStats = {};
        let grandTotal = 0;

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let dateVal = (row[colIdx.date] || '').trim();
            let lineVal = (row[colIdx.line] || '').trim();
            let shiftVal = (row[colIdx.shift] || '').trim();
            let opVal = (row[colIdx.op] || '').trim() || '#NA';
            let nameVal = (row[colIdx.name] || '').trim() || '#NA';
            let ctqVal = (row[colIdx.ctq] || '').trim();
            let defectVal = (row[colIdx.defect] || row[colIdx.rootcause] || '').trim();

            let rowIso = ptlDateToIsoStr(dateVal);

            // Bỏ qua các dòng trống không có Ngày hợp lệ (tránh tính các dòng chứa công thức tự động nhảy STT nhưng trắng tinh)
            if (!dateVal || !rowIso) continue;

            if (fromIso && rowIso && rowIso < fromIso) continue;
            if (toIso && rowIso && rowIso > toIso) continue;
            if (!lineVal) lineVal = 'Chưa xác định';

            filteredRows.push(row);
            grandTotal++;

            // Line stats
            if (!lineStats[lineVal]) {
                lineStats[lineVal] = { line: lineVal, total: 0, day: 0, night: 0, defects: {} };
            }
            lineStats[lineVal].total++;
            let isDay = shiftVal.toLowerCase().includes('day') || shiftVal.toLowerCase().includes('ngày');
            if (isDay) lineStats[lineVal].day++;
            else lineStats[lineVal].night++;
            if (defectVal) {
                lineStats[lineVal].defects[defectVal] = (lineStats[lineVal].defects[defectVal] || 0) + 1;
            }

            // OP stats (Mã thẻ + Họ tên)
            let opKey = `${opVal}|||${nameVal}|||${ctqVal}`;
            if (!opStats[opKey]) {
                opStats[opKey] = { op: opVal, name: nameVal, ctq: ctqVal, total: 0, day: 0, night: 0, defects: {} };
            }
            opStats[opKey].total++;
            if (isDay) opStats[opKey].day++;
            else opStats[opKey].night++;

    function copyPtlSummaryCardImage() {
        let sumCard = document.getElementById('ptl-summary-card');
        if (!sumCard) return showToast("Không tìm thấy bảng Summary để copy!", "warning");
        if (typeof html2canvas !== 'function') return showToast("Thư viện html2canvas chưa sẵn sàng!", "warning");

        showToast("📸 Đang chụp và copy ảnh Báo cáo Summary...", "info");
        html2canvas(sumCard, {
            scale: 2,
            useCORS: true,
            logging: false,
            backgroundColor: '#ffffff'
        }).then(canvas => {
            canvas.toBlob(async (blob) => {
                if (!blob) return showToast("Không thể tạo dữ liệu ảnh!", "error");
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast("📋 Đã copy toàn bộ ảnh Summary Line vào Bộ nhớ tạm! Nhấn Ctrl+V để dán.", "success");
                    } else {
                        throw new Error("Trình duyệt không hỗ trợ ClipboardItem");
                    }
                } catch (err) {
                    console.error(err);
                    let link = document.createElement('a');
                    link.download = `Summary_Line_Report_${new Date().toISOString().slice(0, 10)}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("📋 Đã tải ảnh xuống máy do trình duyệt chặn copy tự động.", "info");
                }
            }, 'image/png');
        }).catch(err => {
            showToast("Lỗi khi chụp ảnh: " + err, "error");
        });
    }
    window.copyPtlSummaryCardImage = copyPtlSummaryCardImage;

    function executePtlThangSearch() {
        let rawData = window.G_LoiThang7Data || [];
        let wrapper = document.getElementById('ptl-thang-wrapper');
        if (!wrapper) return;

        if (rawData.length <= 1) {
            wrapper.innerHTML = `<div style="text-align:center; padding:30px; color:#ef4444; font-weight:800; font-size:15px;">Chưa tìm thấy dữ liệu trong sheet LỖI THÁNG 7!</div>`;
            return;
        }

        let colIdx = getPtlColIndexes(rawData[0]);
        window.G_PTL_LAST_COL_IDX = colIdx;

        let fromIso = (document.getElementById('ptl-thang-from-date') || {}).value || '';
        let toIso = (document.getElementById('ptl-thang-to-date') || {}).value || '';
        let shiftFilter = (document.getElementById('ptl-thang-shift') || {}).value || 'ALL';

        let filteredRows = [];
        let teacherStats = {};
        let lineStats = {};
        let opStats = {};
        let dailyTrend = {};
        let grandTotal = 0;

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let dateVal = (row[colIdx.date] || '').trim();
            let lineVal = (row[colIdx.line] || '').trim() || 'Chưa xác định';
            let shiftVal = (row[colIdx.shift] || '').trim() || 'Day';
            let opVal = (row[colIdx.op] || '').trim() || '#NA';
            let nameVal = (row[colIdx.name] || '').trim() || '#NA';
            let ctqVal = (row[colIdx.ctq] || '').trim() || 'Chưa xác định';
            let defectVal = (row[colIdx.defect] || row[colIdx.rootcause] || '').trim();

            let iso = ptlDateToIsoStr(dateVal);
            if (!iso) continue;
            if (fromIso && iso < fromIso) continue;
            if (toIso && iso > toIso) continue;

            let isDay = shiftVal.toLowerCase().includes('day') || shiftVal.toLowerCase().includes('ngày');
            let isNight = !isDay;

            if (shiftFilter === 'Day' && !isDay) continue;
            if (shiftFilter === 'Night' && !isNight) continue;

            filteredRows.push(row);
            grandTotal++;

            // 1. Teacher stats (Cột M = CTQ/Giáo viên)
            if (!teacherStats[ctqVal]) {
                teacherStats[ctqVal] = { teacher: ctqVal, total: 0, defects: {} };
            }
            teacherStats[ctqVal].total++;
            if (defectVal) {
                teacherStats[ctqVal].defects[defectVal] = (teacherStats[ctqVal].defects[defectVal] || 0) + 1;
            }

            // 2. Line stats
            if (!lineStats[lineVal]) {
                lineStats[lineVal] = { line: lineVal, total: 0, day: 0, night: 0, defects: {} };
            }
            lineStats[lineVal].total++;
            if (isDay) lineStats[lineVal].day++;
            else lineStats[lineVal].night++;
            if (defectVal) {
                lineStats[lineVal].defects[defectVal] = (lineStats[lineVal].defects[defectVal] || 0) + 1;
            }

            // 3. Operator stats

            if (!opStats[opKey]) {

            }
            opStats[opKey].total++;
            if (isDay) opStats[opKey].day++;
            else opStats[opKey].night++;
            if (defectVal) {

            cn: '📈 白班 (🔵) 与夜班 (🔴) 不良趋势折线图',

    function generateTrendChartSVG(rawData, getIdxFunc, title, fromIso, toIso, shiftFilter, lang, chartId) {
        if (!rawData || rawData.length <= 1) return '';

        let colIdx = getIdxFunc(rawData[0]);
        let filteredRows = [];
        let dailyTrend = {};
        let grandTotal = 0;

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let dateVal = (row[colIdx.date] || '').trim();
            let shiftVal = (row[colIdx.shift] || '').trim() || 'Day';

            let iso = ptlDateToIsoStr(dateVal);
            if (!iso) continue;
            if (fromIso && iso < fromIso) continue;
            if (toIso && iso > toIso) continue;

            let isDay = shiftVal.toLowerCase().includes('day') || shiftVal.toLowerCase().includes('ngày');
            let isNight = !isDay;

            if (shiftFilter === 'Day' && !isDay) continue;
            if (shiftFilter === 'Night' && !isNight) continue;

            filteredRows.push(row);
            grandTotal++;

            if (!dailyTrend[iso]) {
                dailyTrend[iso] = { day: 0, night: 0, total: 0 };
            }
            dailyTrend[iso].total++;
            if (isDay) dailyTrend[iso].day++;
            else dailyTrend[iso].night++;
        }

        if (filteredRows.length === 0) return '';

        let trendDates = Object.keys(dailyTrend).sort();

        let txtDateRange = { vn: '📅 Khoảng thời gian:', cn: '📅 时间范围:', en: '📅 Date Range:' }[lang] || '📅 Khoảng thời gian:';
        let txtTotalDefectsLabel = { vn: '📊 Tổng phát sinh:', cn: '📊 不良总数:', en: '📊 Total Defects:' }[lang] || '📊 Tổng phát sinh:';
        let txtDefectUnit = { vn: 'lỗi', cn: '个不良', en: 'defects' }[lang] || 'lỗi';
        let txtAllDates = { vn: 'Tất cả ngày', cn: '所有日期', en: 'All dates' }[lang] || 'Tất cả ngày';

        let txtCaDayHeader = { vn: '🔵 CA DAY:', cn: '🔵 白班:', en: '🔵 DAY SHIFT:' }[lang] || '🔵 CA DAY:';
        let txtCaNightHeader = { vn: '🔴 CA NIGHT:', cn: '🔴 夜班:', en: '🔴 NIGHT SHIFT:' }[lang] || '🔴 CA NIGHT:';

        let txtSumDayPrefix = { vn: 'TỔNG CA DAY', cn: '白班总计', en: 'DAY TOTAL' }[lang] || 'TỔNG CA DAY';
        let txtSumNightPrefix = { vn: 'TỔNG CA NIGHT', cn: '夜班总计', en: 'NIGHT TOTAL' }[lang] || 'TỔNG CA NIGHT';

        let txtBtnCopyImg = { vn: '📋 Copy Ảnh', cn: '📋 复制图片', en: '📋 Copy Image' }[lang] || '📋 Copy Ảnh';
        let txtBtnHide = { vn: '🔼 Ẩn', cn: '🔼 隐藏', en: '🔼 Hide' }[lang] || '🔼 Ẩn';

        let maxVal = 0, totalDayDefects = 0, totalNightDefects = 0;
        trendDates.forEach(d => {
            let dVal = dailyTrend[d].day;
            let nVal = dailyTrend[d].night;
            totalDayDefects += dVal;
            totalNightDefects += nVal;
            if (dVal > maxVal) maxVal = dVal;
            if (nVal > maxVal) maxVal = nVal;
        });
        if (maxVal === 0) maxVal = 5;
        let chartMaxY = Math.ceil(maxVal * 1.25);

        let chartWidth = 1200;
        let chartHeight = 320;
        let padL = 60, padR = 195, padT = 55, padB = 60;
        let drawW = chartWidth - padL - padR;
        let drawH = chartHeight - padT - padB;

        let dayPoints = [], nightPoints = [];
        trendDates.forEach((d, idx) => {
            let x = trendDates.length === 1 ? padL + drawW / 2 : padL + (idx / (trendDates.length - 1)) * drawW;
            let yDay = padT + drawH - (dailyTrend[d].day / chartMaxY) * drawH;
            let yNight = padT + drawH - (dailyTrend[d].night / chartMaxY) * drawH;
            dayPoints.push({ x, y: yDay, val: dailyTrend[d].day, date: d });
            nightPoints.push({ x, y: yNight, val: dailyTrend[d].night, date: d });
        });

        // HÀM TẠO ĐƯỜNG UỐN CONG (BEZIER)
        let getCurvyPath = (pts) => {
            if (pts.length === 0) return '';
            if (pts.length === 1) return `M ${pts[0].x} ${pts[0].y}`;
            let d = `M ${pts[0].x} ${pts[0].y}`;
            for (let i = 1; i < pts.length; i++) {
                let pPrev = pts[i - 1];
                let p = pts[i];
                let ctrlX = pPrev.x + (p.x - pPrev.x) / 2;
                d += ` C ${ctrlX} ${pPrev.y}, ${ctrlX} ${p.y}, ${p.x} ${p.y}`;
            }
            return d;
        };

        let dayPathD = getCurvyPath(dayPoints);
        let nightPathD = getCurvyPath(nightPoints);

        let dayPct = grandTotal > 0 ? ((totalDayDefects / grandTotal) * 100).toFixed(1) : '0';
        let nightPct = grandTotal > 0 ? ((totalNightDefects / grandTotal) * 100).toFixed(1) : '0';
        let dateRangeText = (fromIso && toIso) ? `${fromIso} ➔ ${toIso}` : txtAllDates;

        let lastDayP = dayPoints[dayPoints.length - 1];
        let lastNightP = nightPoints[nightPoints.length - 1];
        let lastDayTagY = lastDayP.y;
        let lastNightTagY = lastNightP.y;
        if (Math.abs(lastDayTagY - lastNightTagY) < 32) {
            if (lastDayP.val >= lastNightP.val) {
                lastDayTagY = Math.min(lastDayP.y, lastNightP.y) - 18;
                lastNightTagY = Math.max(lastDayP.y, lastNightP.y) + 18;
            } else {
                lastDayTagY = Math.max(lastDayP.y, lastNightP.y) + 18;
                lastNightTagY = Math.min(lastDayP.y, lastNightP.y) - 18;
            }
        }

        return `
            <div id="${chartId}" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; border-bottom:2px solid #f1f5f9; padding-bottom:12px;">
                    <div>
                        <h3 style="margin:0 0 6px 0; color:#1e3a8a; font-weight:900; font-size:19px; display:flex; align-items:center; gap:8px;">
                            ${title}
                        </h3>
                        <div style="font-size:13px; font-weight:700; color:#64748b;">
                            ${txtDateRange} <span style="color:#0f172a; font-weight:800;">${dateRangeText}</span> | ${txtTotalDefectsLabel} <span style="color:#dc2626; font-weight:900; font-size:15px;">${grandTotal} ${txtDefectUnit}</span>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                        <div style="display:flex; gap:12px; font-size:13px; font-weight:900; background:#f8fafc; padding:6px 12px; border-radius:8px; border:1px solid #e2e8f0;">
                            <span style="color:#1d4ed8;">${txtCaDayHeader} ${totalDayDefects} ${txtDefectUnit} (${dayPct}%)</span>
                            <span style="color:#b91c1c;">${txtCaNightHeader} ${totalNightDefects} ${txtDefectUnit} (${nightPct}%)</span>
                        </div>
                        <button onclick="copyPtlElementImage('${chartId}', '${title}')" style="padding:6px 12px; background:#8b5cf6; color:#fff; border:none; border-radius:6px; font-weight:800; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px;">
                            ${txtBtnCopyImg}
                        </button>
                        <button onclick="togglePtlSection('${chartId}-body', this)" style="padding:6px 12px; background:#64748b; color:#fff; border:none; border-radius:6px; font-weight:800; font-size:13px; cursor:pointer; min-width:65px;">
                            ${txtBtnHide}
                        </button>
                    </div>
                </div>

                <div id="${chartId}-body" style="width:100%; box-sizing:border-box; overflow-x:auto;">
                    <svg viewBox="0 0 ${chartWidth} ${chartHeight}" style="width:100%; height:auto; background:#f8fafc; border-radius:10px; border:1px solid #cbd5e1; display:block; margin:0 auto;">
                        <!-- Grid Background Horizontal Lines -->
                        ${[0, 0.25, 0.5, 0.75, 1].map(r => {
            let y = padT + drawH * (1 - r);
            let val = Math.round(chartMaxY * r);
            return `
                                <line x1="${padL}" y1="${y}" x2="${chartWidth - padR}" y2="${y}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="${r === 0 ? '0' : '4'}" />
                                <text x="${padL - 10}" y="${y + 4}" font-size="12" font-weight="800" fill="#475569" text-anchor="end">${val}</text>
                            `;
        }).join('')}

                        <!-- Vertical Guide Lines per Date -->
                        ${dayPoints.map(p => `
                            <line x1="${p.x}" y1="${padT}" x2="${p.x}" y2="${padT + drawH}" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" />
                        `).join('')}

                        <!-- Day Line (Blue) CURVY -->
                        <path d="${dayPathD}" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                        <!-- Night Line (Red) CURVY -->
                        <path d="${nightPathD}" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

                        <!-- Day Point Nodes & High-Contrast Pill Badges -->
                        ${dayPoints.map((p, idx) => {
            let nP = nightPoints[idx];
            let isTooClose = Math.abs(p.y - nP.y) < 28;
            let badgeY = p.y + 18; // Default Day below
            if (isTooClose) {
                if (p.val >= nP.val) badgeY = p.y - 22; // Day is higher val (smaller Y), goes above
                else badgeY = p.y + 22; // Day is lower val (larger Y), goes below
            }
            return `
                                <circle cx="${p.x}" cy="${p.y}" r="6.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" />
                                <g>
                                    <rect x="${p.x - 18}" y="${badgeY - 14}" width="36" height="20" rx="6" fill="#1d4ed8" />
                                    <text x="${p.x}" y="${badgeY + 1}" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">${p.val}</text>
                                </g>
                            `;
        }).join('')}

                        <!-- Night Point Nodes & High-Contrast Pill Badges -->
                        ${nightPoints.map((p, idx) => {
            let dP = dayPoints[idx];
            let isTooClose = Math.abs(p.y - dP.y) < 28;
            let badgeY = p.y - 18; // Default Night above
            if (isTooClose) {
                if (p.val > dP.val) badgeY = p.y - 22; // Night is higher val (smaller Y), goes above
                else badgeY = p.y + 22; // Night is lower val, goes below
            }
            return `
                                <circle cx="${p.x}" cy="${p.y}" r="6.5" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" />
                                <g>
                                    <rect x="${p.x - 18}" y="${badgeY - 14}" width="36" height="20" rx="6" fill="#b91c1c" />
                                    <text x="${p.x}" y="${badgeY + 1}" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">${p.val}</text>
                                </g>
                            `;
        }).join('')}

                        <!-- END OF LINE CALLOUT BADGES (TỔNG CỘNG LỖI TỪNG CA Ở CUỐI 2 ĐƯỜNG) -->
                        <g>
                            <line x1="${lastDayP.x}" y1="${lastDayP.y}" x2="${lastDayP.x + 22}" y2="${lastDayTagY}" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="3 3" />
                            <rect x="${lastDayP.x + 22}" y="${lastDayTagY - 15}" width="160" height="30" rx="8" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" />
                            <text x="${lastDayP.x + 102}" y="${lastDayTagY + 4}" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
                                🔵 ${txtSumDayPrefix}: ${totalDayDefects} ${txtDefectUnit}
                            </text>
                        </g>

                        <g>
                            <line x1="${lastNightP.x}" y1="${lastNightP.y}" x2="${lastNightP.x + 22}" y2="${lastNightTagY}" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 3" />
                            <rect x="${lastNightP.x + 22}" y="${lastNightTagY - 15}" width="160" height="30" rx="8" fill="#b91c1c" stroke="#ffffff" stroke-width="2" />
                            <text x="${lastNightP.x + 102}" y="${lastNightTagY + 4}" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">
                                🔴 ${txtSumNightPrefix}: ${totalNightDefects} ${txtDefectUnit}
                            </text>
                        </g>

                        <!-- X Axis Date Badges -->
                        ${trendDates.map((d, idx) => {
            let p = dayPoints[idx];
            let parts = d.split('-');
            let label = parts.length === 3 ? `${parts[2]}/${parts[1]}` : d;
            return `
                                <g>
                                    <rect x="${p.x - 25}" y="${padT + drawH + 12}" width="50" height="24" rx="6" fill="#0f172a" />
                                    <text x="${p.x}" y="${padT + drawH + 28}" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">${label}</text>
                                </g>
                            `;
        }).join('')}
                    </svg>
                </div>
            </div>`;
    }

        html2canvas(card, {
            scale: 2,
            useCORS: true,

            backgroundColor: '#ffffff'

    function executePtlThongKeWtSearch() {
        let rawData = window.G_WtData || [];
        let wrapper = document.getElementById('ptl-thongkewt-wrapper');
        if (!wrapper) return;

        if (rawData.length <= 1) {
            wrapper.innerHTML = `<div style="text-align:center; padding:30px; color:#ef4444; font-weight:800; font-size:15px;">Chưa tìm thấy dữ liệu trong sheet LỖI WT!</div>`;
            return;
        }

        let colIdx = getPtlWtColIndexes(rawData[0]);
        let fromIso = (document.getElementById('ptl-thongkewt-from-date') || {}).value || '';
        let toIso = (document.getElementById('ptl-thongkewt-to-date') || {}).value || '';
        let shiftFilter = (document.getElementById('ptl-thongkewt-shift') || {}).value || 'ALL';

        let linesMap = {};
        let opMap = {};
        let dailyTrend = {};
        let grandTotal = 0;
        let totalDay = 0;
        let totalNight = 0;

        for (let i = 1; i < rawData.length; i++) {
            let row = rawData[i];
            let dateVal = (row[colIdx.date] || '').trim();
            let shiftVal = (row[colIdx.shift] || '').trim() || 'Day';
            let lineVal = (row[colIdx.line] || '').trim().toUpperCase();
            let opVal = (row[colIdx.op] || '').trim();
            let nameVal = (row[colIdx.name] || '').trim();
            let defectVal = (row[colIdx.defect] || '').trim();

            let iso = ptlDateToIsoStr(dateVal);
            if (!iso) continue;
            if (fromIso && iso < fromIso) continue;
            if (toIso && iso > toIso) continue;

            let isDay = shiftVal.toLowerCase().includes('day') || shiftVal.toLowerCase().includes('ngày');
            let isNight = !isDay;

            if (shiftFilter === 'Day' && !isDay) continue;
            if (shiftFilter === 'Night' && !isNight) continue;

            grandTotal++;
            if (isDay) totalDay++;
            else totalNight++;

            // For Chart
            if (!dailyTrend[iso]) {
                dailyTrend[iso] = { day: 0, night: 0, total: 0 };
            }
            dailyTrend[iso].total++;
            if (isDay) dailyTrend[iso].day++;
            else dailyTrend[iso].night++;

            // For Line Ranking
            if (!linesMap[lineVal]) linesMap[lineVal] = { line: lineVal, day: 0, night: 0, total: 0, defects: {} };
            linesMap[lineVal].total++;
            if (isDay) linesMap[lineVal].day++;
            else linesMap[lineVal].night++;
            if (defectVal) {
                linesMap[lineVal].defects[defectVal] = (linesMap[lineVal].defects[defectVal] || 0) + 1;
            }

            // For OP Ranking
            let opKey = opVal + '_' + nameVal;
            if (!opMap[opKey]) opMap[opKey] = { op: opVal, name: nameVal, day: 0, night: 0, total: 0, defects: {} };
            opMap[opKey].total++;
            if (isDay) opMap[opKey].day++;
            else opMap[opKey].night++;
            if (defectVal) {
                opMap[opKey].defects[defectVal] = (opMap[opKey].defects[defectVal] || 0) + 1;
            }
        }

        // Save filtered data for double-click modal
        window.G_PTL_LAST_FILTERED_ROWS = rawData.filter((r, idx) => {
            if (idx === 0) return false;
            let iso = ptlDateToIsoStr((r[colIdx.date] || '').trim());
            if (!iso) return false;
            if (fromIso && iso < fromIso) return false;
            if (toIso && iso > toIso) return false;
            let shiftVal = (r[colIdx.shift] || '').trim() || 'Day';
            let isDay = shiftVal.toLowerCase().includes('day') || shiftVal.toLowerCase().includes('ngày');
            if (shiftFilter === 'Day' && !isDay) return false;
            if (shiftFilter === 'Night' && isDay) return false;
            return true;
        });
        window.G_PTL_LAST_COL_IDX = colIdx;

        if (grandTotal === 0) {
            wrapper.innerHTML = `<div style="text-align:center; padding:35px; color:#ef4444; font-weight:800; font-size:15px;">Không tìm thấy dữ liệu phù hợp với bộ lọc!</div>`;
            return;
        }

        let linesArr = Object.values(linesMap).sort((a, b) => b.total - a.total);

    let _prevOnLangPtl = window.onLanguageChanged;
    window.onLanguageChanged = function () {
        if (_prevOnLangPtl) _prevOnLangPtl();
        let lang = (window.langs && window.currentLangIdx !== undefined) ? window.langs[window.currentLangIdx] : 'vn';

        let dict = {
            'ca': { vn: 'Ca:', en: 'Shift:', cn: '班别:' },
            'tu': { vn: 'Từ:', en: 'From:', cn: '从:' },
            'den': { vn: 'Đến:', en: 'To:', cn: '至:' },
            'opt_all': { vn: '-- Tất cả Ca --', en: '-- All Shifts --', cn: '-- 所有班别 --' },

            'opt_night': { vn: 'Ca Night (Đêm)', en: 'Night Shift', cn: '夜班' },
            'search': { vn: '🔍 Tìm Kiếm', en: '🔍 Search', cn: '🔍 搜索' },
            'view': { vn: '🔍 Xem Thống Kê', en: '🔍 View Stats', cn: '🔍 查看统计' },
            'row': { vn: 'Hàng', en: 'Row', cn: '行' },
            'cell': { vn: 'Ô', en: 'Cell', cn: '单元格' },
            'paint': { vn: '🖌️ Cọ Vẽ', en: '🖌️ Paint', cn: '🖌️ 画笔' },
            'clear': { vn: '🧹 Xóa Màu', en: '🧹 Clear Color', cn: '🧹 清除颜色' },
            'sort': { vn: '⬇️ Sắp Xếp', en: '⬇️ Sort', cn: '⬇️ 排序' },
            'copy': { vn: '📋 Copy Ảnh', en: '📋 Copy', cn: '📋 复制图片' },
            'excel': { vn: '📥 Tải Excel', en: '📥 Excel', cn: '📥 下载' }
        };

        let updateEl = (id, key) => {
            let el = document.getElementById(id);
            if (el && dict[key] && dict[key][lang]) el.innerHTML = dict[key][lang];
        };

        updateEl('ptl-lbl-wt-ca', 'ca');
        updateEl('ptl-opt-wt-all', 'opt_all');
        updateEl('ptl-opt-wt-day', 'opt_day');
        updateEl('ptl-opt-wt-night', 'opt_night');
        updateEl('ptl-wt-btn-search-el', 'search');
        updateEl('ptl-lbl-wt-row', 'row');
        updateEl('ptl-lbl-wt-cell', 'cell');
        updateEl('ptl-wt-btn-paint-tool', 'paint');
        updateEl('ptl-wt-btn-clear-paint', 'clear');
        updateEl('ptl-wt-btn-sort', 'sort');
        updateEl('ptl-wt-btn-copy', 'copy');
        updateEl('ptl-wt-btn-excel', 'excel');

        updateEl('ptl-lbl-tkw-tu', 'tu');
        updateEl('ptl-lbl-tkw-den', 'den');
        updateEl('ptl-lbl-tkw-ca', 'ca');
        updateEl('ptl-opt-tkw-all', 'opt_all');
        updateEl('ptl-opt-tkw-day', 'opt_day');
        updateEl('ptl-opt-tkw-night', 'opt_night');
        updateEl('ptl-btn-tkw-search', 'view');

        // Automatically re-render active table if rendered, so language updates instantly
        let ptlTab = document.getElementById('tab-phan-tich-loi');
        if (ptlTab && ptlTab.style.display !== 'none') {
            let activeBtn = document.querySelector('.ptl-tab-btn.active');
            if (activeBtn) {
                let id = activeBtn.id;
                if (id === 'ptl-btn-wt') {
                    if (typeof executePtlWtSearch === 'function' && document.getElementById('ptl-wt-main-table')) executePtlWtSearch();
                } else if (id === 'ptl-btn-ngay') {
                    if (typeof executePtlSearch === 'function' && document.getElementById('ptl-main-table')) executePtlSearch();
                } else if (id === 'ptl-btn-tuan') {
                    if (typeof executePtlTuanSearch === 'function' && document.getElementById('ptl-tuan-main-table')) executePtlTuanSearch();
                } else if (id === 'ptl-btn-thang') {
                    if (typeof executePtlThangSearch === 'function' && document.getElementById('ptl-thang-main-table')) executePtlThangSearch();
                } else if (id === 'ptl-btn-tonghop') {
                    if (typeof executePtlTongHopSearch === 'function' && document.getElementById('ptl-tonghop-main-table')) executePtlTongHopSearch();
                } else if (id === 'ptl-btn-thongkewt') {
                    if (typeof executePtlThongKeWtSearch === 'function' && document.getElementById('ptl-wt-sec-line')) executePtlThongKeWtSearch();
                }
            }
        }
    };
