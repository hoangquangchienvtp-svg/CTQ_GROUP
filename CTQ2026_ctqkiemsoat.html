    // Vẽ biểu đồ xu hướng cho Tab 2 CTQ-02
    function cksRenderChart02() {
        let cvs = document.getElementById('cks-chart-02-canvas');
        if (!cvs) return;
        let ctx = cvs.getContext('2d');
        let w = cvs.clientWidth || 400;
        let h = 220;
        cvs.width = w; cvs.height = h;
        ctx.clearRect(0, 0, w, h);

        let dataPts = [97.8, 98.2, 98.0, 98.6, 98.5];
        let labels = ['26/07', '27/07', '28/07', '29/07', '30/07'];

        let padLeft = 45, padRight = 20, padTop = 25, padBot = 25;
        let chartW = w - padLeft - padRight;
        let chartH = h - padTop - padBot;

        // Vẽ lưới
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'right';

        [97, 98, 99, 100].forEach(val => {
            let y = (h - padBot) - ((val - 96) / 4) * chartH;
            ctx.fillText(val + '%', padLeft - 6, y + 4);
            ctx.beginPath();
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.moveTo(padLeft, y); ctx.lineTo(w - padRight, y);
            ctx.stroke();
        });

        // Vẽ đường nối & điểm
        let step = chartW / (dataPts.length - 1);
        ctx.beginPath();
        ctx.strokeStyle = '#16a34a';
        ctx.lineWidth = 3;

        dataPts.forEach((val, idx) => {
            let x = padLeft + idx * step;
            let y = (h - padBot) - ((val - 96) / 4) * chartH;
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Vẽ điểm & Data Label
        dataPts.forEach((val, idx) => {
            let x = padLeft + idx * step;
            let y = (h - padBot) - ((val - 96) / 4) * chartH;

            ctx.beginPath();
            ctx.fillStyle = '#ffffff';
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = '#16a34a';
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(val + '%', x, y - 10);

            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(labels[idx], x, h - 8);
        });
    }

    // Export hoặc Copy Ảnh Bảng
    window.cksExportTable = function (tableId, title) {
        let tbl = document.getElementById(tableId);
        if (!tbl) return showToast('Không tìm thấy bảng!', 'warning');
        if (typeof html2canvas !== 'function') return showToast('Thư viện html2canvas chưa sẵn sàng!', 'warning');

        showToast('📸 Đang copy ảnh bảng...', 'info');
        html2canvas(tbl, {
            scale: Math.max(3, (window.devicePixelRatio || 1) * 2),
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff'
        }).then(canvas => {
            canvas.toBlob(async (blob) => {
                if (!blob) return showToast('Không thể tạo dữ liệu ảnh!', 'error');
                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        showToast('📋 Đã copy ảnh bảng ' + title + ' vào Bộ nhớ tạm!', 'success');
                    } else {
                        throw new Error("Không hỗ trợ ClipboardItem");
                    }
                } catch (e) {
                    let link = document.createElement('a');
                    link.download = `${title}_${new Date().toISOString().slice(0, 10)}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast('📋 Đã tải ảnh bảng xuống máy.', 'info');
                }
            }, 'image/png');
        });
    };
