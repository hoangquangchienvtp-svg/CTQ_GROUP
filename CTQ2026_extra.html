    // Load danh sách tháng đã tạo từ server
    function tdcnLoadAvailableMonths() {
        try {
            google.script.run.withSuccessHandler(function (list) {
                let sel = document.getElementById('tdcn-month-select');
                if (!sel) return;
                sel.innerHTML = '<option value="">-- Chọn Tháng --</option>';
                if (list && list.length > 0) {
                    list.forEach(function (item) {
                        let opt = document.createElement('option');
                        opt.value = item.month + '_' + item.year;
                        opt.textContent = 'Tháng ' + item.month + ' / ' + item.year;
                        sel.appendChild(opt);
                    });
                    // Tự động chọn tháng đầu tiên (mới nhất)
                    sel.value = list[0].month + '_' + list[0].year;
                    tdcnOnMonthSelectChange();
                }
            }).getAvailableTdcnMonths();
        } catch (e) {
            console.error("Lỗi khi gọi getAvailableTdcnMonths: ", e);
            alert("Lỗi: Không tìm thấy hàm getAvailableTdcnMonths trên máy chủ! Vui lòng copy file HE_THONG.js mới nhất lên Google Apps Script.");
        }
    }

    // Khi chọn tháng từ dropdown
    function tdcnOnMonthSelectChange() {
        let sel = document.getElementById('tdcn-month-select');
        if (!sel || !sel.value) return;
        let parts = sel.value.split('_');
        let m = parseInt(parts[0]);
        let y = parseInt(parts[1]);
        if (!m || !y) return;
        tdcnCreateMonth(m, y);
    }

    // Hiện modal tạo tháng mới
    function tdcnShowCreateNewModal() {
        let modal = document.getElementById('tdcn-create-modal');
        if (!modal) return;
        // Set default values
        let now = new Date();
        let nextM = now.getMonth() + 2; // tháng tiếp theo
        let nextY = now.getFullYear();
        if (nextM > 12) { nextM = 1; nextY++; }
        document.getElementById('tdcn-new-month').value = nextM;
        document.getElementById('tdcn-new-year').value = nextY;
        // Set default date range (26 tháng trước -> 25 tháng này)
        let prevM = nextM - 1; let prevY = nextY;
        if (prevM === 0) { prevM = 12; prevY = nextY - 1; }
        let fromDate = new Date(prevY, prevM - 1, 26);
        let toDate = new Date(nextY, nextM - 1, 25);
        document.getElementById('tdcn-new-from').value = fromDate.getFullYear() + '-' + String(fromDate.getMonth() + 1).padStart(2, '0') + '-' + String(fromDate.getDate()).padStart(2, '0');
        document.getElementById('tdcn-new-to').value = toDate.getFullYear() + '-' + String(toDate.getMonth() + 1).padStart(2, '0') + '-' + String(toDate.getDate()).padStart(2, '0');
        // Checkbox copy
        document.getElementById('tdcn-new-copy').checked = (typeof tdcnData !== 'undefined' && tdcnData && tdcnData.length > 0);
        modal.style.display = 'flex';
    }

    function tdcnCloseCreateModal() {
        let modal = document.getElementById('tdcn-create-modal');
        if (modal) modal.style.display = 'none';
    }

            else alert(msg);
        };

        if (!m || !y) return notify('Vui lòng chọn tháng và năm!', 'error');
        if (!fromStr || !toStr) return notify('Vui lòng chọn ngày bắt đầu và kết thúc!', 'error');

        let fromDate = new Date(fromStr);
        let toDate = new Date(toStr);
        if (fromDate > toDate) return notify('Ngày bắt đầu phải nhỏ hơn ngày kết thúc!', 'error');

        // Lưu dữ liệu cũ trước khi tạo mới (nếu copy)
        let oldData = (copyData && typeof tdcnData !== 'undefined' && tdcnData) ? JSON.parse(JSON.stringify(tdcnData)) : [];

        // Tạo danh sách ngày
        let newDates = [];
        let newIsSunday = [];
        let curDate = new Date(fromDate);
        while (curDate <= toDate) {
            newDates.push(curDate.getDate() + '/' + (curDate.getMonth() + 1));
            newIsSunday.push(curDate.getDay() === 0);
            curDate.setDate(curDate.getDate() + 1);
        }

        tdcnCurrentMonth = m;
        tdcnCurrentYear = y;
        tdcnDates = newDates;
        tdcnIsSunday = newIsSunday;
        tdcnComments = {};
        tdcnColors = {};
        tdcnTextColors = {};

        // Generate data
        tdcnData = [];
        if (copyData && oldData.length > 0) {
            // Copy columns STT -> LINE (index 0-7) from old data, dates + extra = empty
            for (let i = 0; i < oldData.length; i++) {
                let row = [];
                // Copy first 8 columns (STT, Model, Area, ID, FullName, Station, CA, LINE)
                for (let c = 0; c < 8; c++) {
                    row.push(oldData[i][c] !== undefined ? oldData[i][c] : '');
                }
                // Re-number STT
                row[0] = i + 1;
                // Fill dates - empty, white (Sunday = 周日 + cam)
                for (let d = 0; d < newDates.length; d++) {
                    if (newIsSunday[d]) {
                        row.push('周日');
                        tdcnColors[i + '_' + (8 + d)] = '#f97316';
                    } else {
                        row.push('');
                    }
                }
                // Fill extra columns
                for (let d = 0; d < tdcnExtraColumns.length; d++) {
                    row.push('');
                }
                tdcnData.push(row);
            }
        } else {
            // Tạo 600 dòng trống
            for (let i = 0; i < 600; i++) {
                let row = [i + 1, '', '', '', '', '', '', ''];
                for (let d = 0; d < newDates.length; d++) {
                    if (newIsSunday[d]) {
                        row.push('周日');
                        tdcnColors[i + '_' + (8 + d)] = '#f97316';
                    } else {
                        row.push('');
                    }
                }
                for (let d = 0; d < tdcnExtraColumns.length; d++) {
                    row.push('');
                }
                tdcnData.push(row);
            }
        }

        // Tính toán cột tự động
        for (let i = 0; i < tdcnData.length; i++) tdcnRecalculateRow(i);

        document.getElementById('tdcn-tabs').style.display = 'flex';
        tdcnSwitchTab(1);
        tdcnRenderTable();

        // Đóng modal
        tdcnCloseCreateModal();

        // Cập nhật dropdown (thêm tháng mới nếu chưa có)
        let sel = document.getElementById('tdcn-month-select');
        let newVal = m + '_' + y;
        let found = false;
        for (let i = 0; i < sel.options.length; i++) {
            if (sel.options[i].value === newVal) { found = true; break; }
        }
        if (!found) {
            let opt = document.createElement('option');
            opt.value = newVal;
            opt.textContent = 'Tháng ' + m + ' / ' + y;
            sel.appendChild(opt);
        }
        sel.value = newVal;

        notify('Đã tạo bảng tháng ' + m + '/' + y + ' thành công! Đang đồng bộ Điểm Mù...', 'success');

        try {
            google.script.run.withSuccessHandler(function (res) {
                window.tdcnDiemMuData = res || {};
                tdcnUpdateAllDiemMu();
            }).getDiemMuTheoThang(tdcnCurrentMonth, tdcnCurrentYear);
        } catch (e) {
            console.error("Lỗi getDiemMuTheoThang: ", e);
        }
    }

    function tdcnSwitchTab(tabIdx) {
        tdcnActiveTab = tabIdx;
        document.getElementById('tdcn-content-1').style.display = tabIdx === 1 ? 'block' : 'none';
        document.getElementById('tdcn-content-2').style.display = tabIdx === 2 ? 'block' : 'none';
        document.getElementById('tdcn-content-3').style.display = tabIdx === 3 ? 'block' : 'none';

        document.getElementById('tdcn-btn-tab1').style.background = tabIdx === 1 ? '#eff6ff' : 'transparent';
        document.getElementById('tdcn-btn-tab2').style.background = tabIdx === 2 ? '#eff6ff' : 'transparent';
        document.getElementById('tdcn-btn-tab3').style.background = tabIdx === 3 ? '#eff6ff' : 'transparent';

        // Hiển thị panel kéo thả nếu ở tab 1
        let panel = document.getElementById('tdcn-quick-fill-panel');
        if (panel) {
            panel.style.display = (tabIdx === 1 && tdcnQuickFillVisible) ? 'block' : 'none';
        }

        if (tabIdx === 2) {
            if (typeof tdcnRenderDataTab === 'function') {
                tdcnRenderDataTab();
            } else {
                document.getElementById('tdcn-data-preview').innerHTML = "Đang cập nhật...";
            }
        }
    }

    function tdcnUpdateQuickFillUI() {

        let btnContainer = document.getElementById("tdcn-quick-fill-buttons");
        if (btnContainer) btnContainer.innerHTML = tdcnRenderQuickFill();

        // 2. Cập nhật bảng quản lý trong Tab 3
        let tableBody = document.getElementById("tdcn-quick-fill-table-body");

            html += "<tr>";
            html += "<td style=\"padding:8px;\"><b>" + item.v + "</b></td>";
            html += "<td style=\"padding:8px;\">" + item.d + "</td>";
            html += "<td style=\"padding:8px; text-align:center;\"><div style=\"width:60px; height:24px; background:" + item.c + "; border:1px solid #000; margin:auto;\"></div></td>";

            html += "</tr>";
        });

    function tdcnAddQuickFillOption() {
        let val = document.getElementById("tdcn-new-val").value.trim();
        let desc = document.getElementById("tdcn-new-desc").value.trim();
        let color = document.getElementById("tdcn-new-color").value;
        let textColor = document.getElementById("tdcn-new-text-color") ? document.getElementById("tdcn-new-text-color").value : '';

        if (!val) return alert("Vui lòng nhập Ký hiệu!");

        if (textColor && textColor !== '#000000') newItem.tc = textColor;

        tdcnQuickFillData.push(newItem);

        tdcnUpdateQuickFillUI();

        showToast('Đang lưu cấu hình...', 'info');
        google.script.run.withSuccessHandler(function (res) {
            if (res === "SUCCESS") showToast('Đã lưu cấu hình màu sắc', 'success');
            else showToast(res, 'error');
        }).saveQuickFillData(tdcnQuickFillData);

    function tdcnDeleteQuickFillOption(idx) {
        if (confirm("Bạn có chắc muốn xóa lựa chọn này?")) {
            tdcnQuickFillData.splice(idx, 1);
            tdcnUpdateQuickFillUI();

            // Lưu lên server
            showToast('Đang lưu cấu hình...', 'info');
            google.script.run.withSuccessHandler(function (res) {
                if (res === "SUCCESS") showToast('Đã cập nhật cấu hình màu sắc', 'success');
                else showToast(res, 'error');
            }).saveQuickFillData(tdcnQuickFillData);

    function tdcnCreateMonth(m, y) {
        if (!m || !y) return alert("Vui lòng chọn tháng và năm!");

        if (typeof showToast === 'function') showToast("Đang kiểm tra dữ liệu tháng " + m + "...", "info");

        // Gọi thử API tải dữ liệu
        google.script.run
            .withSuccessHandler(function (res) {
                if (res && res.success) {
                    // Đã có dữ liệu trong Sheet -> Load lên
                    tdcnCurrentMonth = m;
                    tdcnCurrentYear = y;
                    tdcnData = res.data;
                    tdcnDates = res.dates;
                    tdcnComments = res.comments || {};
                    tdcnColors = res.colors || {};
                    tdcnTextColors = res.textColors || {};

                    tdcnIsSunday = [];
                    let prevM = m - 1; let prevY = y;
                    if (prevM === 0) { prevM = 12; prevY = y - 1; }
                    let curDate = new Date(prevY, prevM - 1, 26);
                    for (let i = 0; i < tdcnDates.length; i++) {
                        tdcnIsSunday.push(curDate.getDay() === 0);
                        curDate.setDate(curDate.getDate() + 1);
                    }

                    document.getElementById('tdcn-tabs').style.display = 'flex';
                    tdcnSwitchTab(1);
                    tdcnRenderTable();
                    if (typeof showToast === 'function') showToast("Đã tải dữ liệu hiện có! Đang tính Điểm Mù...", "success");

                    google.script.run.withSuccessHandler(function (dRes) {
                        window.tdcnDiemMuData = dRes || {};
                        tdcnUpdateAllDiemMu();
                    }).getDiemMuTheoThang(m, y);
                } else {
                    // Chưa có dữ liệu -> Tạo bảng trống mới
                    tdcnGenerateEmptyMonth(m, y);
                }
            })
            .withFailureHandler(function (err) {
                // Lỗi mạng hoặc chưa có -> Tạo bảng trống mới
                tdcnGenerateEmptyMonth(m, y);
            })
            .taiTheoDoiCongNhan(m, y);
    }

    function tdcnGenerateEmptyMonth(m, y) {
        tdcnCurrentMonth = m;
        tdcnCurrentYear = y;

        // Tính ngày 26 tháng trước -> 25 tháng này
        tdcnDates = [];
        tdcnIsSunday = [];
        let prevM = m - 1; let prevY = y;
        if (prevM === 0) { prevM = 12; prevY = y - 1; }

        let curDate = new Date(prevY, prevM - 1, 26);
        let endDate = new Date(y, m - 1, 25);

        while (curDate <= endDate) {
            tdcnDates.push(curDate.getDate() + '/' + (curDate.getMonth() + 1));
            tdcnIsSunday.push(curDate.getDay() === 0); // 0 = Sunday
            curDate.setDate(curDate.getDate() + 1);
        }

        // Generate dummy data (600 empty rows)
        tdcnData = [];
        tdcnComments = {};
        for (let i = 0; i < 600; i++) {
            let row = [
                i + 1, "", "", "", "", "", "", ""
            ];
            // Fill dates
            for (let d = 0; d < tdcnDates.length; d++) {
                if (tdcnIsSunday[d]) {
                    row.push("周日");
                    tdcnColors[i + '_' + (8 + d)] = "#f97316"; // Màu cam
                } else {
                    row.push(""); // empty data
                }
            }
            // Fill extra columns
            for (let d = 0; d < tdcnExtraColumns.length; d++) {
                row.push(""); // empty data
            }
            tdcnData.push(row);
        }

        // Tính toán cột tự động trước khi render
        for (let i = 0; i < 600; i++) tdcnRecalculateRow(i);

        document.getElementById('tdcn-tabs').style.display = 'flex';
        tdcnSwitchTab(1);
        tdcnRenderTable();

        if (typeof showToast === 'function') showToast("Đã tạo bảng mới! Đang đồng bộ dữ liệu Điểm Mù...", "info");
        google.script.run.withSuccessHandler(function (res) {
            window.tdcnDiemMuData = res || {};
            tdcnUpdateAllDiemMu();
        }).getDiemMuTheoThang(tdcnCurrentMonth, tdcnCurrentYear);
    }

    function tdcnAddNewRow() {
        if (tdcnDates.length === 0) return alert("Vui lòng tạo tháng trước!");
        let ans = prompt("Nhập số lượng hàng muốn chèn thêm (ví dụ: 20):");
        if (!ans) return;
        let numRows = parseInt(ans);
        if (isNaN(numRows) || numRows <= 0) return alert("Số lượng không hợp lệ!");

        let startIndex = tdcnData.length;
        let newRows = [];
        for (let i = 0; i < numRows; i++) {
            let row = [startIndex + i + 1, "", "", "", "", "", "", ""];
            for (let d = 0; d < tdcnDates.length; d++) {
                if (tdcnIsSunday[d]) {
                    row.push("周日");
                    tdcnColors[(startIndex + i) + '_' + (8 + d)] = "#f97316"; // Màu cam
                } else {
                    row.push("");
                }
            }
            for (let d = 0; d < tdcnExtraColumns.length; d++) row.push("");
            newRows.push(row);
        }

        tdcnData.push(...newRows);
        for (let i = 0; i < numRows; i++) tdcnRecalculateRow(startIndex + i);

        tdcnRenderTable();

        // Scroll to bottom
        let wrapper = document.querySelector('.tdcn-grid-wrapper');
        if (wrapper) wrapper.scrollTop = wrapper.scrollHeight;
    }

    function tdcnDeleteSelectedRows() {
        if (tdcnData.length === 0) return alert("Bảng đang trống!");
        let ans = prompt("Nhập khoảng STT muốn xóa (ví dụ: 5-77):");
        if (!ans) return;
        let parts = ans.split('-');
        let start = parseInt(parts[0]);
        let end = parts.length > 1 ? parseInt(parts[1]) : start;
        if (isNaN(start) || start < 1 || start > tdcnData.length) return alert("STT không hợp lệ!");
        if (isNaN(end) || end > tdcnData.length || end < start) end = start;

        if (!confirm("Bạn có chắc chắn xóa từ STT " + start + " đến " + end + "?")) return;

        let minR = start - 1;
        let maxR = end - 1;

        tdcnData.splice(minR, maxR - minR + 1);

        for (let i = 0; i < tdcnData.length; i++) tdcnData[i][0] = i + 1;

        let newComments = {};
        let newColors = {};
        for (let key in tdcnComments) {
            let p = key.split('_');
            let r = parseInt(p[0]);
            let c = parseInt(p[1]);
            if (r < minR) {
                newComments[key] = tdcnComments[key];
            } else if (r > maxR) {
                newComments[(r - (maxR - minR + 1)) + '_' + c] = tdcnComments[key];
            }
        }
        for (let key in tdcnColors) {
            let p = key.split('_');
            let r = parseInt(p[0]);
            let c = parseInt(p[1]);
            if (r < minR) {
                newColors[key] = tdcnColors[key];
            } else if (r > maxR) {
                newColors[(r - (maxR - minR + 1)) + '_' + c] = tdcnColors[key];
            }
        }
        tdcnComments = newComments;
        tdcnColors = newColors;

        let newTextColors = {};
        for (let key in tdcnTextColors) {
            let p = key.split('_');
            let r = parseInt(p[0]);
            let c = parseInt(p[1]);
            if (r < minR) {
                newTextColors[key] = tdcnTextColors[key];
            } else if (r > maxR) {
                newTextColors[(r - (maxR - minR + 1)) + '_' + c] = tdcnTextColors[key];
            }
        }
        tdcnTextColors = newTextColors;

        tdcnSelection = { startR: -1, startC: -1, endR: -1, endC: -1, isDragging: false };
        tdcnRenderTable();
    }

    function tdcnRenderTable() {
        if (!tdcnData || tdcnData.length === 0) return;

        // Cập nhật lại toàn bộ công thức đếm cho tất cả các hàng mỗi khi render (để áp dụng code mới cho dữ liệu cũ)
        for (let r = 0; r < tdcnData.length; r++) {
            tdcnRecalculateRow(r);
        }

        let thead = document.getElementById('tdcn-thead');
        let tbody = document.getElementById('tdcn-tbody');

        let cols = [
            { c: 'tdcn-col-stt', n: getTxt('tdcn_th_stt') || 'STT' },
            { c: 'tdcn-col-model', n: getTxt('tdcn_th_model') || 'Model' },
            { c: 'tdcn-col-area', n: getTxt('tdcn_th_area') || 'Area' },
            { c: 'tdcn-col-id', n: getTxt('tdcn_th_id') || 'ID' },
            { c: 'tdcn-col-name', n: getTxt('tdcn_th_name') || 'FULL NAME' },
            { c: 'tdcn-col-station', n: getTxt('tdcn_th_station') || 'STATION' },
            { c: 'tdcn-col-ca', n: getTxt('tdcn_th_ca') || 'CA' },
            { c: 'tdcn-col-line', n: getTxt('tdcn_th_line') || 'LINE' }
        ];
        let thHtml = '<tr>';
        cols.forEach((col, idx) => {
            let fColor = tdcnFilters[idx] ? 'red' : '#666';
            thHtml += `<th class="${col.c}">
            <div style="position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center; padding-right:12px;">
                <span>${col.n}</span>
                <span class="tdcn-filter-icon" id="tdcn-filter-icon-${idx}" style="cursor:pointer; color:${fColor}; font-size:10px; position:absolute; right:2px;" onclick="tdcnShowFilterMenu(event, ${idx})">▼</span>
            </div>
        </th>`;
        });

        let extraColsTxt = [
            getTxt('tdcn_th_chuyencan') || 'Chuyên Cần', getTxt('tdcn_th_saivt') || 'Sai Vị Trí', getTxt('tdcn_th_diemmu') || 'Điểm Mù', getTxt('tdcn_th_loiprocess') || 'Lỗi Process',
            getTxt('tdcn_th_dat') || 'Đạt/Không Đạt', getTxt('tdcn_th_ghichu') || 'Ghi Chú', getTxt('tdcn_th_ngaycong') || 'Ngày Công', getTxt('tdcn_th_tyle') || 'Tỷ Lệ', getTxt('tdcn_th_phepnam') || 'Phép Năm',
            getTxt('tdcn_th_viecrieng') || 'Việc Riêng', getTxt('tdcn_th_tudo') || 'Tự Do', getTxt('tdcn_th_nghiviec') || 'Nghỉ Việc', getTxt('tdcn_th_no') || 'NO', getTxt('tdcn_th_khongmochuyen') || 'Không Mở Chuyền'
        ];

        let dateIdxStart = cols.length;
        tdcnDates.forEach((d, i) => {
            let colIdx = dateIdxStart + i;
            let fColor = tdcnFilters[colIdx] ? 'red' : '#666';
            thHtml += `<th class="tdcn-col-date">
            <div style="position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center; padding-right:12px;">
                <span>${d}</span>
                <span class="tdcn-filter-icon" id="tdcn-filter-icon-${colIdx}" style="cursor:pointer; color:${fColor}; font-size:10px; position:absolute; right:2px;" onclick="tdcnShowFilterMenu(event, ${colIdx})">▼</span>
            </div>
            </th>`;
        });

        let extraIdxStart = cols.length + tdcnDates.length;
        extraColsTxt.forEach((d, i) => {
            let colIdx = extraIdxStart + i;
            let fColor = tdcnFilters[colIdx] ? 'red' : '#666';
            thHtml += `<th class="tdcn-col-extra">
            <div style="position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center; padding-right:12px;">
                <span>${d}</span>
                <span class="tdcn-filter-icon" id="tdcn-filter-icon-${colIdx}" style="cursor:pointer; color:${fColor}; font-size:10px; position:absolute; right:2px;" onclick="tdcnShowFilterMenu(event, ${colIdx})">▼</span>
            </div>
            </th>`;
        });
        thHtml += '</tr>';
        thead.innerHTML = thHtml;

        let tbHtml = '';
        // Build rows string manually for performance
        for (let r = 0; r < tdcnData.length; r++) {
            tbHtml += '<tr data-row="' + r + '">';
            for (let c = 0; c < tdcnData[r].length; c++) {
                let val = tdcnData[r][c];
                let hasCmt = tdcnComments[r + '_' + c] ? 'tdcn-has-comment' : '';
                let bgStyle = tdcnColors[r + '_' + c] ? 'background-color:' + tdcnColors[r + '_' + c] + ';' : '';
                let fontStyle = tdcnTextColors[r + '_' + c] ? 'color:' + tdcnTextColors[r + '_' + c] + ';' : '';

                // Cột tự động khóa (Ngày công trở đi, và Điểm Mù)
                let indexChuyenCan = 8 + tdcnDates.length;
                let indexNgayCong = 8 + tdcnDates.length + 6;
                let indexDiemMu = 8 + tdcnDates.length + 2;
                let indexPhepNam = 8 + tdcnDates.length + 8;
                let indexKhongMoChuyen = 8 + tdcnDates.length + 13;
                let indexDatKhongDat = indexChuyenCan + 4;
                let indexGhiChu = indexChuyenCan + 5;
                let indexTyle = indexChuyenCan + 7;

                if (c >= indexChuyenCan) {
                    fontStyle += 'font-size:20px; ';

                    if (c === indexNgayCong) {
                        if (val == null || val === '' || (typeof val === 'string' && val.trim() === '')) {
                            val = '0';
                        }
                    } else if (c === indexTyle) {
                        if (val == null || val === '' || val == 0 || (typeof val === 'string' && val.trim() === '')) {
                            val = '0%';
                        }
                    } else if (c !== indexDatKhongDat && c !== indexGhiChu) {
                        if (val == 0) {
                            val = '';
                        }
                    }
                }

                if (tdcnDates.length > 0 && (c >= indexNgayCong || c === indexDiemMu)) {
                    bgStyle = 'background-color:#e5e7eb; pointer-events:none;';
                    if (c === indexDiemMu) {
                        fontStyle += 'color:red !important; font-weight:bold;';
                    }
                    if (c >= indexPhepNam && c <= indexKhongMoChuyen) {
                        fontStyle += 'color:red !important; font-weight:bold;';
                    }
                }

                if (c === 6) fontStyle = 'color:#000 !important; font-weight:bold;';

                tbHtml += '<td data-r="' + r + '" data-c="' + c + '" class="' + hasCmt + '" style="' + bgStyle + fontStyle + '" oncontextmenu="tdcnShowContext(event, ' + r + ', ' + c + ')">' + val + '</td>';
            }
            tbHtml += '</tr>';
        }
        tbody.innerHTML = tbHtml;

        // Add tooltip events
        tbody.querySelectorAll('td.tdcn-has-comment').forEach(td => {
            td.onmouseenter = (e) => tdcnShowTooltip(e, td.getAttribute('data-r'), td.getAttribute('data-c'));
            td.onmouseleave = tdcnHideTooltip;
        });
    }

    // =====================================
    // EXCEL-LIKE SELECTION
    // =====================================
    let tdcnScrollInterval = null;
    let tdcnLastMouseY = 0;
    let tdcnLastMouseX = 0;

    function tdcnOnMouseDown(e) {
        if (e.button !== 0) return; // Only left click
        let td = e.target.closest('td');
        if (!td) return;

        // Nếu bấm chuột trái vào ô, xóa selection mặc định của trình duyệt để tránh bị bôi xanh linh tinh
        window.getSelection().removeAllRanges();
        e.preventDefault();

        tdcnSelection.isDragging = true;
        tdcnSelection.startR = parseInt(td.getAttribute('data-r'));
        tdcnSelection.startC = parseInt(td.getAttribute('data-c'));
        tdcnSelection.endR = tdcnSelection.startR;
        tdcnSelection.endC = tdcnSelection.startC;
        tdcnUpdateSelectionUI();

        if (tdcnScrollInterval) clearInterval(tdcnScrollInterval);
        tdcnScrollInterval = setInterval(tdcnCheckAutoScroll, 50);
    }

    function tdcnOnMouseOver(e) {
        if (!tdcnSelection.isDragging) return;
        let td = e.target.closest('td');
        if (!td) return;
        tdcnSelection.endR = parseInt(td.getAttribute('data-r'));
        tdcnSelection.endC = parseInt(td.getAttribute('data-c'));
        tdcnUpdateSelectionUI();
    }

    function tdcnOnMouseUp(e) {
        tdcnSelection.isDragging = false;
        if (tdcnScrollInterval) clearInterval(tdcnScrollInterval);
    }

    function tdcnCheckAutoScroll() {
        if (!tdcnSelection.isDragging) return;
        let wrapper = document.querySelector('.tdcn-grid-wrapper');
        if (!wrapper) return;
        let rect = wrapper.getBoundingClientRect();

        let scrollSpeed = 30;
        let didScroll = false;

        if (tdcnLastMouseY > rect.bottom - 40 && tdcnLastMouseY < rect.bottom + 50) {
            wrapper.scrollTop += scrollSpeed;
            didScroll = true;
        } else if (tdcnLastMouseY < rect.top + 40 && tdcnLastMouseY > rect.top - 50) {
            wrapper.scrollTop -= scrollSpeed;
            didScroll = true;
        }

        if (tdcnLastMouseX > rect.right - 40 && tdcnLastMouseX < rect.right + 50) {
            wrapper.scrollLeft += scrollSpeed;
            didScroll = true;
        } else if (tdcnLastMouseX < rect.left + 40 && tdcnLastMouseX > rect.left - 50) {
            wrapper.scrollLeft -= scrollSpeed;
            didScroll = true;
        }

        if (didScroll) {
            // Khi tự động cuộn, giả lập việc di chuyển chuột để cập nhật vùng chọn
            let elem = document.elementFromPoint(tdcnLastMouseX, tdcnLastMouseY);
            if (elem) {
                let td = elem.closest('td');
                if (td && td.hasAttribute('data-r')) {
                    tdcnSelection.endR = parseInt(td.getAttribute('data-r'));
                    tdcnSelection.endC = parseInt(td.getAttribute('data-c'));
                    tdcnUpdateSelectionUI();
                }
            }
        }
    }

    document.addEventListener('mousemove', function (e) {
        tdcnLastMouseX = e.clientX;
        tdcnLastMouseY = e.clientY;
        if (tdcnSelection.isDragging) {
            let elem = document.elementFromPoint(tdcnLastMouseX, tdcnLastMouseY);
            if (elem) {
                let td = elem.closest('td');
                if (td && td.hasAttribute('data-r')) {
                    tdcnSelection.endR = parseInt(td.getAttribute('data-r'));
                    tdcnSelection.endC = parseInt(td.getAttribute('data-c'));
                    tdcnUpdateSelectionUI();
                }
            }
        }
    });

    function tdcnUpdateSelectionUI() {
        let tbody = document.getElementById('tdcn-tbody');
        if (!tbody) return;
        // Clear old
        tbody.querySelectorAll('.tdcn-cell-selected').forEach(td => td.classList.remove('tdcn-cell-selected'));

        if (tdcnSelection.startR === -1) return;

        let minR = Math.min(tdcnSelection.startR, tdcnSelection.endR);
        let maxR = Math.max(tdcnSelection.startR, tdcnSelection.endR);
        let minC = Math.min(tdcnSelection.startC, tdcnSelection.endC);
        let maxC = Math.max(tdcnSelection.startC, tdcnSelection.endC);

        for (let r = minR; r <= maxR; r++) {
            let tr = tbody.children[r];
            if (!tr) continue;
            for (let c = minC; c <= maxC; c++) {
                let td = tr.children[c];
                if (td) td.classList.add('tdcn-cell-selected');
            }
        }
    }

    // =====================================
    // EXCEL-LIKE COPY & PASTE
    // =====================================
    function tdcnOnCopy(e) {
        if (tdcnActiveTab !== 1 || tdcnSelection.startR === -1) return;

        let minR = Math.min(tdcnSelection.startR, tdcnSelection.endR);
        let maxR = Math.max(tdcnSelection.startR, tdcnSelection.endR);
        let minC = Math.min(tdcnSelection.startC, tdcnSelection.endC);
        let maxC = Math.max(tdcnSelection.startC, tdcnSelection.endC);

        let text = [];
        let htmlStr = '<table>';

        for (let r = minR; r <= maxR; r++) {
            let rowData = [];
            htmlStr += '<tr>';
            for (let c = minC; c <= maxC; c++) {
                let val = tdcnData[r][c] || '';
                rowData.push(val);

                let bg = tdcnColors[r + '_' + c] || '';
                let style = bg ? ' style="background-color:' + bg + ';"' : '';
                htmlStr += '<td' + style + '>' + val + '</td>';
            }
            htmlStr += '</tr>';
            text.push(rowData.join('\t'));
        }
        htmlStr += '</table>';

        e.clipboardData.setData('text/plain', text.join('\n'));
        e.clipboardData.setData('text/html', htmlStr);
        e.preventDefault();
    }

    function tdcnOnPaste(e) {
        if (tdcnActiveTab !== 1 || tdcnSelection.startR === -1) return;
        e.preventDefault();

        let pasteData = (e.clipboardData || window.clipboardData).getData('text');
        let htmlPaste = (e.clipboardData || window.clipboardData).getData('text/html');
        if (!pasteData && !htmlPaste) return;

        let minR = Math.min(tdcnSelection.startR, tdcnSelection.endR);
        let minC = Math.min(tdcnSelection.startC, tdcnSelection.endC);
        let tbody = document.getElementById('tdcn-tbody');

        if (htmlPaste) {
            let parser = new DOMParser();
            let doc = parser.parseFromString(htmlPaste, 'text/html');
            let table = doc.querySelector('table');
            if (table) {
                let trs = table.querySelectorAll('tr');
                if (trs.length > 0) {
                    let selR = Math.max(tdcnSelection.startR, tdcnSelection.endR) - minR + 1;
                    let selC = Math.max(tdcnSelection.startC, tdcnSelection.endC) - minC + 1;

                    let targetRows = trs.length;
                    let firstTds = trs[0].querySelectorAll('td, th');
                    let targetCols = firstTds.length;

                    if (selR > 1 || selC > 1) {
                        targetRows = selR;
                        targetCols = selC;
                    }

                    for (let i = 0; i < targetRows; i++) {
                        let targetR = minR + i;
                        if (targetR >= tdcnData.length) break;

                        let sourceTr = trs[i % trs.length];
                        let tds = sourceTr.querySelectorAll('td, th');
                        if (tds.length === 0) continue;

                        let trEl = tbody.children[targetR];

                        for (let j = 0; j < targetCols; j++) {
                            let targetC = minC + j;
                            if (targetC >= tdcnData[0].length) break;

                            let sourceTd = tds[j % tds.length];
                            let indexNgayCong = 8 + tdcnDates.length + 6;
                            let indexDiemMu = 8 + tdcnDates.length + 2;
                            if (tdcnDates.length > 0 && (targetC >= indexNgayCong || targetC === indexDiemMu)) continue; // Khóa không cho sửa

                            let val = sourceTd.innerText.replace(/\r\n|\n|\r/g, ' ').trim();
                            tdcnData[targetR][targetC] = val;

                            let bg = sourceTd.style.backgroundColor || sourceTd.style.background || sourceTd.getAttribute('bgcolor');
                            if (bg) tdcnColors[targetR + '_' + targetC] = bg;
                            else delete tdcnColors[targetR + '_' + targetC];

                            if (trEl && trEl.children[targetC]) {
                                trEl.children[targetC].innerText = val;
                                if (bg) trEl.children[targetC].style.backgroundColor = bg;
                                else trEl.children[targetC].style.backgroundColor = '';
                                if (tdcnComments[targetR + '_' + targetC]) trEl.children[targetC].classList.add('tdcn-has-comment');
                            }
                        }
                    }
                    for (let i = 0; i < targetRows; i++) tdcnRecalculateRow(minR + i);
                    showToast('Đã dán dữ liệu (có màu)', 'success');
                    return;
                }
            }
        }

        // Fallback to plain text
        let rows = pasteData.split(/\r\n|\n|\r/).map(r => r.split('\t'));
        if (rows.length > 0 && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') {
            rows.pop(); // remove trailing empty newline
        }

        let selR = Math.max(tdcnSelection.startR, tdcnSelection.endR) - minR + 1;
        let selC = Math.max(tdcnSelection.startC, tdcnSelection.endC) - minC + 1;
        let targetRows = rows.length;
        let targetCols = rows[0].length;

        if (selR > 1 || selC > 1) {
            targetRows = selR;
            targetCols = selC;
        }

        for (let i = 0; i < targetRows; i++) {
            let targetR = minR + i;
            if (targetR >= tdcnData.length) break;
            let tr = tbody.children[targetR];

            let sourceRow = rows[i % rows.length];

            for (let j = 0; j < targetCols; j++) {
                let targetC = minC + j;
                if (targetC >= tdcnData[0].length) break;

                let indexNgayCong = 8 + tdcnDates.length + 6;
                let indexDiemMu = 8 + tdcnDates.length + 2;
                if (tdcnDates.length > 0 && (targetC >= indexNgayCong || targetC === indexDiemMu)) continue;

                let pasteVal = sourceRow[j % sourceRow.length];
                tdcnData[targetR][targetC] = pasteVal;
                delete tdcnColors[targetR + '_' + targetC];
                if (tr && tr.children[targetC]) {
                    tr.children[targetC].innerText = pasteVal;
                    tr.children[targetC].style.backgroundColor = '';
                    if (tdcnComments[targetR + '_' + targetC]) tr.children[targetC].classList.add('tdcn-has-comment');
                }
            }
        }
        for (let i = 0; i < targetRows; i++) {
            tdcnRecalculateRow(minR + i);
        }
        showToast('Đã dán dữ liệu', 'success');
    }

    function tdcnOnKeyDown(e) {
        if (tdcnActiveTab !== 1 || tdcnSelection.startR === -1) return;

        // Navigation & Selection (Arrow keys, Shift, Ctrl)
        if (e.key.startsWith('Arrow')) {
            e.preventDefault();

            if (!e.shiftKey) {
                tdcnSelection.startR = tdcnSelection.endR;
                tdcnSelection.startC = tdcnSelection.endC;
            }

            if (e.key === 'ArrowUp') {
                if (e.ctrlKey) tdcnSelection.endR = 0;
                else tdcnSelection.endR = Math.max(0, tdcnSelection.endR - 1);
            } else if (e.key === 'ArrowDown') {
                if (e.ctrlKey) tdcnSelection.endR = tdcnData.length - 1;
                else tdcnSelection.endR = Math.min(tdcnData.length - 1, tdcnSelection.endR + 1);
            } else if (e.key === 'ArrowLeft') {
                if (e.ctrlKey) tdcnSelection.endC = 0;
                else tdcnSelection.endC = Math.max(0, tdcnSelection.endC - 1);
            } else if (e.key === 'ArrowRight') {
                if (e.ctrlKey) tdcnSelection.endC = tdcnData[0].length - 1;
                else tdcnSelection.endC = Math.min(tdcnData[0].length - 1, tdcnSelection.endC + 1);
            }

            if (!e.shiftKey) {
                tdcnSelection.startR = tdcnSelection.endR;
                tdcnSelection.startC = tdcnSelection.endC;
            }

            tdcnUpdateSelectionUI();

            let tbody = document.getElementById('tdcn-tbody');
            if (tbody && tbody.children[tdcnSelection.endR]) {
                let cell = tbody.children[tdcnSelection.endR].children[tdcnSelection.endC];
                if (cell) cell.scrollIntoView({ block: "nearest", inline: "nearest" });
            }
            return;
        }

        // Xóa (Delete / Backspace)
        if (e.key === 'Delete' || e.key === 'Backspace') {
            let minR = Math.min(tdcnSelection.startR, tdcnSelection.endR);
            let maxR = Math.max(tdcnSelection.startR, tdcnSelection.endR);
            let minC = Math.min(tdcnSelection.startC, tdcnSelection.endC);
            let maxC = Math.max(tdcnSelection.startC, tdcnSelection.endC);

            let tbody = document.getElementById('tdcn-tbody');
            for (let r = minR; r <= maxR; r++) {
                let tr = tbody.children[r];
                if (!tr) continue;
                for (let c = minC; c <= maxC; c++) {
                    let indexNgayCong = 8 + tdcnDates.length + 6;
                    let indexDiemMu = 8 + tdcnDates.length + 2;
                    if (tdcnDates.length > 0 && (c >= indexNgayCong || c === indexDiemMu)) continue; // Khóa
                    tdcnData[r][c] = '';
                    if (tr.children[c]) {
                        tr.children[c].innerText = '';
                        tr.children[c].style.backgroundColor = '';
                        tr.children[c].style.color = '';
                        delete tdcnColors[r + '_' + c];
                        delete tdcnTextColors[r + '_' + c];
                        if (tdcnComments[r + '_' + c]) tr.children[c].classList.add('tdcn-has-comment');
                    }
                }
                tdcnRecalculateRow(r);
            }
            e.preventDefault();
        }

        // Gõ chữ vào ô đang chọn (nếu chỉ chọn 1 ô)
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
            if (tdcnSelection.startR === tdcnSelection.endR && tdcnSelection.startC === tdcnSelection.endC) {
                let r = tdcnSelection.startR;
                let c = tdcnSelection.startC;
                let tbody = document.getElementById('tdcn-tbody');
                let td = tbody.children[r].children[c];

                if (tdcnDates.length > 0 && c >= 8 + tdcnDates.length + 6) {
                    e.preventDefault();
                    return; // Khóa
                }

                if (!td.classList.contains('tdcn-cell-editing')) {
                    let input = document.createElement('input');
                    input.value = e.key;
                    td.innerHTML = '';
                    td.appendChild(input);
                    td.classList.add('tdcn-cell-editing');
                    input.focus();

                    input.onblur = () => {
                        tdcnData[r][c] = input.value;
                        td.classList.remove('tdcn-cell-editing');
                        td.innerText = input.value;
                        if (tdcnComments[r + '_' + c]) td.classList.add('tdcn-has-comment');
                        tdcnRecalculateRow(r);
                    };
                    input.onkeydown = (ev) => {
                        if (ev.key === 'Enter') input.blur();
                    }
                    e.preventDefault();
                }
            }
        }
    }

    // =====================================

    function tdcnShowContext(e, r, c) {
        e.preventDefault();
        tdcnContextMenuTarget = { r: r, c: c, td: e.target };
        let menu = document.getElementById('tdcn-context-menu');

        let insertOpt = document.getElementById('tdcn-ctx-insert-row');
        if (insertOpt) {
            if (c === 0) insertOpt.style.display = 'block';
            else insertOpt.style.display = 'none';
        }

        menu.style.display = 'block';
        menu.style.left = e.clientX + 'px';
        menu.style.top = e.clientY + 'px';
    }

    function tdcnHideContext() {
        let menu = document.getElementById('tdcn-context-menu');
        if (menu) menu.style.display = 'none';
    }

    function tdcnInsertRowBelow() {
        if (!tdcnContextMenuTarget) return;
        let r = tdcnContextMenuTarget.r;

        let newRow = [0, "", "", "", "", "", "", ""];
        for (let d = 0; d < tdcnDates.length; d++) newRow.push("");

        tdcnData.splice(r + 1, 0, newRow);

        for (let i = 0; i < tdcnData.length; i++) tdcnData[i][0] = i + 1;

        let newComments = {};
        let newColors = {};
        for (let key in tdcnComments) {
            let p = key.split('_');
            let cr = parseInt(p[0]);
            let cc = parseInt(p[1]);
            if (cr > r) {
                newComments[(cr + 1) + '_' + cc] = tdcnComments[key];
            } else {
                newComments[key] = tdcnComments[key];
            }
        }
        for (let key in tdcnColors) {
            let p = key.split('_');
            let cr = parseInt(p[0]);
            let cc = parseInt(p[1]);
            if (cr > r) {
                newColors[(cr + 1) + '_' + cc] = tdcnColors[key];
            } else {
                newColors[key] = tdcnColors[key];
            }
        }
        tdcnComments = newComments;
        tdcnColors = newColors;

        let newTextColors2 = {};
        for (let key in tdcnTextColors) {
            let p = key.split('_');
            let cr = parseInt(p[0]);
            let cc = parseInt(p[1]);
            if (cr > r) {
                newTextColors2[(cr + 1) + '_' + cc] = tdcnTextColors[key];
            } else {
                newTextColors2[key] = tdcnTextColors[key];
            }
        }
        tdcnTextColors = newTextColors2;

        tdcnHideContext();
        tdcnRenderTable();
    }

    function tdcnAddComment() {
        if (!tdcnContextMenuTarget) return;
        let r = tdcnContextMenuTarget.r;
        let c = tdcnContextMenuTarget.c;
        let oldVal = tdcnComments[r + '_' + c] || '';

        let txt = prompt("Nhập nội dung ghi chú:", oldVal);
        if (txt !== null) {
            if (txt.trim() === '') {
                delete tdcnComments[r + '_' + c];
                tdcnContextMenuTarget.td.classList.remove('tdcn-has-comment');
                tdcnContextMenuTarget.td.onmouseenter = null;
                tdcnContextMenuTarget.td.onmouseleave = null;
            } else {
                tdcnComments[r + '_' + c] = txt;
                tdcnContextMenuTarget.td.classList.add('tdcn-has-comment');
                tdcnContextMenuTarget.td.onmouseenter = (e) => tdcnShowTooltip(e, r, c);
                tdcnContextMenuTarget.td.onmouseleave = tdcnHideTooltip;
            }
        }
    }

    function tdcnDeleteComment() {
        if (!tdcnContextMenuTarget) return;
        let r = tdcnContextMenuTarget.r;
        let c = tdcnContextMenuTarget.c;
        delete tdcnComments[r + '_' + c];
        tdcnContextMenuTarget.td.classList.remove('tdcn-has-comment');
    }

    function tdcnShowTooltip(e, r, c) {
        let tooltip = document.getElementById('tdcn-comment-tooltip');
        if (!tooltip) return;
        let txt = tdcnComments[r + '_' + c];
        if (txt) {
            tooltip.innerText = txt;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 10) + 'px';
            tooltip.style.top = (e.clientY + 10) + 'px';
        }
    }

    function tdcnHideTooltip() {
        let tooltip = document.getElementById('tdcn-comment-tooltip');
        if (tooltip) tooltip.style.display = 'none';
    }

    // =====================================
    // EXPORT EXCEL (SỬ DỤNG EXCELJS)
    // =====================================
    async function tdcnExportExcel() {
        if (!tdcnData || tdcnData.length === 0) return alert("Chưa có dữ liệu!");

        if (typeof showToast === 'function') {
            showToast("Đang tạo file Excel...", "info");
        }

        try {
            await tdcnDoExportXML();
        } catch (e) {
            console.error(e);
            alert("Lỗi xuất file: " + e.message);
        }
    }

    async function tdcnDoExportXML() {
        const escapeXml = (unsafe) => {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe).replace(/[<>&'"]/g, c => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        };

        // 1. DATA AGGREGATION FOR SHEET 2
        let workdays = tdcnDates.length - tdcnIsSunday.filter(s => s).length;
        let extraStartIdx = 8 + tdcnDates.length;
        let idxNgayCong = extraStartIdx + 6;
        let idxDiemMu = extraStartIdx + 2;
        let idxPhep = extraStartIdx + 8;
        let idxViecRieng = extraStartIdx + 9;
        let idxTuDo = extraStartIdx + 10;

        let stations = {};
        let areas = { 'MAIN STAS': 0, 'SUB STAS': 0, 'PACK STAS': 0, 'FA STAS': 0 };

        for (let r = 0; r < tdcnData.length; r++) {
            let row = tdcnData[r];
            let model = (row[1] || '').toString().trim();
            let area = (row[2] || '').toString().trim();
            let station = (row[5] || '').toString().trim();
            let line = (row[7] || '').toString().trim();

            if (!model || !area || !station) continue;

            let key = model + '|' + area + '|' + station;
            if (!stations[key]) {
                stations[key] = {
                    station: station, model: model, area: area, lines: new Set(),
                    nhanVien: 0, diLam100: 0, phep1_2: 0, khongPhep1_2: 0, tren3Ngay: 0, nguoiMoi: 0, loi5: 0, trong3Ngay: 0, duDieuKien: 0
                };
            }
            let st = stations[key];
            if (line) st.lines.add(line);
            st.nhanVien++;

            let nc = parseFloat(row[idxNgayCong]) || 0;
            let loiStr = (row[extraStartIdx + 3] || '').toString().trim();
            let loiProcess = 0;
            if (loiStr !== '') {
                let parsed = parseFloat(loiStr);
                loiProcess = (!isNaN(parsed) && parsed > 0) ? parsed : 1;
            }
            let phep = parseFloat(row[idxPhep]) || 0;
            let khongPhep = parseFloat(row[idxViecRieng]) || 0;
            let tuDo = parseFloat(row[idxTuDo]) || 0;

            let isDiLam100 = true;
            let isPhep1_2 = true;
            let countNianJia = 0;
            let hasNewEmployeeCmt = false;
            for (let c = 8; c < 8 + tdcnDates.length; c++) {
                let val = (row[c] || '').toString().trim();
                let vUp = val.toUpperCase();
                if (vUp !== 'V' && val !== '盘点' && val !== '公司放假' && val !== '周日') isDiLam100 = false;
                if (val === '年假') countNianJia++;
                else if (vUp !== 'V' && val !== '盘点' && val !== '公司放假' && val !== '周日') isPhep1_2 = false;

                if (typeof tdcnComments !== 'undefined' && tdcnComments[r + '_' + c]) {
                    hasNewEmployeeCmt = true;
                }
            }
            if (countNianJia < 1 || countNianJia > 2) isPhep1_2 = false;

            if (isDiLam100) { st.diLam100++; }
            if (isPhep1_2) { st.phep1_2++; }
            if (khongPhep >= 1 && khongPhep <= 2) { st.khongPhep1_2++; }
            if (phep > 2 || khongPhep > 2) { st.tren3Ngay++; }
            if (hasNewEmployeeCmt) { st.nguoiMoi++; }

            st.loi5 += loiProcess;
        }
        let tableData = Object.values(stations);

        // 2. BUILD XML STRING
        let stylesMap = new Map();
        let styleCounter = 1;
        let stylesXml = `<Styles>\n`;
        stylesXml += `<Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Center" ss:Horizontal="Center" ss:WrapText="1"/><Borders/><Font ss:FontName="Arial" ss:Size="10"/><Interior/><NumberFormat/><Protection/></Style>\n`;
        stylesXml += `<Style ss:ID="sHeader"><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/></Borders><Font ss:FontName="Arial" ss:Size="10" ss:Bold="1"/></Style>\n`;

        const getStyle = (bg, txt, bold, align, colspan) => {
            let key = `${bg}_${txt}_${bold}_${align}_${colspan}`;
            if (!stylesMap.has(key)) {
                let id = 's' + styleCounter++;
                stylesMap.set(key, id);
                let s = `<Style ss:ID="${id}">`;
                s += `<Alignment ss:Vertical="Center" ss:Horizontal="${align || 'Center'}" ss:WrapText="1"/>`;
                s += `<Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/></Borders>`;
                let fontAttrs = 'ss:FontName="Arial" ss:Size="10"';
                if (bold) fontAttrs += ' ss:Bold="1"';
                if (txt) fontAttrs += ` ss:Color="${txt}"`;
                s += `<Font ${fontAttrs}/>`;
                if (bg) {
                    s += `<Interior ss:Color="${bg}" ss:Pattern="Solid"/>`;
                }
                s += `</Style>\n`;
                stylesXml += s;
            }
            return stylesMap.get(key);
        };

        // --- SHEET 1 ---
        let ws1Xml = `<Worksheet ss:Name="CHUYEN_CAN">\n<Table>\n`;
        let headers1 = ["STT", "Model", "Area", "ID", "FULL NAME", "STATION", "CA", "LINE"];
        tdcnDates.forEach(d => headers1.push(d));
        tdcnExtraColumns.forEach(c => headers1.push(c));

        // Column widths
        headers1.forEach((_, i) => {
            let w = (i === 4 || i === 5) ? 120 : 60;
            ws1Xml += `<Column ss:Width="${w}"/>\n`;
        });

        ws1Xml += `<Row>`;
        headers1.forEach(h => {
            ws1Xml += `<Cell ss:StyleID="sHeader"><Data ss:Type="String">${escapeXml(h)}</Data></Cell>`;
        });
        ws1Xml += `</Row>\n`;

        let isSunday = [false, false, false, false, false, false, false, false];
        tdcnIsSunday.forEach(s => isSunday.push(s));
        tdcnExtraColumns.forEach(() => isSunday.push(false));

        let indexNgayCong = 8 + tdcnDates.length + 6;
        let indexDiemMu = 8 + tdcnDates.length + 2;
        let indexPhepNam = 8 + tdcnDates.length + 8;
        let indexKhongMoChuyen = 8 + tdcnDates.length + 13;

        tdcnData.forEach((rowData, r) => {
            ws1Xml += `<Row>`;
            rowData.forEach((val, c) => {
                let key = `${r}_${c}`;
                let hexBg = '';
                if (tdcnColors && tdcnColors[key]) hexBg = tdcnColors[key];

                let hexTxt = '';
                if (tdcnTextColors && tdcnTextColors[key]) hexTxt = tdcnTextColors[key];

                let isBold = false;
                if (tdcnDates.length > 0 && (c >= indexNgayCong || c === indexDiemMu)) {
                    if (!hexBg) hexBg = '#e5e7eb';
                    if (c === indexDiemMu) {
                        if (!hexTxt) hexTxt = '#ff0000';
                        isBold = true;
                        if (val == 0) val = '';
                    }
                    if (c >= indexPhepNam && c <= indexKhongMoChuyen) {
                        if (!hexTxt) hexTxt = '#ff0000';
                        isBold = true;
                        if (val == 0) val = '';
                    }
                }
                if (c === 6) isBold = true;
                if (!hexBg && isSunday[c]) hexBg = '#ffff00';

                let align = (c === 4 || c === 5) ? 'Left' : 'Center';
                let styleId = getStyle(hexBg, hexTxt, isBold, align);
                let dataStr = `<Data ss:Type="String">${escapeXml(val)}</Data>`;

                let commentStr = '';
                if (tdcnComments && tdcnComments[key]) {
                    commentStr = `<Comment><ss:Data xmlns="http://www.w3.org/TR/REC-html40">Note:\n${escapeXml(tdcnComments[key])}</ss:Data></Comment>`;
                }

                ws1Xml += `<Cell ss:StyleID="${styleId}">${dataStr}${commentStr}</Cell>`;
            });
            ws1Xml += `</Row>\n`;
        });
        ws1Xml += `</Table>\n</Worksheet>\n`;

        // --- SHEET 2 ---
        let ws2Xml = `<Worksheet ss:Name="DATA">\n<Table>\n`;
        const colW = [180, 80, 80, 80, 80, 80, 80, 80, 80, 80, 80, 80, 80, 40, 40, 100, 80, 80, 80];
        colW.forEach((w, i) => { ws2Xml += `<Column ss:Index="${i + 1}" ss:Width="${w}"/>\n`; });

        let sHBlue = getStyle('#b4c6e7', '#000000', true, 'Center');
        let sHYellow = getStyle('#ffff00', '#000000', true, 'Center');
        let sNormal = getStyle('', '#000000', false, 'Center');
        let sNormalLeft = getStyle('', '#000000', false, 'Left');
        let sBold = getStyle('', '#000000', true, 'Center');
        let sLightYellow = getStyle('#fff2cc', '#000000', false, 'Center');

        // Header Rows
        ws2Xml += `<Row>`;
        ws2Xml += `<Cell ss:MergeAcross="3" ss:StyleID="${getStyle('#b4c6e7', '#000000', true, 'Left')}"><Data ss:Type="String">26/06-25/07</Data></Cell>`;
        ws2Xml += `<Cell ss:MergeAcross="8" ss:StyleID="${sHBlue}"><Data ss:Type="String">Bảng Theo Dõi Thống Kê CTQ</Data></Cell>`;

        // Table 2 Header at Col 16
        let m = tdcnCurrentMonth ? tdcnCurrentMonth : "";
        let y = tdcnCurrentYear ? tdcnCurrentYear : "";
        ws2Xml += `<Cell ss:Index="16" ss:MergeAcross="4" ss:StyleID="${sHBlue}"><Data ss:Type="String">Tháng ${m}.${y}</Data></Cell>`;
        ws2Xml += `</Row>\n`;

        ws2Xml += `<Row>`;
        const headers2 = ["Tên Trạm", "Model", "Bộ Phận", "Line On", "Nhân Viên", "Đi Làm 100%", "Nghỉ phép 1N-2N", "Nghỉ không phép 1N-2N", "Trên 3 Ngày", "Người Mới", "5 Lỗi Process", "Vị Trí Trống 3N", "Đủ ĐK CTQ"];
        headers2.forEach((h, i) => { ws2Xml += `<Cell ${i === 0 ? 'ss:Index="1"' : ''} ss:StyleID="sHeader"><Data ss:Type="String">${escapeXml(h)}</Data></Cell>`; });

        const hT2 = ['STT', 'BỘ PHẬN', 'CTQ (85%)', 'OFFLINE (15%)', 'TOTAL (100%)'];
        hT2.forEach((h, i) => { ws2Xml += `<Cell ${i === 0 ? 'ss:Index="16"' : ''} ss:StyleID="sHeader"><Data ss:Type="String">${escapeXml(h)}</Data></Cell>`; });
        ws2Xml += `</Row>\n`;

        let sumLine = 0; let sumNV = 0;
        let sumAreaCTQ = 0; let sumAreaOff = 0; let sumAreaTot = 0;

        let table2Data = [
            [6, 'MAIN STAS', 0, 0, 0], [7, 'SUB STAS', 0, 0, 0], [8, 'PACK STAS', 0, 0, 0],
            [9, 'FA STAS', 0, 0, 0], ['', 'TOTAL', 0, 0, 0]
        ];

        let rIndex = 0;
        tableData.forEach(st => {
            sumLine += st.lines.size;
            sumNV += st.nhanVien;
            st.duDieuKien = st.nhanVien - st.phep1_2 - st.khongPhep1_2 - st.tren3Ngay - st.nguoiMoi - st.loi5 - st.trong3Ngay;

            let areaKey = st.area.toUpperCase() + ' STAS';
            if (areas[areaKey] !== undefined) areas[areaKey] += st.nhanVien;

            ws2Xml += `<Row>`;
            ws2Xml += `<Cell ss:StyleID="${sBold}"><Data ss:Type="String">${escapeXml(st.station)}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sLightYellow}"><Data ss:Type="String">${escapeXml(st.model)}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sLightYellow}"><Data ss:Type="String">${escapeXml(st.area)}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sLightYellow}"><Data ss:Type="Number">${st.lines.size}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sLightYellow}"><Data ss:Type="Number">${st.nhanVien}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sNormal}"><Data ss:Type="Number">${st.diLam100 || 0}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sNormal}"><Data ss:Type="Number">${st.phep1_2 || 0}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sNormal}"><Data ss:Type="Number">${st.khongPhep1_2 || 0}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sNormal}"><Data ss:Type="Number">${st.tren3Ngay || 0}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sNormal}"><Data ss:Type="Number">${st.nguoiMoi || 0}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sNormal}"><Data ss:Type="Number">${st.loi5 || 0}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sNormal}"><Data ss:Type="Number">${st.trong3Ngay || 0}</Data></Cell>`;
            ws2Xml += `<Cell ss:StyleID="${sHYellow}"><Data ss:Type="Number">${st.duDieuKien}</Data></Cell>`;

            // Write Table 2 row if exists
            if (rIndex < table2Data.length) {
                if (rIndex === 3) { table2Data[3][3] = areas['FA STAS']; table2Data[3][4] = areas['FA STAS']; }
                if (rIndex === 4) {
                    sumAreaCTQ = areas['MAIN STAS'] + areas['SUB STAS'] + areas['PACK STAS'];
                    sumAreaOff = areas['FA STAS'];
                    sumAreaTot = sumAreaCTQ + sumAreaOff;
                    table2Data[4][3] = sumAreaOff; table2Data[4][4] = sumAreaTot;
                }
                let t2R = table2Data[rIndex];
                if (rIndex === 4) {
                    ws2Xml += `<Cell ss:Index="16" ss:MergeAcross="1" ss:StyleID="${sBold}"><Data ss:Type="String">TOTAL</Data></Cell>`;
                    ws2Xml += `<Cell ss:Index="18" ss:StyleID="${sBold}"><Data ss:Type="Number">${t2R[2]}</Data></Cell>`;
                    ws2Xml += `<Cell ss:Index="19" ss:StyleID="${sBold}"><Data ss:Type="Number">${t2R[3]}</Data></Cell>`;
                    ws2Xml += `<Cell ss:Index="20" ss:StyleID="${sBold}"><Data ss:Type="Number">${t2R[4]}</Data></Cell>`;
                } else {
                    ws2Xml += `<Cell ss:Index="16" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[0]}</Data></Cell>`;
                    ws2Xml += `<Cell ss:Index="17" ss:StyleID="${sNormal}"><Data ss:Type="String">${escapeXml(t2R[1])}</Data></Cell>`;
                    ws2Xml += `<Cell ss:Index="18" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[2]}</Data></Cell>`;
                    ws2Xml += `<Cell ss:Index="19" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[3]}</Data></Cell>`;
                    ws2Xml += `<Cell ss:Index="20" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[4]}</Data></Cell>`;
                }
            }
            ws2Xml += `</Row>\n`;
            rIndex++;
        });

        // Write Total Row for Table 1
        ws2Xml += `<Row>`;
        ws2Xml += `<Cell ss:MergeAcross="2" ss:StyleID="${sHBlue}"><Data ss:Type="String">TOTAL</Data></Cell>`;
        ws2Xml += `<Cell ss:StyleID="${sHBlue}"><Data ss:Type="Number">${sumLine}</Data></Cell>`;
        ws2Xml += `<Cell ss:StyleID="${sHBlue}"><Data ss:Type="Number">${sumNV}</Data></Cell>`;
        for (let i = 0; i < 8; i++) {
            ws2Xml += `<Cell ss:StyleID="${sHBlue}"><Data ss:Type="Number">0</Data></Cell>`;
        }

        // Write remaining Table 2 rows if tableData was shorter than table2Data
        while (rIndex < table2Data.length) {
            if (rIndex === 3) { table2Data[3][3] = areas['FA STAS']; table2Data[3][4] = areas['FA STAS']; }
            if (rIndex === 4) {
                sumAreaCTQ = areas['MAIN STAS'] + areas['SUB STAS'] + areas['PACK STAS'];
                sumAreaOff = areas['FA STAS'];
                sumAreaTot = sumAreaCTQ + sumAreaOff;
                table2Data[4][3] = sumAreaOff; table2Data[4][4] = sumAreaTot;
            }
            let t2R = table2Data[rIndex];
            if (rIndex === 4) {
                ws2Xml += `<Cell ss:Index="16" ss:MergeAcross="1" ss:StyleID="${sBold}"><Data ss:Type="String">TOTAL</Data></Cell>`;
                ws2Xml += `<Cell ss:Index="18" ss:StyleID="${sBold}"><Data ss:Type="Number">${t2R[2]}</Data></Cell>`;
                ws2Xml += `<Cell ss:Index="19" ss:StyleID="${sBold}"><Data ss:Type="Number">${t2R[3]}</Data></Cell>`;
                ws2Xml += `<Cell ss:Index="20" ss:StyleID="${sBold}"><Data ss:Type="Number">${t2R[4]}</Data></Cell>`;
            } else {
                ws2Xml += `<Cell ss:Index="16" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[0]}</Data></Cell>`;
                ws2Xml += `<Cell ss:Index="17" ss:StyleID="${sNormal}"><Data ss:Type="String">${escapeXml(t2R[1])}</Data></Cell>`;
                ws2Xml += `<Cell ss:Index="18" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[2]}</Data></Cell>`;
                ws2Xml += `<Cell ss:Index="19" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[3]}</Data></Cell>`;
                ws2Xml += `<Cell ss:Index="20" ss:StyleID="${sNormal}"><Data ss:Type="Number">${t2R[4]}</Data></Cell>`;
            }
            ws2Xml += `</Row>\n<Row>`;
            rIndex++;
        }
        ws2Xml += `</Row>\n`;
        ws2Xml += `</Table>\n</Worksheet>\n`;

        // Assemble Final XML
        let finalXml = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">\n`;
        finalXml += stylesXml + `</Styles>\n` + ws1Xml + ws2Xml + `</Workbook>`;

        let blob = new Blob([finalXml], { type: "application/vnd.ms-excel;charset=utf-8;" });
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = `ChamCong_T${m}_${y}.xls`;
        a.click();
        URL.revokeObjectURL(url);

        if (typeof showToast === 'function') {
            showToast("Đã tải xong file Excel!", "success");
        }
    }

    // =====================================
    // LƯU LÊN GOOGLE SHEETS
    // =====================================
    function tdcnSaveToSheet() {
        if (tdcnData.length === 0) return alert("Chưa có dữ liệu để lưu!");
        if (!confirm("Bạn có chắc chắn muốn lưu dữ liệu tháng " + tdcnCurrentMonth + "/" + tdcnCurrentYear + " lên Google Sheets không?")) return;

        if (typeof showToast === 'function') {
            showToast("Đang lưu lên hệ thống, vui lòng đợi...", "info");
        }

        // Gộp Header và Data (thêm cả tdcnExtraColumns)
        let header = ['STT', 'Model', 'Area', 'ID', 'FULL NAME', 'STATION', 'CA', 'LINE'].concat(tdcnDates).concat(tdcnExtraColumns);
        let fullData = [header].concat(tdcnData);

        // Gọi script backend
        google.script.run
            .withSuccessHandler(function (res) {
                if (res && res.success) {
                    if (typeof showToast === 'function') showToast("Đã lưu thành công vào sheet: " + res.sheetName, "success");
                    else alert("Đã lưu thành công vào sheet: " + res.sheetName);
                } else {
                    let msg = res ? res.message : "Lỗi không xác định";
                    if (typeof showToast === 'function') showToast("Lỗi: " + msg, "error");
                    else alert("Lỗi: " + msg);
                }
            })
            .withFailureHandler(function (err) {
                if (typeof showToast === 'function') showToast("Lỗi kết nối: " + err.message, "error");
                else alert("Lỗi kết nối: " + err.message);
            })
            .luuTheoDoiCongNhan(tdcnCurrentMonth, tdcnCurrentYear, fullData, tdcnComments, tdcnColors, tdcnTextColors);
    }

    // =====================================
    // TẢI LẠI TỪ GOOGLE SHEETS
    // =====================================
    function tdcnLoadFromSheet() {
        let sel = document.getElementById('tdcn-month-select');
        if (!sel || !sel.value) return alert("Vui lòng chọn tháng ở phía trên trước khi tải lại!");
        let parts = sel.value.split('_');
        let m = parseInt(parts[0]);
        let y = parseInt(parts[1]);
        if (!m || !y) return alert("Vui lòng chọn tháng/năm hợp lệ!");

        if (typeof showToast === 'function') showToast("Đang tải dữ liệu từ Google Sheets...", "info");

        google.script.run
            .withSuccessHandler(function (res) {
                if (res && res.success) {
                    tdcnCurrentMonth = m;
                    tdcnCurrentYear = y;
                    tdcnData = res.data;
                    tdcnDates = res.dates;
                    tdcnComments = res.comments || {};
                    tdcnColors = res.colors || {};
                    tdcnTextColors = res.textColors || {};

                    // Tính lại tdcnIsSunday
                    tdcnIsSunday = [];
                    let prevM = m - 1; let prevY = y;
                    if (prevM === 0) { prevM = 12; prevY = y - 1; }
                    let curDate = new Date(prevY, prevM - 1, 26);
                    for (let i = 0; i < tdcnDates.length; i++) {
                        tdcnIsSunday.push(curDate.getDay() === 0);
                        curDate.setDate(curDate.getDate() + 1);
                    }

                    document.getElementById('tdcn-tabs').style.display = 'flex';
                    tdcnSwitchTab(1);
                    tdcnRenderTable();
                    if (typeof showToast === 'function') showToast("Tải dữ liệu thành công! Đang đồng bộ Điểm Mù...", "success");

                    // Đồng thời tải lại cấu hình Quick Fill
                    google.script.run.withSuccessHandler(function (qfRes) {
                        if (qfRes && qfRes.length > 0) {
                            tdcnQuickFillData = qfRes;
                            tdcnUpdateQuickFillUI();
                        }
                    }).getQuickFillData();
                    google.script.run.withSuccessHandler(function (res) {
                        window.tdcnDiemMuData = res || {};
                        tdcnUpdateAllDiemMu();
                    }).getDiemMuTheoThang(m, y);
                } else {
                    let msg = res ? res.message : "Không tìm thấy dữ liệu";
                    if (typeof showToast === 'function') showToast("Lỗi: " + msg, "error");
                    else alert("Lỗi: " + msg);
                }
            })
            .withFailureHandler(function (err) {
                if (typeof showToast === 'function') showToast("Lỗi kết nối: " + err.message, "error");
                else alert("Lỗi kết nối: " + err.message);
            })
            .taiTheoDoiCongNhan(m, y);
    }
    let tdcnFilters = {};
    let tdcnFilterMenuTargetCol = -1;

    function tdcnShowFilterMenu(e, colIdx) {
        e.stopPropagation();
        let menu = document.getElementById('tdcn-filter-menu');

        if (menu.style.display === 'block' && tdcnFilterMenuTargetCol === colIdx) {
            menu.style.display = 'none';
            return;
        }

        tdcnFilterMenuTargetCol = colIdx;

        let uniqueVals = new Set();
        let uniqueColors = new Set();
        tdcnData.forEach((row, r) => {
            let val = row[colIdx];
            if (val !== undefined && val !== null) uniqueVals.add(val.toString().trim());
            let color = tdcnColors[r + '_' + colIdx];
            if (color) uniqueColors.add(color);
        });
        let sortedVals = Array.from(uniqueVals).sort();
        let sortedColors = Array.from(uniqueColors);

        let currentFilter = tdcnFilters[colIdx] || { vals: sortedVals, colors: sortedColors.concat(['none']) };
        let currentVals = Array.isArray(currentFilter) ? currentFilter : (currentFilter.vals || sortedVals);
        let currentColors = Array.isArray(currentFilter) ? sortedColors.concat(['none']) : (currentFilter.colors || sortedColors.concat(['none']));

        let html = `
        <div style="padding: 5px; border-bottom: 1px solid #ccc; font-weight: bold; background: #f8fafc;">Lọc theo Giá trị</div>
        <div style="padding: 5px; border-bottom: 1px solid #ccc;">
            <label><input type="checkbox" id="tdcn-filter-all" onchange="tdcnFilterToggleAll(this, 'tdcn-filter-cb-val')" ${currentVals.length === sortedVals.length ? 'checked' : ''}> (Chọn tất cả)</label>
        </div>
        <div style="max-height: 200px; overflow-y: auto; padding: 5px; border-bottom: 1px solid #ccc;">
    `;

        sortedVals.forEach(val => {
            let checked = currentVals.includes(val) ? 'checked' : '';
            let displayVal = val === '' ? '(Trống)' : val;
            html += `<div><label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" class="tdcn-filter-cb-val" value="${val}" ${checked}> ${displayVal}</label></div>`;
        });
        html += `</div>`;

        html += `
        <div style="padding: 5px; border-bottom: 1px solid #ccc; font-weight: bold; background: #f8fafc;">Lọc theo Màu nền</div>
        <div style="padding: 5px; border-bottom: 1px solid #ccc;">
            <label><input type="checkbox" id="tdcn-filter-all-color" onchange="tdcnFilterToggleAll(this, 'tdcn-filter-cb-color')" ${currentColors.length === sortedColors.length + 1 ? 'checked' : ''}> (Chọn tất cả màu)</label>
        </div>
        <div style="max-height: 150px; overflow-y: auto; padding: 5px;">
            <div><label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" class="tdcn-filter-cb-color" value="none" ${currentColors.includes('none') ? 'checked' : ''}> (Không màu)</label></div>
        `;
        sortedColors.forEach(color => {
            let checked = currentColors.includes(color) ? 'checked' : '';
            html += `<div><label style="display:flex; align-items:center; gap:5px;"><input type="checkbox" class="tdcn-filter-cb-color" value="${color}" ${checked}> <span style="display:inline-block; width:16px; height:16px; background-color:${color}; border:1px solid #000;"></span> ${color}</label></div>`;
        });
        html += `</div>`;

        html += `
        <div style="padding: 8px; text-align: right; border-top: 1px solid #ccc; background: #f1f5f9;">
            <button onclick="tdcnApplyFilterMenu()" style="padding: 6px 16px; cursor:pointer; background:#2563eb; color:#fff; border:none; border-radius:4px; font-weight:bold;">OK</button>
        </div>
    `;

        menu.innerHTML = html;
        menu.style.width = '260px'; // Làm to menu
        menu.style.display = 'block';

        let rect = e.target.getBoundingClientRect();
        menu.style.left = rect.left + 'px';
        menu.style.top = (rect.bottom + window.scrollY) + 'px';
    }

    function tdcnFilterToggleAll(cb, targetClass) {
        let cbs = document.querySelectorAll('.' + targetClass);
        cbs.forEach(c => c.checked = cb.checked);
    }

    function tdcnApplyFilterMenu() {
        let valCbs = document.querySelectorAll('.tdcn-filter-cb-val');
        let selectedVals = [];
        valCbs.forEach(c => { if (c.checked) selectedVals.push(c.value); });

        let colorCbs = document.querySelectorAll('.tdcn-filter-cb-color');
        let selectedColors = [];
        colorCbs.forEach(c => { if (c.checked) selectedColors.push(c.value); });

        let allValsSelected = (selectedVals.length === valCbs.length);
        let allColorsSelected = (colorCbs.length === 0 || selectedColors.length === colorCbs.length);

        if (allValsSelected && allColorsSelected) {
            delete tdcnFilters[tdcnFilterMenuTargetCol];
        } else {
            tdcnFilters[tdcnFilterMenuTargetCol] = { vals: selectedVals, colors: selectedColors };
        }

        document.getElementById('tdcn-filter-menu').style.display = 'none';
        tdcnUpdateTableFilterDisplay();
    }

    function tdcnUpdateTableFilterDisplay() {
        let tbody = document.getElementById('tdcn-tbody');
        for (let r = 0; r < tdcnData.length; r++) {
            let tr = tbody.children[r];
            if (!tr) continue;
            let rowData = tdcnData[r];
            let show = true;

            for (let colIdx in tdcnFilters) {
                let filterObj = tdcnFilters[colIdx];
                let cellVal = (rowData[colIdx] || '').toString().trim();
                let cellColor = tdcnColors[r + '_' + colIdx] || 'none';

                let selectedVals = Array.isArray(filterObj) ? filterObj : (filterObj.vals || []);
                let selectedColors = Array.isArray(filterObj) ? null : filterObj.colors;

                if (!selectedVals.includes(cellVal)) {
                    show = false;
                    break;
                }
                if (selectedColors && selectedColors.length > 0 && !selectedColors.includes(cellColor)) {
                    show = false;
                    break;
                }
            }
            tr.style.display = show ? '' : 'none';
        }

        let totalCols = 8 + tdcnDates.length + 14;
        for (let i = 0; i < totalCols; i++) {
            let icon = document.getElementById('tdcn-filter-icon-' + i);
            if (icon) {
                icon.style.color = tdcnFilters[i] ? 'red' : '#666';
            }
        }
    }

    window.tdcnDiemMuData = {};
    function tdcnUpdateAllDiemMu() {
        if (!tdcnData || tdcnData.length === 0) return;
        let indexDiemMu = 8 + tdcnDates.length + 2;
        let tbody = document.getElementById('tdcn-tbody');

        for (let r = 0; r < tdcnData.length; r++) {
            let empId = (tdcnData[r][3] || "").toString().trim();
            if (empId !== "" && window.tdcnDiemMuData[empId]) {
                tdcnData[r][indexDiemMu] = window.tdcnDiemMuData[empId];
            } else {
                tdcnData[r][indexDiemMu] = "";
            }

            if (tbody && tbody.children[r]) {
                let cell = tbody.children[r].children[indexDiemMu];
                if (cell) {
                    let val = tdcnData[r][indexDiemMu];
                    if (val == 0) val = '';
                    cell.innerText = val;
                }
            }
        }
    }

            if (areaName.startsWith('MAIN ')) searchKey = areaName.replace('MAIN ', 'MAINLINE ');
            if (areaName.startsWith('SUB ')) searchKey = areaName.replace('SUB ', 'SUBLINE ');
            if (areaName.startsWith('PACK ')) searchKey = areaName.replace('PACK ', 'PACKOUT ');

            // Find total employees eligible for CTQ for this area
            let areaTotal = 0;
            tableData.forEach(st => {

            });

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        </div>
        `;
        document.getElementById('tdcn-data-preview').innerHTML = html;
    }

                .withSuccessHandler(function (res) {

                        window.tcmtCachedData = res.data;
