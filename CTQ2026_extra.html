    function ycctCalcTimeDiff(time1Str, time2Str) {
        try {
            // Format: dd/MM/yyyy HH:mm:ss
            let p1 = time1Str.split(' ');
            let d1 = p1[0].split('/');
            let t1 = p1[1] ? p1[1].split(':') : [0,0,0];
            let date1 = new Date(d1[2], d1[1]-1, d1[0], t1[0]||0, t1[1]||0, t1[2]||0);

            let p2 = time2Str.split(' ');
            let d2 = p2[0].split('/');
            let t2 = p2[1] ? p2[1].split(':') : [0,0,0];
            let date2 = new Date(d2[2], d2[1]-1, d2[0], t2[0]||0, t2[1]||0, t2[2]||0);

            let diffMs = Math.abs(date2 - date1);
            let diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 60) return diffMin + ' phút';
            let diffHr = Math.floor(diffMin / 60);
            let remMin = diffMin % 60;
            if (diffHr < 24) return diffHr + 'h ' + remMin + 'p';
            let diffDays = Math.floor(diffHr / 24);
            return diffDays + ' ngày ' + (diffHr % 24) + 'h';
        } catch(e) {
            return '';
        }
    }

    function ycctCalcTimeSince(timeStr) {
        try {
            // Format: dd/MM/yyyy HH:mm:ss
            let p = timeStr.split(' ');
            let d = p[0].split('/');
            let t = p[1] ? p[1].split(':') : [0,0,0];
            let dateFrom = new Date(d[2], d[1]-1, d[0], t[0]||0, t[1]||0, t[2]||0);
            let now = new Date();
            let diffMs = now - dateFrom;
            if (diffMs < 0) return '';
            let diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 1) return 'Vừa xong';
            if (diffMin < 60) return diffMin + ' phút';
            let diffHr = Math.floor(diffMin / 60);
            let remMin = diffMin % 60;
            if (diffHr < 24) return diffHr + 'h ' + remMin + 'p';
            let diffDays = Math.floor(diffHr / 24);
            return diffDays + ' ngày ' + (diffHr % 24) + 'h';
        } catch(e) {
            return '';
        }
    }

    function ycctApprove(rowIdx, action) {
        let data = G_Data.capThe || [];
        let r = data[rowIdx];
        if (!r) return;

        let actionLabel = action === 'confirm' ? 'XÁC NHẬN THẺ' : (action === 'approve_print' ? 'DUYỆT IN THẺ' : 'TỪ CHỐI');
        let msg = 'Bạn xác nhận ' + actionLabel + ' cho:\n' + (r[4] || '') + ' - ' + (r[5] || '') + '?';
        if (!confirm(msg)) return;

        showToast('Đang xử lý...', 'info');
        google.script.run.withSuccessHandler(function(res) {
            if (res && res.success) {
                showToast('✅ ' + actionLabel + ' thành công!', 'success');

                // 1. Dùng dữ liệu mới từ server nếu có (server trả sau khi đã ghi vào sheet)
                if (res.newCapTheData && res.newCapTheData.length > 0) {
                    G_Data.capThe = res.newCapTheData;
                } else {
                    // 2. Fallback: Cập nhật trực tiếp local data
                    let now = new Date();
                    let timeStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
                    let cu = CURRENT_USER || '';
                    let row = G_Data.capThe[rowIdx];
                    if (row) {
                        if (action === 'confirm') {
                            row[10] = 'pending_print';
                            row[11] = cu;
                            row[12] = timeStr;
                        } else if (action === 'approve_print') {
                            row[10] = 'approved';
                            row[13] = cu;
                            row[14] = timeStr;
                        } else if (action === 'reject') {
                            row[10] = 'rejected';
                            if (!row[11]) { row[11] = cu; row[12] = timeStr; }
                            else { row[13] = cu; row[14] = timeStr; }
                        }
                    }
                }

                // 3. Bật bảo vệ 30 giây: ngăn background sync ghi đè capThe cũ
                window._ycctApproveProtectUntil = Date.now() + 30000;

                // 4. Cập nhật cache ngay với dữ liệu mới
                try { setCacheData(CACHE_KEY, G_Data, 5 * 60 * 1000); } catch(e) {}

                // 5. Render lại bảng ngay lập tức
                ycctRenderDataTab();
            } else {
                showToast('❌ Lỗi: ' + (res.message || ''), 'error');
            }
        }).withFailureHandler(function(err) {
            showToast('❌ Lỗi hệ thống: ' + err.message, 'error');
        }).approveCardRequest([rowIdx], action, CURRENT_USER || '');
    }

    function ycctFilterData() {
        let keyword = (document.getElementById('ycct-search').value || '').trim().toLowerCase();
        let rows = document.querySelectorAll('#ycct-data-body tr');
        rows.forEach(function(tr) {
            let text = tr.textContent.toLowerCase();
            tr.style.display = (!keyword || text.includes(keyword)) ? '' : 'none';
        });
    }

    function ycctToggleAll(master) {
        document.querySelectorAll('.ycct-data-cb').forEach(function(cb) { cb.checked = master.checked; });
        ycctCheckDelBtn();
    }

    function ycctCheckDelBtn() {
        let checked = document.querySelectorAll('.ycct-data-cb:checked').length;
        // Kiểm tra quyền "xac-nhan-in-the" hoặc admin role
        let perms = (window.USER_PERMS || '').split(',').map(function(s) { return s.trim(); });
        let hasPermInThe = perms.includes('xac-nhan-in-the') || perms.includes('admin') || window.CURRENT_ROLE === 'admin';
        let showStyle = (checked > 0 && hasPermInThe) ? 'inline-flex' : 'none';
        let btn = document.getElementById('ycct-del-btn');
        let btnCap = document.getElementById('ycct-capthe-btn');
        let btnCs = document.getElementById('ycct-chinhsua-btn');
        if (btn) btn.style.display = showStyle;
        if (btnCap) btnCap.style.display = showStyle;
        if (btnCs) btnCs.style.display = showStyle;
    }

    function ycctGetSelectedMaCodes() {
        let checked = document.querySelectorAll('.ycct-data-cb:checked');
        let maCodes = [];
        let capTheData = G_Data.capThe || [];
        checked.forEach(function(cb) {
            let rowIdx = parseInt(cb.value);
            if (capTheData[rowIdx] && capTheData[rowIdx][4]) {
                maCodes.push(String(capTheData[rowIdx][4]).trim().toUpperCase());
            }
        });
        return maCodes;
    }

    // ========== CẤP THẺ: Chuyển sang tab In Thẻ và auto-fill dữ liệu từ THÔNG TIN THẺ ==========
    function ycctCapThe() {
        let maCodes = ycctGetSelectedMaCodes();
        if (maCodes.length === 0) return showToast('Chưa chọn mã thẻ nào!', 'warning');

        // Tìm thông tin trong THÔNG TIN THẺ
        let ttt = G_Data.thongTinThe;
        if (!ttt || ttt.length < 3) return showToast('Không có dữ liệu THÔNG TIN THẺ!', 'error');

        let foundRows = [];
        let notFound = [];
        maCodes.forEach(function(ma) {
            let found = null;
            for (let i = 2; i < ttt.length; i++) {
                if (ttt[i][4] && String(ttt[i][4]).trim().toUpperCase() === ma) {
                    found = { data: ttt[i], globalIdx: i };
                    break;
                }
            }
            if (found) foundRows.push(found);
            else notFound.push(ma);
        });

        if (foundRows.length === 0) return showToast('Không tìm thấy mã thẻ nào trong THÔNG TIN THẺ: ' + notFound.join(', '), 'error');
        if (notFound.length > 0) showToast('Không tìm thấy trong THÔNG TIN THẺ: ' + notFound.join(', '), 'warning');

        // Chuyển sang tab In Thẻ
        switchTab('in-the');

        // Đợi tab In Thẻ render xong rồi fill dữ liệu
        setTimeout(function() {
            // Xóa dòng trống đầu tiên nếu có
            let existingRows = document.querySelectorAll('#tbl-in-the tbody tr');
            if (existingRows.length === 1) {
                let firstMa = existingRows[0].querySelector('.i-ma');
                if (firstMa && !firstMa.value.trim()) existingRows[0].remove();
            }

            foundRows.forEach(function(item) {
                let r = item.data;
                // THONG TIN THE: [0]=LINE, [1]=MODEL, [2]=BO PHAN, [3]=TO TRUONG, [4]=MA THE, [5]=HO TEN, [6]=NGAY VAO, [7]=NGAY PHAT, [8]=LOAI THE, [9]=DEN HAN, [15]=CTQ1, [16]=CTQ2, [17]=CTQ3

                // Thêm dòng mới
                if (typeof addInTheRow2 === 'function') addInTheRow2();

                let allRows = document.querySelectorAll('#tbl-in-the tbody tr');
                let newRow = allRows[allRows.length - 1];
                if (!newRow) return;

                // Fill MÃ THẺ
                let maInput = newRow.querySelector('.i-ma');
                if (maInput) {
                    maInput.value = r[4] || '';
                    // Trigger timMaTheInThe to auto-fill the rest
                    if (typeof timMaTheInThe === 'function') timMaTheInThe(maInput);
                }
            });

            showToast('✅ Đã chuyển ' + foundRows.length + ' mã thẻ sang In Thẻ!', 'success');
        }, 500);
    }

    // ========== CHỈNH SỬA: Hiện modal edit với dữ liệu từ THÔNG TIN THẺ ==========
    function ycctChinhSua() {
        let maCodes = ycctGetSelectedMaCodes();
        if (maCodes.length === 0) return showToast('Chưa chọn mã thẻ nào!', 'warning');

        let ttt = G_Data.thongTinThe;
        if (!ttt || ttt.length < 3) return showToast('Không có dữ liệu THÔNG TIN THẺ!', 'error');

        let foundRows = [];
        let notFound = [];
        maCodes.forEach(function(ma) {
            for (let i = 2; i < ttt.length; i++) {
                if (ttt[i][4] && String(ttt[i][4]).trim().toUpperCase() === ma) {
                    foundRows.push({ data: ttt[i].slice(), sheetRow: i + 1, globalIdx: i });
                    break;
                }
            }
            if (!foundRows.some(function(f) { return String(f.data[4]).trim().toUpperCase() === ma; })) {
                notFound.push(ma);
            }
        });

        if (foundRows.length === 0) return showToast('Không tìm thấy mã thẻ nào trong THÔNG TIN THẺ: ' + notFound.join(', '), 'error');
        if (notFound.length > 0) showToast('Không tìm thấy: ' + notFound.join(', '), 'warning');

        // Build edit form cards (2-row grid design)
        let tbody = document.getElementById('ycct-edit-body');
        if (!tbody) return;
        let html = '';

        foundRows.forEach(function(item, idx) {
            let r = item.data;
            // [0]=LINE, [1]=MODEL, [2]=BO PHAN, [3]=TO TRUONG, [4]=MA THE, [5]=HO TEN, [6]=NGAY VAO, [7]=NGAY PHAT, [8]=LOAI THE, [9]=DEN HAN, [15]=CTQ1, [16]=CTQ2, [17]=CTQ3
            html += '<div class="ycct-edit-card" data-sheet-row="' + item.sheetRow + '" data-global-idx="' + item.globalIdx + '">';
            
            // Header for card
            html += '  <div class="ycct-edit-card-header">';
            html += '    <div class="ycct-edit-card-title">👤 Nhân viên #' + (idx + 1) + ': <span style="color:#0f5132; font-weight:900;">' + (r[5] || 'Chưa có tên') + '</span></div>';
            html += '    <span class="ycct-edit-badge-code">💳 MÃ THẺ: ' + (r[4] || '') + '</span>';
            html += '  </div>';

            // HÀNG 1: THÔNG TIN HÀNH CHÍNH (6 Ô SELECTION)
            html += '  <div class="ycct-edit-grid-row1">';
            html += '    <div class="ycct-edit-field"><label>MÃ THẺ</label><input type="text" value="' + (r[4] || '') + '" readonly style="color:#0d6efd; font-weight:900; background:#eff6ff;"></div>';
            html += '    <div class="ycct-edit-field"><label>HỌ TÊN</label><input type="text" class="ycct-e-ten" value="' + (r[5] || '') + '"></div>';
            html += '    <div class="ycct-edit-field"><label>LINE</label><select class="ycct-e-line">' + generateOptionsValGen(1, r[0] || '') + '</select></div>';
            html += '    <div class="ycct-edit-field"><label>MODEL</label><select class="ycct-e-model">' + generateOptionsValGen(5, r[1] || '') + '</select></div>';
            html += '    <div class="ycct-edit-field"><label>BỘ PHẬN</label><select class="ycct-e-bophan">' + generateOptionsValGen(3, r[2] || '') + '</select></div>';
            html += '    <div class="ycct-edit-field"><label>TỔ TRƯỞNG</label><select class="ycct-e-totruong">' + generateOptionsValGen(2, r[3] || '') + '</select></div>';
            html += '  </div>';

            // HÀNG 2: THỜI HẠN (4 Ô)
            html += '  <div class="ycct-edit-grid-row2">';
            html += '    <div class="ycct-edit-field"><label>NGÀY VÀO</label><input type="text" class="ycct-e-ngayvao" value="' + (r[6] || '') + '" readonly></div>';
            html += '    <div class="ycct-edit-field"><label>NGÀY PHÁT</label><input type="date" class="ycct-e-ngayphat" value="' + parseDateForInput(r[7] || '') + '"></div>';
            html += '    <div class="ycct-edit-field"><label>LOẠI THẺ</label><select class="ycct-e-loai"><option value="6"' + (r[8] == '6' ? ' selected' : '') + '>6 Tháng</option><option value="12"' + (r[8] == '12' ? ' selected' : '') + '>12 Tháng</option></select></div>';
            html += '    <div class="ycct-edit-field"><label>ĐẾN HẠN</label><input type="text" class="ycct-e-denhan" value="' + (r[9] || '') + '" readonly></div>';
            html += '  </div>';

            // HÀNG 3: TRẠM CTQ (3 Ô rộng dài vừa tên trạm)
            html += '  <div class="ycct-edit-grid-row3">';
            html += '    <div class="ycct-edit-field"><label>🏭 TRẠM CTQ 1</label><select class="ycct-e-ctq1">' + generateOptionsValGen(0, r[15] || '') + '</select></div>';
            html += '    <div class="ycct-edit-field"><label>🏭 TRẠM CTQ 2</label><select class="ycct-e-ctq2">' + generateOptionsValGen(0, r[16] || '') + '</select></div>';
            html += '    <div class="ycct-edit-field"><label>🏭 TRẠM CTQ 3</label><select class="ycct-e-ctq3">' + generateOptionsValGen(0, r[17] || '') + '</select></div>';
            html += '  </div>';

            html += '</div>';
        });

        tbody.innerHTML = html;
        document.getElementById('ycct-edit-overlay').style.display = 'flex';
    }

    function ycctCloseEdit() {
        document.getElementById('ycct-edit-overlay').style.display = 'none';
        document.getElementById('ycct-edit-body').innerHTML = '';
    }

    function ycctSaveEdit() {
        let rows = document.querySelectorAll('#ycct-edit-body [data-sheet-row]');
        if (rows.length === 0) return;

        let saveQueue = [];
        rows.forEach(function(tr) {
            let sheetRow = parseInt(tr.dataset.sheetRow);
            let globalIdx = parseInt(tr.dataset.globalIdx);
            let originalData = G_Data.thongTinThe[globalIdx];
            if (!originalData) return;

            // Build data array (18 columns matching THÔNG TIN THẺ)
            let newData = originalData.slice(0, 18);
            newData[0] = tr.querySelector('.ycct-e-line').value;      // LINE
            newData[1] = tr.querySelector('.ycct-e-model').value;     // MODEL
            newData[2] = tr.querySelector('.ycct-e-bophan').value;    // BỘ PHẬN
            newData[3] = tr.querySelector('.ycct-e-totruong').value;  // TỔ TRƯỞNG
            // [4] = MÃ THẺ (readonly)
            newData[5] = tr.querySelector('.ycct-e-ten').value;       // HỌ TÊN
            // [6] = NGÀY VÀO (readonly)
            let ngayPhat = tr.querySelector('.ycct-e-ngayphat').value;
            newData[7] = ngayPhat ? formatDateForSheet(ngayPhat) : originalData[7]; // NGÀY PHÁT
            newData[8] = tr.querySelector('.ycct-e-loai').value;      // LOẠI THẺ
            // [9] = ĐẾN HẠN (tính lại)
            newData[15] = tr.querySelector('.ycct-e-ctq1').value;     // CTQ 1
            newData[16] = tr.querySelector('.ycct-e-ctq2').value;     // CTQ 2
            newData[17] = tr.querySelector('.ycct-e-ctq3').value;     // CTQ 3

            saveQueue.push({ sheetRow: sheetRow, data: newData, globalIdx: globalIdx });
        });

        if (saveQueue.length === 0) return showToast('Không có dữ liệu để lưu!', 'warning');
        if (!confirm('Bạn xác nhận lưu chỉnh sửa ' + saveQueue.length + ' nhân viên vào THÔNG TIN THẺ?')) return;

        showToast('Đang lưu chỉnh sửa...', 'info');

        let saved = 0;
        let total = saveQueue.length;

        saveQueue.forEach(function(item) {
            google.script.run.withSuccessHandler(function(newData) {
                saved++;
                G_Data.thongTinThe = newData;
                if (saved === total) {
                    showToast('✅ Đã lưu chỉnh sửa ' + total + ' nhân viên thành công!', 'success');
                    ycctCloseEdit();
                    // Refresh data tab
                    ycctRenderDataTab();
                }
            }).withFailureHandler(function(err) {
                saved++;
                showToast('❌ Lỗi lưu mã ' + item.data[4] + ': ' + err.message, 'error');
                if (saved === total) ycctCloseEdit();
            }).luuChinhSuaThongTin(item.sheetRow, item.data, CURRENT_USER);
        });
    }

    function ycctDeleteSelected() {
        let checked = document.querySelectorAll('.ycct-data-cb:checked');
        if (checked.length === 0) return;
        if (!confirm('Bạn xác nhận xóa ' + checked.length + ' dòng đã chọn?')) return;

        let rowIndexes = [];
        checked.forEach(function(cb) { rowIndexes.push(parseInt(cb.value)); });
        rowIndexes.sort(function(a, b) { return b - a; }); // Xóa từ dưới lên

        showToast('Đang xóa...', 'info');

        google.script.run.withSuccessHandler(function(res) {
            if (res && res.success) {
                showToast('✅ Đã xóa thành công!', 'success');
                if (res.newCapTheData) G_Data.capThe = res.newCapTheData;
                ycctRenderDataTab();
                let checkAll = document.getElementById('ycct-check-all');
                if (checkAll) checkAll.checked = false;
                ycctCheckDelBtn();
            } else {
                showToast('❌ Lỗi: ' + (res.message || 'Không xác định'), 'error');
            }
        }).withFailureHandler(function(err) {
            showToast('❌ Lỗi hệ thống: ' + err.message, 'error');
        }).deleteYeuCauCapThe(rowIndexes, CURRENT_USER);
    }

</script>
