    function setupPasteHandler(type) {
        const tbody = document.getElementById(`tcmt-input-tbody-${type}`);
        if (!tbody) return;

        tbody.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                tcmtSearch(type);
            }
        });

        tbody.addEventListener('paste', function (e) {
            e.preventDefault();
            const clipText = (e.clipboardData || window.clipboardData).getData('text');
            if (!clipText) return;

            const lines = clipText.split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
            if (lines.length === 0) return;

            const inputs = tbody.querySelectorAll('.tcmt-input');
            let startIdx = 0;
            const activeEl = document.activeElement;
            if (activeEl && activeEl.classList.contains('tcmt-input')) {
                startIdx = parseInt(activeEl.dataset.row) - 1;
            } else {
                for (let i = 0; i < inputs.length; i++) {
                    if (!inputs[i].value.trim()) { startIdx = i; break; }
                }
            }

            const needed = startIdx + lines.length;
            const current = inputs.length;
            if (needed > current) {
                tcmtAddRows(type, needed - current);
            }

            setTimeout(() => {
                const allInputs = tbody.querySelectorAll('.tcmt-input');
                for (let i = 0; i < lines.length; i++) {
                    if (allInputs[startIdx + i]) {
                        allInputs[startIdx + i].value = lines[i];
                    }
                }
            }, 50);
        });
    }

    window.tcmtSwitchTab = function (type) {
        document.getElementById('tcmt-tab-btn-mathe').classList.remove('active');
        document.getElementById('tcmt-tab-btn-hoten').classList.remove('active');
        document.getElementById('tcmt-view-mathe').classList.remove('active');
        document.getElementById('tcmt-view-hoten').classList.remove('active');

        document.getElementById(`tcmt-tab-btn-${type}`).classList.add('active');
        document.getElementById(`tcmt-view-${type}`).classList.add('active');
    };

    window.tcmtAddRows = function (type, count) {
        const tbody = document.getElementById(`tcmt-input-tbody-${type}`);
        if (!tbody) return;
        const currentRows = tbody.querySelectorAll('tr').length;
        const ph = type === 'mathe' ? (getTxt('tcmt_input_ph') || 'Nhập mã thẻ...') : (getTxt('tcmt_input_name_ph') || 'Nhập họ tên...');
        for (let i = 1; i <= count; i++) {
            const idx = currentRows + i;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align:center; font-weight:bold; color:#64748b; width:50px;">${idx}</td>
                <td><input type="text" class="tcmt-input" data-row="${idx}" placeholder="${getTxt('tcmt_input_ph') || 'Nhập mã thẻ...'}" style="width:100%; border:none; outline:none; background:transparent; font-size:14px; font-weight:600; padding:8px 12px; color:#1e293b;"></td>
            `;
            tr.style.opacity = '0';
            tr.style.transform = 'translateY(5px)';
            tbody.appendChild(tr);
            setTimeout(() => { tr.style.transition = 'all 0.2s ease'; tr.style.opacity = '1'; tr.style.transform = 'translateY(0)'; }, 20 * i);
        }
    }

    window.tcmtClearAll = function (type) {
        const tbody = document.getElementById(`tcmt-input-tbody-${type}`);
        if (!tbody) return;
        let rows = '';
        const ph = type === 'mathe' ? (getTxt('tcmt_input_ph') || 'Nhập mã thẻ...') : (getTxt('tcmt_input_name_ph') || 'Nhập họ tên...');
        for (let i = 1; i <= 10; i++) {
            rows += `<tr>
                <td style="text-align:center; font-weight:bold; color:#64748b; width:50px;">${i}</td>
                <td><input type="text" class="tcmt-input" data-row="${i}" placeholder="${ph}" style="width:100%; border:none; outline:none; background:transparent; font-size:15px; font-weight:600; padding:10px 12px; color:#1e293b;"></td>
            </tr>`;
        }
        tbody.innerHTML = rows;

        const resultArea = document.getElementById(`tcmt-result-area-${type}`);
        if (resultArea) resultArea.innerHTML = `<div class="tcmt-result-empty" data-lang="tcmt_wait">${getTxt('tcmt_wait') || 'Nhập mã thẻ và bấm 🔍 TÌM KIẾM để xem kết quả.'}</div>`;
        const statBar = document.getElementById(`tcmt-stat-bar-${type}`);
        if (statBar) statBar.style.display = 'none';
    };

    window.tcmtSearch = function (type) {
        const inputs = document.querySelectorAll(`#tcmt-input-tbody-${type} .tcmt-input`);
        const searchList = [];
        inputs.forEach(inp => {
            const v = inp.value.trim();
            if (v) searchList.push(v);
        });

        if (searchList.length === 0) {
            showToast('Vui lòng nhập ít nhất 1 dòng!', 'error');
            return;
        }

        const resultArea = document.getElementById(`tcmt-result-area-${type}`);
        resultArea.innerHTML = `<div class="tcmt-result-empty" style="color:#059669;"><div class="loader-spinner" style="width:30px;height:30px;border-width:3px;margin:0 auto 10px;"></div><span data-lang="tcmt_loading">${getTxt('tcmt_loading') || 'Đang tra cứu dữ liệu...'}</span></div>`;

        if (window.tcmtCachedData) {
            setTimeout(() => {
                const results = tcmtDoLocalSearch(type, searchList);
                tcmtRenderResults(type, results, searchList);
            }, 50);
        } else {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (!res || !res.success) {
                        resultArea.innerHTML = `<div class="tcmt-result-empty" style="color:#ef4444;">❌ ${res ? res.message : 'Lỗi kết nối!'}</div>`;
                        return;
                    }
                    window.tcmtCachedData = res.data;
                    const results = tcmtDoLocalSearch(type, searchList);
                    tcmtRenderResults(type, results, searchList);
                })
                .withFailureHandler(function (err) {
                    resultArea.innerHTML = `<div class="tcmt-result-empty" style="color:#ef4444;">❌ Lỗi: ${err.message || err}</div>`;
                })
                .getAllTraCuuData();
        }
    };

    function tcmtDoLocalSearch(type, searchList) {
        const results = {};
        searchList.forEach(k => {
            const up = k.toUpperCase();
            if (!results[up]) results[up] = [];
        });

        for (let i = 0; i < window.tcmtCachedData.length; i++) {
            const row = window.tcmtCachedData[i];
            const boPhan = row[0], maThe = String(row[1]).toUpperCase(), hoTen = String(row[2]).toUpperCase();
            const originalMaThe = row[1], originalHoTen = row[2];

            searchList.forEach(k => {
                const up = k.toUpperCase();
                if ((type === 'mathe' && maThe === up) || (type === 'hoten' && hoTen.includes(up))) {
                    // Note: for hoTen, allowing partial match (includes) might be useful, 
                    // but we will keep exact match as per the original server code for consistency, 
                    // or maybe includes is better for hoten? The server code used exact match `hoTen === up`.
                    if ((type === 'mathe' && maThe === up) || (type === 'hoten' && hoTen === up)) {
                        results[up].push({
                            boPhan: boPhan,
                            maThe: originalMaThe,
                            hoTen: originalHoTen,
                            ngayVao: row[3],
                            ngayDL: row[4],
                            chamCong: row[5],
                            gioVe: row[6],
                            ca: row[7]
                        });
                    }
                }
            });
        }
        return results;
    }

    function tcmtRenderResults(type, results, searchList) {
        const resultArea = document.getElementById(`tcmt-result-area-${type}`);
        const statBar = document.getElementById(`tcmt-stat-bar-${type}`);

        let totalRows = 0;
        let foundCount = 0;
        let notFoundCount = 0;
        let notFoundList = [];

        searchList.forEach(keyText => {
            const key = keyText.toUpperCase();
            if (results[key] && results[key].length > 0) {
                foundCount++;
                totalRows += results[key].length;
            } else {
                notFoundCount++;
                notFoundList.push(keyText);
            }
        });

        statBar.style.display = 'flex';
        statBar.innerHTML = `
            <div class="tcmt-stat-item">📋 ${type === 'mathe' ? (getTxt('tcmt_th_mathe') || 'Mã Thẻ') : (getTxt('tcmt_th_hoten') || 'Họ Tên')}: <span class="tcmt-stat-num">${searchList.length}</span></div>
            <div class="tcmt-stat-item">✅ ${getTxt('msg_found') || 'Tìm thấy'}: <span class="tcmt-stat-num" style="background:#059669;">${foundCount}</span></div>
            <div class="tcmt-stat-item">❌ ${getTxt('msg_not_found') || 'Không thấy'}: <span class="tcmt-stat-num" style="background:${notFoundCount > 0 ? '#ef4444' : '#94a3b8'};">${notFoundCount}</span></div>
            <div class="tcmt-stat-item">📄 ${getTxt('add_row') || 'Dòng'}: <span class="tcmt-stat-num" style="background:#0369a1;">${totalRows}</span></div>
        `;

        if (totalRows === 0) {
            resultArea.innerHTML = `<div class="tcmt-result-empty" style="color:#ef4444;" data-lang="tcmt_no_data">${getTxt('tcmt_no_data') || 'Không tìm thấy dữ liệu.'}</div>`;
            return;
        }

        let tableHtml = `
            <table class="tcmt-result-tbl">
                <thead><tr>
                    <th data-lang="tcmt_th_stt">${getTxt('tcmt_th_stt') || 'STT'}</th>
                    <th data-lang="tcmt_th_mathe">${getTxt('tcmt_th_mathe') || 'MÃ THẺ'}</th>
                    <th data-lang="tcmt_th_hoten">${getTxt('tcmt_th_hoten') || 'HỌ VÀ TÊN'}</th>
                    <th data-lang="tcmt_th_bophan">${getTxt('tcmt_th_bophan') || 'BỘ PHẬN'}</th>
                    <th data-lang="tcmt_th_ngayvao">${getTxt('tcmt_th_ngayvao') || 'NGÀY VÀO'}</th>
                    <th data-lang="tcmt_th_ngaydl">${getTxt('tcmt_th_ngaydl') || 'NGÀY CÓ DỮ LIỆU'}</th>
                    <th data-lang="tcmt_th_chamcong">${getTxt('tcmt_th_chamcong') || 'CHẤM CÔNG'}</th>
                    <th data-lang="tcmt_th_giove">${getTxt('tcmt_th_giove') || 'GIỜ VỀ'}</th>
                    <th data-lang="tcmt_th_ca">${getTxt('tcmt_th_ca') || 'CA'}</th>
                </tr></thead>
                <tbody>`;

        let stt = 0;
        if (notFoundList.length > 0) {
            notFoundList.forEach(keyText => {
                stt++;
                tableHtml += `<tr class="tcmt-fade-in" style="animation-delay:${stt * 15}ms; background:#fef2f2;">
                    <td style="text-align:center; font-weight:800; color:#64748b;">${stt}</td>
                    <td style="font-weight:800; color:#ef4444;">${type === 'mathe' ? keyText : '-'}</td>
                    <td style="font-weight:800; color:#ef4444;">${type === 'hoten' ? keyText : '-'}</td>
                    <td colspan="6" style="text-align:center; color:#ef4444; font-weight:700; font-style:italic;" data-lang="tcmt_not_found_row">${getTxt('tcmt_not_found_row') || 'Không tìm thấy dữ liệu'}</td>
                </tr>`;
            });
        }

        searchList.forEach(keyText => {
            const key = keyText.toUpperCase();
            const rows = results[key];
            if (!rows || rows.length === 0) return;

            rows.forEach((row, idx) => {
                stt++;
                const isGroupStart = idx === 0 ? ' tcmt-group-start' : '';

                let maTheVal = type === 'mathe' ? keyText : row.maThe;
                let hoTenVal = type === 'mathe' ? row.hoTen : keyText;

                tableHtml += `<tr class="tcmt-fade-in${isGroupStart}" style="animation-delay:${stt * 15}ms;">
                    <td style="text-align:center; font-weight:800; color:#64748b;">${stt}</td>
                    <td style="font-weight:800; color:#059669;">${maTheVal}</td>
                    <td style="font-weight:700;">${hoTenVal}</td>
                    <td>${row.boPhan}</td>
                    <td style="text-align:center;">${row.ngayVao}</td>

                    <td style="text-align:center;">${row.gioVe}</td>
                    <td style="text-align:center; font-weight:700;">${row.ca}</td>
                </tr>`;
            });
        });

        tableHtml += `</tbody></table>`;
        resultArea.innerHTML = tableHtml;
    }

    function initKbFilterOptions(data) {
        let models = new Set(), lines = new Set(), leaders = new Set(), dates = new Set();
        data.forEach(r => {
            if (r[0]) models.add(r[0].trim()); // Cột A (Model)
            if (r[3]) lines.add(r[3].trim()); // Cột D (Line)
            if (r[4]) leaders.add(r[4].trim()); // Cột E (Tổ trưởng)
            if (r[8]) dates.add(r[8].trim()); // Cột I (Ngày)
        });

        let buildMenu = function (menuId, items, typeKey) {
            let menu = document.getElementById(menuId);
            if (!menu) return;
            let html = Array.from(items).map(val => `
                <div class="kb-multiselect-item">
                    <input type="checkbox" value="${val}" onchange="onKbCheckboxChange('${typeKey}')"> ${val}
                </div>
            `).join('');
            menu.innerHTML = html || '<div style="padding:5px; color:#64748b;">Không có dữ liệu</div>';
        };

        buildMenu('kb-menu-model', models, 'model');
        buildMenu('kb-menu-line', lines, 'line');
        buildMenu('kb-menu-totruong', leaders, 'totruong');
        buildMenu('kb-menu-ngay', dates, 'ngay');
    }

    function onKbCheckboxChange(typeKey) {
        let menu = document.getElementById('kb-menu-' + typeKey);
        let btnText = document.getElementById('kb-btn-text-' + typeKey);
        if (!menu || !btnText) return;

        let checked = Array.from(menu.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
        if (checked.length === 0) {
            btnText.innerText = 'Tất cả ' + (typeKey === 'model' ? 'Model' : typeKey === 'line' ? 'Line' : typeKey === 'totruong' ? 'Tổ trưởng' : typeKey === 'passfail' ? 'Trạng Thái' : 'Ngày');
        } else if (checked.length === 1) {
            btnText.innerText = checked[0];
        } else {
            btnText.innerText = `Đã chọn (${checked.length})`;
        }
    }

    function getKbSelectedValues(typeKey) {
        let menu = document.getElementById('kb-menu-' + typeKey);
        if (!menu) return [];
        return Array.from(menu.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
    }

    function applyKanbanFilter() {
        let tbody = document.getElementById('kb-dcd-tbody');
        if (tbody) {
            tbody.innerHTML = `<tr><td colspan="14" style="text-align:center; padding:25px; color:#2563eb; font-weight:900;">⏳ Đang tải dữ liệu mới nhất từ hệ thống Google Sheet...</td></tr>`;
        }

        let doFilterAndRender = function (rawList) {
            g_kanbanRawData = rawList || [];
            initKbFilterOptions(g_kanbanRawData);

            let selModels = getKbSelectedValues('model');
            let selLines = getKbSelectedValues('line');
            let selLeaders = getKbSelectedValues('totruong');
            let selPassFail = getKbSelectedValues('passfail');
            let selDates = getKbSelectedValues('ngay');

            let filtered = g_kanbanRawData.filter(r => {
                let model = (r[0] || '').trim();
                let line = (r[3] || '').trim();
                let leader = (r[4] || '').trim();
                let passFail = (r[7] || '').trim(); // Cột H (PASS/FAIL)
                let date = (r[8] || '').trim();     // Cột I (NGÀY)

                let matchModel = selModels.length === 0 || selModels.includes(model);
                let matchLine = selLines.length === 0 || selLines.includes(line);
                let matchLeader = selLeaders.length === 0 || selLeaders.includes(leader);
                let matchPassFail = selPassFail.length === 0 || selPassFail.includes(passFail);
                let matchDate = selDates.length === 0 || selDates.includes(date);

                return matchModel && matchLine && matchLeader && matchPassFail && matchDate;
            });

            renderKanbanTable(filtered);
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(function (res) {
                if (res.success) {
                    doFilterAndRender(res.data);
                } else {
                    if (tbody) tbody.innerHTML = `<tr><td colspan="14" style="text-align:center; padding:20px; color:#dc2626;">Lỗi tải dữ liệu: ${res.message}</td></tr>`;
                }
            }).getKanbanDcdData();
        } else {
            doFilterAndRender(g_kanbanRawData);
        }
    }

    // RENDER BẢNG KANBAN TỪ CỘT A ĐẾN CỘT M (13 CỘT)
    function renderKanbanTable(data) {
        let tbody = document.getElementById('kb-dcd-tbody');
        if (!tbody) return;

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="14" style="text-align:center; padding:20px; color:#dc2626; font-weight:900;">Không tìm thấy dữ liệu phù hợp với bộ lọc!</td></tr>`;
            return;
        }

        let html = data.map((r, idx) => {
            let pf = (r[7] || '').trim();
            let pfUpper = pf.toUpperCase();
            let passFailTd;
            if (pfUpper === 'PASS' || pfUpper === 'P') {
                passFailTd = `<td style="padding:12px; border:1px solid #cbd5e1; text-align:center; font-size:15px; font-weight:900; background:#16a34a; color:#ffffff;">${pf}</td>`;
            } else if (pfUpper === 'FAIL' || pfUpper === 'F') {
                passFailTd = `<td style="padding:12px; border:1px solid #cbd5e1; text-align:center; font-size:15px; font-weight:900; background:#dc2626; color:#ffffff;">${pf}</td>`;
            } else {
                passFailTd = `<td style="padding:12px; border:1px solid #cbd5e1; text-align:center; font-size:15px; font-weight:900; color:#000000;">${pf}</td>`;
            }

            // Tình trạng đi làm (Cột M - index 12)
            let tinhTrang = (r[12] || '').trim();
            let tinhTrangStyle = '';
            if (tinhTrang.toLowerCase().includes('đã nghỉ')) {
                tinhTrangStyle = 'color:#dc2626; font-weight:900;';
            } else if (tinhTrang.toLowerCase().includes('vẫn đi làm')) {
                tinhTrangStyle = 'color:#16a34a; font-weight:900;';
            }

            return `
            <tr style="border-bottom:1px solid #e2e8f0; background:${idx % 2 === 0 ? '#ffffff' : '#f8fafc'}; color:#000000; font-size:15px; white-space:normal; line-height:1.5;">
                <td style="padding:12px; border:1px solid #cbd5e1; text-align:center; font-weight:900;">${idx + 1}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[0] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[1] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[2] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[3] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[4] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[5] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[6] || ''}</td>
                ${passFailTd}
                <td style="padding:12px; border:1px solid #cbd5e1; text-align:center; font-weight:900;">${r[8] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[9] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[10] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; font-weight:900;">${r[11] || ''}</td>
                <td style="padding:12px; border:1px solid #cbd5e1; text-align:center; ${tinhTrangStyle}">${tinhTrang}</td>
            </tr>`;
        }).join('');

        tbody.innerHTML = html;
    }

    function handleDcdMathePaste(e, inputElem) {
        let clipboardData = (e.clipboardData || window.clipboardData);
        if (!clipboardData) return;
        let pastedText = clipboardData.getData('text');
        if (!pastedText) return;

        let lines = pastedText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length <= 1) return;

        e.preventDefault();

        let currentRow = inputElem.closest('.dcd-row-item');
        if (!currentRow) return;

        let container = document.getElementById('dcd-rows-container');
        if (!container) return;

        let allRows = Array.from(container.querySelectorAll('.dcd-row-item'));
        let startIdx = allRows.indexOf(currentRow);
        if (startIdx === -1) startIdx = 0;

        let totalNeededRows = startIdx + lines.length;
        while (allRows.length < totalNeededRows) {
            dcdAddNewRow();
            allRows = Array.from(container.querySelectorAll('.dcd-row-item'));
        }

        lines.forEach((code, i) => {
            let targetRow = allRows[startIdx + i];
            if (targetRow) {
                let mInput = targetRow.querySelector('.dcd-mathe');
                if (mInput) {
                    mInput.value = code;
                    dcdLookupNameRow(mInput);
                }
            }
        });
    }

    function dcdLookupNameRow(inputElem) {
        let row = inputElem.closest('.dcd-row-item');
        if (!row) return;
        let maThe = inputElem.value.trim().toUpperCase();
        let hoTenElem = row.querySelector('.dcd-hoten');
        if (!hoTenElem) return;

        if (!maThe) {
            hoTenElem.value = '';
            delete inputElem.dataset.lastLookup;
            return;
        }

        // 1. TRA CỨU TỨC THÌ TRÊN CLIENT TỪ G_DATA MEMORY (0ms KHÔNG CHỜ SERVER)
        let foundName = "";
        if (typeof G_Data !== 'undefined') {
            // TRA CỨU SHEET 出勤数据 CỘT C TRƯỚC TIÊN (G_Data.hrData)
            if (G_Data.hrData && Array.isArray(G_Data.hrData)) {
                for (let i = 1; i < G_Data.hrData.length; i++) {
                    let r = G_Data.hrData[i];
                    if (r && Array.isArray(r)) {
                        for (let c = 0; c < r.length; c++) {
                            if (String(r[c] || "").trim().toUpperCase() === maThe) {
                                // Lấy chính xác CỘT C (Index 2)
                                foundName = String(r[2] || "").trim();
                                if (foundName && foundName.toUpperCase() !== maThe) break;
                                foundName = String(r[1] || r[3] || r[0] || "").trim();
                                if (foundName && foundName.toUpperCase() !== maThe) break;
                            }
                        }
                    }
                    if (foundName) break;
                }
            }
            // Check G_Data.sta5Data
            if (!foundName && G_Data.sta5Data && Array.isArray(G_Data.sta5Data)) {
                for (let i = 1; i < G_Data.sta5Data.length; i++) {
                    let r = G_Data.sta5Data[i];
                    if (r && String(r[0] || "").trim().toUpperCase() === maThe) {
                        foundName = String(r[1] || "").trim();
                        if (foundName) break;
                    }
                }
            }
            // Check G_Data.nhapTheData
            if (!foundName && G_Data.nhapTheData && Array.isArray(G_Data.nhapTheData)) {
                for (let i = 1; i < G_Data.nhapTheData.length; i++) {
                    let r = G_Data.nhapTheData[i];
                    if (r && String(r[2] || r[1] || "").trim().toUpperCase() === maThe) {
                        foundName = String(r[3] || r[2] || "").trim();
                        if (foundName) break;
                    }
                }
            }

        }

        if (foundName) {
            hoTenElem.value = foundName;
            inputElem.dataset.lastLookup = maThe;
            return;
        }

        // Đánh dấu mã đang tra cứu gần nhất
        inputElem.dataset.lastLookup = maThe;

        if (!hoTenElem.value || hoTenElem.value === "Đang tìm...") {
            hoTenElem.value = "Đang tìm...";
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function (res) {
                    var currentVal = inputElem.value.trim().toUpperCase();
                    if (currentVal !== maThe || inputElem.dataset.lastLookup !== maThe) return;

                    if (res && res.success && res.name) {
                        hoTenElem.value = res.name;
                    } else {
                        hoTenElem.value = '';
                    }
                })
                .withFailureHandler(function () {
                    var currentVal = inputElem.value.trim().toUpperCase();
                    if (currentVal === maThe && inputElem.dataset.lastLookup === maThe) {
                        hoTenElem.value = '';
                    }
                })
                .lookupEmployeeNameDcd(maThe);
        } else {
            setTimeout(() => {
                if (inputElem.value.trim().toUpperCase() === maThe) {
                    hoTenElem.value = "Nguyễn Văn A (" + maThe + ")";
                }
            }, 300);
        }
    }

    function dcdAddNewRow() {
        let container = document.getElementById('dcd-rows-container');
        if (!container) return;
        let count = container.querySelectorAll('.dcd-row-item').length + 1;

        let today = new Date().toISOString().split('T')[0];
        container.insertAdjacentHTML('beforeend', createRowHtml(count));

        let newRow = container.lastElementChild;
        if (newRow) {
            let dInput = newRow.querySelector('.dcd-ngay');
            if (dInput) dInput.value = today;
        }

        loadAdminDataDcd();
    }

    function dcdDeleteSelectedRow() {
        let container = document.getElementById('dcd-rows-container');
        if (!container) return;
        let rows = container.querySelectorAll('.dcd-row-item');
        if (rows.length === 0) return;

        let doDelete = function (rowIndex) {
            let target = Array.from(rows).find(r => parseInt(r.getAttribute('data-index')) === rowIndex);
            if (target) {
                target.remove();
                if (typeof Swal !== 'undefined') Swal.fire('Đã xóa', `Đã xóa thành công Dòng ${rowIndex}!`, 'success');
            } else {
                if (typeof Swal !== 'undefined') Swal.fire('Lỗi', `Không tìm thấy Dòng ${rowIndex}!`, 'error');
            }
        };

        if (typeof Swal !== 'undefined') {
            Swal.fire({
                title: '➖ XÓA DÒNG',
                text: 'Nhập số thứ tự dòng bạn muốn xóa (Ví dụ: 1):',
                input: 'number',
                inputAttributes: { min: 1, max: rows.length, step: 1 },
                inputValue: rows.length,
                showCancelButton: true,
                confirmButtonText: 'Xóa dòng',
                cancelButtonText: 'Hủy',
                confirmButtonColor: '#dc2626'
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    let idx = parseInt(result.value);
                    doDelete(idx);
                }
            });
        } else {
            let val = prompt("Nhập số dòng muốn xóa:", rows.length);
            if (val) doDelete(parseInt(val));
        }
    }

    function submitDcdData() {
        let rowElements = document.querySelectorAll('.dcd-row-item');
        let records = [];
        let isValid = false;

        rowElements.forEach(row => {
            let model = row.querySelector('.dcd-model').value || '';
            let maThe = row.querySelector('.dcd-mathe').value.trim();
            let hoTen = row.querySelector('.dcd-hoten').value.trim();
            let line = row.querySelector('.dcd-line').value || '';
            let toTruong = row.querySelector('.dcd-totruong').value || '';
            let viTri = row.querySelector('.dcd-vitri').value.trim();
            let giaoVien = row.querySelector('.dcd-giaovien').value || '';
            let passFail = row.querySelector('.dcd-passfail').value || '';
            let ngay = row.querySelector('.dcd-ngay').value;
            let tram1 = row.querySelector('.dcd-tram1').value || '';
            let tram2 = row.querySelector('.dcd-tram2').value || '';
            let tram3 = row.querySelector('.dcd-tram3').value || '';

            if (maThe && hoTen && viTri && ngay) {
                isValid = true;
                let d = new Date(ngay);
                let dateStr = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
                // 12 cột chuẩn sheet ĐA CÔNG ĐOẠN: A-MODEL, B-Mã Thẻ, C-Họ Và Tên, D-Line, E-Tổ trưởng, F-Vị Trí Ban Đầu, G-Giáo Viên, H-PASS FAIL, I-Ngày, J-Trạm CTQ 1, K-Trạm CTQ 2, L-Trạm CTQ 3
                records.push([model, maThe, hoTen, line, toTruong, viTri, giaoVien, passFail, dateStr, tram1, tram2, tram3]);
            }
        });

        if (!isValid || records.length === 0) {
            if (typeof Swal !== 'undefined') Swal.fire('Thiếu thông tin', 'Vui lòng điền ít nhất 1 dòng hoàn chỉnh (Mã thẻ, Tên, Vị trí ban đầu, Ngày)!', 'warning');

        // Bật ngay 1 LỚP PHỦ MỜ VỚI HÌNH XOAY TRÒN ĐANG LƯU DỮ LIỆU

        let overlayHtml = `
        <div id="${overlayId}" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15, 23, 42, 0.6); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div style="width:60px; height:60px; border:6px solid rgba(255,255,255,0.3); border-top:6px solid #16a34a; border-radius:50%; animation:dcdSpin 1s linear infinite;"></div>
            <h3 style="color:#ffffff; font-weight:800; font-size:20px; margin-top:20px; text-shadow:0 2px 4px rgba(0,0,0,0.5); letter-spacing:0.5px;">⏳ ĐANG LƯU DỮ LIỆU...</h3>
            <p style="color:#e2e8f0; font-size:14px; margin-top:5px;">Hệ thống đang đồng bộ dữ liệu vào Google Sheet, vui lòng chờ!</p>
            <style>
                @keyframes dcdSpin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            </style>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', overlayHtml);

        let removeOverlay = function () {
            let ov = document.getElementById(overlayId);
            if (ov) ov.remove();
        };

        let resetFormToDefault = function () {
            removeOverlay();
            let rowsContainer = document.getElementById('dcd-rows-container');
            if (rowsContainer) {
                rowsContainer.innerHTML = createRowHtml(1) + createRowHtml(2) + createRowHtml(3);
                let today = new Date().toISOString().split('T')[0];
                document.querySelectorAll('.dcd-ngay').forEach(el => el.value = today);
                loadAdminDataDcd();
            }

            // Đưa thông báo vào setTimeout để UI kịp xóa vòng xoay trước khi hiện alert
            setTimeout(() => {
                // Thông báo ĐÃ LƯU THÀNH CÔNG RÕ RÀNG
                if (typeof Swal !== 'undefined') {
                    Swal.fire({
                        icon: 'success',
                        title: '🎉 ĐÃ LƯU THÀNH CÔNG!',
                        text: 'Dữ liệu DS Đa Công Đoạn đã lưu an toàn vào hệ thống',
                        background: '#15803d',
                        color: '#ffffff',
                        iconColor: '#ffffff',
                        confirmButtonColor: '#ffffff',
                        confirmButtonText: '<span style="color:#15803d; font-weight:bold; font-size:15px;">XÁC NHẬN</span>',
                        position: 'center',
                        backdrop: `rgba(0,0,0,0.5) blur(2px)`
                    });
                } else {
                    alert('🎉 ĐÃ LƯU THÀNH CÔNG!');
                }
            }, 100);
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(function (res) {
                if (res.success) {
                    g_kanbanRawData = []; // Đặt lại cache để load dữ liệu mới nhất cho tab Data
                    resetFormToDefault();
                } else {
                    removeOverlay();
                    if (typeof Swal !== 'undefined') Swal.fire('Lỗi', 'Không thể lưu: ' + res.message, 'error');
                }
            }).saveDcdRecord(records);
        } else {
            setTimeout(() => {
                resetFormToDefault();
            }, 1200);

                                <label style="font-weight:900; font-size:13px; color:#1e293b; margin-bottom:4px; display:block;">12. TRẠM CTQ 3 (Cột L)</label>
                                <select class="edit-tram3 dcd-input-style">${getOptionsHtml(g_adminDcdCache.stations, r[11])}</select>

            container.innerHTML = html;

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(function (res) {
                if (res.success) {
                    renderEditCards(res.data);
                } else {
                    container.innerHTML = `<div style="text-align:center; padding:20px; color:#dc2626; font-weight:900;">Lỗi tải dữ liệu: ${res.message}</div>`;
                }
            }).getKanbanDcdData();
        } else {
            renderEditCards(g_kanbanRawData);
        }
    }

    function getOptionsHtml(arr, selectedVal) {
        let html = '<option value="">-- Chọn --</option>';
        (arr || []).forEach(val => {
            let sel = (val === selectedVal) ? 'selected' : '';
            html += `<option value="${val}" ${sel}>${val}</option>`;
        });
        return html;
    }

    function lookupEditNameDcd(inputElem) {
        let card = inputElem.closest('.edit-dcd-card-item');
        let maThe = inputElem.value.trim();
        let nameInput = card.querySelector('.edit-hoten');
        if (!maThe) { nameInput.value = ''; return; }
        nameInput.value = 'Đang tìm...';
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(function (res) {
                nameInput.value = (res && res.success) ? res.name : '';
            }).lookupEmployeeNameDcd(maThe);
        } else {
            nameInput.value = 'Nguyễn Văn B (' + maThe + ')';
        }
    }

    function saveSingleCardEditDcd(sheetRowIndex) {
        let card = document.querySelector(`.edit-dcd-card-item[data-row-index="${sheetRowIndex}"]`);
        if (!card) return;

        let model = card.querySelector('.edit-model').value || '';
        let maThe = card.querySelector('.edit-mathe').value.trim();
        let hoTen = card.querySelector('.edit-hoten').value.trim();
        let line = card.querySelector('.edit-line').value || '';
        let toTruong = card.querySelector('.edit-totruong').value || '';
        let viTri = card.querySelector('.edit-vitri').value.trim();
        let giaoVien = card.querySelector('.edit-giaovien').value || '';
        let passFail = card.querySelector('.edit-passfail').value || '';
        let ngay = card.querySelector('.edit-ngay').value;
        let tram1 = card.querySelector('.edit-tram1').value || '';
        let tram2 = card.querySelector('.edit-tram2').value || '';
        let tram3 = card.querySelector('.edit-tram3').value || '';

        if (!maThe || !hoTen) {
            if (typeof Swal !== 'undefined') Swal.fire('Cảnh báo', 'Vui lòng nhập đầy đủ Mã Thẻ và Họ Tên!', 'warning');
            else alert('Vui lòng nhập Mã Thẻ và Họ Tên!');
            return;
        }

        let dateStr = '';
        if (ngay) {
            let d = new Date(ngay);
            dateStr = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
        }

        let record = [model, maThe, hoTen, line, toTruong, viTri, giaoVien, passFail, dateStr, tram1, tram2, tram3];

        if (typeof Swal !== 'undefined') Swal.fire({ title: '⏳ Đang lưu...', text: 'Đang cập nhật dòng dữ liệu...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(function (res) {
                if (res.success) {
                    g_kanbanRawData = []; // Đặt lại cache
                    if (typeof Swal !== 'undefined') Swal.fire('Thành công', 'Đã lưu thay đổi dòng này vào Sheet ĐA CÔNG ĐOẠN!', 'success');
                    else alert('Đã lưu thành công!');
                } else {
                    if (typeof Swal !== 'undefined') Swal.fire('Lỗi', 'Không thể lưu: ' + res.message, 'error');
                    else alert('Lỗi: ' + res.message);
                }
            }).updateDcdRecord(sheetRowIndex, record);
        } else {
            if (typeof Swal !== 'undefined') Swal.fire('Thành công', 'Đã lưu thay đổi giả lập!', 'success');
        }
    }

    function deleteDcdSingleRowItem(sheetRowIndex, displayIdx) {
        let confirmAction = function () {
            if (typeof Swal !== 'undefined') Swal.fire({ title: '⏳ Đang xóa...', text: `Đang xóa Dòng ${displayIdx || ''} (Dòng ${sheetRowIndex} trong Sheet)...`, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withFailureHandler(function (err) {
                        if (typeof Swal !== 'undefined') Swal.fire('Lỗi', 'Lỗi xóa dòng: ' + (err.message || err), 'error');
                        else alert('Lỗi: ' + (err.message || err));
                    })
                    .withSuccessHandler(function (res) {
                        if (res.success) {
                            g_kanbanRawData = []; // Đặt lại cache
                            if (typeof Swal !== 'undefined') Swal.fire('Đã Xóa', `Đã xóa thành công Dòng ${displayIdx || ''} trong Sheet!`, 'success');
                            else alert('Đã xóa thành công!');
                            searchDcdRecordsByMaThe();
                        } else {
                            if (typeof Swal !== 'undefined') Swal.fire('Lỗi', 'Không thể xóa: ' + res.message, 'error');
                            else alert('Lỗi: ' + res.message);
                        }
                    }).deleteDcdSingleRowBySheetIndex(sheetRowIndex);
            } else {
                if (typeof Swal !== 'undefined') Swal.fire('Đã Xóa', 'Đã xóa giả lập!', 'success');
                let card = document.querySelector(`.edit-dcd-card-item[data-row-index="${sheetRowIndex}"]`);
                if (card) card.remove();
            }
        };

        if (typeof Swal !== 'undefined') {
            Swal.fire({
                title: `🔴 XÓA DÒNG ${displayIdx ? displayIdx : ''}`,
                text: `Bạn có chắc chắn muốn xóa Dòng ${displayIdx ? displayIdx : ''} (Dòng ${sheetRowIndex} trong Sheet ĐA CÔNG ĐOẠN) không?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'XÓA DÒNG NÀY',
                cancelButtonText: 'HỦY BỎ'
            }).then((res) => {
                if (res.isConfirmed) confirmAction();
            });
        } else {
            if (confirm(`Xóa dòng ${sheetRowIndex}?`)) confirmAction();
        }
    }

    function deleteDcdEmployeeRecords(maTheVal) {
        if (!maTheVal) return;
        let matched = g_searchEditDcdCache || [];

        if (matched.length === 1) {
            let sheetRowIndex = matched[0][matched[0].length - 1];
            deleteDcdSingleRowItem(sheetRowIndex, 1);
            return;
        }

        if (typeof Swal !== 'undefined') {
            let inputOptions = {};
            matched.forEach((r, idx) => {
                let sheetRow = r[r.length - 1];
                let model = r[0] || 'Chưa chọn Model';
                let ngay = r[8] || '';
                inputOptions[sheetRow] = `📌 Dòng ${idx + 1} (Dòng ${sheetRow} trong Sheet - Model: ${model} - Ngày: ${ngay})`;
            });
            inputOptions['ALL'] = `🚨 XÓA TẤT CẢ ${matched.length} DÒNG KHỎI SHEET`;

            Swal.fire({
                title: '❓ BẠN MUỐN XÓA HÀNG NÀO?',
                html: `Mã Thẻ <strong style="color:#2563eb;">${maTheVal}</strong> có <strong>${matched.length} hàng dữ liệu</strong> trong Sheet. Vui lòng chọn hàng cần xóa:`,
                input: 'radio',
                inputOptions: inputOptions,
                inputValue: String(matched[0][matched[0].length - 1]),
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'XÓA NGAY LỰA CHỌN NÀY',
                cancelButtonText: 'HỦY BỎ',
                inputValidator: (value) => {
                    if (!value) {
                        return 'Vui lòng chọn 1 lựa chọn để xóa!';
                    }
                }
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    if (result.value === 'ALL') {
                        deleteAllDcdRecordsByMaThe(maTheVal);
                    } else {
                        let selectedSheetRow = parseInt(result.value);
                        let rowNumberDisplay = matched.findIndex(r => r[r.length - 1] == selectedSheetRow) + 1;
                        deleteDcdSingleRowItem(selectedSheetRow, rowNumberDisplay);
                    }
                }
            });
        } else {
            if (confirm(`Bạn có muốn xóa tất cả dòng của mã ${maTheVal}?`)) deleteAllDcdRecordsByMaThe(maTheVal);
        }
    }

    // ==========================================
    // HÀM COPY BẢNG KANBAN THÀNH ẢNH
    // ==========================================
    function copyKanbanTableAsImage() {
        let captureArea = document.getElementById('kb-table-capture-area');
        if (!captureArea) {
            if (typeof Swal !== 'undefined') Swal.fire('Lỗi', 'Không tìm thấy bảng để chụp!', 'error');
            return;
        }

        if (typeof html2canvas === 'undefined') {
            if (typeof Swal !== 'undefined') Swal.fire('Lỗi', 'Thư viện html2canvas chưa được tải. Vui lòng kiểm tra file CTQ2026_html2canvas.html', 'error');
            else alert('Lỗi: Thư viện html2canvas chưa được tải!');
            return;
        }

        if (typeof Swal !== 'undefined') Swal.fire({ title: '⏳ Đang xử lý...', text: 'Đang chụp ảnh bảng...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        let origOverflow = captureArea.style.overflow;
        let origMaxH = captureArea.style.maxHeight;
        captureArea.style.overflow = 'visible';
        captureArea.style.maxHeight = 'none';

        html2canvas(captureArea, {
            scale: Math.max(3, (window.devicePixelRatio || 1) * 2),
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff',
            logging: false
        }).then(function (canvas) {
            captureArea.style.overflow = origOverflow;
            captureArea.style.maxHeight = origMaxH;
            if (typeof Swal !== 'undefined') Swal.close();

            canvas.toBlob(function (blob) {
                if (navigator.clipboard && navigator.clipboard.write) {
                    navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]).then(function () {
                        if (typeof Swal !== 'undefined') Swal.fire('✅ Đã Copy!', 'Ảnh bảng đã được copy vào clipboard. Bấm Ctrl+V để dán vào Excel, Word hoặc Zalo!', 'success');
                        else alert('Đã copy ảnh bảng vào clipboard!');
                    }).catch(function (err) {
                        let url = URL.createObjectURL(blob);
                        let a = document.createElement('a');
                        a.href = url;
                        a.download = 'bang_kanban_dcd_' + new Date().toISOString().slice(0, 10) + '.png';
                        a.click();
                        URL.revokeObjectURL(url);
                    });
                } else {
                    let url = URL.createObjectURL(blob);
                    let a = document.createElement('a');
                    a.href = url;
                    a.download = 'bang_kanban_dcd_' + new Date().toISOString().slice(0, 10) + '.png';
                    a.click();
                    URL.revokeObjectURL(url);
                    if (typeof Swal !== 'undefined') Swal.fire('📥 Đã Tải Ảnh!', 'Trình duyệt không hỗ trợ copy clipboard, đã tải ảnh về máy!', 'info');
                }
            }, 'image/png');
        }).catch(function (err) {
            captureArea.style.overflow = origOverflow;
            captureArea.style.maxHeight = origMaxH;
            if (typeof Swal !== 'undefined') Swal.fire('Lỗi', 'Không thể chụp ảnh: ' + err.message, 'error');
        });
    }

    // ==========================================
    // MODULE: DATA THỐNG KÊ (TAB 4)
    // ==========================================
    function loadDcdStatistics() {
        let container = document.getElementById('dcd-stats-table-container');
        let chartContainer = document.getElementById('dcd-stats-chart-container');
        if (!container || !chartContainer) return;

        let renderStats = function (rawData) {
            // Nhóm dữ liệu theo Line -> Tổ trưởng
            let statsMap = {};

            rawData.forEach(r => {
                let line = (r[3] || 'Khác').trim();
                let leader = (r[4] || 'Khác').trim();
                let status = (r[12] || '').trim().toLowerCase(); // Cột M

                let key = line + '|' + leader;
                if (!statsMap[key]) {
                    statsMap[key] = {
                        line: line,
                        leader: leader,
                        total: 0,
                        resigned: 0,
                        remaining: 0
                    };
                }

                statsMap[key].total++;
                if (status.includes('đã nghỉ')) {
                    statsMap[key].resigned++;
                } else {
                    statsMap[key].remaining++;
                }
            });

            // Chuyển object sang array và sắp xếp
            let statsArray = Object.values(statsMap);
            statsArray.sort((a, b) => a.line.localeCompare(b.line) || a.leader.localeCompare(b.leader));

            let lang = (typeof window.langs !== 'undefined' && typeof window.currentLangIdx !== 'undefined') ? window.langs[window.currentLangIdx] : (typeof g_currentLang !== 'undefined' ? g_currentLang : 'vn');
            let isZh = (lang === 'cn' || lang === 'zh');

            // Render Table
            let htmlTable = `
            <table style="width:100%; border-collapse:collapse; font-size:15px; text-align:left; color:#000000; border:1px solid #cbd5e1; box-shadow:0 4px 6px rgba(0,0,0,0.05);" id="dcd-stats-html-table">
                <thead style="background:#7e22ce; color:#ffffff;">
                    <tr>
                        <th style="padding:15px 10px; border:1px solid #6b21a8; text-align:center; font-weight:900;">${isZh ? '序号 (STT)' : 'STT'}</th>
                        <th style="padding:15px 10px; border:1px solid #6b21a8; font-weight:900;">${isZh ? '线别 (LINE)' : 'LINE'}</th>
                        <th style="padding:15px 10px; border:1px solid #6b21a8; font-weight:900;">${isZh ? '组长 (TỔ TRƯỞNG)' : 'TỔ TRƯỞNG'}</th>
                        <th style="padding:15px 10px; border:1px solid #6b21a8; text-align:center; font-weight:900;">${isZh ? '总培训 (TỔNG ĐÃ ĐÀO TẠO)' : 'TỔNG ĐÃ ĐÀO TẠO'}</th>
                        <th style="padding:15px 10px; border:1px solid #6b21a8; text-align:center; font-weight:900; color:#fca5a5;">${isZh ? '离职 (ĐÃ NGHỈ VIỆC)' : 'ĐÃ NGHỈ VIỆC'}</th>
                        <th style="padding:15px 10px; border:1px solid #6b21a8; text-align:center; font-weight:900; color:#86efac;">${isZh ? '在职 (CÒN LẠI)' : 'CÒN LẠI'}</th>
                    </tr>
                </thead>
                <tbody>
            `;

            let sumTotal = 0, sumResigned = 0, sumRemaining = 0;

            if (statsArray.length === 0) {
                htmlTable += `<tr><td colspan="6" style="text-align:center; padding:20px; color:#dc2626; font-weight:900;">Không có dữ liệu!</td></tr>`;
            } else {
                statsArray.forEach((s, idx) => {
                    sumTotal += s.total;
                    sumResigned += s.resigned;
                    sumRemaining += s.remaining;

                    htmlTable += `
                    <tr style="border-bottom:1px solid #e2e8f0; background:${idx % 2 === 0 ? '#ffffff' : '#f8fafc'}; font-weight:bold;">
                        <td style="padding:12px 10px; border:1px solid #cbd5e1; text-align:center;">${idx + 1}</td>
                        <td style="padding:12px 10px; border:1px solid #cbd5e1;">${s.line}</td>
                        <td style="padding:12px 10px; border:1px solid #cbd5e1;">${s.leader}</td>
                        <td style="padding:12px 10px; border:1px solid #cbd5e1; text-align:center; color:#2563eb; font-size:16px;">${s.total}</td>
                        <td style="padding:12px 10px; border:1px solid #cbd5e1; text-align:center; color:#dc2626; font-size:16px;">${s.resigned}</td>
                        <td style="padding:12px 10px; border:1px solid #cbd5e1; text-align:center; color:#16a34a; font-size:16px;">${s.remaining}</td>
                    </tr>
                    `;
                });
            }

            // Dòng tổng
            htmlTable += `
                <tr style="background:#f3e8ff; font-weight:900; font-size:16px; color:#6b21a8;">
                    <td colspan="3" style="padding:15px 10px; border:1px solid #d8b4fe; text-align:right;">${isZh ? '总计 (TỔNG CỘNG):' : 'TỔNG CỘNG:'}</td>
                    <td style="padding:15px 10px; border:1px solid #d8b4fe; text-align:center; color:#1d4ed8;">${sumTotal}</td>
                    <td style="padding:15px 10px; border:1px solid #d8b4fe; text-align:center; color:#b91c1c;">${sumResigned}</td>
                    <td style="padding:15px 10px; border:1px solid #d8b4fe; text-align:center; color:#15803d;">${sumRemaining}</td>
                </tr>
                </tbody>
            </table>
            `;

            container.innerHTML = htmlTable;

            // Render Chart (CSS Bar Chart)
            let maxTotal = Math.max(...statsArray.map(s => s.total), 1);
            let chartHtml = '';

            if (statsArray.length > 0) {
                statsArray.forEach(s => {
                    let h1 = (s.remaining / maxTotal) * 100;
                    let h2 = (s.resigned / maxTotal) * 100;

                    chartHtml += `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:100px; min-width:80px;">
                        <div style="font-weight:bold; font-size:14px; margin-bottom:5px; color:#16a34a;">${s.remaining}</div>
                        <div style="width:50px; height:${h1}%; background:linear-gradient(180deg, #22c55e 0%, #16a34a 100%); border-radius:6px 6px 0 0; box-shadow:0 4px 6px rgba(34,197,94,0.3);"></div>
                        
                        <div style="font-weight:bold; font-size:14px; margin-bottom:5px; color:#dc2626; margin-top:5px;">${s.resigned}</div>
                        <div style="width:50px; height:${h2}%; background:linear-gradient(180deg, #ef4444 0%, #dc2626 100%); border-radius:0 0 0 0; box-shadow:0 4px 6px rgba(239,68,68,0.3);"></div>
                        
                        <div style="margin-top:10px; text-align:center; font-weight:900; font-size:12px; color:#475569;">
                            <div style="color:#000;">${s.line}</div>
                            <div>${s.leader}</div>
                        </div>
                    </div>
                    `;
                });
            } else {
                chartHtml = '<div style="color:#94a3b8; font-weight:bold;">Chưa có dữ liệu để vẽ biểu đồ</div>';
            }

            chartContainer.innerHTML = chartHtml;

            // ==========================================
            // VẼ BIỂU ĐỒ 2: TỶ LỆ NGHỈ VIỆC BẰNG ĐƯỜNG (LINE CHART)
            // ==========================================
            let lineStats = {};
            rawData.forEach(r => {
                let line = (r[3] || 'Khác').trim();
                let status = (r[12] || '').trim().toLowerCase();
                if (!lineStats[line]) lineStats[line] = { total: 0, resigned: 0 };
                lineStats[line].total++;
                if (status.includes('đã nghỉ')) lineStats[line].resigned++;
            });
            let lineArray = Object.keys(lineStats).map(k => ({
                line: k,
                total: lineStats[k].total,
                resigned: lineStats[k].resigned,
                rate: lineStats[k].total > 0 ? (lineStats[k].resigned / lineStats[k].total * 100) : 0
            })).sort((a, b) => a.line.localeCompare(b.line));

            let chartContainer2 = document.getElementById('dcd-stats-chart-container-2');
            if (chartContainer2) {
                if (lineArray.length > 0) {
                    let w = 800; let h = 300;
                    let padX = 40; let padY = 40;
                    let chartW = w - padX * 2;
                    let chartH = h - padY * 2 - 20; // Trừ hao phần chữ bên dưới

                    let maxRate = Math.max(20, Math.ceil(Math.max(...lineArray.map(l => l.rate)) / 10) * 10);
                    let stepX = lineArray.length > 1 ? chartW / (lineArray.length - 1) : chartW / 2;

                    let points = lineArray.map((l, i) => {
                        let x = padX + (lineArray.length > 1 ? i * stepX : stepX);
                        let y = padY + chartH - (l.rate / maxRate) * chartH;
                        return { x, y, rate: l.rate, line: l.line };
                    });

                    let pathD = `M ${padX},${padY + chartH}`;
                    if (points.length === 1) {
                        pathD += ` L ${points[0].x},${points[0].y} L ${w - padX},${padY + chartH}`;
                    } else {
                        points.forEach((p, i) => {
                            if (i === 0) pathD = `M ${p.x},${p.y}`;
                            else {
                                let prev = points[i - 1];
                                let cx1 = prev.x + stepX / 2;
                                let cy1 = prev.y;
                                let cx2 = p.x - stepX / 2;
                                let cy2 = p.y;
                                pathD += ` C ${cx1},${cy1} ${cx2},${cy2} ${p.x},${p.y}`;
                            }
                        });
                    }

                    let areaPath = pathD + ` L ${points[points.length - 1].x},${padY + chartH} L ${points[0].x},${padY + chartH} Z`;

                    let circles = points.map(p => `
                        <g style="cursor:pointer;">
                            <circle cx="${p.x}" cy="${p.y}" r="6" fill="#ffffff" stroke="#b45309" stroke-width="3" style="filter:drop-shadow(0 3px 3px rgba(0,0,0,0.3));"></circle>
                            <text x="${p.x}" y="${p.y - 15}" text-anchor="middle" font-size="13" font-weight="900" fill="#dc2626">${p.rate.toFixed(1)}%</text>
                            <text x="${p.x}" y="${padY + chartH + 25}" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">${p.line}</text>
                        </g>
                    `).join('');

                    chartContainer2.innerHTML = `
                    <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" style="font-family:inherit; overflow:visible;">
                        <line x1="${padX}" y1="${padY}" x2="${w - padX}" y2="${padY}" stroke="#e2e8f0" stroke-dasharray="4" />
                        <line x1="${padX}" y1="${padY + chartH / 2}" x2="${w - padX}" y2="${padY + chartH / 2}" stroke="#e2e8f0" stroke-dasharray="4" />
                        <line x1="${padX}" y1="${padY + chartH}" x2="${w - padX}" y2="${padY + chartH}" stroke="#94a3b8" stroke-width="2" />
                        
                        <text x="${padX - 10}" y="${padY + 5}" text-anchor="end" font-size="12" font-weight="bold" fill="#94a3b8">${maxRate}%</text>
                        <text x="${padX - 10}" y="${padY + chartH / 2 + 5}" text-anchor="end" font-size="12" font-weight="bold" fill="#94a3b8">${maxRate / 2}%</text>
                        <text x="${padX - 10}" y="${padY + chartH + 5}" text-anchor="end" font-size="12" font-weight="bold" fill="#94a3b8">0%</text>
                        
                        <path d="${areaPath}" fill="url(#grad2)" opacity="0.4" />
                        <path d="${pathD}" fill="none" stroke="#d97706" stroke-width="4" style="filter:drop-shadow(0 4px 6px rgba(217,119,6,0.4));" />
                        ${circles}
                        
                        <defs>
                            <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#f59e0b" stop-opacity="1" />
                                <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                    </svg>
                    `;
                } else {
                    chartContainer2.innerHTML = '<div style="width:100%; text-align:center; padding-top:100px; color:#94a3b8; font-weight:bold;">Chưa có dữ liệu</div>';
                }
            }

            // ==========================================
            // VẼ BIỂU ĐỒ 3: ĐÀO TẠO THEO NGÀY
            // ==========================================
            let dateStats = {};
            rawData.forEach(r => {
                let dateStr = (r[8] || '').trim(); // Cột I Ngày
                if (!dateStr) return;
                if (!dateStats[dateStr]) dateStats[dateStr] = { total: 0 };
                dateStats[dateStr].total++;
            });

            let dateArray = Object.keys(dateStats).sort((a, b) => {
                let pA = a.split('/'); let pB = b.split('/');
                if (pA.length === 3 && pB.length === 3) {
                    return new Date(pA[2], pA[1] - 1, pA[0]) - new Date(pB[2], pB[1] - 1, pB[0]);
                }
                return a.localeCompare(b);
            });

            let chartContainer3 = document.getElementById('dcd-stats-chart-container-3');
            if (chartContainer3) {
                if (dateArray.length > 0) {
                    let maxDateTotal = Math.max(...dateArray.map(d => dateStats[d].total), 1);
                    let chartHtml3 = '';
                    dateArray.forEach(d => {
                        let ds = dateStats[d];
                        let h = (ds.total / maxDateTotal) * 100;
                        chartHtml3 += `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:70px;">
                            <div style="font-weight:900; font-size:15px; margin-bottom:5px; color:#4338ca;">${ds.total}</div>
                            <div style="width:40px; height:${h}%; background:linear-gradient(180deg, #6366f1 0%, #4338ca 100%); border-radius:6px 6px 0 0; box-shadow:0 6px 8px rgba(99,102,241,0.4);"></div>
                            <div style="margin-top:10px; text-align:center; font-weight:bold; font-size:12px; color:#475569; width:100%; white-space:nowrap;">${d}</div>
                        </div>
                        `;
                    });
                    chartContainer3.innerHTML = chartHtml3;
                } else {

    function copyDcdStatsTable() {

            el.style.background = oldBackground;

                }
            });
        }).catch(err => {
            el.style.background = oldBackground;

    function ycctSwitchTab(tabNum) {
        window.CURRENT_YCCT_TAB = tabNum;
        document.getElementById('ycct-panel-1').style.display = tabNum === 1 ? 'block' : 'none';
        document.getElementById('ycct-panel-2').style.display = tabNum === 2 ? 'block' : 'none';

        if (tabNum === 2) ycctRenderDataTab();

    function ycctAddRow() {
        let tbody = document.getElementById('ycct-input-body');
        if (!tbody) return;
        let tr = document.createElement('tr');
        tr.style.animation = 'ycctSlideUp 0.35s ease';
        tr.dataset.dup = '0';
        tr.innerHTML = `
            <td class="ycct-stt"><b>${ycctSttCounter++}</b></td>
            <td class="ycct-x-col"><button class="ycct-btn-x" onclick="this.closest('tr').remove(); ycctUpdateCount();">✕</button></td>
            <td><select class="ycct-model">${generateOptionsValGen(5, "")}</select></td>
            <td><select class="ycct-line">${generateOptionsValGen(1, "")}</select></td>
            <td><select class="ycct-bophan">${generateOptionsValGen(3, "")}</select></td>
            <td><input type="text" class="ycct-ma-input" onchange="ycctTimMaThe(this)" placeholder="Nhập mã..."></td>
            <td><input type="text" class="ycct-ten-input" readonly placeholder="Tự động"></td>
            <td><select class="ycct-lydo">${generateOptionsValGen(6, "")}</select></td>
            <td><select class="ycct-quanly">${generateOptionsValGen(2, "")}</select></td>
            <td><select class="ycct-tram1">${generateOptionsValGen(0, "")}</select></td>
            <td><select class="ycct-tram2">${generateOptionsValGen(0, "")}</select></td>
        `;
        tbody.appendChild(tr);
        ycctUpdateCount();
    }

    function ycctUpdateCount() {
        let rows = document.querySelectorAll('#ycct-input-body tr');
        let badge = document.getElementById('ycct-row-count');
        if (badge) badge.textContent = rows.length + ' dòng';
    }

    function ycctTimMaThe(inputEl) {
        let tr = inputEl.closest('tr');
        let ma = inputEl.value.trim().toUpperCase();
        inputEl.value = ma;
        let tenInput = tr.querySelector('.ycct-ten-input');

        if (!ma) { tenInput.value = ''; tenInput.classList.remove('ycct-error'); tr.dataset.dup = '0'; return; }

        // Kiểm tra trùng trong CẤP THẺ (G_Data.capThe) cột E (index 4)
        let isDup = false;
        if (G_Data && G_Data.capThe && G_Data.capThe.length > 1) {
            for (let i = 1; i < G_Data.capThe.length; i++) {
                if (G_Data.capThe[i][4] && String(G_Data.capThe[i][4]).trim().toUpperCase() === ma) {
                    isDup = true; break;
                }
            }
        }

        if (isDup) {
            tenInput.value = '⚠️ MÃ THẺ ĐÃ TỒN TẠI!';
            tenInput.classList.add('ycct-error');
            tr.dataset.dup = '1';
            showToast('Mã thẻ ' + ma + ' đã có trong hệ thống Cấp Thẻ!', 'error');
            return;
        }

        // Kiểm tra trùng trong bảng input hiện tại
        let allMaInputs = document.querySelectorAll('#ycct-input-body .ycct-ma-input');
        let dupCount = 0;
        allMaInputs.forEach(inp => { if (inp.value.trim().toUpperCase() === ma) dupCount++; });
        if (dupCount > 1) {
            tenInput.value = '⚠️ TRÙNG MÃ TRONG BẢNG!';
            tenInput.classList.add('ycct-error');
            tr.dataset.dup = '1';
            showToast('Mã thẻ ' + ma + ' bị trùng trong bảng nhập!', 'warning');
            return;
        }

        tr.dataset.dup = '0';
        tenInput.classList.remove('ycct-error');
        tenInput.value = 'Đang tìm...';

        // Tìm tên từ 出勤数据 qua getEmployeeData
        google.script.run.withSuccessHandler(function(res) {
            if (inputEl.value.trim().toUpperCase() !== ma) return;
            if (res && res.success) {
                tenInput.value = res.name || '';
            } else {
                tenInput.value = 'Không tìm thấy';
            }
        }).withFailureHandler(function() {
            tenInput.value = 'Lỗi tìm kiếm';
        }).getEmployeeData(ma);
    }

    function ycctClearAll() {
        if (!confirm('Bạn có chắc chắn muốn xóa tất cả dòng?')) return;
        let tbody = document.getElementById('ycct-input-body');
        if (tbody) tbody.innerHTML = '';
        ycctSttCounter = 1;
        ycctAddRow();
        showToast('Đã xóa tất cả!', 'info');
    }

    function ycctSaveData() {
        let rows = document.querySelectorAll('#ycct-input-body tr');
        let dataToSave = [];
        let hasDup = false;
        let hasEmpty = false;

        rows.forEach(function(tr, idx) {
            if (tr.dataset.dup === '1') { hasDup = true; return; }
            let ma = tr.querySelector('.ycct-ma-input').value.trim().toUpperCase();
            if (!ma) return;

            let model = tr.querySelector('.ycct-model').value;
            let line = tr.querySelector('.ycct-line').value;
            let bophan = tr.querySelector('.ycct-bophan').value;
            let ten = tr.querySelector('.ycct-ten-input').value.trim();
            let lydo = tr.querySelector('.ycct-lydo').value;
            let quanly = tr.querySelector('.ycct-quanly').value;
            let tram1 = tr.querySelector('.ycct-tram1').value;
            let tram2 = tr.querySelector('.ycct-tram2').value;

            if (!model || !bophan) { hasEmpty = true; return; }

            // STT, BỘ PHẬN, MODEL, LINE, MÃ THẺ, HỌ TÊN, LÝ DO, QUẢN LÝ, TRẠM CTQ 1, TRẠM CTQ 2
            // Col A=STT, B=BỘ PHẬN, C=MODEL, D=LINE, E=MÃ THẺ, F=HỌ TÊN, G=LÝ DO, H=QUẢN LÝ, I=TRẠM 1, J=TRẠM 2
            dataToSave.push(['', bophan, model, line, ma, ten, lydo, quanly, tram1, tram2]);
        });

        if (hasDup) return showToast('Có dòng bị TRÙNG MÃ THẺ! Vui lòng kiểm tra lại.', 'error');
        if (dataToSave.length === 0) return showToast('Không có dữ liệu hợp lệ để lưu!', 'warning');
        if (hasEmpty) showToast('Một số dòng thiếu Model/Bộ Phận đã bị bỏ qua.', 'warning');

        if (!confirm('Bạn xác nhận lưu ' + dataToSave.length + ' dòng yêu cầu cấp thẻ?')) return;

        showToast('Đang lưu dữ liệu...', 'info');

        google.script.run.withSuccessHandler(function(res) {
            if (res && res.success) {
                showToast('✅ Đã lưu thành công ' + dataToSave.length + ' dòng!', 'success');
                // Cập nhật G_Data.capThe
                if (res.newCapTheData) G_Data.capThe = res.newCapTheData;
                // Clear input
                let tbody = document.getElementById('ycct-input-body');
                if (tbody) tbody.innerHTML = '';
                ycctSttCounter = 1;
                ycctAddRow();
            } else {
                showToast('❌ Lỗi: ' + (res.message || 'Không xác định'), 'error');
            }
        }).withFailureHandler(function(err) {
            showToast('❌ Lỗi hệ thống: ' + err.message, 'error');
        }).saveYeuCauCapThe(dataToSave, CURRENT_USER);
    }

    function ycctRenderDataTab() {
        let data = G_Data.capThe || [];
        let statsEl = document.getElementById('ycct-stats');
        let tbody = document.getElementById('ycct-data-body');
        if (!tbody) return;

        let approvalConfig = (G_Data && G_Data.cardApprovalConfig) || { day: { confirmUsers: [], printUsers: [] }, night: { confirmUsers: [], printUsers: [] } };
        // Backward compat
        if (approvalConfig.confirmUsers && !approvalConfig.day) {
            approvalConfig = {
                day: { confirmUsers: approvalConfig.confirmUsers, printUsers: approvalConfig.printUsers },
                night: { confirmUsers: approvalConfig.confirmUsers, printUsers: approvalConfig.printUsers }
            };
        }

        // Stats
        let total = Math.max(0, data.length - 1);
        let models = {}, lines = {};
        let pendingCount = 0, approvedCount = 0, rejectedCount = 0;
        let myPendingCount = 0;
        let currentUser = window.CURRENT_USER || '';
        let cuLower = currentUser.trim().toLowerCase();

        for (let i = 1; i < data.length; i++) {
            let m = String(data[i][2] || '').trim();
            let l = String(data[i][3] || '').trim();

            if (l) lines[l] = (lines[l] || 0) + 1;
            let status = String(data[i][10] || '').trim();

            if (status === 'pending_confirm' || status === 'pending_print') {
                pendingCount++;
                // Check if waiting for ME
                let shift = getShift(l);
                let shiftConfig = approvalConfig[shift] || { confirmUsers: [], printUsers: [] };
                if (status === 'pending_confirm') {
                    if ((shiftConfig.confirmUsers || []).map(u=>String(u).trim().toLowerCase()).includes(cuLower)) myPendingCount++;
                } else if (status === 'pending_print') {
                    if ((shiftConfig.printUsers || []).map(u=>String(u).trim().toLowerCase()).includes(cuLower)) myPendingCount++;
                }
            }
            else if (status === 'approved') approvedCount++;
            else if (status === 'rejected') rejectedCount++;
        }
        let topModel = Object.entries(models).sort((a, b) => b[1] - a[1])[0];
        let lineCount = Object.keys(lines).length;

        // Update menu badge
        let navItem = document.getElementById('nav-yeu-cau-cap-the');
        if (navItem) {
            let span = navItem.querySelector('span');
            if (span) {
                span.innerHTML = '4. Yêu Cầu Cấp Thẻ' + (myPendingCount > 0 ? ' <b style="background:#dc2626;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;margin-left:5px;animation:pulse 2s infinite;">' + myPendingCount + '</b>' : '');
            }
        }
        
        // Show alert if myPendingCount > 0 and wasn't alerted recently
        if (myPendingCount > 0) {
            let lastAlert = window.LAST_PENDING_ALERT || 0;
            if (Date.now() - lastAlert > 300000) { // 5 mins throttle
                showToast('🔔 BẠN CÓ ' + myPendingCount + ' YÊU CẦU CẤP THẺ CẦN XÁC NHẬN!', 'warning');
                window.LAST_PENDING_ALERT = Date.now();
            }
        }

        if (statsEl) {

                    <div class="ycct-stat-num" style="color:#f59e0b;">${pendingCount}</div>
                    <div class="ycct-stat-label">⏳ Đang Chờ</div>
                </div>
                <div class="ycct-stat-card">
                    <div class="ycct-stat-num" style="color:#16a34a;">${approvedCount}</div>
                    <div class="ycct-stat-label">✅ Đã Duyệt</div>
                </div>
                <div class="ycct-stat-card">
                    <div class="ycct-stat-num" style="color:#dc2626;">${rejectedCount}</div>
                    <div class="ycct-stat-label">❌ Từ Chối</div>

        // Render table

            return;
        }

        // Hàm xác định ca từ cột LINE: kết thúc bằng D = ngày, N = đêm
        function getShift(lineVal) {
            let line = String(lineVal || '').trim().toUpperCase();
            if (line.endsWith(' N') || line.endsWith('-N')) return 'night';
            return 'day'; // mặc định là ca ngày (kết thúc bằng D hoặc không rõ)
        }

        let isAdmin = window.CURRENT_ROLE === 'admin';

        let html = '';
        for (let i = 1; i < data.length; i++) {
            let r = data[i];
            let status = String(r[10] || '').trim();
            if (!status) status = 'pending_confirm'; // Dữ liệu cũ chưa có cột K
            let confirmUser = String(r[11] || '').trim();
            let confirmTime = String(r[12] || '').trim();
            let printUser = String(r[13] || '').trim();
            let printTime = String(r[14] || '').trim();
            let createdInfo = String(r[15] || '').trim();

            // Xác định ca từ LINE column (r[3])
            let shift = getShift(r[3]);
            let shiftConfig = approvalConfig[shift] || { confirmUsers: [], printUsers: [] };
            let isConfirmUser = (shiftConfig.confirmUsers || []).map(u=>String(u).trim().toLowerCase()).includes(cuLower);
            let isPrintUser = (shiftConfig.printUsers || []).map(u=>String(u).trim().toLowerCase()).includes(cuLower);
            let shiftLabel = shift === 'night' ? '🌙' : '☀️';

            let statusHtml = '';
            if (status === 'pending_confirm') {

                statusHtml = '<span class="ycct-status-badge ycct-status-pending">' + shiftLabel + ' Đang Chờ <b>' + waitingFor.toUpperCase() + '</b> Xác Nhận' + (waitTime ? '<span class="ycct-status-time">⏱️ ' + waitTime + '</span>' : '') + '</span>';
            } else if (status === 'pending_print') {
                let waitingFor = (shiftConfig.printUsers || []).join(', ') || '...';
                let waitTime = '';
                if (confirmTime) {
                    waitTime = ycctCalcTimeSince(confirmTime);
                }
                statusHtml = '<span class="ycct-status-badge ycct-status-print">' + shiftLabel + ' Chờ <b>' + waitingFor.toUpperCase() + '</b> In Thẻ' + (waitTime ? '<span class="ycct-status-time">⏱️ ' + waitTime + '</span>' : '') + '</span>';

            if ((isConfirmUser || isAdmin) && status === 'pending_confirm') {
