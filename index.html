<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTQ SYSTEM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #17324d;
        }

        header {
            background: linear-gradient(135deg, #087f5b, #12b886);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.12);
            text-align: center;
        }

        button {
            border: none;
            background: #087f5b;
            color: white;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #056b4d;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<header>
    <h1>CTQ SYSTEM</h1>
    <p>HỆ THỐNG QUẢN LÝ THÔNG MINH</p>
</header>

<div class="container">

    <div class="card">
        <h2>🚀 Chào mừng đến CTQ SYSTEM</h2>

        <p>
            Website CTQ đã được triển khai trên GitHub.
        </p>

        <button onclick="hello()">
            BẮT ĐẦU
        </button>
    </div>

</div>

<script>
function hello() {
    alert("Chào mừng bạn đến với CTQ SYSTEM!");
}
</script>

</body>
</html>
