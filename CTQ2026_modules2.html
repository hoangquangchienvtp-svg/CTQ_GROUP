<script>

    // ==========================================
    // MODULE: BÔI MÀU NỀN Ô VÀ HÀNG (HIGHLIGHTING)
    // ==========================================
    window.ptCurrentHighlightColor = '#fca5a5';

    function ptSelectHighlightColor(btnEl, color) {
        window.ptCurrentHighlightColor = color;
        document.querySelectorAll('.pt-color-btn').forEach(b => {
            b.style.transform = 'scale(1)';
            b.style.borderWidth = '2px';
        });
        if (btnEl) {
            btnEl.style.transform = 'scale(1.15)';
            btnEl.style.borderWidth = '3px';
        }
    }

    document.addEventListener('click', function (e) {
        let cell = e.target.closest('td, input');
        if (!cell) return;

        let table = cell.closest('#pt-training-table, #pt-summary-table');
        if (!table) return;

        // Bỏ qua header, footer hoặc các nút thao tác (xóa trạm, nút bấm)
        if (e.target.tagName === 'BUTTON' || cell.closest('thead, tfoot') || e.target.closest('.pt-color-btn')) return;

        let tr = cell.closest('tr');
        if (!tr) return;

        let isWholeRow = document.getElementById('pt-color-whole-row') && document.getElementById('pt-color-whole-row').checked;
        let color = window.ptCurrentHighlightColor || '#fca5a5';

        if (isWholeRow) {
            tr.querySelectorAll('td').forEach(td => {
                td.style.backgroundColor = color;
                let inp = td.querySelector('input');
                if (inp) inp.style.backgroundColor = 'transparent';
            });
        } else {
            let td = cell.tagName === 'INPUT' ? cell.closest('td') : cell;
            if (td) {
                td.style.backgroundColor = color;
                if (cell.tagName === 'INPUT') cell.style.backgroundColor = 'transparent';
            }
        }
    });

    function ptInitTrainingDatesFromRange() {
        let fromVal = document.getElementById('pt-tr-from-date') ? document.getElementById('pt-tr-from-date').value : '';
        let toVal = document.getElementById('pt-tr-to-date') ? document.getElementById('pt-tr-to-date').value : '';

        let dates = [];
        if (fromVal && toVal) {
            let curr = new Date(fromVal);
            let end = new Date(toVal);
            while (curr <= end) {
                dates.push(new Date(curr));
                curr.setDate(curr.getDate() + 1);
            }
        }

        if (!dates.length) {
            let start = new Date(2026, 6, 22); // Default starting 22/07/2026
            for (let i = 0; i < 5; i++) {
                let d = new Date(start);
                d.setDate(start.getDate() + i);
                dates.push(d);
            }
            if (document.getElementById('pt-tr-from-date')) {
                let y = start.getFullYear(), m = ("0" + (start.getMonth() + 1)).slice(-2), d = ("0" + start.getDate()).slice(-2);
                document.getElementById('pt-tr-from-date').value = `${y}-${m}-${d}`;
            }
            if (document.getElementById('pt-tr-to-date')) {
                let last = dates[dates.length - 1];
                let y = last.getFullYear(), m = ("0" + (last.getMonth() + 1)).slice(-2), d = ("0" + last.getDate()).slice(-2);
                document.getElementById('pt-tr-to-date').value = `${y}-${m}-${d}`;
            }
        }

        window.PassTramTrainingDates = dates;
        ptRenderTrainingDates();
    }

    function ptRenderTrainingDates() {
        let thead = document.getElementById('pt-training-thead');
        if (!thead) return;

        let datesList = window.PassTramTrainingDates;
        if (!datesList || !datesList.length) {
            ptInitTrainingDatesFromRange();
            datesList = window.PassTramTrainingDates;
        }

        let hiddenMap = window.PassTramTrainingHiddenDateIndices || {};
        let visibleCount = datesList.filter((_, i) => !hiddenMap[i]).length;

        let table = document.getElementById('pt-training-table');
        if (table) {
            table.style.tableLayout = 'fixed';
            if (visibleCount <= 4) {
                table.style.width = 'max-content';
                table.style.minWidth = 'auto';
                table.style.margin = '0 auto';
            } else {
                table.style.width = 'max-content';
                table.style.minWidth = '100%';
                table.style.margin = '0';
            }
        }

        let col1W = (visibleCount >= 7) ? '50px' : '60px';
        let col2W = (visibleCount <= 2) ? '450px' : '300px';
        let infoW = (visibleCount >= 7) ? '40px' : '50px';
        let shiftW = (visibleCount >= 7) ? '48px' : ((visibleCount >= 5) ? '55px' : '65px');
        let shiftFont = '16px';

        let titleMain = (typeof getTxt === 'function' && getTxt('pt_title_main')) ? getTxt('pt_title_main') : 'THỐNG KÊ SỐ LƯỢNG ĐÀO TẠO Ở CÁC TRẠM (MAINLINE)';
        let thProcess = (typeof getTxt === 'function' && getTxt('pt_th_process')) ? getTxt('pt_th_process') : '制程';
        let thStation = (typeof getTxt === 'function' && getTxt('pt_th_station')) ? getTxt('pt_th_station') : 'CTQ 站别';

        let totalCols = 5 + (visibleCount * 2) + 1;

        let hHtml = `
        <tr style="background:#0f5132; color:#ffffff; font-weight:900; font-size:20px;">
            <th colspan="${totalCols}" style="padding:8px; background:#0f5132; color:#ffffff; font-size:20px; font-weight:900; text-align:center; height:44px; vertical-align:middle;">${titleMain}</th>
        </tr>
        <tr style="background:#0f5132; color:#ffffff; font-weight:900;">
            <th rowspan="2" style="padding:6px 2px; width:${col1W}; min-width:${col1W}; max-width:${col1W}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">${thProcess}</th>
            <th rowspan="2" style="padding:6px 6px; width:${col2W}; min-width:${col2W}; max-width:${col2W}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">${thStation}</th>
            <th rowspan="2" style="padding:6px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">HC</th>
            <th rowspan="2" style="padding:6px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">Line</th>
            <th rowspan="2" style="padding:6px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">On</th>
        `;

        datesList.forEach((d, idx) => {
            if (!hiddenMap[idx]) {
                let m = d.getMonth() + 1;
                let day = d.getDate();
                let dateStr = `${day < 10 ? '0' + day : day}/${m < 10 ? '0' + m : m}`;
                hHtml += `<th colspan="2" style="padding:6px 2px; background:#0f5132; color:#ffffff; font-size:18px; font-weight:900; text-align:center; vertical-align:middle;">${dateStr}</th>`;
            }
        });
        hHtml += `<th rowspan="2" style="padding:6px 2px; width:75px; min-width:75px; max-width:75px; background:#0f5132; color:#ffffff; font-size:18px; font-weight:900; text-align:center; vertical-align:middle;">TOTAL</th></tr><tr style="font-weight:900;">`;

        datesList.forEach((_, idx) => {
            if (!hiddenMap[idx]) {
                hHtml += `
                <th style="padding:5px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; background:#bbf7d0; color:#000; font-size:${shiftFont}; font-weight:900; text-align:center; vertical-align:middle;">白班</th>
                <th style="padding:5px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; background:#fef08a; color:#000; font-size:${shiftFont}; font-weight:900; text-align:center; vertical-align:middle;">夜班</th>
                `;
            }
        });
        hHtml += `</tr>`;

        thead.innerHTML = hHtml;
        ptRenderTrainingTable();
    }

    function ptRenderTrainingTable() {
        let tbody = document.getElementById('pt-training-tbody');
        if (!tbody) return;

        let datesList = window.PassTramTrainingDates || [];
        let hiddenMap = window.PassTramTrainingHiddenDateIndices || {};

        let visibleCount = datesList.filter((_, idx) => !hiddenMap[idx]).length;
        let col1W = (visibleCount >= 7) ? '50px' : '60px';
        let col2W = (visibleCount <= 2) ? '450px' : '300px';
        let infoW = (visibleCount >= 7) ? '40px' : '50px';
        let shiftW = (visibleCount >= 7) ? '48px' : ((visibleCount >= 5) ? '55px' : '65px');

        let shiftFont = '18px';
        let thProcess = (typeof getTxt === 'function' && getTxt('pt_th_process')) ? getTxt('pt_th_process') : '制程';
        let thStation = (typeof getTxt === 'function' && getTxt('pt_th_station')) ? getTxt('pt_th_station') : 'CTQ 站别';

        let mainStations = window.PassTramTrainingMainStations || [];
        let subStations = window.PassTramTrainingSubStations || [];

        let titleMain = (typeof getTxt === 'function' && getTxt('pt_title_main')) ? getTxt('pt_title_main') : 'THỐNG KÊ SỐ LƯỢNG ĐÀO TẠO Ở CÁC TRẠM (MAINLINE)';
        let titleSub = (typeof getTxt === 'function' && getTxt('pt_title_sub')) ? getTxt('pt_title_sub') : 'THỐNG KÊ SỐ LƯỢNG ĐÀO TẠO Ở CÁC TRẠM (SUBLINE)';

        let totalColsSpan = 5 + visibleCount * 2 + 1;

        let html = '';

        mainStations.forEach((st, idx) => {
            html += `<tr class="pt-tr-row" data-type="MAIN">`;
            if (idx === 0) {
                html += `<td rowspan="${mainStations.length}" style="background:#fef08a; font-weight:900; font-size:18px; vertical-align:middle; text-align:center; padding:8px 2px; width:${col1W}; min-width:${col1W}; max-width:${col1W};">Main</td>`;
            }
            html += `<td style="padding:2px 4px; text-align:center; vertical-align:middle; width:${col2W}; min-width:${col2W}; max-width:${col2W}; word-break:break-word;"><textarea class="pt-tr-st-name" style="width:100%; border:none; background:transparent; font-weight:900; font-size:14px; color:#000; text-align:center; resize:none; outline:none; height:36px; line-height:1.2; overflow:hidden; font-family:inherit; margin:0; padding:1px 0;" rows="2">${st.name}</textarea></td>`;
            html += `<td style="padding:2px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-hc" value="${st.hc}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; font-weight:900; border:none; background:transparent; height:34px; font-size:22px; color:#000;"></td>`;
            html += `<td style="padding:2px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-line" value="${st.line}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; font-weight:900; border:none; background:transparent; height:34px; font-size:22px; color:#000;"></td>`;
            html += `<td style="padding:2px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-on" value="${st.on}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; font-weight:900; border:none; background:transparent; height:34px; font-size:22px; color:#000;"></td>`;

            let stRowSum = 0;
            datesList.forEach((_, dIdx) => {
                if (!hiddenMap[dIdx]) {
                    let c1 = dIdx * 2;
                    let c2 = dIdx * 2 + 1;
                    let dsVal = (st.vals && st.vals[c1] !== undefined) ? Number(st.vals[c1]) : 0;
                    let nsVal = (st.vals && st.vals[c2] !== undefined) ? Number(st.vals[c2]) : 0;
                    stRowSum += (dsVal + nsVal);
                    let dsStyle = (dsVal > 0) ? 'color:#dc2626; font-size:30px; font-weight:900;' : 'color:#000; font-size:22px; font-weight:900;';
                    let nsStyle = (nsVal > 0) ? 'color:#dc2626; font-size:30px; font-weight:900;' : 'color:#000; font-size:22px; font-weight:900;';
                    html += `<td style="padding:2px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-cell" data-col="${c1}" value="${dsVal}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; border:none; background:transparent; height:34px; ${dsStyle}"></td>`;
                    html += `<td style="padding:2px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-cell" data-col="${c2}" value="${nsVal}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; border:none; background:transparent; height:34px; ${nsStyle}"></td>`;
                }
            });
            html += `<td class="pt-tr-row-total" style="text-align:center; vertical-align:middle; font-weight:900; font-size:25px; width:75px; min-width:75px; max-width:75px; background:#fff; color:#000;">${stRowSum} <button type="button" onclick="ptDeleteTrainingStation(this)" style="border:none; background:none; cursor:pointer; color:#ef4444; font-weight:bold; font-size:11px; padding:0; margin-left:1px;" title="Xóa trạm">🗑️</button></td></tr>`;
        });

        // Dòng tổng Main Total nằm ngay dưới phần MAIN
        html += `<tr class="pt-tr-main-total" style="background:#0f5132; color:#ffffff; font-weight:bold; font-size:21px; height:48px;">
            <td colspan="2" style="padding:8px 4px; text-align:center; vertical-align:middle; color:#ffffff; font-size:21px; font-weight:bold;">Main Total</td>
            <td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-main-sum-hc">0</td>
            <td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-main-sum-line">0</td>
            <td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-main-sum-on">0</td>
        `;
        datesList.forEach((_, dIdx) => {
            if (!hiddenMap[dIdx]) {
                let c1 = dIdx * 2;
                let c2 = dIdx * 2 + 1;
                html += `<td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-main-sum-col-${c1}">0</td>`;
                html += `<td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-main-sum-col-${c2}">0</td>`;
            }
        });
        html += `<td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-main-sum-total">0</td></tr>`;

        // SECTION 2: SUBLINE BANNER ROW & EXPLICIT SUBHEADER ROW
        html += `<tr class="pt-tr-section-header" style="background:#0f5132; color:#ffffff; font-weight:900; font-size:20px; height:44px;">
            <td colspan="${totalColsSpan}" style="text-align:center; vertical-align:middle; padding:8px 15px; color:#ffffff; font-size:20px; font-weight:900;">${titleSub}</td>
        </tr>`;

        // Tiêu đề cột rõ ràng cho bộ phận SUBLINE
        html += `<tr class="pt-tr-sub-header" style="background:#0f5132; color:#ffffff; font-weight:900;">
            <th rowspan="2" style="padding:6px 2px; width:${col1W}; min-width:${col1W}; max-width:${col1W}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">${thProcess}</th>
            <th rowspan="2" style="padding:6px 6px; width:${col2W}; min-width:${col2W}; max-width:${col2W}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">${thStation}</th>
            <th rowspan="2" style="padding:6px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">HC</th>
            <th rowspan="2" style="padding:6px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">Line</th>
            <th rowspan="2" style="padding:6px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; background:#0f5132; color:#ffffff; text-align:center; vertical-align:middle; font-size:18px;">On</th>
        `;

        datesList.forEach((d, idx) => {
            if (!hiddenMap[idx]) {
                let m = d.getMonth() + 1;
                let day = d.getDate();
                let dateStr = `${day < 10 ? '0' + day : day}/${m < 10 ? '0' + m : m}`;
                html += `<th colspan="2" style="padding:6px 2px; background:#0f5132; color:#ffffff; font-size:18px; font-weight:900; text-align:center; vertical-align:middle;">${dateStr}</th>`;
            }
        });
        html += `<th rowspan="2" style="padding:6px 2px; width:75px; min-width:75px; max-width:75px; background:#0f5132; color:#ffffff; font-size:18px; font-weight:900; text-align:center; vertical-align:middle;">TOTAL</th></tr><tr class="pt-tr-sub-header" style="font-weight:900;">`;

        datesList.forEach((_, idx) => {
            if (!hiddenMap[idx]) {
                html += `
                <th style="padding:5px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; background:#bbf7d0; color:#000; font-size:${shiftFont}; font-weight:900; text-align:center; vertical-align:middle;">白班</th>
                <th style="padding:5px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; background:#fef08a; color:#000; font-size:${shiftFont}; font-weight:900; text-align:center; vertical-align:middle;">夜班</th>
                `;
            }
        });
        html += `</tr>`;

        subStations.forEach((st, idx) => {
            html += `<tr class="pt-tr-row" data-type="SUB">`;
            if (idx === 0) {
                html += `<td rowspan="${subStations.length}" style="background:#fef08a; font-weight:900; font-size:18px; vertical-align:middle; text-align:center; padding:8px 2px; width:${col1W}; min-width:${col1W}; max-width:${col1W};">SUB</td>`;
            }
            html += `<td style="padding:2px 4px; text-align:center; vertical-align:middle; width:${col2W}; min-width:${col2W}; max-width:${col2W}; word-break:break-word;"><textarea class="pt-tr-st-name" style="width:100%; border:none; background:transparent; font-weight:900; font-size:14px; color:#000; text-align:center; resize:none; outline:none; height:36px; line-height:1.2; overflow:hidden; font-family:inherit; margin:0; padding:1px 0;" rows="2">${st.name}</textarea></td>`;
            html += `<td style="padding:2px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-hc" value="${st.hc}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; font-weight:900; border:none; background:transparent; height:34px; font-size:22px; color:#000;"></td>`;
            html += `<td style="padding:2px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-line" value="${st.line}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; font-weight:900; border:none; background:transparent; height:34px; font-size:22px; color:#000;"></td>`;
            html += `<td style="padding:2px 2px; width:${infoW}; min-width:${infoW}; max-width:${infoW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-on" value="${st.on}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; font-weight:900; border:none; background:transparent; height:34px; font-size:22px; color:#000;"></td>`;

            let stRowSum = 0;
            datesList.forEach((_, dIdx) => {
                if (!hiddenMap[dIdx]) {
                    let c1 = dIdx * 2;
                    let c2 = dIdx * 2 + 1;
                    let dsVal = (st.vals && st.vals[c1] !== undefined) ? Number(st.vals[c1]) : 0;
                    let nsVal = (st.vals && st.vals[c2] !== undefined) ? Number(st.vals[c2]) : 0;
                    stRowSum += (dsVal + nsVal);
                    let dsStyle = (dsVal > 0) ? 'color:#dc2626; font-size:30px; font-weight:900;' : 'color:#000; font-size:22px; font-weight:900;';
                    let nsStyle = (nsVal > 0) ? 'color:#dc2626; font-size:30px; font-weight:900;' : 'color:#000; font-size:22px; font-weight:900;';
                    html += `<td style="padding:2px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-cell" data-col="${c1}" value="${dsVal}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; border:none; background:transparent; height:34px; ${dsStyle}"></td>`;
                    html += `<td style="padding:2px 2px; width:${shiftW}; min-width:${shiftW}; max-width:${shiftW}; text-align:center; vertical-align:middle;"><input type="number" class="pt-tr-cell" data-col="${c2}" value="${nsVal}" oninput="ptCalcTrainingGrandTotal()" style="width:100%; text-align:center; text-align-last:center; border:none; background:transparent; height:34px; ${nsStyle}"></td>`;
                }
            });
            html += `<td class="pt-tr-row-total" style="text-align:center; vertical-align:middle; font-weight:900; font-size:25px; width:75px; min-width:75px; max-width:75px; background:#fff; color:#000; white-space:nowrap;">${stRowSum} <button type="button" onclick="ptDeleteTrainingStation(this)" style="border:none; background:none; cursor:pointer; color:#ef4444; font-weight:bold; font-size:11px; padding:0; margin-left:2px; vertical-align:middle;" title="Xóa trạm">🗑️</button></td></tr>`;
        });

        tbody.innerHTML = html;
        ptCalcTrainingGrandTotal();
    }

    function ptCalcTrainingGrandTotal() {
        let tfoot = document.getElementById('pt-training-tfoot');
        if (!tfoot) return;

        let datesList = window.PassTramTrainingDates || [];
        let hiddenMap = window.PassTramTrainingHiddenDateIndices || {};
        let totalShiftCols = datesList.length * 2;

        let mainHc = 0, mainLine = 0, mainOn = 0;
        let mainShiftSums = new Array(totalShiftCols).fill(0);
        let mainGrandTotal = 0;

        let subHc = 0, subLine = 0, subOn = 0;
        let subShiftSums = new Array(totalShiftCols).fill(0);
        let subGrandTotal = 0;

        let rows = document.querySelectorAll('#pt-training-tbody tr.pt-tr-row');
        rows.forEach(tr => {
            let isMain = tr.getAttribute('data-type') === 'MAIN';
            let hcInp = tr.querySelector('.pt-tr-hc');
            let lineInp = tr.querySelector('.pt-tr-line');
            let onInp = tr.querySelector('.pt-tr-on');

            let hcVal = hcInp ? Number(hcInp.value || 0) : 0;
            let lineVal = lineInp ? Number(lineInp.value || 0) : 0;
            let onVal = onInp ? Number(onInp.value || 0) : 0;

            if (isMain) {
                mainHc += hcVal;
                mainLine += lineVal;
                mainOn += onVal;
            } else {
                subHc += hcVal;
                subLine += lineVal;
                subOn += onVal;
            }

            let rowSum = 0;
            datesList.forEach((_, dIdx) => {
                if (!hiddenMap[dIdx]) {
                    let c1 = dIdx * 2;
                    let c2 = dIdx * 2 + 1;
                    let cellInp1 = tr.querySelector(`.pt-tr-cell[data-col="${c1}"]`);
                    let cellInp2 = tr.querySelector(`.pt-tr-cell[data-col="${c2}"]`);
                    let v1 = cellInp1 ? Number(cellInp1.value || 0) : 0;
                    let v2 = cellInp2 ? Number(cellInp2.value || 0) : 0;

                    if (cellInp1) {
                        if (v1 > 0) {
                            cellInp1.style.color = '#dc2626';
                            cellInp1.style.fontSize = '30px';
                            cellInp1.style.fontWeight = '900';
                        } else {
                            cellInp1.style.color = '#000000';
                            cellInp1.style.fontSize = '22px';
                            cellInp1.style.fontWeight = '900';
                        }
                    }

                    if (cellInp2) {
                        if (v2 > 0) {
                            cellInp2.style.color = '#dc2626';
                            cellInp2.style.fontSize = '30px';
                            cellInp2.style.fontWeight = '900';
                        } else {
                            cellInp2.style.color = '#000000';
                            cellInp2.style.fontSize = '22px';
                            cellInp2.style.fontWeight = '900';
                        }
                    }

                    if (isMain) {
                        mainShiftSums[c1] += v1;
                        mainShiftSums[c2] += v2;
                    } else {
                        subShiftSums[c1] += v1;
                        subShiftSums[c2] += v2;
                    }
                    rowSum += (v1 + v2);
                }
            });

            if (isMain) mainGrandTotal += rowSum;
            else subGrandTotal += rowSum;

            let totalCell = tr.querySelector('.pt-tr-row-total');
            if (totalCell) {
                totalCell.innerHTML = `${rowSum} <button type="button" onclick="ptDeleteTrainingStation(this)" style="border:none; background:none; cursor:pointer; color:#ef4444; font-weight:bold; font-size:11px; padding:0; margin-left:2px; vertical-align:middle;" title="Xóa trạm">🗑️</button>`;
            }
        });

        // Update Main Total row in tbody
        let mainHcElem = document.getElementById('pt-tr-main-sum-hc');
        if (mainHcElem) mainHcElem.textContent = mainHc;
        let mainLineElem = document.getElementById('pt-tr-main-sum-line');
        if (mainLineElem) mainLineElem.textContent = mainLine;
        let mainOnElem = document.getElementById('pt-tr-main-sum-on');
        if (mainOnElem) mainOnElem.textContent = mainOn;
        let mainTotElem = document.getElementById('pt-tr-main-sum-total');
        if (mainTotElem) mainTotElem.textContent = mainGrandTotal;

        datesList.forEach((_, dIdx) => {
            if (!hiddenMap[dIdx]) {
                let c1 = dIdx * 2;
                let c2 = dIdx * 2 + 1;
                let elem1 = document.getElementById(`pt-tr-main-sum-col-${c1}`);
                let elem2 = document.getElementById(`pt-tr-main-sum-col-${c2}`);
                if (elem1) elem1.textContent = mainShiftSums[c1];
                if (elem2) elem2.textContent = mainShiftSums[c2];
            }
        });

        // Render Sub Total / Grand Total in tfoot
        let ftHtml = `<tr style="background:#0f5132; color:#ffffff; font-weight:bold; font-size:21px; height:48px;">
            <td colspan="2" style="padding:8px 4px; text-align:center; vertical-align:middle; color:#ffffff; font-size:21px; font-weight:bold;">Grand Total</td>
            <td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-sum-hc">${subHc}</td>
            <td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-sum-line">${subLine}</td>
            <td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-sum-on">${subOn}</td>
        `;

        datesList.forEach((_, dIdx) => {
            if (!hiddenMap[dIdx]) {
                let c1 = dIdx * 2;
                let c2 = dIdx * 2 + 1;
                ftHtml += `<td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;">${subShiftSums[c1]}</td>`;
                ftHtml += `<td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;">${subShiftSums[c2]}</td>`;
            }
        });
        ftHtml += `<td style="padding:8px 2px; text-align:center; vertical-align:middle; font-size:21px; font-weight:bold; color:#ffffff;" id="pt-tr-sum-grand-total">${subGrandTotal}</td></tr>`;

        tfoot.innerHTML = ftHtml;
        ptSyncTrainingStationsFromUI();
    }

    function ptAutoCalcTrainingFromData(evt) {
        if (evt) evt.preventDefault();

        // Bật hiển thị bảng và ẩn banner placeholder
        let card = document.getElementById('pt-training-table-card');
        let placeholder = document.getElementById('pt-training-placeholder');
        if (card) card.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';

        // Cập nhật lại danh sách cột ngày từ Từ ngày -> Đến ngày khi BẤM TÌM KIẾM
        ptInitTrainingDatesFromRange();

        let sheetName = document.getElementById('pt-target-sheet') ? document.getElementById('pt-target-sheet').value : 'STA5';
        showToast(`Đang quét dữ liệu từ sheet ${sheetName}...`, "info");

        let datesList = window.PassTramTrainingDates || [];

        let inputRows = [];
        let trs = document.querySelectorAll('#pt-input-tbody tr');
        trs.forEach(tr => {
            let inps = tr.querySelectorAll('input, select');
            if (inps.length >= 11) {
                let khuVuc = (inps[1].value || '').toUpperCase();
                let ca = (inps[3].value || '').toUpperCase();
                let tram = (inps[4].value || '').trim();
                let ngayStr = (inps[7].value || '').trim();
                let res = (inps[9].value || '').toUpperCase();

                if (tram && ngayStr) {
                    inputRows.push({ khuVuc, ca, tram, ngayStr, res });
                }
            }
        });

        if (!inputRows.length) {
            google.script.run.withSuccessHandler(res => {
                if (res && res.success && res.rows) {
                    let bRows = res.rows.map(r => ({
                        khuVuc: (r[2] || '').toString().toUpperCase(),
                        ca: (r[4] || '').toString().toUpperCase(),
                        tram: (r[5] || '').toString().trim(),
                        ngayStr: (r[8] || '').toString().trim(),
                        res: (r[10] || '').toString().toUpperCase()
                    }));
                    ptApplyTrainingCounts(bRows);
                } else {
                    ptApplyTrainingCounts([]);
                }
            }).getPassTramReportData(sheetName, '', '');
        } else {
            ptApplyTrainingCounts(inputRows);
        }
    }

    function ptApplyTrainingCounts(rows) {
        let datesList = window.PassTramTrainingDates || [];
        let trRows = document.querySelectorAll('#pt-training-tbody tr.pt-tr-row');

        trRows.forEach(tr => {
            let stNameInp = tr.querySelector('.pt-tr-st-name');
            let stName = stNameInp ? stNameInp.value.trim().toLowerCase() : '';
            let type = tr.getAttribute('data-type');

            datesList.forEach((d, dIdx) => {
                let c1 = dIdx * 2;
                let c2 = dIdx * 2 + 1;

                let dayCount = 0;
                let nightCount = 0;

                rows.forEach(r => {
                    let rawNgay = (r.ngayStr || '').toString().trim();
                    let parsedMonth = -1, parsedDay = -1;

                    if (rawNgay) {
                        if (rawNgay.includes('T') || rawNgay.includes('-')) {
                            let dObj = new Date(rawNgay);
                            if (!isNaN(dObj.getTime())) { parsedDay = dObj.getDate(); parsedMonth = dObj.getMonth(); }
                        } else if (rawNgay.includes('/')) {
                            let p = rawNgay.split('/');
                            parsedDay = parseInt(p[0], 10); parsedMonth = parseInt(p[1], 10) - 1;
                        } else {
                            let dObj = new Date(rawNgay);
                            if (!isNaN(dObj.getTime())) { parsedDay = dObj.getDate(); parsedMonth = dObj.getMonth(); }
                        }
                    }

                    if (parsedDay === d.getDate() && parsedMonth === d.getMonth()) {
                        let rTram = (r.tram || '').trim().toLowerCase();
                        if (rTram && stName && (rTram === stName || rTram.includes(stName) || stName.includes(rTram))) {
                            let caStr = (r.ca || '').toString().toUpperCase();
                            let isNight = caStr.includes('NIGHT') || caStr.includes('ĐÊM') || caStr === 'N' || caStr.includes('夜');
                            if (!isNight) dayCount += 1;
                            else nightCount += 1;
                        }
                    }
                });

                let dayInp = tr.querySelector(`.pt-tr-cell[data-col="${c1}"]`);
                let nightInp = tr.querySelector(`.pt-tr-cell[data-col="${c2}"]`);
                if (dayInp) dayInp.value = dayCount;
                if (nightInp) nightInp.value = nightCount;
            });
        });

        ptCalcTrainingGrandTotal();
        showToast("Đã tự động tính toán tổng hợp dữ liệu Training thành công!", "success");
    }

    function ptAddTrainingStation(type) {
        let stName = prompt(`Nhập tên Trạm CTQ mới cho ${type}:`);
        if (!stName || !stName.trim()) return;

        let newObj = { name: stName.trim(), hc: 0, line: 0, on: 0 };
        if (type === 'MAIN') {
            window.PassTramTrainingMainStations = window.PassTramTrainingMainStations || [];
            window.PassTramTrainingMainStations.push(newObj);
        } else {
            window.PassTramTrainingSubStations = window.PassTramTrainingSubStations || [];
            window.PassTramTrainingSubStations.push(newObj);
        }

        ptRenderTrainingTable();
        showToast(`Đã thêm trạm ${stName} vào ${type}!`, "success");
    }

    function ptSaveTrainingToSheet(evt) {
        if (evt) evt.preventDefault();

        // Đồng bộ và lưu toàn bộ giá trị HC, Line, On, tên trạm hiện tại vào localStorage
        ptSyncTrainingStationsFromUI();

        let table = document.getElementById('pt-training-table');
        if (!table) return showToast("Không tìm thấy bảng Training!", "warning");

        let matrix = [];
        let bgColors = [];
        let merges = [];

        let datesList = window.PassTramTrainingDates || [new Date()];
        let totalShiftCols = datesList.length * 2;
        let numCols = 5 + totalShiftCols + 1; // +1 cho cột TOTAL ở cuối

        // Row 1: Header 1 (Orange #f59e0b)
        let r1 = ['THỐNG KÊ SỐ LƯỢNG ĐÀO TẠO Ở CÁC TRẠM (MAINLINE)', '', '', '', ''];
        let r1Bgs = ['#f59e0b', '#f59e0b', '#f59e0b', '#f59e0b', '#f59e0b'];
        datesList.forEach(d => {
            let day = d.getDate();
            let m = d.getMonth() + 1;
            let dateStr = `${day < 10 ? '0' + day : day}/${m < 10 ? '0' + m : m}`;
            r1.push(dateStr, '');
            r1Bgs.push('#f59e0b', '#f59e0b');
        });
        r1.push('');
        r1Bgs.push('#f59e0b');
        matrix.push(r1);
        bgColors.push(r1Bgs);

        // Merges for Row 1
        merges.push({ r: 1, c: 1, rs: 1, cs: numCols });

        // Row 2: Header 2 (Shifts: 白班 #bbf7d0, 夜班 #fef08a)
        let r2 = ['制程', 'CTQ 站别', 'HC', 'Line', 'On'];
        let r2Bgs = ['#f59e0b', '#f59e0b', '#f59e0b', '#f59e0b', '#f59e0b'];
        datesList.forEach(() => {
            r2.push('白班', '夜班');
            r2Bgs.push('#bbf7d0', '#fef08a');
        });
        r2.push('TOTAL');
        r2Bgs.push('#f59e0b');
        matrix.push(r2);
        bgColors.push(r2Bgs);

        // Rows in Tbody
        let trs = document.querySelectorAll('#pt-training-tbody tr');
        let currentSheetRow = 3;

        let mainRowsCount = 0;
        let subRowsCount = 0;
        let mainStartRow = 0;
        let subStartRow = 0;

        trs.forEach(tr => {
            if (tr.classList.contains('pt-tr-section-header')) {
                let secTitle = tr.innerText.trim();
                let rHeader = [secTitle, '', '', '', ''];
                let rHeaderBgs = ['#f59e0b', '#f59e0b', '#f59e0b', '#f59e0b', '#f59e0b'];
                for (let i = 0; i < totalShiftCols + 1; i++) {
                    rHeader.push('');
                    rHeaderBgs.push('#f59e0b');
                }
                matrix.push(rHeader);
                bgColors.push(rHeaderBgs);
                merges.push({ r: currentSheetRow, c: 1, rs: 1, cs: numCols });
                currentSheetRow++;
            } else if (tr.classList.contains('pt-tr-row')) {
                let type = tr.getAttribute('data-type');
                let stName = tr.querySelector('.pt-tr-st-name') ? tr.querySelector('.pt-tr-st-name').value : '';
                let hc = tr.querySelector('.pt-tr-hc') ? tr.querySelector('.pt-tr-hc').value : '0';
                let line = tr.querySelector('.pt-tr-line') ? tr.querySelector('.pt-tr-line').value : '0';
                let on = tr.querySelector('.pt-tr-on') ? tr.querySelector('.pt-tr-on').value : '0';

                if (type === 'MAIN') {
                    if (mainRowsCount === 0) mainStartRow = currentSheetRow;
                    mainRowsCount++;
                } else if (type === 'SUB') {
                    if (subRowsCount === 0) subStartRow = currentSheetRow;
                    subRowsCount++;
                }

                let procArea = (type === 'MAIN') ? 'Main' : 'SUB';
                let rowVals = [procArea, stName, Number(hc), Number(line), Number(on)];

                let tds = tr.querySelectorAll('td');
                let getCellBg = (td, defBg) => {
                    if (td && td.style.backgroundColor && td.style.backgroundColor !== 'transparent') {
                        return td.style.backgroundColor;
                    }
                    return defBg || '#ffffff';
                };

                let rowBgs = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff'];
                for (let c = 0; c < totalShiftCols; c++) {
                    let cellInp = tr.querySelector(`.pt-tr-cell[data-col="${c}"]`);
                    let tdCell = cellInp ? cellInp.closest('td') : null;
                    let val = cellInp ? Number(cellInp.value || 0) : 0;
                    rowVals.push(val);
                    rowBgs.push(getCellBg(tdCell, '#ffffff'));
                }

                // Cột TOTAL trạm
                let totalCell = tr.querySelector('.pt-tr-row-total');
                let totalVal = totalCell ? Number(totalCell.innerText.trim().replace(/[^0-9]/g, '') || 0) : 0;
                rowVals.push(totalVal);
                rowBgs.push(getCellBg(totalCell, '#ffffff'));

                matrix.push(rowVals);
                bgColors.push(rowBgs);
                currentSheetRow++;
            }
        });

        if (mainRowsCount > 1 && mainStartRow > 0) {
            merges.push({ r: mainStartRow, c: 1, rs: mainRowsCount, cs: 1 });
        }
        if (subRowsCount > 1 && subStartRow > 0) {
            merges.push({ r: subStartRow, c: 1, rs: subRowsCount, cs: 1 });
        }

        // Grand Total Row (Footer)
        let hcSum = Number(document.getElementById('pt-tr-sum-hc') ? document.getElementById('pt-tr-sum-hc').innerText : 0);

    function ptExecuteCaptureDirect(tabType, mode = 'download') {
        let tableId = (tabType === 'summary') ? 'pt-summary-table' : 'pt-training-table';
        let cardId = (tabType === 'summary') ? 'pt-summary-table-card' : 'pt-training-table-card';
        let table = document.getElementById(tableId);
        let card = document.getElementById(cardId);
        if (!table) return showToast("Không tìm thấy bảng để chụp!", "warning");

        let tabName = (tabType === 'summary') ? 'Summary' : 'Training';

        if (mode === 'copy') {
            showToast(`📋 Đang chụp và copy ảnh toàn bộ bảng ${tabName}...`, "info");
        } else {
            showToast(`📸 Đang chụp và tải ảnh toàn bộ bảng ${tabName}...`, "info");
        }

        let origCardOverflow = card ? card.style.overflow : '';
        let origCardMaxHeight = card ? card.style.maxHeight : '';

        let delCols = card ? card.querySelectorAll('.pt-tr-del-col, .pt-sum-del-col') : [];
        delCols.forEach(el => el.style.display = 'none');

        if (card) {
            card.style.overflow = 'visible';
            card.style.maxHeight = 'none';
        }

        let restoreAll = () => {
            if (card) {
                card.style.overflow = origCardOverflow;
                card.style.maxHeight = origCardMaxHeight;
            }
            delCols.forEach(el => el.style.display = '');
        };

        if (typeof html2canvas === 'function') {
            html2canvas(table, {
                scale: Math.max(3, (window.devicePixelRatio || 1) * 2),
                useCORS: true,
                allowTaint: true,
                logging: false,
                backgroundColor: '#ffffff',
                height: table.offsetHeight,
                windowHeight: table.offsetHeight,
                scrollY: -window.scrollY
            }).then(canvas => {
                restoreAll();
                let dateStr = new Date().toISOString().slice(0, 10);
                let fileName = `${tabName}_Report_${dateStr}.png`;

                if (mode === 'copy') {
                    canvas.toBlob(async (blob) => {
                        if (!blob) return showToast("Không thể tạo dữ liệu ảnh!", "error");
                        try {
                            if (navigator.clipboard && window.ClipboardItem) {
                                const item = new ClipboardItem({ 'image/png': blob });
                                await navigator.clipboard.write([item]);
                                showToast(`📋 Đã copy toàn bộ ảnh bảng ${tabName} vào Bộ nhớ tạm! Nhấn Ctrl+V sang Zalo để dán ngay.`, "success");
                            } else {
                                throw new Error("Trình duyệt không hỗ trợ ClipboardItem API");
                            }
                        } catch (err) {
                            console.error(err);
                            let link = document.createElement('a');
                            link.download = fileName;
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                            showToast(`📋 Đã tải ảnh xuống máy (Tự động paste bị trình duyệt chặn). Mở ảnh vừa tải để dán.`, "info");
                        }
                    }, 'image/png');
                } else {
                    let link = document.createElement('a');
                    link.download = fileName;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast(`✅ Đã chụp và tải ảnh toàn bộ bảng ${tabName} thành công!`, "success");
                }
            }).catch(err => {
                restoreAll();
                showToast("Lỗi khi chụp ảnh: " + err, "error");
            });
        } else {
            restoreAll();
            showToast("Thư viện html2canvas chưa sẵn sàng!", "warning");
        }
    }

                        <input type="text" id="dmt-new-name" class="dmt-input" placeholder="Nhập Tên Station name trạm mới..." style="flex:1; min-width:250px;" />
                        <input type="number" id="dmt-new-total-day" class="dmt-input" placeholder="Tổng SL Ca Ngày" style="width:160px;" min="0" />
                        <input type="number" id="dmt-new-total-night" class="dmt-input" placeholder="Tổng SL Ca Đêm" style="width:160px;" min="0" />
                        <button class="dmt-btn dmt-btn-green" onclick="addDmtStation()">+ THÊM TRẠM</button>
                    </div>
                </div>

                <div class="dmt-table-wrap">
                    <table class="dmt-table" style="text-align:left;">
                        <thead>
                            <tr style="background:#f1f5f9;">
                                <th style="width:60px; text-align:center;">STT</th>
                                <th style="width:140px;">Khu Vực (Process)</th>
                                <th>Tên Trạm (Station name)</th>
                                <th style="width:160px; text-align:center;">Tổng SL Ca Ngày</th>
                                <th style="width:160px; text-align:center;">Tổng SL Ca Đêm</th>
                                <th style="width:100px; text-align:center;">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="dmt-set-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        `;

        container.innerHTML = html;

        window.switchDmtSubTab = function (tab) {
            ['view', 'sta5', 'bc', 'bc-set', 'set'].forEach(function (t) {
                let el = document.getElementById('dmt-subtab-' + t);
                if (el) el.style.display = (t === tab) ? 'block' : 'none';
                let btn = document.getElementById('dmt-tab-btn-' + t);
                if (btn) btn.classList.toggle('active', t === tab);
            });

            if (tab === 'set') renderDmtSettingsTable();
            if (tab === 'bc-set') initBcSetTab();
            if (tab === 'sta5') {
                initSta5LineSelector();
            }
            if (tab === 'bc') {
                initBcLineSelector();
            }
            if (tab === 'view') {
                initViewCCSheetSelector();
            }
        };

        // ----- KHỞI TẠO BỘ CHỌN SHEET (2 Ô RIÊNG) -----
        // Để null → populateSta5Dropdowns sẽ tự điền từ danh sách sheet thực tế của server
        window.currentCCSheet = null;
        window.currentKDVTSheet = null;
        window.currentBcSheet = null;
        window.currentBcCCSheet = null; // Sheet trái của BC (Chúyên Cần)
        window.currentBcKDVTSheet = null; // Sheet phải của BC (Không Đúng Vị Trí)

        // ===== HÀM NẠP DROPDOWN SHEET CHO TAB BÁO CÁO HỌP =====
        function populateBcDropdowns(res) {
            let ccSel = document.getElementById('bc-cc-sheet-select');
            let kdvtSel = document.getElementById('bc-kdvt-sheet-select');
            if (!ccSel || !kdvtSel) return;

            let ccSheets, kdvtSheets, defCC, defKDVT;
            if (res && res.ccSheets) {
                ccSheets = res.ccSheets;
                kdvtSheets = res.kdvtSheets || [];
                defCC = res.defaultCCSheet || (ccSheets[0] ? (typeof ccSheets[0] === 'string' ? ccSheets[0] : ccSheets[0].name) : 'CHUÊN CẦN STAS');
                defKDVT = res.defaultKDVTSheet || (kdvtSheets[0] ? (typeof kdvtSheets[0] === 'string' ? kdvtSheets[0] : kdvtSheets[0].name) : 'KHÔNG ĐÚNG VỊ TRÍ STAS');
            } else if (res && res.lines) {
                ccSheets = res.lines.map(function (l) { return { name: 'CHUÊN CẦN ' + (typeof l === 'string' ? l : l.name) }; });
                kdvtSheets = res.lines.map(function (l) { return { name: 'KHÔNG ĐÚNG VỊ TRÍ ' + (typeof l === 'string' ? l : l.name) }; });
                defCC = 'CHUÊN CẦN ' + (res.defaultLine || 'STAS');
                defKDVT = 'KHÔNG ĐÚNG VỊ TRÍ ' + (res.defaultLine || 'STAS');
            } else {
                ccSheets = [{ name: 'CHUÊN CẦN STAS' }];
                kdvtSheets = [{ name: 'KHÔNG ĐÚNG VỊ TRÍ STAS' }];
                defCC = 'CHUÊN CẦN STAS';
                defKDVT = 'KHÔNG ĐÚNG VỊ TRÍ STAS';
            }

            let ccNames = ccSheets.map(function (s) { return typeof s === 'string' ? s : s.name; });
            let kdvtNames = kdvtSheets.map(function (s) { return typeof s === 'string' ? s : s.name; });

            if (!window.currentBcCCSheet || ccNames.indexOf(window.currentBcCCSheet) === -1)
                window.currentBcCCSheet = (ccNames.indexOf(defCC) !== -1) ? defCC : (ccNames[0] || defCC);
            if (!window.currentBcKDVTSheet || kdvtNames.indexOf(window.currentBcKDVTSheet) === -1)
                window.currentBcKDVTSheet = (kdvtNames.indexOf(defKDVT) !== -1) ? defKDVT : (kdvtNames[0] || defKDVT);

            // Dropdown trái: CHUÊN CẦN
            ccSel.innerHTML = '';
            ccNames.forEach(function (name) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name + (name === defCC ? ' ⭐' : '');
                opt.selected = (name === window.currentBcCCSheet);
                ccSel.appendChild(opt);
            });

            // Dropdown phải: KHÔNG ĐÚNG VỊ TRÍ
            kdvtSel.innerHTML = '';
            kdvtNames.forEach(function (name) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name + (name === defKDVT ? ' ⭐' : '');
                opt.selected = (name === window.currentBcKDVTSheet);
                kdvtSel.appendChild(opt);
            });
        }

        function initBcLineSelector() {
            if (typeof google === 'undefined' || !google.script || !google.script.run) return;
            google.script.run
                .withSuccessHandler(function (res) { populateBcDropdowns(res); })
                .withFailureHandler(function () { populateBcDropdowns(null); })
                .getAvailableStaLines();
        }


        // ===== HÀM CHUYỂN CHỮ CỘT SANG SỐ INDEX (A=0, B=1, Z=25, AA=26...) =====
        window.colLetterToIndex = function (letter) {
            let s = String(letter || '').trim().toUpperCase();
            let result = 0;
            for (let i = 0; i < s.length; i++) {
                result = result * 26 + (s.charCodeAt(i) - 64);
            }
            return result - 1; // 0-based
        };

        window.executeBcSearch = function (forceReload) {
            let selectedDateInput = document.getElementById('bc-select-date').value;
            let caVal = document.getElementById('bc-filter-ca').value;

            if (!selectedDateInput) return showToast('Vui lòng chọn Ngày xem báo cáo!', 'warning');

            // Hiển thị phần bảng và biểu đồ bên dưới
            let wrap = document.getElementById('bc-content-wrap');
            let msg = document.getElementById('bc-empty-msg');
            if (wrap) wrap.style.display = 'grid';
            if (msg) msg.style.display = 'none';

            // Nếu người dùng chủ động bấm TÌM KIẾM DỮ LIỆU → Xóa cache để luôn tải dữ liệu mới nhất trực tiếp từ Google Sheet
            if (forceReload === true) {
                G_Data.bcCCData = null;
                G_Data.chuyenCanStasData = null;
                G_Data.bcKdvtData = null;
                G_Data.khongDungViTriData = null;
            }

            let tramList = window.BC_TRAM_LIST || [];
            if (!tramList.length)
                return showToast('⚠️ Chưa có trạm nào! Vào CÀI ĐẶT BÁO CÁO HỌP để thêm trạm.', 'warning');

            let targetDate = new Date(selectedDateInput);

            // Hàm kiểm tra dòng có thuộc BC_TRAM_LIST không (hỗ trợ so sánh chính xác và lọc khoảng trắng thừa/xuống dòng)
            function rowBelongsToTram(row) {
                for (let t = 0; t < tramList.length; t++) {
                    let tram = tramList[t];
                    let colIdx = window.colLetterToIndex(tram.col);
                    if (colIdx < 0) continue;
                    let cellInCol = String(row[colIdx] || '').replace(/\s+/g, ' ').trim().toLowerCase();
                    let targetName = String(tram.name || '').replace(/\s+/g, ' ').trim().toLowerCase();
                    if (!cellInCol || !targetName) continue;
                    if (cellInCol === targetName || cellInCol.includes(targetName) || targetName.includes(cellInCol)) return true;
                }
                return false;
            }


            // Tạo mảng ngày: ưu tiên lấy từ header sheet KHÔNG ĐÚNG VỊ TRÍ đã load vào G_Data
            let dates = [];
            let kdvtHeaderForDates = (G_Data.bcKdvtData && G_Data.bcKdvtData.values && G_Data.bcKdvtData.values.length > 0)
                ? G_Data.bcKdvtData.values[0] : [];

            if (kdvtHeaderForDates.length > 5) {
                let kdvtDatesAll = [];
                for (let c = 5; c < kdvtHeaderForDates.length; c++) {
                    let hv = String(kdvtHeaderForDates[c] || '').trim();
                    if (!hv) continue;
                    let parts = hv.split('/');
                    if (parts.length === 3) {
                        let d = parseInt(parts[0]), mo = parseInt(parts[1]), y = parseInt(parts[2]);
                        let dt = new Date(y, mo - 1, d);
                        if (dt <= targetDate)
                            kdvtDatesAll.push({ key: `${String(d).padStart(2, '0')}/${String(mo).padStart(2, '0')}/${y}`, dt: dt });
                    }
                }
                kdvtDatesAll.sort((a, b) => a.dt - b.dt);
                dates = kdvtDatesAll.slice(-6).map(x => x.key);
            }

            // Fallback 6 ngày làm việc gần nhất
            if (dates.length === 0) {
                let cd = new Date(targetDate);
                while (dates.length < 6) {
                    if (cd.getDay() !== 0) {
                        let y = cd.getFullYear();
                        let m = String(cd.getMonth() + 1).padStart(2, '0');
                        let day = String(cd.getDate()).padStart(2, '0');
                        dates.unshift(`${day}/${m}/${y}`);
                    }
                    cd.setDate(cd.getDate() - 1);
                }
            }

            let selDay = String(targetDate.getDate()).padStart(2, '0');
            let selMonth = String(targetDate.getMonth() + 1).padStart(2, '0');
            let selYear = targetDate.getFullYear();
            let selectedDateStr = `${selDay}/${selMonth}/${selYear}`;

            let selectedCaCode = 'ALL';
            if (caVal === 'DAY') selectedCaCode = 'D';
            else if (caVal === 'NIGHT') selectedCaCode = 'N';

            // Nếu chưa có data CC cho BC, sử dụng dữ liệu đã load của STA5 làm fallback hoặc tải mới
            let bcCCSheetName = window.currentBcCCSheet || window.currentCCSheet || 'CHUYÊN CẦN STAS';

            if (!G_Data.bcCCData || !G_Data.bcCCData.length) {
                if (!forceReload && G_Data.chuyenCanStasData && G_Data.chuyenCanStasData.length) {
                    G_Data.bcCCData = G_Data.chuyenCanStasData;
                } else if (typeof google !== 'undefined' && google.script && google.script.run) {
                    showToast('⏳ Đang tải dữ liệu Chuyên Cần từ Google Sheet...', 'info');
                    google.script.run
                        .withSuccessHandler(function (rows) {
                            let dataRows = (rows && rows.data) ? rows.data : (Array.isArray(rows) ? rows : []);
                            G_Data.bcCCData = dataRows;
                            G_Data.chuyenCanStasData = dataRows;
                            window.executeBcSearch(false);
                        })
                        .withFailureHandler(function (err) { showToast('❌ Lỗi tải sheet CC: ' + err, 'error'); })
                        .getSheetDataByName(bcCCSheetName, false);
                    return;
                }
            }

            let stasData = G_Data.bcCCData || G_Data.chuyenCanStasData || [];
            let stasHeader = stasData.length > 0 ? stasData[0] : [];

            // Build dateColMap từ header CC
            let dateColMap = {};
            for (let c = 4; c < stasHeader.length; c++) {
                let cellVal = String(stasHeader[c] || '').trim();
                if (!cellVal) continue;
                dateColMap[cellVal] = c;
                let parts = cellVal.split('/');
                if (parts.length === 3) {
                    let d = String(parts[0]).padStart(2, '0');
                    let m = String(parts[1]).padStart(2, '0');
                    let y = parts[2];
                    let dNum = parseInt(parts[0]), mNum = parseInt(parts[1]);
                    dateColMap[`${d}/${m}/${y}`] = c;
                    dateColMap[`${dNum}/${mNum}/${y}`] = c;
                    dateColMap[`${dNum}/${m}/${y}`] = c;
                    dateColMap[`${d}/${mNum}/${y}`] = c;
                    dateColMap[`${mNum}/${dNum}/${y}`] = c;
                    dateColMap[`${m}/${d}/${y}`] = c;
                }
                let tryD = new Date(cellVal);
                if (!isNaN(tryD.getTime()) && cellVal.indexOf('-') !== -1) {
                    let ddU = String(tryD.getUTCDate()).padStart(2, '0');
                    let mmU = String(tryD.getUTCMonth() + 1).padStart(2, '0');
                    dateColMap[`${ddU}/${mmU}/${tryD.getUTCFullYear()}`] = c;
                    dateColMap[`${tryD.getUTCDate()}/${tryD.getUTCMonth() + 1}/${tryD.getUTCFullYear()}`] = c;
                }
            }

            // Bảng 1: tổng hợp theo ngày chọn, chỉ dòng thuộc BC_TRAM_LIST
            let totalReq = 0;
            for (let r = 1; r < stasData.length; r++) {
                let row = stasData[r];
                let rowCa = String(row[3] || '').trim().toUpperCase();
                let caMatch = (selectedCaCode === 'ALL') || (rowCa === selectedCaCode);
                let hasVal = String(row[2] || '').trim() !== '';
                if (hasVal && caMatch && rowBelongsToTram(row)) totalReq++;
            }

            let v1Act = 0, v1Phep = 0, v1Td = 0, v1Nv = 0, v1Thieu = 0;
            let colIdxV1 = dateColMap[selectedDateStr];
            if (colIdxV1 !== undefined && stasData.length > 1) {
                for (let r = 1; r < stasData.length; r++) {
                    let row = stasData[r];
                    let rowCa = String(row[3] || '').trim().toUpperCase();
                    let caMatch = (selectedCaCode === 'ALL') || (rowCa === selectedCaCode);
                    if (!caMatch || !rowBelongsToTram(row)) continue;
                    let cv = String(row[colIdxV1] || '').trim().toUpperCase();
                    if (cv === 'V' || cv === '✓') v1Act++;
                    else if (cv.includes('请假') || cv.includes('病假') || cv.includes('年假') || cv.includes('婚假') || cv.includes('丧假') || cv.includes('PHÉP')) v1Phep++;
                    else if (cv.includes('旷工') || cv.includes('TỰ DO')) v1Td++;
                    else if (cv.includes('离职') || cv.includes('NGHỈ VIỆC')) v1Nv++;
                    else if (cv.includes('NO') || cv.includes('不开线') || cv.includes('THIẾU')) v1Thieu++;
                }
            }
            let v1Rate = totalReq > 0 ? Math.round((v1Act / totalReq) * 100) + '%' : '0%';
            document.getElementById('bc-v1-req').innerText = totalReq;
            document.getElementById('bc-v1-act').innerText = v1Act;
            document.getElementById('bc-v1-phep').innerText = v1Phep;
            document.getElementById('bc-v1-td').innerText = v1Td;
            document.getElementById('bc-v1-nv').innerText = v1Nv;
            document.getElementById('bc-v1-thieu').innerText = v1Thieu;
            document.getElementById('bc-v1-rate').innerText = v1Rate;

            // Cache + các bảng 6 ngày
            let cacheKey = 'BC_CACHE_V1_' + caVal;
            let bcCache = {};
            try { bcCache = JSON.parse(localStorage.getItem(cacheKey) || '{}'); } catch (e) { bcCache = {}; }

            let dateRateMap = {}, dateNvMap = {}, dateTotalPeopleMap = {}, dateNotCorrMap = {};

            // KDVT data cho BC
            let bcKdvtRes = G_Data.bcKdvtData || {};
            let kdvtValues = bcKdvtRes.values || [];
            let kdvtBgColors = bcKdvtRes.bgColors || [];
            let kdvtHeader = kdvtValues.length > 0 ? kdvtValues[0] : [];
            let kdvtDateColMap = {};
            for (let c = 0; c < kdvtHeader.length; c++) {
                let cv = String(kdvtHeader[c] || '').trim();
                if (!cv) continue;
                kdvtDateColMap[cv] = c;
                let parts = cv.split('/');
                if (parts.length === 3) {
                    let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]), p3 = parts[2];
                    kdvtDateColMap[`${p1}/${p2}/${p3}`] = c;
                    kdvtDateColMap[`${String(p1).padStart(2, '0')}/${String(p2).padStart(2, '0')}/${p3}`] = c;
                    kdvtDateColMap[`${p2}/${p1}/${p3}`] = c;
                    kdvtDateColMap[`${String(p2).padStart(2, '0')}/${String(p1).padStart(2, '0')}/${p3}`] = c;
                }
            }
            let hasKdvtData = (kdvtValues && kdvtValues.length > 1);

            // Lọc danh sách ngày: chỉ giữ lại những ngày CÓ CỘT trong Sheet Chuyên Cần (nếu ngày nào không có dữ liệu cột thì không hiện ra)
            let validDates = [];
            dates.forEach(dt => {
                let colIdx = dateColMap[dt];
                // Nếu cột tồn tại và có dữ liệu đếm hoặc dòng yêu cầu nhân lực > 0
                if (colIdx !== undefined) {
                    let hasColData = false;
                    for (let r = 1; r < stasData.length; r++) {
                        let row = stasData[r];
                        if (!rowBelongsToTram(row)) continue;
                        let cv = String(row[colIdx] || '').trim();
                        if (cv !== '') { hasColData = true; break; }
                    }
                    if (hasColData) validDates.push(dt);
                }
            });

            // Nếu lọc xong có ngày hợp lệ thì dùng validDates, tránh hiển thị ngày rỗng 0%
            if (validDates.length > 0) {
                dates = validDates;
            }

            dates.forEach(dt => {
                let colIdx = dateColMap[dt];
                let actCount = 0, nvCount = 0;

                if (colIdx !== undefined && stasData.length > 1) {
                    for (let r = 1; r < stasData.length; r++) {
                        let row = stasData[r];
                        let rowCa = String(row[3] || '').trim().toUpperCase();
                        let caMatch = (selectedCaCode === 'ALL') || (rowCa === selectedCaCode);
                        if (!caMatch || !rowBelongsToTram(row)) continue;
                        let cv = String(row[colIdx] || '').trim().toUpperCase();
                        if (cv === 'V' || cv === '✓') actCount++;
                        else if (cv.includes('离职') || cv.includes('NGHỈ VIỆC')) nvCount++;
                    }
                }

                let totPeople = totalReq; // Bảng bên phải tự nhảy theo Yêu cầu nhân lực
                let notCorrCount = 0;

                let rateStr = totalReq > 0 ? Math.round((actCount / totalReq) * 100) + '%' : '0%';
                dateRateMap[dt] = rateStr;
                dateNvMap[dt] = nvCount;
                dateTotalPeopleMap[dt] = totPeople;
                dateNotCorrMap[dt] = notCorrCount;
                bcCache[dt] = { rate: rateStr, nv: nvCount, totP: totPeople, notP: notCorrCount };
                try { localStorage.setItem(cacheKey, JSON.stringify(bcCache)); } catch (e) { }
            });

            // Bảng 2: 出勤率 theo 6 ngày
            let t2Head = '<tr><th style="background:#ff6b00;color:#fff;font-weight:900;font-size:20px;padding:8px 4px;">Date</th>';
            let t2Body = '<tr><td style="font-weight:900;font-size:20px;padding:8px 4px;">出勤率</td>';
            dates.forEach(dt => {
                let parts = dt.split('/');
                let sd = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
                t2Head += `<th style="font-weight:900;font-size:22px;padding:8px 4px;">${sd}</th>`;
                t2Body += `<td style="font-weight:bold;font-size:22px;color:#000000 !important;text-align:center;vertical-align:middle;padding:8px 4px;">${dateRateMap[dt]}</td>`;
            });
            t2Head += '</tr>'; t2Body += '</tr>';
            document.getElementById('bc-tbl2-head').innerHTML = t2Head;
            document.getElementById('bc-tbl2-body').innerHTML = t2Body;

            // Bảng 3: 离职 theo 6 ngày
            let t3Head = '<tr><th style="background:#ff6b00;color:#fff;font-weight:900;font-size:20px;padding:8px 4px;">Date</th>';
            let t3Body = '<tr><td style="background:#b91c1c;color:#fff;font-weight:900;font-size:20px;padding:8px 4px;">离职</td>';
            dates.forEach(dt => {
                let parts = dt.split('/');
                let sd = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
                t3Head += `<th style="font-weight:900;font-size:22px;padding:8px 4px;">${sd}</th>`;
                t3Body += `<td style="font-weight:bold;font-size:22px;color:#000000 !important;text-align:center;vertical-align:middle;padding:8px 4px;">${dateNvMap[dt]}</td>`;
            });
            t3Head += '</tr>'; t3Body += '</tr>';
            document.getElementById('bc-tbl3-head').innerHTML = t3Head;
            document.getElementById('bc-tbl3-body').innerHTML = t3Body;

            // Bảng 4: Automatic Total People from totalReq (Chữ tiếng Trung ở trên, tiếng Anh ở dưới)
            let manualTbl4Data = {};
            try { manualTbl4Data = JSON.parse(localStorage.getItem('bc_manual_tbl4') || '{}'); } catch (e) { }

            let t4Head = '<tr><th style="background:#ff6b00;color:#fff;font-weight:900;font-size:20px;width:130px;min-width:120px;padding:8px 4px;">日期<br><span style="font-size:17px;font-weight:900;">Date</span></th>';
            let t4Tot = '<tr><td style="font-weight:900;font-size:20px;width:130px;min-width:120px;padding:8px 4px;">总人数<br><span style="font-size:17px;font-weight:900;">Total people</span></td>';
            let t4Not = '<tr><td style="font-weight:900;font-size:20px;width:130px;min-width:120px;padding:8px 4px;">不对料人数<br><span style="font-size:17px;font-weight:900;">Does not correspond</span></td>';
            let t4Pct = '<tr><td style="font-weight:900;font-size:20px;width:130px;min-width:120px;padding:8px 4px;">不对料率<br><span style="font-size:17px;font-weight:900;">Does not correspond %</span></td>';
            let nonCorrRates = [];

            window.updateBcTbl4Manual = function (dt, type, val) {
                let mData = {};
                try { mData = JSON.parse(localStorage.getItem('bc_manual_tbl4') || '{}'); } catch (e) { }
                if (!mData[dt]) mData[dt] = {};
                mData[dt][type] = parseInt(val) || 0;
                localStorage.setItem('bc_manual_tbl4', JSON.stringify(mData));

                let not = parseInt(val) || 0;
                let pct = totalReq > 0 ? Math.round((not / totalReq) * 100) : 0;
                let pctEl = document.getElementById(`bc-t4-pct-${dt}`);
                if (pctEl) pctEl.innerText = pct + '%';

                let newRates = dates.map(d => {
                    let dNot = (d === dt) ? not : (mData[d] && mData[d].not !== undefined ? mData[d].not : 0);

        // Biểu đồ trái BC: Chuyên cần %
        function renderBcLeftChart(labels, dataPts) {
            let cvs = document.getElementById('bc-left-chart-canvas');
            if (!cvs) return;
            let ctx = cvs.getContext('2d');
            let w = cvs.clientWidth || 350;
            let h = 220;
            cvs.width = w; cvs.height = h;
            ctx.clearRect(0, 0, w, h);
            if (!dataPts || dataPts.length === 0) return;

            let padLeft = 60, padRight = 20, padTop = 28, padBot = 22, innerPad = 18;
            let chartW = w - padLeft - padRight;
            let chartH = h - padTop - padBot;
            let maxVal = Math.max(...dataPts, 1);
            let yMax = Math.max(Math.ceil(maxVal * 2.2 / 5) * 5, 20);
            let gridCount = 4;
            let gridStep = Math.ceil(yMax / gridCount / 5) * 5;
            yMax = gridStep * gridCount;
            let gridVals = [];
            for (let i = 0; i <= gridCount; i++) gridVals.push(i * gridStep);

            ctx.fillStyle = '#374151';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'right';
            gridVals.forEach(function (val) {
                let y = (h - padBot) - (val / yMax) * chartH;
                ctx.fillText(val + '%', padLeft - 8, y + 4);
                ctx.beginPath();
                ctx.strokeStyle = val === 0 ? '#94a3b8' : '#e2e8f0';
                ctx.lineWidth = val === 0 ? 1.5 : 1;
                ctx.moveTo(padLeft, y); ctx.lineTo(w - padRight, y);
                ctx.stroke();
            });
            let step = dataPts.length > 1 ? (chartW - innerPad * 2) / (dataPts.length - 1) : 0;
            drawSmoothLine(ctx, dataPts, padLeft, padBot, innerPad, step, h, yMax, chartH, '#2563eb', 'rgba(37,99,235,0.18)');
        }

        window.addBcTram = function () {
            let nameInput = document.getElementById('bc-new-tram-name');
            let colInput = document.getElementById('bc-new-tram-col');
            let rawText = (nameInput ? nameInput.value : '');
            let col = (colInput ? colInput.value.trim().toUpperCase() : '');

            if (!rawText.trim()) return showToast('⚠️ Vui lòng nhập hoặc dán tên trạm!', 'warning');

            // Tách các trạm theo dòng (hỗ trợ copy dán từ Excel)
            let lines = rawText.split(/[\r\n]+/).map(s => s.trim()).filter(Boolean);
            if (lines.length === 0) return showToast('⚠️ Không có tên trạm hợp lệ nào!', 'warning');

            let addedCount = 0;
            let dupCount = 0;

            lines.forEach(name => {
                let exists = window.BC_TRAM_LIST.some(t => t.name.toLowerCase() === name.toLowerCase());
                if (!exists) {
                    window.BC_TRAM_LIST.push({ name: name, col: col });
                    addedCount++;
                } else {
                    dupCount++;
                }
            });

            if (addedCount > 0) {
                saveBcTramStations();
                if (nameInput) nameInput.value = '';
                window.renderBcTramTable();
                showToast(`✅ Đã thêm ${addedCount} trạm thành công!${dupCount > 0 ? ` (Bỏ qua ${dupCount} trạm đã có)` : ''}`, 'success');
            } else {

        function populateSta5Dropdowns(res) {
            let ccSel = document.getElementById('sta5-cc-sheet-select');
            let kdvtSel = document.getElementById('sta5-kdvt-sheet-select');
            if (!ccSel || !kdvtSel) return;

            // --- Tương thích cả format cũ (res.lines) và mới (res.ccSheets) ---
            let ccSheets, kdvtSheets, defCC, defKDVT;

            if (res && res.ccSheets) {
                // Format mới: server đã deploy hàm cập nhật
                ccSheets = res.ccSheets;
                kdvtSheets = res.kdvtSheets || [];
                defCC = res.defaultCCSheet || (ccSheets[0] ? (typeof ccSheets[0] === 'string' ? ccSheets[0] : ccSheets[0].name) : 'CHUYÊN CẦN STAS');
                defKDVT = res.defaultKDVTSheet || (kdvtSheets[0] ? (typeof kdvtSheets[0] === 'string' ? kdvtSheets[0] : kdvtSheets[0].name) : 'KHÔNG ĐÚNG VỊ TRÍ STAS');
            } else if (res && res.lines) {
                // Format cũ: server chưa deploy → tạo ra danh sách sheet từ lines
                ccSheets = res.lines.map(function (l) { return { name: 'CHUYÊN CẦN ' + (typeof l === 'string' ? l : l.name) }; });
                kdvtSheets = res.lines.map(function (l) { return { name: 'KHÔNG ĐÚNG VỊ TRÍ ' + (typeof l === 'string' ? l : l.name) }; });
                defCC = 'CHUYÊN CẦN ' + (res.defaultLine || 'STAS');
                defKDVT = 'KHÔNG ĐÚNG VỊ TRÍ ' + (res.defaultLine || 'STAS');
            } else {
                // Fallback hoàn toàn khi không có dữ liệu
                ccSheets = [{ name: 'CHUYÊN CẦN STAS' }];
                kdvtSheets = [{ name: 'KHÔNG ĐÚNG VỊ TRÍ STAS' }];
                defCC = 'CHUYÊN CẦN STAS';
                defKDVT = 'KHÔNG ĐÚNG VỊ TRÍ STAS';
            }

            // Lấy mảng tên thực tế để kiểm tra
            let ccNames = ccSheets.map(function (s) { return typeof s === 'string' ? s : s.name; });
            let kdvtNames = kdvtSheets.map(function (s) { return typeof s === 'string' ? s : s.name; });

            // Nếu currentCCSheet không có trong danh sách → dùng defCC hoặc sheet đầu tiên
            if (!window.currentCCSheet || ccNames.indexOf(window.currentCCSheet) === -1) {
                window.currentCCSheet = (ccNames.indexOf(defCC) !== -1) ? defCC : (ccNames[0] || defCC);
            }
            if (!window.currentKDVTSheet || kdvtNames.indexOf(window.currentKDVTSheet) === -1) {
                window.currentKDVTSheet = (kdvtNames.indexOf(defKDVT) !== -1) ? defKDVT : (kdvtNames[0] || defKDVT);
            }

            // Điền Dropdown 1: CHUYÊN CẦN
            ccSel.innerHTML = '';
            ccNames.forEach(function (name) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name + (name === defCC ? ' ⭐' : '');
                opt.selected = (name === window.currentCCSheet);
                ccSel.appendChild(opt);
            });

            // Điền Dropdown 2: KHÔNG ĐÚNG VỊ TRÍ
            kdvtSel.innerHTML = '';
            kdvtNames.forEach(function (name) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name + (name === defKDVT ? ' ⭐' : '');
                opt.selected = (name === window.currentKDVTSheet);
                kdvtSel.appendChild(opt);
            });

            // Nút Đặt mặc định: hiện khi lựa chọn hiện tại KHÁC default
            let isDefault = (window.currentCCSheet === defCC && window.currentKDVTSheet === defKDVT);
            let setBtn = document.getElementById('sta5-set-default-btn');
            let indicator = document.getElementById('sta5-default-indicator');
            if (setBtn) setBtn.style.display = isDefault ? 'none' : 'inline-block';
            if (indicator) indicator.style.display = isDefault ? 'inline-block' : 'none';
        }
