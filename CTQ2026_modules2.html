                    initSta5LineSelector();
                    executeDmtSta5Search();
                }).withFailureHandler(function (err) {
                    G_Data.khongDungViTriData = { success: true, values: [], bgColors: [] };
                    showToast('❌ Lỗi tải sheet KDVT: ' + err, 'error');
                    executeDmtSta5Search();
                }).getSheetDataByName(sheetName, true); // true = cần bgColors
            }
        };

        window.setDefaultStaLineFn = function () {
            // Chỉ Admin mới được đặt mặc định toàn hệ thống
            let _isAdmin = (window.USER_PERMS || '').split(',').includes('admin');
            if (!_isAdmin) {
                showToast('❌ Chỉ Admin mới có quyền đặt mặc định toàn hệ thống!', 'error');
                return;
            }
            let cc = window.currentCCSheet || 'CHUYÊN CẦN STAS';
            let kdvt = window.currentKDVTSheet || 'KHÔNG ĐÚNG VỊ TRÍ STAS';
            if (!confirm('[🔒 ADMIN] Đặt mặc định toàn hệ thống:\n• Bảng trái: ' + cc + '\n• Bảng phải: ' + kdvt + '\n\nTất cả user đăng nhập vào sẽ thấy cài đặt này.')) return;
            if (typeof google === 'undefined' || !google.script || !google.script.run) {
                showToast('❌ Không thể kết nối server!', 'error'); return;
            }
            google.script.run.withSuccessHandler(function (res) {
                if (res && res.success) {
                    showToast('✅ Đã đặt mặc định toàn hệ thống!', 'success');
                    initSta5LineSelector();
                } else {
                    showToast('❌ Lỗi: ' + (res && res.message ? res.message : 'Không xác định'), 'error');
                }
            }).withFailureHandler(function (err) {
                showToast('❌ Lỗi đặt mặc định: ' + err, 'error');
            }).setDefaultStaSheets(cc, kdvt);
        };

        window.executeDmtSta5Search = function (forceReload) {
            let selectedDateInput = document.getElementById('sta5-select-date').value;
            let caVal = document.getElementById('sta5-filter-ca').value;

            if (!selectedDateInput) return showToast("Vui lòng chọn Ngày xem báo cáo!", "warning");

            // Hiển thị phần bảng và biểu đồ bên dưới
            let wrap = document.getElementById('sta5-content-wrap');
            let msg = document.getElementById('sta5-empty-msg');
            if (wrap) wrap.style.display = 'grid';
            if (msg) msg.style.display = 'none';

            if (forceReload === true) {
                G_Data.chuyenCanStasData = null;
                G_Data.khongDungViTriData = null;
                G_Data.bcCCData = null;
                G_Data.bcKdvtData = null;
            }
            let targetDate = new Date(selectedDateInput);

            // Tạo mảng ngày: ưu tiên lấy từ header sheet KHÔNG ĐÚNG VỊ TRÍ STA5
            // Nếu KDVT chưa load, dùng fallback 6 ngày làm việc gần nhất (bỏ Chủ Nhật)
            let dates = [];
            let kdvtHeaderForDates = (G_Data.khongDungViTriData && G_Data.khongDungViTriData.values && G_Data.khongDungViTriData.values.length > 0)
                ? G_Data.khongDungViTriData.values[0] : [];

            // Lấy ngày từ header KDVT (từ cột 5 trở đi), lọc ≤ ngày chọn, lấy 6 ngày mới nhất
            if (kdvtHeaderForDates.length > 5) {
                let kdvtDatesAll = [];
                for (let c = 5; c < kdvtHeaderForDates.length; c++) {
                    let hv = String(kdvtHeaderForDates[c] || '').trim();
                    if (!hv) continue;
                    // Chuyển sang Date để so sánh
                    let parts = hv.split('/');
                    if (parts.length === 3) {
                        let d = parseInt(parts[0]), mo = parseInt(parts[1]), y = parseInt(parts[2]);
                        let dt = new Date(y, mo - 1, d);
                        if (dt <= targetDate) {
                            kdvtDatesAll.push({ key: `${String(d).padStart(2, '0')}/${String(mo).padStart(2, '0')}/${y}`, dt: dt });
                        }
                    }
                }
                // Sắp xếp tăng dần theo ngày rồi lấy 6 ngày cuối
                kdvtDatesAll.sort((a, b) => a.dt - b.dt);
                dates = kdvtDatesAll.slice(-6).map(x => x.key);
            }

            // Fallback: nếu KDVT chưa có, tính 6 ngày làm việc gần nhất (bỏ Chủ Nhật)
            if (dates.length === 0) {
                let checkDate = new Date(targetDate);
                while (dates.length < 6) {
                    if (checkDate.getDay() !== 0) {
                        let y = checkDate.getFullYear();
                        let m = String(checkDate.getMonth() + 1).padStart(2, '0');
                        let day = String(checkDate.getDate()).padStart(2, '0');
                        dates.unshift(`${day}/${m}/${y}`);
                    }
                    checkDate.setDate(checkDate.getDate() - 1);
                }
            }

            let selDay = String(targetDate.getDate()).padStart(2, '0');
            let selMonth = String(targetDate.getMonth() + 1).padStart(2, '0');
            let selYear = targetDate.getFullYear();
            let selectedDateStr = `${selDay}/${selMonth}/${selYear}`;

            let stasData = (G_Data && G_Data.chuyenCanStasData) ? G_Data.chuyenCanStasData : [];
            let stasHeader = (stasData && stasData.length > 0) ? stasData[0] : [];

            // Xử lý mã Ca lọc: DAY => 'D', NIGHT => 'N', ALL => 'ALL'
            let selectedCaCode = 'ALL';
            if (caVal === 'DAY') selectedCaCode = 'D';
            else if (caVal === 'NIGHT') selectedCaCode = 'N';

            let dateColMap = {};
            for (let c = 4; c < stasHeader.length; c++) {
                let cellVal = String(stasHeader[c] || '').trim();
                if (cellVal) {
                    dateColMap[cellVal] = c;
                    let parts = cellVal.replace(/\-/g, '/').split('/');
                    if (parts.length === 3) {
                        let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]), y = parts[2];
                        dateColMap[`${String(p1).padStart(2, '0')}/${String(p2).padStart(2, '0')}/${y}`] = c;
                        dateColMap[`${p1}/${p2}/${y}`] = c;
                        // Hỗ trợ cả định dạng MM/DD/YYYY hoặc DD/MM/YYYY trên header
                        dateColMap[`${String(p2).padStart(2, '0')}/${String(p1).padStart(2, '0')}/${y}`] = c;
                        dateColMap[`${p2}/${p1}/${y}`] = c;
                    }
                }
            }

            // Hàm kiểm tra khớp Ca linh hoạt cho Chuyên Cần
            function checkCaMatch(caStr) {
                if (selectedCaCode === 'ALL') return true;
                let cUpper = String(caStr || '').trim().toUpperCase();
                if (selectedCaCode === 'D') {
                    return cUpper === 'D' || cUpper.includes('DAY') || cUpper.includes('NGÀY');
                }
                if (selectedCaCode === 'N') {
                    return cUpper === 'N' || cUpper.includes('NIGHT') || cUpper.includes('ĐÊM');
                }
                return false;
            }

            // CỘT 1: Yêu cầu nhân lực = đếm số dòng từ C2 xuống dưới có dữ liệu ứng với Ca lọc (bỏ hàng trống)
            let totalReq = 0;
            if (stasData && stasData.length > 1) {
                for (let r = 1; r < stasData.length; r++) {
                    let rContent = stasData[r];
                    let isCaMatch = checkCaMatch(rContent[3]);
                    let hasVal = String(rContent[2] || '').trim() !== '';
                    if (hasVal && isCaMatch) totalReq++;
                }
            }

            // --- BẢNG 1: TÍNH TOÁN THEO CÁC ĐIỀU KIỆN CHUẨN ĐƯỢC YÊU CẦU ---
            let v1Act = 0, v1Phep = 0, v1Td = 0, v1Nv = 0, v1Thieu = 0;
            let colIdxV1 = dateColMap[selectedDateStr];

            // Fallback tìm cột ngày nếu định dạng đặc biệt
            if (colIdxV1 === undefined && stasHeader.length > 4) {
                let dtParts = selectedDateStr.split('/');
                let dNum = parseInt(dtParts[0], 10), mNum = parseInt(dtParts[1], 10);
                for (let c = 4; c < stasHeader.length; c++) {
                    let hStr = String(stasHeader[c] || '').trim();
                    if (hStr === selectedDateStr || hStr.includes(selectedDateStr)) { colIdxV1 = c; break; }
                    let hParts = hStr.replace(/\-/g, '/').split('/');
                    if (hParts.length >= 2) {
                        let hd1 = parseInt(hParts[0], 10), hd2 = parseInt(hParts[1], 10);
                        if ((hd1 === dNum && hd2 === mNum) || (hd1 === mNum && hd2 === dNum)) { colIdxV1 = c; break; }
                    }
                }
            }

            if (colIdxV1 !== undefined && stasData && stasData.length > 1) {
                for (let r = 1; r < stasData.length; r++) {
                    let row = stasData[r];
                    let isCaMatch = checkCaMatch(row[3]);

                    if (isCaMatch) {
                        let cellVal = String(row[colIdxV1] || '').trim().toUpperCase();

                        // 1. Thực tế đến: đếm chữ V
                        if (cellVal === 'V' || cellVal === '✓') {
                            v1Act++;
                        }
                        // 2. Nghỉ phép: đếm 请假, 病假, 年假, 婚假, 丧假
                        else if (cellVal.includes('请假') || cellVal.includes('病假') || cellVal.includes('年假') || cellVal.includes('婚假') || cellVal.includes('丧假') || cellVal.includes('PHÉP')) {
                            v1Phep++;
                        }
                        // 3. Nghỉ tự do: đếm 旷工
                        else if (cellVal.includes('旷工') || cellVal.includes('TỰ DO')) {
                            v1Td++;
                        }
                        // 4. Nghỉ việc: đếm 离职
                        else if (cellVal.includes('离职') || cellVal.includes('NGHỈ VIỆC')) {
                            v1Nv++;
                        }
                        // 5. Số Lượng Thiếu: đếm NO, 不开线
                        else if (cellVal.includes('NO') || cellVal.includes('不开线') || cellVal.includes('THIẾU')) {
                            v1Thieu++;
                        }
                    }
                }
            }

            // 6. Tỷ lệ chuyên cần = Thực tế đến chia cho Yêu cầu nhân lực * 100%
            let v1Rate = totalReq > 0 ? Math.round((v1Act / totalReq) * 100) + '%' : '0%';

            document.getElementById('sta5-v1-req').innerText = totalReq;
            document.getElementById('sta5-v1-act').innerText = v1Act;
            document.getElementById('sta5-v1-phep').innerText = v1Phep;
            document.getElementById('sta5-v1-td').innerText = v1Td;
            document.getElementById('sta5-v1-nv').innerText = v1Nv;
            document.getElementById('sta5-v1-thieu').innerText = v1Thieu;
            document.getElementById('sta5-v1-rate').innerText = v1Rate;

            // --- BẢNG 2, 3, 4 VÀ BIỂU ĐỒ: CHẠY DỮ LIỆU CỦA 6 NGÀY LÀM VIỆC ---
            // Lấy bộ nhớ đệm lịch sử STA5 V3 trong localStorage (Loại bỏ triệt để cache cũ bị lệch số)
            let cacheKey = 'STA5_CACHE_V3_' + caVal;
            let sta5Cache = {};
            try {
                sta5Cache = JSON.parse(localStorage.getItem(cacheKey) || '{}');
            } catch (e) { sta5Cache = {}; }

            let dateRateMap = {};
            let dateNvMap = {};
            let dateTotalPeopleMap = {};
            let dateNotCorrMap = {};

            // Xử lý dữ liệu Sheet KHÔNG ĐÚNG VỊ TRÍ STA5 (Item 4)
            let kdvtRes = G_Data.khongDungViTriData || {};
            let kdvtValues = kdvtRes.values || [];
            let kdvtBgColors = kdvtRes.bgColors || [];
            let kdvtHeader = kdvtValues.length > 0 ? kdvtValues[0] : [];
            let kdvtDateColMap = {};

            for (let c = 0; c < kdvtHeader.length; c++) {
                let cellVal = String(kdvtHeader[c] || '').trim();
                if (cellVal) {
                    kdvtDateColMap[cellVal] = c;
                    let parts = cellVal.split('/');
                    if (parts.length === 3) {
                        let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]), p3 = parts[2];
                        kdvtDateColMap[`${p1}/${p2}/${p3}`] = c;
                        kdvtDateColMap[`${String(p1).padStart(2, '0')}/${String(p2).padStart(2, '0')}/${p3}`] = c;
                        kdvtDateColMap[`${p2}/${p1}/${p3}`] = c;
                        kdvtDateColMap[`${String(p2).padStart(2, '0')}/${String(p1).padStart(2, '0')}/${p3}`] = c;
                        kdvtDateColMap[`${p1}/${p2}`] = c;
                        kdvtDateColMap[`${p2}/${p1}`] = c;
                    }
                }
            }

            let hasKdvtData = (kdvtValues && kdvtValues.length > 1);

            dates.forEach(dt => {
                let isCurrentNewDate = (dt === selectedDateStr);

                // Lọc trực tiếp từ Sheet CHUYÊN CẦN STA5
                let colIdx = dateColMap[dt];
                if (colIdx === undefined && stasHeader.length > 4) {
                    let dtParts = dt.split('/');
                    let dNum = parseInt(dtParts[0], 10), mNum = parseInt(dtParts[1], 10);
                    for (let c = 4; c < stasHeader.length; c++) {
                        let hStr = String(stasHeader[c] || '').trim();
                        if (hStr === dt || hStr.includes(dt)) { colIdx = c; break; }
                        let hParts = hStr.replace(/\-/g, '/').split('/');
                        if (hParts.length >= 2) {
                            let hd1 = parseInt(hParts[0], 10), hd2 = parseInt(hParts[1], 10);
                            if ((hd1 === dNum && hd2 === mNum) || (hd1 === mNum && hd2 === dNum)) { colIdx = c; break; }
                        }
                    }
                }
                let actCount = 0, phepCount = 0, tdCount = 0, nvCount = 0;

                if (colIdx !== undefined && stasData && stasData.length > 1) {
                    for (let r = 1; r < stasData.length; r++) {
                        let row = stasData[r];
                        let isCaMatch = checkCaMatch(row[3]);

                        if (isCaMatch) {
                            let cellVal = String(row[colIdx] || '').trim().toUpperCase();
                            if (cellVal === 'V' || cellVal === '✓') actCount++;
                            else if (cellVal.includes('请假') || cellVal.includes('PHÉP')) phepCount++;
                            else if (cellVal.includes('旷工') || cellVal.includes('TỰ DO')) tdCount++;
                            else if (cellVal.includes('离职') || cellVal.includes('NGHỈ VIỆC')) nvCount++;
                        }
                    }
                }

                // Lọc đếm từ Sheet KHÔNG ĐÚNG VỊ TRÍ STA5
                let totPeople = 0;
                let notCorrCount = 0;

                // Tìm cột theo ngày
                let kdvtColIdx = kdvtDateColMap[dt];
                if (kdvtColIdx === undefined) {
                    let dtClean = dt.replace(/\-/g, '/');
                    let dtParts = dtClean.split('/');
                    if (dtParts.length >= 2) {
                        let dNum = parseInt(dtParts[0], 10);
                        let mNum = parseInt(dtParts[1], 10);

                        for (let c = 4; c < kdvtHeader.length; c++) {
                            let hStr = String(kdvtHeader[c] || '').trim();
                            if (!hStr) continue;

                            if (hStr === dt || hStr.includes(dt)) {
                                kdvtColIdx = c;
                                break;
                            }

                            let hParts = hStr.replace(/\-/g, '/').split('/');
                            if (hParts.length >= 2) {
                                let hd1 = parseInt(hParts[0], 10);
                                let hd2 = parseInt(hParts[1], 10);
                                if ((hd1 === dNum && hd2 === mNum) || (hd1 === mNum && hd2 === dNum)) {
                                    kdvtColIdx = c;
                                    break;
                                }
                            }
                        }
                    }
                }

                if (kdvtColIdx !== undefined && hasKdvtData) {
                    for (let r = 1; r < kdvtValues.length; r++) {
                        let row = kdvtValues[r];
                        let rowCaCode = String(row[3] || '').trim().toUpperCase();
                        let isCaMatch = (selectedCaCode === 'ALL') || (rowCaCode === selectedCaCode) || (selectedCaCode === 'D' && (rowCaCode === 'D' || rowCaCode.includes('DAY') || rowCaCode.includes('NGÀY'))) || (selectedCaCode === 'N' && (rowCaCode === 'N' || rowCaCode.includes('NIGHT') || rowCaCode.includes('ĐÊM')));

                        if (isCaMatch) {
                            let cellVal = String(row[kdvtColIdx] || '').trim();
                            let bg = (kdvtBgColors[r] && kdvtBgColors[r][kdvtColIdx]) ? String(kdvtBgColors[r][kdvtColIdx]).toLowerCase() : '';
                            let cellValUpper = cellVal.toUpperCase();

                            // Xác định ô vắng mặt (NO, 请假, 병假, 旷工, 离职, PHÉP, TỰ DO, trống...)
                            let isAbsent = (
                                cellValUpper === '' ||
                                cellValUpper === 'NO' ||
                                cellValUpper.includes('不开线') ||
                                cellValUpper.includes('请假') ||
                                cellValUpper.includes('病假') ||
                                cellValUpper.includes('旷工') ||
                                cellValUpper.includes('离职') ||
                                cellValUpper.includes('PHÉP') ||
                                cellValUpper.includes('TỰ DO') ||
                                cellValUpper.includes('NGHỈ VIỆC')
                            );

                            // Nhận diện ô VÀNG: CHỈ dùng màu nền, KHÔNG fallback text
                            // (tránh đếm nhầm ô xanh có mã thẻ thành vàng)
                            let isYellow = !isAbsent && (
                                bg.includes('ffff00') || // pure yellow
                                bg.includes('ffd966') || // Google Sheets yellow
                                bg.includes('fff2cc') || // light yellow
                                bg.includes('f1c232') || // gold yellow
                                bg.includes('ffe599') || // pale yellow
                                bg.includes('fce8b2') || // soft yellow
                                bg.includes('f4f400') || // bright yellow
                                bg.includes('ffd700') || // gold
                                bg.includes('ffe066') || // amber
                                bg.includes('ffff9c')    // very light yellow
                            );

                            // Nhận diện ô XANH (có người đến, đúng vị trí):
                            // = Không vắng mặt VÀ Không phải vàng VÀ có nội dung (V, ✓, mã thẻ...)
                            // Cách này không cần liệt kê mọi màu xanh, tránh bỏ sót
                            let isGreen = !isAbsent && !isYellow && cellVal.length > 0;

                            // Hàng 1 (Total people): Xanh + Vàng = toàn bộ người đến (193)
                            // Hàng 2 (Does not correspond): Chỉ Vàng = sai vị trí (17)
                            if (isGreen) {
                                totPeople++;
                            } else if (isYellow) {
                                totPeople++;
                                notCorrCount++;
                            }
                        }
                    }
                } else {
                    totPeople = actCount + phepCount + tdCount;
                    notCorrCount = nvCount;
                }

                let rateStr = totalReq > 0 ? Math.round((actCount / totalReq) * 100) + '%' : '0%';

                dateRateMap[dt] = rateStr;
                dateNvMap[dt] = nvCount;
                dateTotalPeopleMap[dt] = totPeople;
                dateNotCorrMap[dt] = notCorrCount;

                // Lưu dữ liệu V3 chuẩn vào Cache lịch sử
                sta5Cache[dt] = {
                    rate: rateStr,
                    nv: nvCount,
                    totP: totPeople,
                    notP: notCorrCount
                };
                try { localStorage.setItem(cacheKey, JSON.stringify(sta5Cache)); } catch (e) { }
            });

            // Bảng 2: FATP STA5 CTQ 出勤 Data Chuyên cần CTQ theo Ngày (Số chữ đều màu đen 21px nền trắng)
            let t2Head = '<tr><th style="background:#ff6b00; color:#fff; font-weight:900; font-size:20px; text-align:center; padding:8px 4px;">Date</th>';
            let t2Body = '<tr><td style="font-weight:900; font-size:20px; padding:8px 4px;">出勤率</td>';
            dates.forEach(dt => {
                let parts = dt.split('/');
                let shortDate = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
                t2Head += `<th style="background-color:#ffffff !important; font-weight:bold; font-size:22px; color:#000000 !important; text-align:center; padding:6px 2px;">${shortDate}</th>`;
                t2Body += `<td style="background-color:#ffffff !important; font-weight:bold; font-size:22px; color:#000000 !important; text-align:center; vertical-align:middle; padding:6px 2px;">${dateRateMap[dt]}</td>`;
            });
            t2Head += '</tr>'; t2Body += '</tr>';
            document.getElementById('sta5-tbl2-head').innerHTML = t2Head;
            document.getElementById('sta5-tbl2-body').innerHTML = t2Body;

            // Bảng 3: Nghỉ việc 离职 theo Ngày (Số chữ đều màu đen 21px nền trắng)
            let t3Head = '<tr><th style="background:#ff6b00; color:#fff; font-weight:900; font-size:20px; text-align:center; padding:8px 4px;">Date</th>';
            let t3Body = '<tr><td style="background:#b91c1c; color:#fff; font-weight:900; font-size:20px; padding:8px 4px;">离职</td>';
            dates.forEach(dt => {
                let parts = dt.split('/');
                let shortDate = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
                t3Head += `<th style="background-color:#ffffff !important; font-weight:bold; font-size:22px; color:#000000 !important; text-align:center; padding:6px 2px;">${shortDate}</th>`;
                t3Body += `<td style="background-color:#ffffff !important; font-weight:bold; font-size:22px; color:#000000 !important; text-align:center; vertical-align:middle; padding:6px 2px;">${dateNvMap[dt]}</td>`;
            });
            t3Head += '</tr>'; t3Body += '</tr>';
            document.getElementById('sta5-tbl3-head').innerHTML = t3Head;
            document.getElementById('sta5-tbl3-body').innerHTML = t3Body;

            // Bảng 4: CTQ station-specific non-correspondence rate (Chữ tiếng Trung ở trên, tiếng Anh ở dưới) - Cột ngày hẹp gọn gàng
            let t4Head = '<tr><th style="background:#ff6b00; color:#fff; font-weight:900; font-size:20px; text-align:center; width:130px; min-width:120px; padding:8px 4px;">日期<br><span style="font-size:17px; font-weight:900;">Date</span></th>';
            let t4BodyTot = '<tr><td style="background-color:#ffffff !important; font-weight:900; font-size:20px; color:#000000 !important; width:130px; min-width:120px; padding:8px 4px;">总人数<br><span style="font-size:17px; font-weight:900;">Total people</span></td>';
            let t4BodyNot = '<tr><td style="background-color:#ffffff !important; font-weight:900; font-size:20px; color:#000000 !important; width:130px; min-width:120px; padding:8px 4px;">不对料人数<br><span style="font-size:17px; font-weight:900;">Does not correspond</span></td>';
            let t4BodyPct = '<tr><td style="background-color:#ffffff !important; font-weight:900; font-size:20px; color:#000000 !important; width:130px; min-width:120px; padding:8px 4px;">不对料率<br><span style="font-size:17px; font-weight:900;">Does not correspond %</span></td>';

            let nonCorrRates = [];

            dates.forEach(dt => {
                let parts = dt.split('/');

        // Hàm vẽ Biểu đồ đường 1 bên trái (CTQ站别不对应率) - Thụ t lề tránh đè 25%, Chữ màu đen, to hơn 1 size
        // Hàm vẽ biểu đồ đường BEZIER (dung chung cho cả 2 biểu đồ)
        function drawSmoothLine(ctx, pts, padLeft, padBot, innerPad, step, h, yMax, chartH, lineColor, shadowColor) {
            if (!pts || pts.length === 0) return;

            // --- Vẽ shadow 3D bên dưới đường (gradient fill) ---
            let grad = ctx.createLinearGradient(0, padLeft, 0, h - padBot);
            grad.addColorStop(0, shadowColor || 'rgba(37,99,235,0.22)');
            grad.addColorStop(1, 'rgba(37,99,235,0)');
            ctx.beginPath();
            pts.forEach(function (rawVal, idx) {
                let val = Math.min(yMax, Math.max(0, rawVal));
                let x = padLeft + innerPad + idx * step;
                let y = (h - padBot) - (val / yMax) * chartH;
                if (idx === 0) {
                    ctx.moveTo(x, h - padBot);
                    ctx.lineTo(x, y);
                } else {
                    let px = padLeft + innerPad + (idx - 1) * step;
                    let py = (h - padBot) - (Math.min(yMax, Math.max(0, pts[idx - 1])) / yMax) * chartH;
                    let cpx = (px + x) / 2;
                    ctx.bezierCurveTo(cpx, py, cpx, y, x, y);
                }
            });
            let lastVal = Math.min(yMax, Math.max(0, pts[pts.length - 1]));
            let lastX = padLeft + innerPad + (pts.length - 1) * step;
            ctx.lineTo(lastX, h - padBot);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // --- Vẽ đường BEZIER chính ---
            ctx.beginPath();
            ctx.strokeStyle = lineColor || '#2563eb';
            ctx.lineWidth = 3;
            ctx.shadowColor = lineColor || '#2563eb';
            ctx.shadowBlur = 6;
            ctx.lineJoin = 'round';
            pts.forEach(function (rawVal, idx) {
                let val = Math.min(yMax, Math.max(0, rawVal));
                let x = padLeft + innerPad + idx * step;
                let y = (h - padBot) - (val / yMax) * chartH;
                if (idx === 0) {
                    ctx.moveTo(x, y);
                } else {
                    let px = padLeft + innerPad + (idx - 1) * step;
                    let py = (h - padBot) - (Math.min(yMax, Math.max(0, pts[idx - 1])) / yMax) * chartH;
                    let cpx = (px + x) / 2;
                    ctx.bezierCurveTo(cpx, py, cpx, y, x, y);
                }
            });
            ctx.stroke();
            ctx.shadowBlur = 0;

            // --- Vẽ điểm + viền trắng + số to ---
            pts.forEach(function (rawVal, idx) {
                let val = Math.min(yMax, Math.max(0, rawVal));
                let x = padLeft + innerPad + idx * step;
                let y = (h - padBot) - (val / yMax) * chartH;

                // Viền trắng
                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.arc(x, y, 7, 0, Math.PI * 2);
                ctx.fill();
                // Điểm màu
                ctx.beginPath();
                ctx.fillStyle = lineColor || '#1d4ed8';
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();

                // Số to in đậm màu đen đậm (Font 15px bold sắc nét)
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255,255,255,0.95)';
                ctx.shadowBlur = 4;
                ctx.fillText(val + '%', x, y - 12);
                ctx.shadowBlur = 0;
            });
        }

        function renderSta5LeftChart(labels, dataPts) {
            let cvs = document.getElementById('sta5-left-chart-canvas');
            if (!cvs) return;
            let ctx = cvs.getContext('2d');
            let w = cvs.clientWidth || 350;
            let h = 220;
            cvs.width = w; cvs.height = h;
            ctx.clearRect(0, 0, w, h);
            if (!dataPts || dataPts.length === 0) return;

            let padLeft = 60, padRight = 20, padTop = 28, padBot = 22, innerPad = 18;
            let chartW = w - padLeft - padRight;
            let chartH = h - padTop - padBot;
            let maxVal = Math.max(...dataPts, 1);
            let yMax = Math.max(Math.ceil(maxVal * 2.2 / 5) * 5, 20);
            let gridCount = 4;
            let gridStep = Math.ceil(yMax / gridCount / 5) * 5;
            yMax = gridStep * gridCount;
            let gridVals = [];
            for (let i = 0; i <= gridCount; i++) gridVals.push(i * gridStep);

            // Vẽ lưới
            ctx.fillStyle = '#374151';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'right';
            gridVals.forEach(function (val) {
                let y = (h - padBot) - (val / yMax) * chartH;
                ctx.fillText(val + '%', padLeft - 8, y + 4);
                ctx.beginPath();
                ctx.strokeStyle = val === 0 ? '#94a3b8' : '#e2e8f0';
                ctx.lineWidth = val === 0 ? 1.5 : 1;
                ctx.moveTo(padLeft, y); ctx.lineTo(w - padRight, y);
                ctx.stroke();
            });

            let step = dataPts.length > 1 ? (chartW - innerPad * 2) / (dataPts.length - 1) : 0;
            drawSmoothLine(ctx, dataPts, padLeft, padBot, innerPad, step, h, yMax, chartH, '#2563eb', 'rgba(37,99,235,0.18)');
        }

        // Hàm vẽ Biểu đồ đường 2 bên phải (DL Attendance Trend Chart)

            let maxVal = Math.max(...dataPts, 1);
            let yMax = Math.max(Math.ceil(maxVal * 2.2 / 5) * 5, 20);
            let gridCount = 4;
            let gridStep = Math.ceil(yMax / gridCount / 5) * 5;
            yMax = gridStep * gridCount;
            let gridVals = [];
            for (let i = 0; i <= gridCount; i++) gridVals.push(i * gridStep);

            // Vẽ lưới
            ctx.fillStyle = '#374151';

            ctx.textAlign = 'right';
            gridVals.forEach(function (val) {

                ctx.beginPath();

            let step = dataPts.length > 1 ? (chartW - innerPad * 2) / (dataPts.length - 1) : 0;

                dates.push(`${d}/${m}/${y}`);

            }

            // XỬ LÝ ĐẾM CHỮ 'V' TỪ SHEET CHUYÊN CẦN STAS
            let stasData = (G_Data && G_Data.chuyenCanStasData) ? G_Data.chuyenCanStasData : [];
            let stasHeader = (stasData && stasData.length > 0) ? stasData[0] : [];

            // Map chỉ số cột ngày trong sheet CHUYÊN CẦN STAS
            let dateColIndexMap = {};
            for (let c = 4; c < stasHeader.length; c++) {
                let rawCell = stasHeader[c];
                let cellVal = String(rawCell || '').trim();
                if (!cellVal || cellVal === 'undefined' || cellVal === 'null') continue;
                dateColIndexMap[cellVal] = c;

                // Thử parse dạng DD/MM/YYYY hoặc D/M/YYYY
                let parts = cellVal.split('/');
                if (parts.length === 3) {
                    let d0 = String(parts[0]).padStart(2, '0');
                    let m0 = String(parts[1]).padStart(2, '0');
                    let y0 = parts[2];
                    dateColIndexMap[`${d0}/${m0}/${y0}`] = c;
                    dateColIndexMap[`${parseInt(d0)}/${parseInt(m0)}/${y0}`] = c;
                }

                // Thử parse dạng ISO: "2026-07-28T17:00:00.000Z" (từ getSheetDataByName)
                let tryDate = new Date(cellVal);
                if (!isNaN(tryDate.getTime()) && cellVal.indexOf('-') !== -1) {
                    // Dùng UTC để tránh lệch múi giờ
                    let dd = String(tryDate.getUTCDate()).padStart(2, '0');
                    let mm = String(tryDate.getUTCMonth() + 1).padStart(2, '0');
                    let yy = tryDate.getUTCFullYear();
                    dateColIndexMap[`${dd}/${mm}/${yy}`] = c;
                    dateColIndexMap[`${parseInt(dd)}/${parseInt(mm)}/${yy}`] = c;
                    // Cũng thử local time
                    let ddL = String(tryDate.getDate()).padStart(2, '0');
                    let mmL = String(tryDate.getMonth() + 1).padStart(2, '0');
                    let yyL = tryDate.getFullYear();
                    dateColIndexMap[`${ddL}/${mmL}/${yyL}`] = c;
                }
            }
            // Lọc ngày: chỉ hiện ngày nào có trong HÀNG ĐẦU TIÊN (header) của sheet
            if (stasData && stasData.length > 0) {
                dates = dates.filter(function (dt) {
                    return dateColIndexMap[dt] !== undefined;
                });
                if (dates.length === 0) {
                    showToast('⚠️ Không có ngày nào trong khoảng đã chọn tồn tại trong sheet!', 'warning');
                }
            }


            // Lấy mã Ca chọn: Ca Ngày = D, Ca Đêm = N
            let selectedCaCode = caVal === 'DAY' ? 'D' : 'N';


            let tbodyHtml = '';
            let totalTongArr = new Array(dates.length).fill(0);
            let totalDaCoArr = new Array(dates.length).fill(0);
            let totalThieuArr = new Array(dates.length).fill(0);

            // SỬA LOGIC: SO SÁNH CHÍNH XÁC TÊN TRẠM (Tránh bị trùng lặp đếm nhầm trạm con)
            filteredStations.forEach(st => {
                let stCleanName = cleanTramName(st.name);

                tbodyHtml += `<tr>`;
                tbodyHtml += `<td class="dmt-process-subline dmt-sticky-1" style="width:110px; min-width:110px; max-width:110px; background:#ffffff !important; color:#111; font-size:18px; font-weight:900; text-align:center; border:1px solid #e2e8f0;">${st.process}</td>`;
                tbodyHtml += `<td class="dmt-sticky-2" style="text-align:left; font-weight:900; font-size:18px; background:#ffffff !important; color:#111; min-width:380px; max-width:560px; width:520px; white-space:normal; word-break:break-word; line-height:1.4; padding:5px 8px;">${st.name}</td>`;
                dates.forEach((dt, dIdx) => {
                    let tongNum = (caVal === 'DAY')
                        ? (st.totalDay !== undefined ? st.totalDay : (st.total || 0))
                        : (st.totalNight !== undefined ? st.totalNight : (st.total || 0));
                    let colIdx = dateColIndexMap[dt];
                    let daCoNum = 0;

                    if (colIdx !== undefined && stasData && stasData.length > 1) {
                        for (let r = 1; r < stasData.length; r++) {
                            let row = stasData[r];
                            let rowTramName = cleanTramName(row[2]); // Cột C (Index 2): Nội dung đào tạo
                            let rowCaCode = String(row[3] || '').trim().toUpperCase(); // Cột D (Index 3): Ca (N/D)

                            // CHỈ ĐẾM KHI MÃ CA VÀ TÊN TRẠM KHỚP CHÍNH XÁC 100%
                            if (rowCaCode === selectedCaCode && rowTramName === stCleanName) {
                                let cellVal = String(row[colIdx] || '').trim().toUpperCase();
                                if (cellVal === 'V' || cellVal === '✓') {
                                    daCoNum++;
                                }
                            }
                        }
                    }

                    let diffNum = daCoNum - tongNum; // < 0 nếu thiếu (VD: 10 - 12 = -2)
                    let thieuStr = diffNum < 0 ? `${diffNum}` : '0';

                    totalTongArr[dIdx] += tongNum;
                    totalDaCoArr[dIdx] += daCoNum;
                    totalThieuArr[dIdx] += diffNum; // Cộng dồn số chênh lệch âm

                    tbodyHtml += `<td style="font-size:17.5px; font-weight:900; color:#000000 !important;">${tongNum}</td>`;
                    tbodyHtml += `<td style="font-size:17.5px; font-weight:900; color:#000000 !important;">${daCoNum}</td>`;
                    tbodyHtml += `<td style="font-size:17.5px; font-weight:900; color:${diffNum < 0 ? '#dc2626' : '#000000'} !important;">${thieuStr}</td>`;
                });
                tbodyHtml += `</tr>`;
            });

            // HÀNG TOTAL & HIỆU SUẤT CHUYÊN CẦN: NỀN TRẮNG, CHỮ ĐỎ IN ĐẬM CHỮ TO
            tbodyHtml += `<tr style="background:#ffffff !important;"><td colspan="2" class="dmt-sticky-1" style="color:#d50000 !important; font-weight:900; font-size:19px; text-align:center; background:#ffffff !important;">TOTAL</td>`;
            dates.forEach((dt, dIdx) => {
                let totThieuStr = totalThieuArr[dIdx] < 0 ? `${totalThieuArr[dIdx]}` : '0';
                tbodyHtml += `<td style="color:#d50000 !important; font-weight:900; font-size:20px; background:#ffffff !important;">${totalTongArr[dIdx]}</td>`;
                tbodyHtml += `<td style="color:#d50000 !important; font-weight:900; font-size:20px; background:#ffffff !important;">${totalDaCoArr[dIdx]}</td>`;
                tbodyHtml += `<td style="color:#d50000 !important; font-weight:900; font-size:20px; background:#ffffff !important;">${totThieuStr}</td>`;
            });
            tbodyHtml += `</tr>`;

            tbodyHtml += `<tr style="background:#ffffff !important;"><td colspan="2" class="dmt-sticky-1" style="color:#d50000 !important; font-weight:900; font-size:18px; text-align:center; background:#ffffff !important;" data-lang="dmt_eff_rate">Hiệu suất chuyên cần</td>`;
            dates.forEach((dt, dIdx) => {
                let effRate = totalTongArr[dIdx] > 0 ? ((totalDaCoArr[dIdx] / totalTongArr[dIdx]) * 100).toFixed(2) + '%' : '0.00%';
                tbodyHtml += `<td colspan="3" style="color:#d50000 !important; font-weight:900; font-size:20px; background:#ffffff !important;">${effRate}</td>`;
            });
            tbodyHtml += `</tr>`;

            document.getElementById('dmt-table-tbody').innerHTML = tbodyHtml;

            // Điều chỉnh layout hiển thị theo số ngày tra cứu (ôm khít căn giữa khi ít ngày, dãn cuộn khi nhiều ngày)
            let tblWrap = document.querySelector('#dmt-subtab-view .dmt-table-wrap');
            if (tblWrap) {
                if (dates.length <= 3) {
                    tblWrap.style.display = 'flex';
                    tblWrap.style.justifyContent = 'center';
                } else {
                    tblWrap.style.display = 'block';
                }
            }

            if (typeof applyLanguage === 'function') applyLanguage();
        };

        window.copyDmtTableImage = function () {
            let tbl = document.getElementById('dmt-main-table');
            if (!tbl) return showToast("Không tìm thấy bảng để copy!", "warning");
            if (typeof html2canvas !== 'function') return showToast("Thư viện html2canvas chưa sẵn sàng!", "warning");

            showToast("📸 Đang chụp và copy ảnh bảng Dữ Liệu Trạm CTQ...", "info");

            // Co gọn chiều cao vừa sát phần dữ liệu thực tế
            let origHeight = tbl.style.height;
            tbl.style.height = 'auto';

            html2canvas(tbl, {
                scale: Math.max(3, (window.devicePixelRatio || 1) * 2),
                useCORS: true,
                allowTaint: true,
                logging: false,
                backgroundColor: '#ffffff',
                height: tbl.offsetHeight,
                windowHeight: tbl.offsetHeight
            }).then(canvas => {
                tbl.style.height = origHeight;
                canvas.toBlob(async (blob) => {
                    if (!blob) return showToast("Không thể tạo dữ liệu ảnh!", "error");
                    try {
                        if (navigator.clipboard && window.ClipboardItem) {
                            const item = new ClipboardItem({ 'image/png': blob });
                            await navigator.clipboard.write([item]);
                            showToast("📋 Đã copy toàn bộ ảnh bảng Dữ Liệu Trạm CTQ vào Bộ nhớ tạm! Nhấn Ctrl+V để dán.", "success");
                        } else {
                            throw new Error("Trình duyệt không hỗ trợ ClipboardItem");
                        }
                    } catch (err) {
                        let link = document.createElement('a');
                        link.download = `Du_Lieu_Tram_CTQ_${new Date().toISOString().slice(0, 10)}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        showToast("📋 Đã tải ảnh Dữ Liệu Trạm xuống máy.", "info");
                    }
                }, 'image/png');
            }).catch(err => {
                showToast("Lỗi khi chụp ảnh: " + err, "error");
            });
        };
