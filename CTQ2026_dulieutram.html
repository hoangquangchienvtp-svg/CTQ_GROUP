            if (!ccSel || !kdvtSel) return;

            let ccSheets, kdvtSheets, defCC, defKDVT;
            if (res && res.ccSheets) {

                kdvtSheets = res.kdvtSheets || [];
                defCC = res.defaultCCSheet || (ccSheets[0] ? (typeof ccSheets[0] === 'string' ? ccSheets[0] : ccSheets[0].name) : 'CHUYÊN CẦN STAS');
                defKDVT = res.defaultKDVTSheet || (kdvtSheets[0] ? (typeof kdvtSheets[0] === 'string' ? kdvtSheets[0] : kdvtSheets[0].name) : 'KHÔNG ĐÚNG VỊ TRÍ STAS');
            } else if (res && res.lines) {
                ccSheets = res.lines.map(function (l) { return { name: 'CHUYÊN CẦN ' + (typeof l === 'string' ? l : l.name) }; });
                kdvtSheets = res.lines.map(function (l) { return { name: 'KHÔNG ĐÚNG VỊ TRÍ ' + (typeof l === 'string' ? l : l.name) }; });
                defCC = 'CHUYÊN CẦN ' + (res.defaultLine || 'STAS');
                defKDVT = 'KHÔNG ĐÚNG VỊ TRÍ ' + (res.defaultLine || 'STAS');
            } else {
                ccSheets = [{ name: 'CHUYÊN CẦN STAS' }];
                kdvtSheets = [{ name: 'KHÔNG ĐÚNG VỊ TRÍ STAS' }];
                defCC = 'CHUYÊN CẦN STAS';
                defKDVT = 'KHÔNG ĐÚNG VỊ TRÍ STAS';

        window.colLetterToIndex = function (letter) {

            let result = 0;
            for (let i = 0; i < s.length; i++) {

            }
            return result - 1; // 0-based

                            <div id="bc-title-trend" style="font-weight:900; font-size:16.5px; color:#ff6b00; margin-bottom:10px;">

            // Nếu người dùng chủ động bấm TÌM KIẾM DỮ LIỆU → Xóa cache để luôn tải dữ liệu mới nhất trực tiếp từ Google Sheet
            if (forceReload === true) {
                G_Data.bcCCData = null;
                G_Data.chuyenCanStasData = null;
                G_Data.bcKdvtData = null;
                G_Data.khongDungViTriData = null;
            }

            let tramList = window.BC_TRAM_LIST || [];
            if (!tramList.length)
                return showToast('⚠️ Chưa có trạm nào! Vào CÀI ĐẶT BÁO CÁO HỌP để thêm trạm.', 'warning');

            let targetDate = new Date(selectedDateInput);

            // Hàm kiểm tra dòng có thuộc BC_TRAM_LIST không (hỗ trợ so sánh chính xác và lọc khoảng trắng thừa/xuống dòng)
            function rowBelongsToTram(row) {
                for (let t = 0; t < tramList.length; t++) {
                    let tram = tramList[t];
                    let colIdx = window.colLetterToIndex(tram.col);
                    if (colIdx < 0) continue;
                    let cellInCol = String(row[colIdx] || '').replace(/\s+/g, ' ').trim().toLowerCase();
                    let targetName = String(tram.name || '').replace(/\s+/g, ' ').trim().toLowerCase();
                    if (!cellInCol || !targetName) continue;
                    if (cellInCol === targetName || cellInCol.includes(targetName) || targetName.includes(cellInCol)) return true;
                }
                return false;
            }


            // Tạo mảng ngày: ưu tiên lấy từ header sheet KHÔNG ĐÚNG VỊ TRÍ đã load vào G_Data
            let dates = [];
            let kdvtHeaderForDates = (G_Data.bcKdvtData && G_Data.bcKdvtData.values && G_Data.bcKdvtData.values.length > 0)
                ? G_Data.bcKdvtData.values[0] : [];

            if (kdvtHeaderForDates.length > 5) {
                let kdvtDatesAll = [];
                for (let c = 5; c < kdvtHeaderForDates.length; c++) {
                    let hv = String(kdvtHeaderForDates[c] || '').trim();
                    if (!hv) continue;
                    let parts = hv.split('/');
                    if (parts.length === 3) {
                        let d = parseInt(parts[0]), mo = parseInt(parts[1]), y = parseInt(parts[2]);
                        let dt = new Date(y, mo - 1, d);
                        if (dt <= targetDate)
                            kdvtDatesAll.push({ key: `${String(d).padStart(2, '0')}/${String(mo).padStart(2, '0')}/${y}`, dt: dt });
                    }
                }
                kdvtDatesAll.sort((a, b) => a.dt - b.dt);
                dates = kdvtDatesAll.slice(-6).map(x => x.key);
            }

            // Fallback 6 ngày làm việc gần nhất
            if (dates.length === 0) {
                let cd = new Date(targetDate);
                while (dates.length < 6) {
                    if (cd.getDay() !== 0) {
                        let y = cd.getFullYear();
                        let m = String(cd.getMonth() + 1).padStart(2, '0');
                        let day = String(cd.getDate()).padStart(2, '0');
                        dates.unshift(`${day}/${m}/${y}`);
                    }
                    cd.setDate(cd.getDate() - 1);
                }
            }

            let selDay = String(targetDate.getDate()).padStart(2, '0');
            let selMonth = String(targetDate.getMonth() + 1).padStart(2, '0');
            let selYear = targetDate.getFullYear();
            let selectedDateStr = `${selDay}/${selMonth}/${selYear}`;

            let selectedCaCode = 'ALL';
            if (caVal === 'DAY') selectedCaCode = 'D';
            else if (caVal === 'NIGHT') selectedCaCode = 'N';

            // Nếu chưa có data CC cho BC, sử dụng dữ liệu đã load của STA5 làm fallback hoặc tải mới
            let bcCCSheetName = window.currentBcCCSheet || window.currentCCSheet || 'CHUYÊN CẦN STAS';

            if (!G_Data.bcCCData || !G_Data.bcCCData.length) {
                if (!forceReload && G_Data.chuyenCanStasData && G_Data.chuyenCanStasData.length) {
                    G_Data.bcCCData = G_Data.chuyenCanStasData;
                } else if (typeof google !== 'undefined' && google.script && google.script.run) {
                    showToast('⏳ Đang tải dữ liệu Chuyên Cần từ Google Sheet...', 'info');
                    google.script.run
                        .withSuccessHandler(function (rows) {
                            let dataRows = (rows && rows.data) ? rows.data : (Array.isArray(rows) ? rows : []);
                            G_Data.bcCCData = dataRows;
                            G_Data.chuyenCanStasData = dataRows;
                            window.executeBcSearch(false);
                        })
                        .withFailureHandler(function (err) { showToast('❌ Lỗi tải sheet CC: ' + err, 'error'); })
                        .getSheetDataByName(bcCCSheetName, false);
                    return;
                }
            }

            let stasData = G_Data.bcCCData || G_Data.chuyenCanStasData || [];
            let stasHeader = stasData.length > 0 ? stasData[0] : [];

            // Build dateColMap từ header CC
            let dateColMap = {};
            for (let c = 4; c < stasHeader.length; c++) {
                let cellVal = String(stasHeader[c] || '').trim();
                if (!cellVal) continue;
                dateColMap[cellVal] = c;
                let parts = cellVal.replace(/\-/g, '/').split('/');
                if (parts.length === 3) {
                    let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]), p3 = parts[2];
                    let s1 = String(parts[0]).padStart(2, '0');
                    let s2 = String(parts[1]).padStart(2, '0');
                    dateColMap[`${s1}/${s2}/${p3}`] = c;
                    dateColMap[`${p1}/${p2}/${p3}`] = c;
                    dateColMap[`${s2}/${s1}/${p3}`] = c;
                    dateColMap[`${p2}/${p1}/${p3}`] = c;
                    dateColMap[`${s1}/${s2}`] = c;
                    dateColMap[`${p1}/${p2}`] = c;
                    dateColMap[`${s2}/${s1}`] = c;
                    dateColMap[`${p2}/${p1}`] = c;
                } else if (parts.length === 2) {
                    let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]);
                    let s1 = String(parts[0]).padStart(2, '0');
                    let s2 = String(parts[1]).padStart(2, '0');
                    dateColMap[`${s1}/${s2}`] = c;
                    dateColMap[`${p1}/${p2}`] = c;
                    dateColMap[`${s2}/${s1}`] = c;
                    dateColMap[`${p2}/${p1}`] = c;
                }
                let tryD = new Date(cellVal);
                if (!isNaN(tryD.getTime()) && cellVal.indexOf('-') !== -1) {
                    let ddU = String(tryD.getUTCDate()).padStart(2, '0');
                    let mmU = String(tryD.getUTCMonth() + 1).padStart(2, '0');
                    dateColMap[`${ddU}/${mmU}/${tryD.getUTCFullYear()}`] = c;
                    dateColMap[`${tryD.getUTCDate()}/${tryD.getUTCMonth() + 1}/${tryD.getUTCFullYear()}`] = c;
                    dateColMap[`${tryD.getUTCDate()}/${tryD.getUTCMonth() + 1}`] = c;
                    dateColMap[`${ddU}/${mmU}`] = c;
                }
            }

            // Bảng 1: tổng hợp theo ngày chọn, chỉ dòng thuộc BC_TRAM_LIST
            let totalReq = 0;
            for (let r = 1; r < stasData.length; r++) {
                let row = stasData[r];
                let rowCa = String(row[3] || '').trim().toUpperCase();
                let caMatch = (selectedCaCode === 'ALL') || (rowCa === selectedCaCode);
                let hasVal = row.some(c => String(c || '').trim() !== '');
                if (hasVal && caMatch && rowBelongsToTram(row)) totalReq++;
            }

            let v1Act = 0, v1Phep = 0, v1Td = 0, v1Nv = 0, v1Thieu = 0;
            let colIdxV1 = dateColMap[selectedDateStr];
            if (colIdxV1 !== undefined && stasData.length > 1) {
                for (let r = 1; r < stasData.length; r++) {
                    let row = stasData[r];
                    let rowCa = String(row[3] || '').trim().toUpperCase();
                    let caMatch = (selectedCaCode === 'ALL') || (rowCa === selectedCaCode);
                    if (!caMatch || !rowBelongsToTram(row)) continue;
                    let cv = String(row[colIdxV1] || '').trim().toUpperCase();
                    if (cv === 'V' || cv === '✓') v1Act++;
                    else if (cv.includes('请假') || cv.includes('病假') || cv.includes('年假') || cv.includes('婚假') || cv.includes('丧假') || cv.includes('PHÉP')) v1Phep++;
                    else if (cv.includes('旷工') || cv.includes('TỰ DO')) v1Td++;
                    else if (cv.includes('离职') || cv.includes('NGHỈ VIỆC')) v1Nv++;
                    else if (cv.includes('NO') || cv.includes('不开线') || cv.includes('THIẾU')) v1Thieu++;
                }
            }
            let v1Rate = totalReq > 0 ? Math.round((v1Act / totalReq) * 100) + '%' : '0%';
            document.getElementById('bc-v1-req').innerText = totalReq;
            document.getElementById('bc-v1-act').innerText = v1Act;
            document.getElementById('bc-v1-phep').innerText = v1Phep;
            document.getElementById('bc-v1-td').innerText = v1Td;
            document.getElementById('bc-v1-nv').innerText = v1Nv;
            document.getElementById('bc-v1-thieu').innerText = v1Thieu;
            document.getElementById('bc-v1-rate').innerText = v1Rate;

            // Cache + các bảng 6 ngày
            let cacheKey = 'BC_CACHE_V1_' + caVal;
            let bcCache = {};
            try { bcCache = JSON.parse(localStorage.getItem(cacheKey) || '{}'); } catch (e) { bcCache = {}; }

            let dateRateMap = {}, dateNvMap = {}, dateTotalPeopleMap = {}, dateNotCorrMap = {};

            // KDVT data cho BC
            let bcKdvtRes = G_Data.bcKdvtData || {};
            let kdvtValues = bcKdvtRes.values || [];
            let kdvtBgColors = bcKdvtRes.bgColors || [];
            let kdvtHeader = kdvtValues.length > 0 ? kdvtValues[0] : [];
            let kdvtDateColMap = {};
            for (let c = 0; c < kdvtHeader.length; c++) {
                let cv = String(kdvtHeader[c] || '').trim();
                if (!cv) continue;
                kdvtDateColMap[cv] = c;
                let parts = cv.split('/');
                if (parts.length === 3) {
                    let p1 = parseInt(parts[0]), p2 = parseInt(parts[1]), p3 = parts[2];
                    kdvtDateColMap[`${p1}/${p2}/${p3}`] = c;
                    kdvtDateColMap[`${String(p1).padStart(2, '0')}/${String(p2).padStart(2, '0')}/${p3}`] = c;
                    kdvtDateColMap[`${p2}/${p1}/${p3}`] = c;
                    kdvtDateColMap[`${String(p2).padStart(2, '0')}/${String(p1).padStart(2, '0')}/${p3}`] = c;
                }
            }
            let hasKdvtData = (kdvtValues && kdvtValues.length > 1);

            // Lọc danh sách ngày: chỉ giữ lại những ngày CÓ CỘT trong Sheet Chuyên Cần (nếu ngày nào không có dữ liệu cột thì không hiện ra)
            let validDates = [];
            dates.forEach(dt => {
                let colIdx = dateColMap[dt];
                // Nếu cột tồn tại và có dữ liệu đếm hoặc dòng yêu cầu nhân lực > 0
                if (colIdx !== undefined) {
                    let hasColData = false;
                    for (let r = 1; r < stasData.length; r++) {
                        let row = stasData[r];
                        if (!rowBelongsToTram(row)) continue;
                        let cv = String(row[colIdx] || '').trim();
                        if (cv !== '') { hasColData = true; break; }
                    }
                    if (hasColData) validDates.push(dt);
                }
            });

            // Nếu lọc được mảng validDates có dữ liệu thì ưu tiên hiển thị mảng đó
            if (validDates.length > 0) {
                dates = validDates;
            }

            dates.forEach(dt => {
                let colIdx = dateColMap[dt];
                let actCount = 0, nvCount = 0;

                if (colIdx !== undefined && stasData.length > 1) {
                    for (let r = 1; r < stasData.length; r++) {
                        let row = stasData[r];
                        let rowCa = String(row[3] || '').trim().toUpperCase();
                        let caMatch = (selectedCaCode === 'ALL') || (rowCa === selectedCaCode);
                        if (!caMatch || !rowBelongsToTram(row)) continue;
                        let cv = String(row[colIdx] || '').trim().toUpperCase();
                        if (cv === 'V' || cv === '✓') actCount++;
                        else if (cv.includes('离职') || cv.includes('NGHỈ VIỆC')) nvCount++;
                    }
                }

                let totPeople = totalReq; // Bảng bên phải tự nhảy theo Yêu cầu nhân lực
                let notCorrCount = 0;

                let rateStr = totalReq > 0 ? Math.round((actCount / totalReq) * 100) + '%' : '0%';
                dateRateMap[dt] = rateStr;
                dateNvMap[dt] = nvCount;
                dateTotalPeopleMap[dt] = totPeople;
                dateNotCorrMap[dt] = notCorrCount;
                bcCache[dt] = { rate: rateStr, nv: nvCount, totP: totPeople, notP: notCorrCount };
                try { localStorage.setItem(cacheKey, JSON.stringify(bcCache)); } catch (e) { }
            });

            // Bảng 2: 出勤率 theo 6 ngày
            let t2Head = '<tr><th style="background:#ff6b00;color:#fff;font-weight:900;font-size:20px;">Date</th>';
            let t2Body = '<tr><td style="font-weight:900;font-size:20px;">出勤率</td>';
            dates.forEach(dt => {
                let parts = dt.split('/');
                let sd = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
                t2Head += `<th style="font-weight:900;font-size:22px;">${sd}</th>`;
                t2Body += `<td style="font-weight:900;font-size:22px;color:#000000 !important;">${dateRateMap[dt]}</td>`;
            });
            t2Head += '</tr>'; t2Body += '</tr>';
            document.getElementById('bc-tbl2-head').innerHTML = t2Head;
            document.getElementById('bc-tbl2-body').innerHTML = t2Body;

            // Bảng 3: 离职 theo 6 ngày
            let t3Head = '<tr><th style="background:#ff6b00;color:#fff;font-weight:900;font-size:20px;">Date</th>';
            let t3Body = '<tr><td style="background:#b91c1c;color:#fff;font-weight:900;font-size:20px;">离职</td>';
            dates.forEach(dt => {
                let parts = dt.split('/');
                let sd = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
                t3Head += `<th style="font-weight:900;font-size:22px;">${sd}</th>`;
                t3Body += `<td style="font-weight:900;font-size:22px;color:#000000 !important;">${dateNvMap[dt]}</td>`;
            });
            t3Head += '</tr>'; t3Body += '</tr>';
            document.getElementById('bc-tbl3-head').innerHTML = t3Head;
            document.getElementById('bc-tbl3-body').innerHTML = t3Body;

            // Bảng 4: Automatic Total People from totalReq (Tự nhảy theo Yêu cầu nhân lực)
            let manualTbl4Data = {};
            try { manualTbl4Data = JSON.parse(localStorage.getItem('bc_manual_tbl4') || '{}'); } catch (e) { }

            let t4Head = '<tr><th style="background:#ff6b00;color:#fff;font-weight:900;font-size:20px;width:130px;min-width:120px;">日期<br>Date</th>';
            let t4Tot = '<tr><td style="font-weight:900;font-size:20px;width:130px;min-width:120px;">总人数<br>Total people</td>';
            let t4Not = '<tr><td style="font-weight:900;font-size:20px;width:130px;min-width:120px;">不对料人数<br>Does not correspond</td>';
            let t4Rate = '<tr><td style="font-weight:900;font-size:20px;width:130px;min-width:120px;">不对料率 Does not correspond %</td>';

            dates.forEach(dt => {
                let parts = dt.split('/');
                let sd = parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
                t4Head += `<th style="font-weight:900;font-size:22px; width:45px; min-width:40px; max-width:55px;">${sd}</th>`;
                t4Tot += `<td style="font-weight:900;font-size:22px;color:#000000 !important; width:45px; min-width:40px; max-width:55px;">${totalReq}</td>`;

                // Đếm 不对料人数 từ KDVT
                let countNotCorr = 0;
                let colKDVT = kdvtDateColMap[dt];

                if (colKDVT !== undefined && hasKdvtData) {
                    for (let r = 1; r < kdvtValues.length; r++) {
                        let row = kdvtValues[r];
                        let val = String(row[colKDVT] || '').trim();
                        let rowCa = String(row[3] || '').trim().toUpperCase();
                        let caMatch = (selectedCaCode === 'ALL') || (rowCa === selectedCaCode);
                        if (!caMatch || !rowBelongsToTram(row)) continue;

                        let color = (kdvtBgColors[r] && kdvtBgColors[r][colKDVT]) ? String(kdvtBgColors[r][colKDVT]).toLowerCase() : '';
                        let isRed = (color.indexOf('ff0000') !== -1 || color.indexOf('ea4335') !== -1 || color.indexOf('f44336') !== -1 || color.indexOf('e53935') !== -1 || color.indexOf('d32f2f') !== -1 || color.indexOf('b71c1c') !== -1 || color.indexOf('#f00') !== -1);

                        if (isRed || val.includes('不对料') || val.includes('KHÔNG ĐÚNG') || val.includes('LỆCH') || (val !== '' && val !== 'OK' && val !== 'V' && val !== '✓')) {
                            countNotCorr++;
                        }
                    }
                } else if (manualTbl4Data[dt] !== undefined) {
                    countNotCorr = parseInt(manualTbl4Data[dt]) || 0;
                }

                dateNotCorrMap[dt] = countNotCorr;

                t4Not += `<td style="padding:4px; width:45px; min-width:40px; max-width:55px;"><input type="number" min="0" value="${countNotCorr}" onchange="updateBcManualNotCorr('${dt}', this.value)" style="width:100%; text-align:center; font-weight:900; font-size:22px; color:#000000 !important; border:none; background:transparent; outline:none;" onfocus="this.select()"></td>`;

                let rPct = totalReq > 0 ? Math.round((countNotCorr / totalReq) * 100) : 0;
                t4Rate += `<td style="font-weight:900;font-size:22px;color:#000000 !important; width:45px; min-width:40px; max-width:55px;">${rPct}%</td>`;
            });

            t4Head += '</tr>'; t4Tot += '</tr>'; t4Not += '</tr>'; t4Rate += '</tr>';
            document.getElementById('bc-tbl4-head').innerHTML = t4Head;
            document.getElementById('bc-tbl4-body').innerHTML = t4Tot + t4Not + t4Rate;

            window.updateBcManualNotCorr = function (dtKey, val) {
                let m = {};
                try { m = JSON.parse(localStorage.getItem('bc_manual_tbl4') || '{}'); } catch (e) { }
                m[dtKey] = parseInt(val) || 0;
                localStorage.setItem('bc_manual_tbl4', JSON.stringify(m));
                executeBcSearch(false);
            };

            // Vẽ Biểu đồ 1 bên trái (Chart.js)
            let chartLabels = dates.map(dt => {
                let parts = dt.split('/');
                return parts.length === 3 ? `${parseInt(parts[1])}/${parseInt(parts[0])}` : dt;
            });
            let chartDataRate = dates.map(dt => parseInt(dateRateMap[dt]) || 0);

            let ctxLeft = document.getElementById('bc-left-chart-canvas');
            if (ctxLeft) {
                if (window.bcLeftChartInstance) window.bcLeftChartInstance.destroy();
                window.bcLeftChartInstance = new Chart(ctxLeft, {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: '出勤率 (%)',
                            data: chartDataRate,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59,130,246,0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 5,
                            pointBackgroundColor: '#3b82f6'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            datalabels: {
                                anchor: 'end',
                                align: 'top',
                                formatter: function (val) { return val + '%'; },
                                font: { weight: 'bold', size: 12 },
                                color: '#1e293b'
                            }
                        },
                        scales: {
                            y: { min: 0, max: 200, ticks: { callback: function (val) { return val + '%'; } } }
                        }
                    },
                    plugins: (typeof ChartDataLabels !== 'undefined') ? [ChartDataLabels] : []
                });
            }

            // Vẽ Biểu đồ 2 Trend Chart bên phải
            let chartDataTrend = dates.map(dt => {
                let notC = dateNotCorrMap[dt] || 0;
                return totalReq > 0 ? Math.round((notC / totalReq) * 100) : 0;
            });

            let ctxTrend = document.getElementById('bc-trend-canvas');
            if (ctxTrend) {
                if (window.bcTrendChartInstance) window.bcTrendChartInstance.destroy();
                window.bcTrendChartInstance = new Chart(ctxTrend, {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: 'Does not correspond %',
                            data: chartDataTrend,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239,68,68,0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 5,
                            pointBackgroundColor: '#ef4444'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            datalabels: {
                                anchor: 'end',
                                align: 'top',
                                formatter: function (val) { return val + '%'; },
                                font: { weight: 'bold', size: 13 },
                                color: '#b91c1c'
                            }
                        },
                        scales: {
                            y: { min: 0, max: 50, ticks: { callback: function (val) { return val + '%'; } } }
                        }
                    },
                    plugins: (typeof ChartDataLabels !== 'undefined') ? [ChartDataLabels] : []
                });
            }
        };


        window.onViewCCSheetChange = function (sheetName) {
            if (!sheetName) return;
            window.currentCCSheet = sheetName;
            showToast('📋 Đã chọn sheet Chuyên Cần: ' + sheetName, 'info');
            let tbody = document.getElementById('dmt-table-tbody');
            if (tbody && tbody.children.length > 0) executeDmtSearch();
        };

        window.executeDmtSearch = function () {
            let fromDateStr = document.getElementById('dmt-from-date').value;
            let toDateStr = document.getElementById('dmt-to-date').value;
            let caVal = document.getElementById('dmt-filter-ca').value;
            let processVal = document.getElementById('dmt-filter-process').value;

            if (!fromDateStr || !toDateStr) return showToast("Vui lòng chọn Từ ngày và Đến ngày!", "warning");

            let d1 = new Date(fromDateStr);
            let d2 = new Date(toDateStr);
            if (d1 > d2) return showToast("Từ ngày phải nhỏ hơn hoặc bằng Đến ngày!", "warning");

            // Xóa cache để luôn lấy dữ liệu mới nhất từ sheet
            G_Data.chuyenCanStasData = null;

            // Populate dropdown nếu chưa được populate
            let viewSel = document.getElementById('view-cc-sheet-select');
            if (viewSel && (viewSel.options.length === 0 || (viewSel.options[0] && viewSel.options[0].value === ''))) {
                initViewCCSheetSelector();
            }

            if (!G_Data.chuyenCanStasData || G_Data.chuyenCanStasData.length === 0) {
                // Lấy tên sheet hiện tại (dynamic, không hardcode)
                let sheetToLoad = window.currentCCSheet || 'CHUYÊN CẦN STAS';
                showToast('⏳ Đang tải dữ liệu ' + sheetToLoad + '...', 'info');
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(function (res) {
                        if (res && res.success) {
                            G_Data.chuyenCanStasData = res.data || [];
                            showToast('✅ Đã tải dữ liệu ' + sheetToLoad + '!', 'success');
                            renderDmtTableData(d1, d2, caVal, processVal);
                        } else {
                            showToast('❌ Lỗi tải sheet ' + sheetToLoad + ': ' + (res ? res.message : 'Không xác định'), 'error');
                        }
                    }).withFailureHandler(function (err) {
                        showToast('❌ Lỗi tải sheet CC: ' + err, 'error');
                    }).getSheetDataByName(sheetToLoad, false); // false = không cần bgColors
                    return;
                }
            }

            renderDmtTableData(d1, d2, caVal, processVal);
        };

        function renderDmtTableData(d1, d2, caVal, processVal) {
            let filteredStations = STATIONS_LIST;
            if (processVal !== 'ALL') {
                filteredStations = STATIONS_LIST.filter(s => s.process === processVal);
            }

            if (filteredStations.length === 0) {
                showToast("Không có trạm nào thuộc khu vực được chọn!", "warning");
                document.getElementById('dmt-table-thead').innerHTML = '';
                document.getElementById('dmt-table-tbody').innerHTML = '<tr><td colspan="10" style="padding:20px; text-align:center; color:#64748b;">Không có dữ liệu trạm.</td></tr>';
                return;
            }

            // Tạo danh sách các ngày trong khoảng từ d1 -> d2
            let dates = [];
            let cur = new Date(d1);
            while (cur <= d2) {
                let y = cur.getFullYear();
                let m = String(cur.getMonth() + 1).padStart(2, '0');
                let d = String(cur.getDate()).padStart(2, '0');
                dates.push({
                    display: `${d}/${m}/${y}`,
                    dateObj: new Date(cur)
                });
                cur.setDate(cur.getDate() + 1);
            }

            // Xử lý dữ liệu Chuyên Cần STA5 để đếm thực tế theo từng ngày & từng trạm
            let stasData = G_Data.chuyenCanStasData || [];
            let stasHeader = stasData.length > 0 ? stasData[0] : [];

            // Map ngày (dd/mm/yyyy) sang index cột trong sheet
            let dateColMap = {};
            for (let c = 4; c < stasHeader.length; c++) {
                let cellVal = String(stasHeader[c] || '').trim();
                if (cellVal) {
                    dateColMap[cellVal] = c;
                    let parts = cellVal.split('/');
                    if (parts.length === 3) {
                        let d = String(parts[0]).padStart(2, '0');
                        let m = String(parts[1]).padStart(2, '0');
                        let y = parts[2];
                        dateColMap[`${d}/${m}/${y}`] = c;
                        dateColMap[`${parseInt(d)}/${parseInt(m)}/${y}`] = c;
                    }
                }
            }

            let selectedCaCode = (caVal === 'DAY') ? 'D' : 'N';

            // DỰNG HEADER BẢNG DÙNG THẺ COMPACT VỚI MÀU XANH LÁ ĐẬM #153a29 IN ĐẬM RÕ NÉT
            let theadHtml = ``;

            // Hàng 1: Tiêu đề Ca (Ca Ngày / Ca Đêm)
            let caTitleText = (caVal === 'DAY') ? 'CA NGÀY (DAY)' : 'CA ĐÊM (NIGHT)';
            theadHtml += `<tr>`;
            theadHtml += `<th colspan="2" class="dmt-th-ca dmt-sticky-1" style="border-right:2px solid #94a3b8 !important; z-index:25 !important; color:#ffffff !important;">${caTitleText}</th>`;
            dates.forEach(dt => {
                theadHtml += `<th colspan="3" class="dmt-th-ca" style="color:#ffffff !important;">${caTitleText}</th>`;
            });
            theadHtml += `</tr>`;

            // Hàng 2: Tên Ngày
            theadHtml += `<tr>`;
            theadHtml += `<th class="dmt-th-date dmt-col-proc dmt-sticky-1" style="z-index:25 !important; color:#ffffff !important;">Khu Vực</th>`;
            theadHtml += `<th class="dmt-th-date dmt-sticky-2" style="color:#ffffff !important;">Tên Trạm (Station name)</th>`;
            dates.forEach(dt => {
                theadHtml += `<th colspan="3" class="dmt-th-date" style="color:#ffffff !important;">${dt.display}</th>`;
            });
            theadHtml += `</tr>`;

            // Hàng 3: 3 Cột con (Tổng Số Lượng | Số lượng đã có | Số lượng thiếu)
            theadHtml += `<tr>`;
            theadHtml += `<th class="dmt-th-sub dmt-col-proc dmt-sticky-1" style="z-index:25 !important; color:#ffffff !important; font-size:18px;">Process</th>`;
            theadHtml += `<th class="dmt-th-sub dmt-sticky-2" style="color:#ffffff !important; font-size:18px;">Station name</th>`;
            dates.forEach(dt => {
                theadHtml += `<th class="dmt-th-sub" style="font-size:13.5px; padding:6px 8px; color:#ffffff !important;">Tổng Số Lượng</th>`;
                theadHtml += `<th class="dmt-th-sub" style="font-size:13.5px; padding:6px 8px; color:#ffffff !important;">Số lượng đã có</th>`;
                theadHtml += `<th class="dmt-th-sub" style="font-size:13.5px; padding:6px 8px; color:#ffffff !important;">Số lượng thiếu</th>`;
            });
            theadHtml += `</tr>`;

            document.getElementById('dmt-table-thead').innerHTML = theadHtml;

            // DỰNG BODY BẢNG (CHỮ TO 17.5px, IN ĐẬM ĐEN 900)
            let tbodyHtml = ``;

            let totalTongArr = new Array(dates.length).fill(0);
            let totalDaCoArr = new Array(dates.length).fill(0);
            let totalThieuArr = new Array(dates.length).fill(0);

            // Gom nhóm trạm theo Khu Vực (Process) để tạo hàng phân cách đẹp mắt
            let processGroups = {};
            filteredStations.forEach(st => {
                let proc = st.process || 'KHÁC';
                if (!processGroups[proc]) processGroups[proc] = [];
                processGroups[proc].push(st);
            });

            let processOrder = ['SUBLINE', 'OFFLINE', 'FATP', 'PACK', 'FA', 'KHÁC'];

            processOrder.forEach(procKey => {
                let groupList = processGroups[procKey];
                if (!groupList || groupList.length === 0) return;

                // Hàng phân cách tên Process
                let procColSpan = 2 + dates.length * 3;
                tbodyHtml += `<tr class="dmt-process-subline">`;
                tbodyHtml += `<td colspan="${procColSpan}" style="text-align:left; padding:8px 16px; font-weight:900; font-size:16px; background:#fce4ec; color:#880e4f;">`;
                tbodyHtml += `📌 KHU VỰC: ${procKey}`;
                tbodyHtml += `</td></tr>`;

                // Render từng trạm trong khu vực
                groupList.forEach((st, idx) => {
                    tbodyHtml += `<tr>`;
                    tbodyHtml += `<td class="dmt-col-proc dmt-sticky-1" style="font-size:18px; font-weight:900; background:#ffffff !important;">${st.process}</td>`;
                    tbodyHtml += `<td class="dmt-sticky-2" style="text-align:left; font-size:18px; font-weight:900; background:#ffffff !important;">${st.name}</td>`;

                    // Số lượng định mức (Tổng Số Lượng) theo Ca lọc
                    let tongNum = (caVal === 'DAY') ? (st.totalDay !== undefined ? st.totalDay : st.total) : (st.totalNight !== undefined ? st.totalNight : st.total);
                    tongNum = parseInt(tongNum) || 0;

                    dates.forEach((dt, dIdx) => {
                        let colIdx = dateColMap[dt.display];
                        let daCoNum = 0;

                        if (colIdx !== undefined && stasData.length > 1) {
                            let targetStationName = String(st.name || '').replace(/\s+/g, ' ').trim().toLowerCase();

                            for (let r = 1; r < stasData.length; r++) {
                                let row = stasData[r];
                                let rowCaCode = String(row[3] || '').trim().toUpperCase(); // Cột D (Index 3): Ca (D/N)
                                let isCaMatch = (rowCaCode === selectedCaCode);

                                if (isCaMatch) {
                                    // Tên trạm nằm ở Cột B (Index 1) hoặc Cột C (Index 2)
                                    let cellB = String(row[1] || '').replace(/\s+/g, ' ').trim().toLowerCase();
                                    let cellC = String(row[2] || '').replace(/\s+/g, ' ').trim().toLowerCase();

                                    let isStationMatch = (cellB === targetStationName || cellC === targetStationName ||
                                        cellB.includes(targetStationName) || cellC.includes(targetStationName) ||
                                        targetStationName.includes(cellB) || targetStationName.includes(cellC));

                                    if (isStationMatch) {
                                        let markVal = String(row[colIdx] || '').trim().toUpperCase();
                                        if (markVal === 'V' || markVal === '✓') {
                                            daCoNum++;
                                        }
                                    }
                                }
                            }
                        }

                        let diffNum = daCoNum - tongNum; // < 0 nếu thiếu (VD: 10 - 12 = -2)
                        let thieuStr = diffNum < 0 ? `${diffNum}` : '0';

                        totalTongArr[dIdx] += tongNum;
                        totalDaCoArr[dIdx] += daCoNum;
                        totalThieuArr[dIdx] += diffNum; // Cộng dồn số chênh lệch âm

                        tbodyHtml += `<td style="font-size:17.5px; font-weight:900; color:#000000 !important;">${tongNum}</td>`;
                        tbodyHtml += `<td style="font-size:17.5px; font-weight:900; color:#000000 !important;">${daCoNum}</td>`;
                        tbodyHtml += `<td style="font-size:17.5px; font-weight:900; color:${diffNum < 0 ? '#dc2626' : '#000000'} !important;">${thieuStr}</td>`;
                    });
                    tbodyHtml += `</tr>`;
                });
            });

            // HÀNG TOTAL & HIỆU SUẤT CHUYÊN CẦN: NỀN TRẮNG, CHỮ ĐỎ IN ĐẬM CHỮ TO
            tbodyHtml += `<tr style="background:#ffffff !important;"><td colspan="2" class="dmt-sticky-1" style="color:#d50000 !important; font-weight:900; font-size:19px; text-align:center; background:#ffffff !important;">TOTAL</td>`;
            dates.forEach((dt, dIdx) => {
                let totThieuStr = totalThieuArr[dIdx] < 0 ? `${totalThieuArr[dIdx]}` : '0';
                tbodyHtml += `<td style="color:#d50000 !important; font-weight:900; font-size:20px; background:#ffffff !important;">${totalTongArr[dIdx]}</td>`;
                tbodyHtml += `<td style="color:#d50000 !important; font-weight:900; font-size:20px; background:#ffffff !important;">${totalDaCoArr[dIdx]}</td>`;
                tbodyHtml += `<td style="color:#d50000 !important; font-weight:900; font-size:20px; background:#ffffff !important;">${totThieuStr}</td>`;
            });
            tbodyHtml += `</tr>`;

            // Hàng Tỷ lệ Chuyên Cần
            tbodyHtml += `<tr style="background:#ffffff !important;"><td colspan="2" class="dmt-sticky-1" style="color:#d50000 !important; font-weight:900; font-size:19px; text-align:center; background:#ffffff !important;">Hiệu suất Chuyên Cần (%)</td>`;
            dates.forEach((dt, dIdx) => {
                let eff = totalTongArr[dIdx] > 0 ? Math.round((totalDaCoArr[dIdx] / totalTongArr[dIdx]) * 100) : 0;
                tbodyHtml += `<td colspan="3" style="color:#d50000 !important; font-weight:900; font-size:20px; text-align:center; background:#ffffff !important;">${eff}%</td>`;
            });
            tbodyHtml += `</tr>`;

            document.getElementById('dmt-table-tbody').innerHTML = tbodyHtml;
        }

        window.renderDmtSettingsTable = function () {
            let tbody = document.getElementById('dmt-set-tbody');
            if (!tbody) return;

            let html = ``;
            STATIONS_LIST.forEach((st, idx) => {
                html += `
                <tr>
                    <td style="text-align:center; font-weight:900;">${idx + 1}</td>
                    <td style="font-weight:900; color:#153a29;">${st.process}</td>
                    <td><input type="text" value="${st.name}" onchange="updateDmtStation(${idx}, 'name', this.value)" class="dmt-input" style="width:100%; text-align:left;" /></td>
                    <td style="text-align:center;"><input type="number" value="${st.totalDay !== undefined ? st.totalDay : st.total}" onchange="updateDmtStation(${idx}, 'totalDay', this.value)" class="dmt-input" style="width:110px; text-align:center;" min="0" /></td>
                    <td style="text-align:center;"><input type="number" value="${st.totalNight !== undefined ? st.totalNight : st.total}" onchange="updateDmtStation(${idx}, 'totalNight', this.value)" class="dmt-input" style="width:110px; text-align:center;" min="0" /></td>
                    <td style="text-align:center;"><button class="btn btn-sm" style="background:#dc2626; color:#fff; padding:4px 10px; border-radius:4px;" onclick="deleteDmtStation(${idx})">🗑 Xóa</button></td>
                </tr>
                `;
            });
            tbody.innerHTML = html;
        };

        window.addDmtStation = function () {
            let proc = document.getElementById('dmt-new-proc').value;
            let name = document.getElementById('dmt-new-name').value.trim();
            let totalDay = parseInt(document.getElementById('dmt-new-total-day').value) || 0;
            let totalNight = parseInt(document.getElementById('dmt-new-total-night').value) || 0;

            if (!name) return showToast("Vui lòng nhập Tên Trạm mới!", "warning");

            STATIONS_LIST.push({
                process: proc,
                name: name,
                totalDay: totalDay,
                totalNight: totalNight,
                total: totalDay
            });

            saveDmTramStations();
            renderDmtSettingsTable();

            document.getElementById('dmt-new-name').value = '';
            document.getElementById('dmt-new-total-day').value = '';
            document.getElementById('dmt-new-total-night').value = '';
            showToast("✅ Đã thêm trạm mới thành công!", "success");
        };

        window.updateDmtStation = function (idx, field, val) {
            if (field === 'totalDay' || field === 'totalNight') {
                STATIONS_LIST[idx][field] = parseInt(val) || 0;
                if (field === 'totalDay') STATIONS_LIST[idx].total = STATIONS_LIST[idx].totalDay;
            } else {
                STATIONS_LIST[idx][field] = val;
            }
            saveDmTramStations();
            showToast("Cập nhật thành công!", "info");
        };

        window.deleteDmtStation = function (idx) {
            if (confirm(`Bạn có chắc muốn xóa trạm "${STATIONS_LIST[idx].name}" không?`)) {
                STATIONS_LIST.splice(idx, 1);
                saveDmTramStations();
                renderDmtSettingsTable();
                showToast("🗑 Đã xóa trạm thành công!", "info");
            }
        };

        // Chụp ảnh Bảng Tổng Hợp
        window.copyDmtTableImage = function () {
            let el = document.getElementById('dmt-main-table');
            if (!el) return showToast("Không tìm thấy bảng để chụp ảnh!", "warning");
            if (typeof html2canvas === 'undefined') return showToast("Thư viện chụp ảnh chưa sẵn sàng!", "warning");

            showToast("⏳ Đang chụp ảnh Bảng Tổng Hợp...", "info");
            html2canvas(el, { scale: Math.max(3, (window.devicePixelRatio || 1) * 2), useCORS: true, allowTaint: true, logging: false, backgroundColor: '#ffffff' }).then(canvas => {
                canvas.toBlob(async (blob) => {
                    if (!blob) return showToast("Không thể tạo dữ liệu ảnh!", "error");
                    try {
                        if (navigator.clipboard && window.ClipboardItem) {
                            const item = new ClipboardItem({ 'image/png': blob });
                            await navigator.clipboard.write([item]);
                            showToast("📋 Đã copy ảnh Bảng Tổng Hợp vào Bộ nhớ tạm! Nhấn Ctrl+V để dán.", "success");
                        } else {
                            throw new Error("Trình duyệt không hỗ trợ ClipboardItem");
                        }
                    } catch (err) {
                        let link = document.createElement('a');
                        link.download = `Bang_Tong_Hop_${new Date().toISOString().slice(0, 10)}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        showToast("📋 Đã tải ảnh Bảng Tổng Hợp xuống máy.", "info");
                    }
                }, 'image/png');
            }).catch(err => {
                showToast("Lỗi khi chụp ảnh: " + err, "error");
            });
        };
