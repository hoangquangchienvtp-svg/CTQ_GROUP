<script>
    let ttdcProvinces = [];
    let ttdcSearchTree = {};
    let ttdcSearchDobs = [];

    function formatWardDisplayName(name) {
        if (!name) return '';
        let match = name.match(/^(Phường|Xã|Thị trấn|Thành phố|Tỉnh)\s+(.+)$/i);
        if (match) {
            return `${match[2]} (${match[1]})`;
        }
        return name;
    }

    function ttdcLoadProvinces() {
        fetch('https://provinces.open-api.vn/api/?depth=3')
            .then(r => r.json())
            .then(data => {
                ttdcProvinces = data;
                data.sort((a, b) => formatWardDisplayName(a.name).localeCompare(formatWardDisplayName(b.name), 'vi'));
                let html = '<option value="">-- Tỉnh / Thành --</option>';
                data.forEach(p => {
                    let disp = formatWardDisplayName(p.name);
                    html += `<option value="${p.code}">${disp}</option>`;
                });
                let el = document.getElementById('ttdc-in-tinh');
                if (el) el.innerHTML = html;
            });
    }

    function ttdcLoadSearchFilters() {
        google.script.run.withSuccessHandler(function (res) {
            if (res && res.success) {
                ttdcSearchTree = res.tree || {};
                ttdcSearchDobs = res.dobs || [];

                let tinhSel = document.getElementById('ttdc-search-tinh');
                if (tinhSel) {
                    let html = '<option value="">-- Tỉnh / Thành --</option>';
                    let sortedTinh = Object.keys(ttdcSearchTree).sort((a, b) => formatWardDisplayName(a).localeCompare(formatWardDisplayName(b), 'vi'));
                    sortedTinh.forEach(t => {
                        let disp = formatWardDisplayName(t);
                        html += `<option value="${t}">${disp}</option>`;
                    });
                    tinhSel.innerHTML = html;
                }

                // Populate DOB autocomplete using datalist
                let dobInp = document.getElementById('ttdc-search-dob');
                if (dobInp) {
                    let dl = document.getElementById('ttdc-search-dob-list');
                    if (!dl) {
                        dl = document.createElement('datalist');
                        dl.id = 'ttdc-search-dob-list';
                        document.body.appendChild(dl);
                    }
                    dobInp.setAttribute('list', 'ttdc-search-dob-list');
                    let dlHtml = '';
                    ttdcSearchDobs.forEach(d => {
                        dlHtml += `<option value="${d}">`;
                    });
                    dl.innerHTML = dlHtml;
                }
            }
        }).getTtdcFilterOptionsAPI();
    }

    function renderThongTinDiaChi(container) {
        let perms = (window.USER_PERMS || '').split(',').map(s => s.trim());
        let isAdmin = perms.includes('admin');
        let canEdit = isAdmin || perms.includes('sua-thong-tin-dia-chi');

        let html = `
        <style>
            .ttdc-container { padding: 20px; background: #f8fafc; min-height: 85vh; border-radius: 12px; }
            .ttdc-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
            .ttdc-tab-btn { padding: 12px 24px; border: none; background: transparent; font-size: 16px; font-weight: 800; color: #64748b; cursor: pointer; border-radius: 8px; transition: all 0.3s; }
            .ttdc-tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
            .ttdc-tab-content { display: none; }
            .ttdc-tab-content.active { display: block; }
            
            .ttdc-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 25px; }
            .ttdc-form-group { margin-bottom: 20px; }
            .ttdc-form-group label { display: block; font-weight: 900; margin-bottom: 8px; color: #000; font-size: 16px; }
            .ttdc-input { width: 100%; padding: 14px 16px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 18px; font-weight: 900; color: #000; box-sizing: border-box; background: #fff; }
            .ttdc-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2); }
            
            .ttdc-btn { padding: 14px 28px; background: linear-gradient(135deg, var(--primary), #004d30); color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 6px 15px rgba(0,0,0,0.2); transition: all 0.2s; justify-content: center; text-transform: uppercase; }
            .ttdc-btn:hover { background: linear-gradient(135deg, #003823, #002211); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
            .ttdc-result-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: 20px; border-left: 6px solid var(--primary); display: flex; gap: 40px; flex-wrap: wrap; }
            .ttdc-info-row { display: flex; margin-bottom: 15px; font-size: 20px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 12px; align-items: center; color:#000; }
            .ttdc-info-label { width: 220px; font-weight: 800; color: #333; font-size: 18px; }
            .ttdc-info-value { font-weight: 900; color: #000; flex: 1; font-size: 22px; }
            
            #ttdc-img-preview { width: 100%; max-width: 350px; height: 450px; border-radius: 12px; border: 3px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f1f5f9; color: #94a3b8; font-weight: bold; text-align: center; padding: 15px; cursor: pointer; font-size: 16px; line-height: 1.6; margin: 0 auto; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
            #ttdc-img-preview img { width: 100%; height: 100%; object-fit: cover; }
        </style>
        <div class="ttdc-container">
            <h2 style="color:var(--primary); font-weight:900; font-size:24px; margin-bottom:20px; text-transform:uppercase; display:flex; align-items:center; gap:10px;">
                <span style="font-size:28px;">🏢</span> <span data-lang="ttdc_title">THÔNG TIN ĐỊA CHỈ</span>
            </h2>
            
            <div class="ttdc-tabs">
                <button class="ttdc-tab-btn active" onclick="switchTtdcTab('DATA')" data-lang="ttdc_tab_data">🔍 TRA CỨU (DATA)</button>
                ${canEdit ? `<button class="ttdc-tab-btn" onclick="checkTtdcTabInput()" data-lang="ttdc_tab_input">✍️ NHẬP LIỆU (INPUT)</button>` : ''}
            </div>

            <!-- TAB DATA -->
            <div id="ttdc-tab-DATA" class="ttdc-tab-content active">
                <div style="background:#fff; border-radius:12px; padding:20px; margin-bottom:25px; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
                    <div style="margin-bottom:12px; font-weight:900; color:var(--primary); font-size:16px;">1️⃣ TRA CỨU NHANH THEO MÃ THẺ</div>
                    <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
                        <input type="text" id="ttdc-search-id" class="ttdc-input" placeholder="Nhập Mã Thẻ để tra cứu..." data-lang="ttdc_ph_search" style="max-width:400px; font-size: 18px; font-weight: 900;" onkeypress="if(event.key==='Enter') searchTtdc()">
                        <button class="ttdc-btn" onclick="searchTtdc()" data-lang="ttdc_btn_search">🔍 TÌM KIẾM</button>
                    </div>

                    <div style="border-top: 2px dashed #e2e8f0; margin: 20px 0;"></div>

                    <div style="margin-bottom:12px; font-weight:900; color:#3b82f6; font-size:16px;">2️⃣ LỌC THEO ĐỊA CHỈ & NGÀY SINH</div>
                    <div style="display:flex; gap:15px; flex-wrap:wrap; align-items:center;">
                        <select id="ttdc-search-tinh" class="ttdc-input" style="flex:1; min-width:160px;" onchange="ttdcSearchLoadXa()"><option value="">-- Tỉnh / Thành --</option></select>
                        <select id="ttdc-search-xa" class="ttdc-input" style="flex:1; min-width:160px;"><option value="">-- Phường / Xã --</option></select>
                        <input type="text" id="ttdc-search-dob" class="ttdc-input" style="flex:1; min-width:160px;" placeholder="Ngày Sinh (DD/MM/YYYY)" maxlength="10" oninput="formatDateInput(this)">
                        <button class="ttdc-btn" style="background:#3b82f6;" onclick="searchTtdcAdvanced()">🔍 LỌC DỮ LIỆU</button>
                    </div>
                </div>
                <div id="ttdc-search-result"></div>
            </div>

            <!-- TAB INPUT -->
            <div id="ttdc-tab-INPUT" class="ttdc-tab-content">
                <div style="display:flex; justify-content:flex-end; margin-bottom: 15px;">
                    ${isAdmin ? `<button class="ttdc-btn" style="background:#f59e0b; padding:10px 20px; font-size:14px;" onclick="setTtdcPassword()">⚙️ CÀI ĐẶT KHÓA TAB</button>` : ''}
                </div>
                <div style="display:flex; gap:30px; flex-wrap:wrap; background:#fff; padding:25px; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.05);">
                    <div style="flex: 2; min-width:400px;">
                        <div class="ttdc-form-grid">
                            <div class="ttdc-form-group"><label data-lang="ttdc_lbl_mathe">Mã Thẻ (*)</label><input type="text" id="ttdc-in-mathe" class="ttdc-input" onchange="checkTtdcExists(this.value)"></div>
                            <div class="ttdc-form-group"><label data-lang="ttdc_lbl_hoten">Họ Tên</label><input type="text" id="ttdc-in-hoten" class="ttdc-input" readonly style="background:#e2e8f0; color:#64748b; cursor:not-allowed;"></div>
                            
                            <div class="ttdc-form-group"><label data-lang="ttdc_lbl_bophan">Bộ Phận</label><input type="text" id="ttdc-in-bophan" class="ttdc-input"></div>
                            <div class="ttdc-form-group"><label>Chức Vụ</label><input type="text" id="ttdc-in-chucvu" class="ttdc-input"></div>
                            
                            <div class="ttdc-form-group"><label data-lang="ttdc_lbl_ngayvao">Ngày Vào</label><input type="text" id="ttdc-in-ngayvao" class="ttdc-input" placeholder="DD/MM/YYYY" maxlength="10" oninput="formatDateInput(this)" readonly style="background:#e2e8f0; color:#64748b; cursor:not-allowed;"></div>
                            <div class="ttdc-form-group"><label data-lang="ttdc_lbl_ngaysinh">Ngày Sinh</label><input type="text" id="ttdc-in-ngaysinh" class="ttdc-input" placeholder="DD/MM/YYYY" maxlength="10" oninput="formatDateInput(this)"></div>
                            
                            <div class="ttdc-form-group"><label data-lang="ttdc_lbl_sdt">Số Điện Thoại</label><input type="text" id="ttdc-in-sdt" class="ttdc-input"></div>
                            <div class="ttdc-form-group"><label data-lang="ttdc_lbl_honnhan">Tình Trạng Hôn Nhân</label>
                                <select id="ttdc-in-honnhan" class="ttdc-input" style="height: 47px;">
                                    <option value="" data-lang="ttdc_opt_select">-- Chọn --</option>
                                    <option value="Độc thân" data-lang="ttdc_opt_single">Độc thân</option>
                                    <option value="Đã kết hôn" data-lang="ttdc_opt_married">Đã kết hôn</option>
                                    <option value="Ly hôn" data-lang="ttdc_opt_divorced">Ly hôn</option>
                                </select>
                            </div>

                            <div class="ttdc-form-group" style="grid-column: 1 / -1;">
                                <label data-lang="ttdc_lbl_diachi">Địa Chỉ</label>
                                <div style="display:flex; gap:10px; margin-bottom:10px;">
                                    <select id="ttdc-in-tinh" class="ttdc-input" onchange="ttdcLoadXa()"><option value="">-- Tỉnh / Thành --</option></select>
                                    <select id="ttdc-in-xa" class="ttdc-input"><option value="">-- Phường / Xã --</option></select>
                                </div>
                                <input type="text" id="ttdc-in-diachi-chitiet" class="ttdc-input" placeholder="Số nhà, đường, thôn xóm (hoặc nhập tự do)...">
                            </div>
                        </div>
                    </div>
                    <div style="flex: 1; min-width:250px; display:flex; flex-direction:column; align-items:center;">
                        <div class="ttdc-form-group" style="width:100%;">
                            <label style="text-align:center;" data-lang="ttdc_lbl_anh">Ảnh Đại Diện</label>
                            <div id="ttdc-img-preview" tabindex="0">
                                <div data-lang="ttdc_paste_img">🖱️ Click vào đây<br>và ấn <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">Ctrl</kbd> + <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">V</kbd><br>để dán ảnh</div>
                            </div>
                            <input type="hidden" id="ttdc-in-base64">
                            <input type="file" id="ttdc-img-upload" accept="image/*" style="display:none;" onchange="ttdcHandleImageUpload(this)">
                            <div style="display:flex; gap:10px; margin-top:15px; width:100%; max-width:350px; margin-left:auto; margin-right:auto;">
                                <button class="ttdc-btn" style="background:#3b82f6; flex:1; font-size:15px; padding:12px;" onclick="document.getElementById('ttdc-img-upload').click()">📁 TẢI TỪ MÁY</button>
                                <button class="ttdc-btn" style="background:#ef4444; flex:1; font-size:15px; padding:12px;" data-lang="ttdc_btn_xoa_anh" onclick="document.getElementById('ttdc-in-base64').value=''; document.getElementById('ttdc-img-preview').innerHTML='<div data-lang=&quot;ttdc_paste_img&quot;>🖱️ Click vào đây<br>và ấn <kbd style=&quot;background:#e2e8f0; padding:2px 6px; border-radius:4px;&quot;>Ctrl</kbd> + <kbd style=&quot;background:#e2e8f0; padding:2px 6px; border-radius:4px;&quot;>V</kbd><br>để dán ảnh</div>'; if (typeof updateTextByLang === 'function') updateTextByLang();">🗑️ XÓA ẢNH</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:20px; margin-top:25px;">
                    <button class="ttdc-btn" style="font-size:18px; padding:15px 40px; background:#059669; width:auto;" id="ttdc-btn-save" data-lang="ttdc_btn_luu" onclick="saveTtdc()">💾 LƯU THÔNG TIN</button>
                    <div id="ttdc-save-msg" style="font-weight:bold; font-size:16px;"></div>
                </div>
            </div>
        </div>
    `;
        container.innerHTML = html;
        if (typeof updateTextByLang === 'function') updateTextByLang();

        // Khởi tạo select data
        ttdcLoadProvinces();
        ttdcLoadSearchFilters();

        // Tải trước mật khẩu khóa
        if (window.G_TTDC_PASS_REQUIRED === undefined) {
            google.script.run.withSuccessHandler(function (hasPass) {
                window.G_TTDC_PASS_REQUIRED = hasPass;
            }).hasTtdcPasswordAPI();
        }

        window.ttdcCompressBase64 = function (b64, maxChars = 40000) {
            return new Promise((resolve) => {
                if (!b64 || b64.length <= maxChars) return resolve(b64);
                let img = new Image();
                img.onload = function () {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let maxW = 400;
                    let maxH = 500;
                    let quality = 0.7;
                    let resB64 = b64;
                    for (let i = 0; i < 12; i++) {
                        let w = img.width, h = img.height;
                        if (w > h) {
                            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                        } else {
                            if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
                        }
                        canvas.width = Math.max(10, w);
                        canvas.height = Math.max(10, h);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resB64 = canvas.toDataURL('image/jpeg', quality);
                        if (resB64.length <= maxChars) break;
                        maxW = Math.round(maxW * 0.85);
                        maxH = Math.round(maxH * 0.85);
                        quality = Math.max(0.2, quality - 0.08);
                    }
                    resolve(resB64);
                };
                img.onerror = function () { resolve(b64); };
                img.src = b64;
            });
        };

        window.ttdcProcessImageFile = function (file) {
            let reader = new FileReader();
            reader.onload = function (event) {
                let img = new Image();
                img.onload = function () {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let maxW = 450;
                    let maxH = 600;
                    let quality = 0.7;
                    let b64 = '';

                    for (let attempt = 0; attempt < 12; attempt++) {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxW) { height = Math.round(height * maxW / width); width = maxW; }
                        } else {
                            if (height > maxH) { width = Math.round(width * maxH / height); height = maxH; }
                        }
                        canvas.width = Math.max(10, width);
                        canvas.height = Math.max(10, height);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        b64 = canvas.toDataURL('image/jpeg', quality);
                        if (b64.length <= 40000) break;

                        maxW = Math.round(maxW * 0.85);
                        maxH = Math.round(maxH * 0.85);
                        quality = Math.max(0.2, quality - 0.08);
                    }

                    document.getElementById('ttdc-in-base64').value = b64;
                    document.getElementById('ttdc-img-preview').innerHTML = `<img src="${b64}">`;
                }
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.ttdcHandleImageUpload = function (input) {
            if (input.files && input.files[0]) {
                ttdcProcessImageFile(input.files[0]);
            }
        };

        let preview = document.getElementById('ttdc-img-preview');
        if (preview) {
            preview.addEventListener('paste', function (e) {
                e.preventDefault();
                let items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let index in items) {
                    let item = items[index];
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        let blob = item.getAsFile();
                        ttdcProcessImageFile(blob);
                    }
                }
            });
        }
    }

    window.formatDateInput = function (input) {
        let v = input.value.replace(/\D/g, '');
        if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2);
        if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9);
        input.value = v;
    }

    window.ttdcLoadXa = function (selectedWardName = null) {
        let pCode = document.getElementById('ttdc-in-tinh').value;
        let xaSel = document.getElementById('ttdc-in-xa');
        if (!xaSel) return;
        if (!pCode) {
            xaSel.innerHTML = '<option value="">-- Phường / Xã --</option>';
            return;
        }
        let p = ttdcProvinces.find(x => x.code == pCode);
        if (!p) return;

        let html = '<option value="">-- Phường / Xã --</option>';
        let allWards = [];
        if (p.districts) {
            p.districts.forEach(d => {
                if (d.wards) d.wards.forEach(w => allWards.push(w));
            });
        }
        allWards.sort((a, b) => formatWardDisplayName(a.name).localeCompare(formatWardDisplayName(b.name), 'vi'));
        allWards.forEach(w => {
            let disp = formatWardDisplayName(w.name);
            html += `<option value="${w.name}">${disp}</option>`;
        });
        xaSel.innerHTML = html;
        if (selectedWardName) xaSel.value = selectedWardName;
    }

    window.ttdcSearchLoadXa = function () {
        let tinh = document.getElementById('ttdc-search-tinh').value;
        let xaSel = document.getElementById('ttdc-search-xa');
        if (!xaSel) return;
        if (!tinh || !ttdcSearchTree[tinh]) {
            xaSel.innerHTML = '<option value="">-- Phường / Xã --</option>';
            return;
        }
        let html = '<option value="">-- Phường / Xã --</option>';
        let allXa = new Set();
        Object.keys(ttdcSearchTree[tinh]).forEach(h => {
            if (Array.isArray(ttdcSearchTree[tinh][h])) {
                ttdcSearchTree[tinh][h].forEach(x => allXa.add(x));
            }
        });
        let sortedXa = Array.from(allXa).sort((a, b) => formatWardDisplayName(a).localeCompare(formatWardDisplayName(b), 'vi'));
        sortedXa.forEach(x => {
            let disp = formatWardDisplayName(x);
            html += `<option value="${x}">${disp}</option>`;
        });
        xaSel.innerHTML = html;
    }

    window.setTtdcPassword = function () {
        let p = prompt("Nhập mật khẩu mới để khóa tab Nhập Liệu (để trống để xóa mật khẩu):");
        if (p !== null) {
            google.script.run.withSuccessHandler(function () {
                showToast("Đã lưu cài đặt mật khẩu thành công!", "success");
                window.G_TTDC_PASS_REQUIRED = (p.trim() !== "");
            }).setTtdcPasswordAPI(p);
        }
    }

    window.checkTtdcTabInput = function () {
        let perms = (window.USER_PERMS || '').split(',').map(s => s.trim());
        let canEdit = perms.includes('admin') || perms.includes('sua-thong-tin-dia-chi');
        if (!canEdit) {
            showToast("Bạn không có quyền truy cập tab Nhập Liệu!", "error");
            switchTtdcTab('DATA');
            return;
        }

        let oldBtn = document.querySelector(".ttdc-tab-btn[onclick='checkTtdcTabInput()']");
        if (oldBtn) oldBtn.innerHTML = "⏳ ĐANG KIỂM TRA...";

        google.script.run.withSuccessHandler(function (hasPass) {
            if (oldBtn) oldBtn.innerHTML = "✍️ NHẬP LIỆU (INPUT)";
            if (typeof updateTextByLang === 'function') updateTextByLang();

            if (hasPass) {
                let p = prompt("🔒 TAB NÀY ĐÃ ĐƯỢC KHÓA MẬT KHẨU!\nVui lòng nhập mật khẩu để vào tab Nhập Liệu:");
                if (p === null || p.trim() === "") {
                    switchTtdcTab('DATA');
                    return;
                }
                google.script.run.withSuccessHandler(function (isValid) {
                    if (isValid) {
                        switchTtdcTab('INPUT');
                    } else {
                        alert("❌ Mật khẩu không đúng!");
                        switchTtdcTab('DATA');
                    }
                }).verifyTtdcPasswordAPI(p);
            } else {
                switchTtdcTab('INPUT');
            }
        }).hasTtdcPasswordAPI();
    }

    window.switchTtdcTab = function (tab) {
        document.querySelectorAll('.ttdc-tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.ttdc-tab-content').forEach(c => c.classList.remove('active'));
        let btn = document.querySelector(`.ttdc-tab-btn[onclick*="${tab}"]`);
        if (btn) btn.classList.add('active');
        document.getElementById('ttdc-tab-' + tab).classList.add('active');
    }

    window.searchTtdc = function () {
        let maThe = document.getElementById('ttdc-search-id').value.trim();
        if (!maThe) return showToast("Vui lòng nhập mã thẻ!", "error");

        let resDiv = document.getElementById('ttdc-search-result');

        google.script.run
            .withSuccessHandler(function (res) {
                if (!res.success) {
                    resDiv.innerHTML = `<div style="color:#ef4444; font-weight:900; font-size:20px; background:#fef2f2; padding:20px; border-radius:10px; border:2px solid #fca5a5;">❌ ${res.message}</div>`;

            })
            .searchTtdcAPI(maThe);
    }

                <div class="ttdc-info-row"><div class="ttdc-info-label">Bộ Phận:</div><div class="ttdc-info-value">${d.boPhan}</div></div>
                <div class="ttdc-info-row"><div class="ttdc-info-label">Chức Vụ:</div><div class="ttdc-info-value">${d.chucVu || ''}</div></div>
                <div class="ttdc-info-row"><div class="ttdc-info-label">Ngày Vào:</div><div class="ttdc-info-value">${d.ngayVao}</div></div>
                <div class="ttdc-info-row"><div class="ttdc-info-label">Ngày Sinh:</div><div class="ttdc-info-value">${d.ngaySinh}</div></div>
                <div class="ttdc-info-row"><div class="ttdc-info-label">Số Điện Thoại:</div><div class="ttdc-info-value">${d.sdt}</div></div>
                <div class="ttdc-info-row"><div class="ttdc-info-label">Địa Chỉ:</div><div class="ttdc-info-value">${d.diaChi}</div></div>
                <div class="ttdc-info-row"><div class="ttdc-info-label">Tình Trạng H.Nhân:</div><div class="ttdc-info-value">${d.honNhan}</div></div>

                ${imgHtml}
            </div>
        </div>
    `;
    };

    window.searchTtdcAdvanced = function () {
        let tinhSel = document.getElementById('ttdc-search-tinh');
        let xaSel = document.getElementById('ttdc-search-xa');

        let tinh = (tinhSel?.value || '').trim();
        let xa = (xaSel?.value || '').trim();
        let dob = (document.getElementById('ttdc-search-dob')?.value || '').trim();

        if (tinh.includes('--')) tinh = '';
        if (xa.includes('--')) xa = '';

        if (!tinh && !xa && !dob) {
            return showToast("Vui lòng chọn ít nhất 1 điều kiện (Địa chỉ hoặc Ngày sinh)!", "error");
        }

        let resDiv = document.getElementById('ttdc-search-result');
        resDiv.innerHTML = "<div class='tdl-loader' style='display:inline-block'></div> <span style='font-size:18px; font-weight:bold; margin-left:10px;'>Đang lọc dữ liệu...</span>";

        google.script.run
            .withSuccessHandler(function (res) {
                if (!res.success) {
                    resDiv.innerHTML = `<div style="color:#ef4444; font-weight:900; font-size:20px; background:#fef2f2; padding:20px; border-radius:10px; border:2px solid #fca5a5;">❌ ${res.message}</div>`;
                    return;
                }
                let html = `<div style="margin-bottom:15px; font-size:18px; font-weight:bold; color:#10b981;">✅ Tìm thấy ${res.data.length} kết quả</div>`;
                res.data.forEach(d => {
                    html += renderTtdcResultCard(d);
                });
                resDiv.innerHTML = html;
                window.G_Ttdc_Current = res.data[0];

                window.G_Ttdc_Map = {};
                res.data.forEach(d => window.G_Ttdc_Map[d.maThe] = d);
            })
            .withFailureHandler(function (err) {
                resDiv.innerHTML = `<div style="color:#ef4444; font-weight:900; font-size:20px; background:#fef2f2; padding:20px; border-radius:10px; border:2px solid #fca5a5;">❌ Lỗi kết nối: ${err.message}</div>`;
            })
            .searchTtdcAdvancedAPI({ tinh: tinh, huyen: '', xa: xa, dob: dob });
    }

    function parseAddressString(fullAddress, provinces) {
        let result = { tinhCode: '', xaName: '', chitiet: '' };
        if (!fullAddress) return result;

        let parts = fullAddress.split(',').map(s => s.trim()).filter(Boolean);
        if (parts.length === 0) return result;

        let matchedTinh = null;
        let matchedXa = null;

        // Bỏ các phần Huyện/Quận cũ nếu có
        parts = parts.filter(p => !/^(huyện|quận|thị xã)\s+/i.test(p));

        // 1. Phân tích Tỉnh từ phần cuối cùng
        if (parts.length > 0) {
            let lastPart = parts[parts.length - 1].toLowerCase();
            matchedTinh = provinces.find(p => {
                let pName = p.name.toLowerCase();
                let pClean = pName.replace(/^(tỉnh|thành phố)\s+/i, '');
                return pName === lastPart || lastPart.includes(pClean) || pName.includes(lastPart);
            });

            if (matchedTinh) {
                result.tinhCode = matchedTinh.code;
                parts.pop();
            }
        }

        // 2. Phân tích Phường/Xã từ phần tiếp theo
        if (parts.length > 0) {
            let lastPart = parts[parts.length - 1].toLowerCase();
            let targetProvinces = matchedTinh ? [matchedTinh] : provinces;

            for (let p of targetProvinces) {
                if (!p.districts) continue;
                for (let d of p.districts) {
                    if (!d.wards) continue;
                    let w = d.wards.find(wItem => {
                        let wName = wItem.name.toLowerCase();
                        let wClean = wName.replace(/^(phường|xã|thị trấn)\s+/i, '');
                        return wName === lastPart || lastPart.includes(wClean) || wName.includes(lastPart);
                    });
                    if (w) {
                        matchedXa = w.name;
                        if (!matchedTinh) {
                            matchedTinh = p;
                            result.tinhCode = p.code;
                        }
                        break;
                    }
                }
                if (matchedXa) break;
            }

            if (matchedXa) {
                result.xaName = matchedXa;
                parts.pop();
            }
        }

        result.chitiet = parts.join(', ');
        return result;
    }

    window.editTtdc = function (maThe) {
        let perms = (window.USER_PERMS || '').split(',').map(s => s.trim());
        let canEdit = perms.includes('admin') || perms.includes('sua-thong-tin-dia-chi');
        if (!canEdit) {
            showToast("Bạn không có quyền chỉnh sửa thông tin!", "error");
            return;
        }
        let d = (window.G_Ttdc_Map && window.G_Ttdc_Map[maThe]) || window.G_Ttdc_Current;
        if (!d) return;
        window.G_Ttdc_Current = d;
        switchTtdcTab('INPUT');

        document.getElementById('ttdc-in-mathe').value = d.maThe || '';
        document.getElementById('ttdc-in-hoten').value = d.hoTen || '';
        document.getElementById('ttdc-in-bophan').value = d.boPhan || '';
        document.getElementById('ttdc-in-chucvu').value = d.chucVu || '';
        document.getElementById('ttdc-in-ngayvao').value = d.ngayVao || '';
        document.getElementById('ttdc-in-ngaysinh').value = d.ngaySinh || '';
        document.getElementById('ttdc-in-sdt').value = d.sdt || '';
        document.getElementById('ttdc-in-honnhan').value = d.honNhan || '';
        document.getElementById('ttdc-in-base64').value = d.anhBase64 || '';

        // Tự động phân tách chuỗi địa chỉ thành Tỉnh, Phường/Xã và Chi tiết (Thôn/Xóm)
        let parsed = parseAddressString(d.diaChi || '', ttdcProvinces);
        let tinhSel = document.getElementById('ttdc-in-tinh');
        if (tinhSel) tinhSel.value = parsed.tinhCode || '';
        ttdcLoadXa(parsed.xaName || null);
        document.getElementById('ttdc-in-diachi-chitiet').value = parsed.chitiet || '';

        let preview = document.getElementById('ttdc-img-preview');
        if (d.anhBase64) {
            preview.innerHTML = `<img src="${d.anhBase64}">`;
        } else {
            preview.innerHTML = `<div data-lang="ttdc_paste_img">🖱️ Click vào đây<br>và ấn <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">Ctrl</kbd> + <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">V</kbd><br>để dán ảnh</div>`;
            if (typeof updateTextByLang === 'function') updateTextByLang();
        }
    }

    window.saveTtdc = function () {
        let maThe = document.getElementById('ttdc-in-mathe').value.trim();
        if (!maThe) return showToast("Cần nhập Mã thẻ", "error");

        let tinhSel = document.getElementById('ttdc-in-tinh');
        let tinhName = '';
        if (tinhSel && tinhSel.selectedIndex >= 0) {
            let pCode = tinhSel.value;
            let p = ttdcProvinces.find(x => x.code == pCode);
            tinhName = p ? p.name : '';
        }
        let xaName = (document.getElementById('ttdc-in-xa')?.value || '').trim();
        let chitiet = document.getElementById('ttdc-in-diachi-chitiet').value.trim();

        let diaChiArr = [chitiet];
        if (xaName && !xaName.includes('--')) diaChiArr.push(xaName);
        if (tinhName && !tinhName.includes('--')) diaChiArr.push(tinhName);
        let finalDiaChi = diaChiArr.filter(x => x).join(', ');

        let data = {
            maThe: maThe,
            hoTen: document.getElementById('ttdc-in-hoten').value.trim(),
            boPhan: document.getElementById('ttdc-in-bophan').value.trim(),
            chucVu: document.getElementById('ttdc-in-chucvu').value.trim(),
            ngayVao: document.getElementById('ttdc-in-ngayvao').value.trim(),
            ngaySinh: document.getElementById('ttdc-in-ngaysinh').value.trim(),
            sdt: document.getElementById('ttdc-in-sdt').value.trim(),
            diaChi: finalDiaChi,
            honNhan: document.getElementById('ttdc-in-honnhan').value.trim(),
            anhBase64: document.getElementById('ttdc-in-base64').value
        };

        let btn = document.getElementById('ttdc-btn-save');
        let msg = document.getElementById('ttdc-save-msg');
        btn.disabled = true;
        msg.innerHTML = "";

        let overlay = document.getElementById('ttdc-loading-overlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'ttdc-loading-overlay';
            overlay.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:99999; color:#fff; font-weight:900; font-size:22px;';
            overlay.innerHTML = `<div class='tdl-loader' style='width:60px; height:60px; border-width:6px; margin-bottom:20px;'></div><span>⏳ ĐANG LƯU DỮ LIỆU... VUI LÒNG ĐỢI</span>`;
            document.body.appendChild(overlay);
        } else {
            overlay.style.display = 'flex';
        }

        let doSendSave = function (payload) {
            google.script.run
                .withSuccessHandler(function (res) {
                    btn.disabled = false;
                    if (overlay) overlay.style.display = 'none';
                    if (res.success) {
                        msg.innerHTML = "✅ " + res.message;
                        msg.style.color = "#10b981";
                        showToast("Lưu thành công!", "success");
                        let savedMaThe = payload.maThe;
                        ttdcClearForm();
                        // Tự động chuyển sang tab TRA CỨU (DATA) và tra cứu ngay mã thẻ vừa nhập
                        if (savedMaThe) {
                            let searchInp = document.getElementById('ttdc-search-id');
                            if (searchInp) searchInp.value = savedMaThe;
                            switchTtdcTab('DATA');
                            searchTtdc();
                        }
                    } else {
                        msg.innerHTML = "❌ " + res.message;
                        msg.style.color = "#ef4444";
                    }
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    if (overlay) overlay.style.display = 'none';
                    msg.innerHTML = "❌ Lỗi kết nối: " + err.message;
                    msg.style.color = "#ef4444";
                })
                .saveTtdcAPI(payload);
        };

        if (data.anhBase64 && data.anhBase64.length > 40000) {
            ttdcCompressBase64(data.anhBase64, 40000).then(compB64 => {
                data.anhBase64 = compB64;
                document.getElementById('ttdc-in-base64').value = compB64;
                doSendSave(data);
            });
        } else {
            doSendSave(data);
        }
    }

        document.getElementById('ttdc-in-diachi-chitiet').value = '';

    }

    window.deleteTtdc = function (maThe) {
        if (!confirm("Bạn có chắc chắn muốn xóa nhân viên này khỏi hệ thống?")) return;

        let resDiv = document.getElementById('ttdc-search-result');
        resDiv.innerHTML = "<div class='tdl-loader' style='display:inline-block'></div> <span style='font-size:18px; font-weight:bold; margin-left:10px;'>Đang xóa...</span>";

        google.script.run
            .withSuccessHandler(function (res) {
                if (res.success) {
                    resDiv.innerHTML = `<div style="color:#10b981; font-weight:900; font-size:20px; background:#ecfdf5; padding:20px; border-radius:10px; border:2px solid #6ee7b7;">✅ ${res.message}</div>`;
                    showToast("Đã xóa thành công!", "success");
                } else {
                    resDiv.innerHTML = `<div style="color:#ef4444; font-weight:900; font-size:20px; background:#fef2f2; padding:20px; border-radius:10px; border:2px solid #fca5a5;">❌ Lỗi: ${res.message}</div>`;

                resDiv.innerHTML = `<div style="color:#ef4444; font-weight:900; font-size:20px; background:#fef2f2; padding:20px; border-radius:10px; border:2px solid #fca5a5;">❌ Lỗi kết nối: ${err.message}</div>`;
            })
            .deleteTtdcAPI(maThe);
    }

    window.checkTtdcExists = function (maThe) {
        if (!maThe) return;
        let hoTenInp = document.getElementById('ttdc-in-hoten');
        let ngayVaoInp = document.getElementById('ttdc-in-ngayvao');

        hoTenInp.placeholder = "Đang kiểm tra dữ liệu...";

        google.script.run.withSuccessHandler(function (res) {
            hoTenInp.placeholder = "";
            if (res && res.success) {
                if (res.isExist) {
                    if (confirm("⚠️ Mã thẻ này đã có trong hệ thống Địa Chỉ. Bạn có muốn tải dữ liệu lên để chỉnh sửa không?")) {
                        window.G_Ttdc_Current = res.data;
                        window.editTtdc(maThe);
                    }
                } else if (res.autoFillData) {
                    if (!hoTenInp.value) hoTenInp.value = res.autoFillData.hoTen || '';
                    if (!ngayVaoInp.value && res.autoFillData.ngayVao) {
                        try {
                            let dStr = res.autoFillData.ngayVao;
                            // convert to DD/MM/YYYY if it is YYYY-MM-DD or MM/DD/YYYY or similar
                            // Simple assumption: if it has -, it's YYYY-MM-DD. If /, it's usually DD/MM/YYYY or MM/DD/YYYY.
                            // I will just use the value as is if it's already in good shape or format it
                            let dParts = dStr.split(/[-/]/);
                            if (dParts.length === 3) {
                                if (dParts[0].length === 4) {
                                    // YYYY-MM-DD -> DD/MM/YYYY
                                    ngayVaoInp.value = `${dParts[2].padStart(2, '0')}/${dParts[1].padStart(2, '0')}/${dParts[0]}`;
                                } else {
                                    // assuming DD/MM/YYYY or MM/DD/YYYY, I'll just clean it up
                                    ngayVaoInp.value = `${dParts[0].padStart(2, '0')}/${dParts[1].padStart(2, '0')}/${dParts[2]}`;
                                }
                            } else {
                                ngayVaoInp.value = dStr;
                            }
                        } catch (e) { }
                    }
                    showToast("Đã tự động điền Họ Tên và Ngày Vào từ dữ liệu chấm công", "success");
                }
            }
        }).getEmployeeInfoForTtdcAPI(maThe);
    }
